<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卡片">
<meta name="theme-color" content="#0f0e0c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f0e0c'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle' fill='%23d9bf8a' font-family='serif'%3E史%3C/text%3E%3C/svg%3E">
<title>卡片</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f0e0c;color:#ece4d8;
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#deck{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 8px)}
header{flex:0 0 auto;padding:0 24px 8px;display:flex;align-items:baseline;justify-content:space-between}
#seen{font-size:12px;letter-spacing:.06em;color:#7a7166}
#seen b{color:#d9bf8a;font-weight:500;font-variant-numeric:tabular-nums}

#stage{flex:1 1 auto;position:relative;overflow:hidden}
.card{position:absolute;left:50%;top:50%;width:min(87vw,430px);
  margin-left:calc(min(87vw,430px) / -2);
  transform:translate3d(0,-50%,0);
  border-radius:24px;padding:32px 26px 30px;
  background:linear-gradient(165deg,#211d19,#191614 70%);
  box-shadow:0 20px 50px -22px #000,0 0 0 1px rgba(255,255,255,.055) inset;
  transition:transform .36s cubic-bezier(.22,.9,.3,1),opacity .36s ease;
  will-change:transform,opacity;touch-action:pan-y;
  display:flex;flex-direction:column;justify-content:center;
  min-height:min(46vh,360px);max-height:74vh;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;
  background:radial-gradient(130% 80% at 50% -10%,rgba(217,191,138,.075),transparent 62%)}
.era{font-size:11px;letter-spacing:.16em;color:#8c8175;margin-bottom:14px}
.card h2{font-size:clamp(20px,5.4vw,25px);margin:0 0 14px;line-height:1.42;font-weight:600;color:#f2ebdf}
.card p{margin:0;font-size:clamp(14.5px,4vw,16px);line-height:1.88;color:#bdb3a5}
.think{margin-top:18px;padding-top:14px;border-top:1px solid rgba(217,191,138,.14);
  font-size:clamp(13px,3.6vw,14px);line-height:1.8;color:#d9bf8a;opacity:.9}
.think::before{content:"多想一层 · ";color:#8c7a55;letter-spacing:.04em;font-size:11px}

footer{flex:0 0 auto;padding:14px 24px 0;text-align:center;font-size:11.5px;color:#514b43;letter-spacing:.08em}

#themeBtn{background:none;border:none;padding:0;font-family:inherit;font-size:13px;
  letter-spacing:.06em;color:#d9bf8a;display:flex;align-items:center;gap:5px}
#themeBtn i{font-style:normal;font-size:10px;opacity:.55;transform:translateY(-1px)}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(8,7,6,.9);backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top) + 46px) 22px calc(env(safe-area-inset-bottom) + 24px)}
#sheet.on{display:block}
#sheet h3{margin:0 0 16px;padding-left:4px;font-size:12px;font-weight:400;letter-spacing:.16em;color:#7a7166}
.titem{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:15px 18px;margin-bottom:10px;border-radius:16px;border:none;cursor:pointer;
  background:#1b1815;color:#ece4d8;font-family:inherit;font-size:16px;text-align:left;
  box-shadow:0 0 0 1px rgba(255,255,255,.05) inset;transition:box-shadow .2s}
.titem small{display:block;margin-top:5px;font-size:12px;color:#7a7166;letter-spacing:.04em;font-weight:400}
.titem.now{box-shadow:0 0 0 1px rgba(217,191,138,.45) inset}
.titem.now .dot{opacity:1}
.titem .dot{opacity:0;color:#d9bf8a;font-size:9px}
#closeSheet{margin-top:6px;width:100%;padding:15px;border-radius:16px;border:none;
  background:transparent;color:#6d6459;font-family:inherit;font-size:14px}
</style>
</head>
<body>
<div id="deck">
  <header><button id="themeBtn"><span id="themeName"></span><i>⌄</i></button><span id="seen"></span></header>
  <div id="stage"></div>
  <footer>左滑下一张 · 右滑上一张</footer>
</div>

<div id="sheet">
  <h3>选择主题</h3>
  <div id="themeList"></div>
  <button id="closeSheet">关闭</button>
</div>

<script>
/* ===== 主题数据 ===== */
const THEMES = __THEMES__;

const DECAY = 0.3;          // 看过一次后权重倍数
const KEY_THEME = 'cards.theme.v1';

let theme = THEMES.find(t => t.id === localStorage.getItem(KEY_THEME)) || THEMES[0];
let POOL = theme.cards;
let seen = {};
let history = [];
let curIdx = -1;

const stage = document.getElementById('stage');

/* ===== 存储 ===== */
function seenKey(){ return 'cards.seen.' + theme.id + '.v1'; }
function loadSeen(){
  try { const o = JSON.parse(localStorage.getItem(seenKey()) || '{}'); return (o && typeof o === 'object') ? o : {}; }
  catch(e){ return {}; }
}
function saveSeen(){
  try { localStorage.setItem(seenKey(), JSON.stringify(seen)); } catch(e){}
}

/* ===== 权重 ===== */
function weightOf(i){
  const n = seen[i] || 0;
  if (!n) return 1;
  return Math.max(0.03, Math.pow(DECAY, n));
}
function pick(exclude){
  exclude = exclude || [];
  let total = 0;
  const ws = [];
  for (let i = 0; i < POOL.length; i++){
    const w = exclude.indexOf(i) >= 0 ? 0 : weightOf(i);
    ws.push(w); total += w;
  }
  if (total <= 0){
    let i;
    do { i = Math.floor(Math.random() * POOL.length); }
    while (exclude.indexOf(i) >= 0 && exclude.length < POOL.length);
    return i;
  }
  let r = Math.random() * total;
  for (let i = 0; i < ws.length; i++){
    r -= ws[i];
    if (r <= 0) return i;
  }
  return POOL.length - 1;
}
function seenCount(){
  let c = 0, num = 0;
  for (const k in seen) if (seen[k] > 0) c++;
  return c;
}
function updateHeader(){
  document.getElementById('themeName').textContent = theme.name;
  document.getElementById('seen').innerHTML = '已看 <b>' + seenCount() + '</b> / ' + POOL.length;
}

/* ===== 卡片 ===== */
function makeCard(i){
  const c = POOL[i];
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = '<div class="era"></div><h2></h2><p></p><div class="think"></div>';
  el.querySelector('.era').textContent = c.e || '';
  el.querySelector('h2').textContent = c.t;
  el.querySelector('p').textContent = c.b;
  const th = el.querySelector('.think');
  if (c.x) th.textContent = c.x; else th.remove();
  el.dataset.i = i;
  return el;
}
function place(el, y, scale, opacity){
  el.style.transform = 'translate3d(0,calc(-50% + ' + y + 'px),0) scale(' + scale + ')';
  el.style.opacity = String(opacity);
}
function markSeen(i){
  seen[i] = (seen[i] || 0) + 1;
  saveSeen();
  updateHeader();
}
function render(i, fromDir){
  stage.innerHTML = '';
  const el = makeCard(i);
  el.style.transition = 'none';
  place(el, fromDir ? fromDir * 36 : 0, fromDir ? 0.95 : 1, 0);
  stage.appendChild(el);
  bindSwipe(el);
  requestAnimationFrame(() => {
    el.style.transition = '';
    place(el, 0, 1, 1);
  });
  curIdx = i;
  markSeen(i);
}
function next(){
  history.push(curIdx);
  const ex = history.slice(-8).concat([curIdx]).filter(x => x >= 0);
  render(pick(ex), 1);
}
function prev(){
  if (history.length < 2) return;
  history.pop();
  render(history[history.length - 1], -1);
}

/* ===== 手势 ===== */
function bindSwipe(el){
  let x0 = 0, y0 = 0, dx = 0, active = false, axis = null;
  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    active = true; dx = 0; axis = null;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    el.style.transition = 'none';
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!active) return;
    const tx = e.touches[0].clientX, ty = e.touches[0].clientY;
    dx = tx - x0;
    const dy = ty - y0;
    if (axis === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (axis === 'y') return;
    if (e.cancelable) e.preventDefault();
    el.style.transform = 'translate3d(' + dx + 'px,-50%,0) rotate(' + (dx * 0.025) + 'deg)';
    el.style.opacity = String(Math.max(0.4, 1 - Math.abs(dx) / 460));
  }, { passive: false });

  el.addEventListener('touchend', () => {
    if (!active) return;
    active = false;
    el.style.transition = '';
    if (dx <= -55){
      el.style.transform = 'translate3d(-120vw,-50%,0) rotate(-10deg)';
      el.style.opacity = '0';
      setTimeout(next, 160);
    } else if (dx >= 55){
      el.style.transform = 'translate3d(120vw,-50%,0) rotate(10deg)';
      el.style.opacity = '0';
      setTimeout(prev, 160);
    } else {
      place(el, 0, 1, 1);
    }
  }, { passive: true });

  el.addEventListener('touchcancel', () => {
    if (!active) return;
    active = false; el.style.transition = ''; place(el, 0, 1, 1);
  }, { passive: true });

  // 桌面 / 鼠标
  let mx = 0, down = false;
  el.addEventListener('mousedown', e => { down = true; mx = e.clientX; el.style.transition = 'none'; });
  window.addEventListener('mousemove', e => {
    if (!down) return;
    const d = e.clientX - mx;
    el.style.transform = 'translate3d(' + d + 'px,-50%,0) rotate(' + (d * 0.025) + 'deg)';
  });
  window.addEventListener('mouseup', e => {
    if (!down) return;
    down = false; el.style.transition = '';
    const d = e.clientX - mx;
    if (d <= -55) next(); else if (d >= 55) prev(); else place(el, 0, 1, 1);
  });
}

window.addEventListener('keydown', e => {
  if (document.getElementById('sheet').classList.contains('on')){
    if (e.key === 'Escape') closeSheet();
    return;
  }
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

/* ===== 主题切换 ===== */
const sheet = document.getElementById('sheet');
const themeList = document.getElementById('themeList');

function renderThemeList(){
  themeList.innerHTML = '';
  THEMES.forEach(t => {
    const b = document.createElement('button');
    b.className = 'titem' + (t.id === theme.id ? ' now' : '');
    b.innerHTML = '<div><span>' + t.name + '</span><small>' + t.desc + '</small></div><span class="dot">●</span>';
    b.onclick = () => { switchTheme(t.id); };
    themeList.appendChild(b);
  });
}
function openSheet(){ renderThemeList(); sheet.classList.add('on'); }
function closeSheet(){ sheet.classList.remove('on'); }

function switchTheme(id){
  theme = THEMES.find(t => t.id === id) || THEMES[0];
  try { localStorage.setItem(KEY_THEME, theme.id); } catch(e){}
  POOL = theme.cards;
  seen = loadSeen();
  history = [];
  closeSheet();
  updateHeader();
  render(pick([]), 0);
}

document.getElementById('themeBtn').onclick = openSheet;
document.getElementById('closeSheet').onclick = closeSheet;
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

/* ===== 启动 ===== */
seen = loadSeen();
updateHeader();
render(pick([]), 0);
</script>
</body>
</html>
