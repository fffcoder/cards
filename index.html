": "制度移植得快，社会基础跟不上就会反复。"}, {"e": "近代·民国", "t": "宋教仁遇刺：一次关键人物的消失", "b": "1913 年宋教仁在上海遇刺，国民党与袁世凯的合作彻底破裂，议会政治的道路基本被堵死。", "x": "关键人物的消失，会让一条路线直接断掉。"}, {"e": "近代·民国", "t": "二次革命与护法运动", "b": "袁世凯控制中央后，国民党发动二次革命失败，孙中山南下广州组织护法。中央与地方的对抗成为民国初年的主线。", "x": "没有军队支撑的政治主张，很难落地。"}, {"e": "近代·民国", "t": "袁世凯称帝：一次失败的赌注", "b": "1915 年袁世凯宣布称帝，遭到各方反对，不到三个月取消，次年病死。旧式权威在共和时代已经失去合法性。", "x": "用旧脚本演新戏，观众不会买账。"}, {"e": "近代·民国", "t": "军阀混战：地方割据的二十年", "b": "北洋分裂后，直系、皖系、奉系等军阀争夺中央，地方军事化加剧。国家统一在很长时间里只是一种名义。", "x": "中央权威一旦碎裂，地方军事力量会迅速填补空白。"}, {"e": "近代·民国", "t": "五四运动：学生走上街头", "b": "1919 年巴黎和会消息传来，北京学生上街抗议，随后全国响应。新文化运动的思想积累与民族情绪在这里汇合。", "x": "社会情绪需要现成的组织才能变成行动。"}, {"e": "近代·民国", "t": "新文化运动：从语言开始改造", "b": "胡适提倡白话文，陈独秀办《新青年》，鲁迅写《狂人日记》。语言工具的改造，让新思想能进入更多人的阅读范围。", "x": "语言一变，思想的传播半径就变了。"}, {"e": "近代·民国", "t": "科学与民主：一个时代的两个关键词", "b": "五四提出的科学与民主，把批判的矛头指向传统礼教与家族制度。它既是思想解放，也是对旧社会结构的公开质疑。", "x": "口号之所以有力，是因为它同时说中了理想和不满。"}, {"e": "近代·民国", "t": "马克思主义在中国的传播", "b": "十月革命后，李大钊、陈独秀等人开始介绍马克思主义，1921 年中国共产党成立。一种新的组织方式进入中国的政治场。", "x": "新的组织方式进来，往往比新的理论更改变局面。"}, {"e": "近代·民国", "t": "第一次国共合作与北伐", "b": "1924 年国民党改组，与共产党合作，1926 年北伐迅速推进，击败吴佩孚、孙传芳，国民政府定都南京。", "x": "合作能迅速改变力量对比，也埋下分歧的伏笔。"}, {"e": "近代·民国", "t": "1927 年：合作破裂与新的分裂", "b": "北伐途中，国共合作破裂，随后进入十年内战。此后的政治主线，变成党内、党外的多条冲突同时进行。", "x": "旧问题没解决，新矛盾已经叠加上来。"}, {"e": "近代·民国", "t": "南京国民政府的十年", "b": "国民政府推行币制改革、修铁路、办教育，同时面临内部军阀与外部威胁。国家能力有限，很多政策难以真正落地。", "x": "现代化需要的不只是意愿，还有执行能力。"}, {"e": "近代·民国", "t": "法币改革：一次成功的货币统一", "b": "1935 年废银元、行法币，纸币统一，财政与市场得到稳定。抗日战争爆发后，为筹款大量发行，埋下通胀隐患。", "x": "短期有效的财政工具，用久了会反噬。"}, {"e": "近代·民国", "t": "农村问题：土地与佃租", "b": "近代中国农村土地集中、佃租高、借贷利息重，加上天灾与苛捐，大量农民生活艰难。农村问题贯穿整个近代。", "x": "所有宏大的政治，最终都要在村子里兑现。"}, {"e": "近代·抗战", "t": "日本侵华：从九一八到七七", "b": "1931 年九一八事变日本占领东北，1937 年七七事变全面侵华。民族危机压过了此前的内部纷争。", "x": "外部的压力，有时会短暂压下内部的矛盾，但不会解决它。"}, {"e": "近代·抗战", "t": "抗战中的后方工业内迁", "b": "大批工厂、学校与机构迁往重庆、昆明、成都等地，形成临时的工业与教育中心。战争迫使国家组织能力大幅提升。", "x": "极端的压力，也会逼出原本不存在的能力。"}, {"e": "近代·抗战", "t": "陕甘宁边区与根据地", "b": "中共在根据地推行土地政策、群众动员与基层政权建设，形成了与国统区不同的治理模式。", "x": "治理模式的竞争，往往比战争本身更决定长期走向。"}, {"e": "近代·抗战", "t": "重庆与延安：两种政治语言的对照", "b": "抗战时期，国民政府与中共在动员方式、社会政策与话语体系上差异明显。同一场战争里，有两条不同的组织路径。", "x": "同一个目标下，往往同时存在几种做法，看哪种能持续。"}, {"e": "近代·战后", "t": "抗战胜利后的局面", "b": "1945 年胜利后，国共对未来的政治安排分歧明显，谈判与冲突并行。国家重建的机会与内战的危险同时存在。", "x": "胜利之后的选择，往往比战争期间的判断更难。"}, {"e": "近代·战后", "t": "通货膨胀：民国后期的财政崩塌", "b": "内战期间军费浩大，货币超发，物价飞涨，城市居民的储蓄迅速蒸发。经济崩溃对政权的合法性的打击，往往比战场失利更直接。", "x": "一个政权失去货币信用时，公众对它的信任也会跟着耗光。"}, {"e": "近代·战后", "t": "土地改革：一次彻底的社会改造", "b": "在解放区推行的土地改革改变了农村的产权结构，把大量农民与新的政权绑定在一起。", "x": "把利益结构改掉，往往比赢几场仗更能改变格局。"}, {"e": "近代·战后", "t": "三大战役", "b": "辽沈、淮海、平津三大战役在不到半年内改变了军事力量对比，东北、华东、华北的控制权转移。", "x": "决定性战役的价值，在于让它后面的事变得不必再打。"}, {"e": "近代·战后", "t": "1949：近代的落幕", "b": "1949 年新中国成立，此后进入新的历史阶段。近代的很多议题，比如工业化、外交、农村问题，换了一种方式继续存在。", "x": "时代的名字会变，问题的清单往往还在。"}, {"e": "近代·专题", "t": "条约体系：一层层叠加的约束", "b": "从南京条约到辛丑条约，每次战败都带来新的条款，割地、赔款、通商、驻兵、传教，积累成一套结构性约束。", "x": "让步一旦成为惯例，下一轮谈判的起点就会更低。"}, {"e": "近代·专题", "t": "赔款与财政：借来的钱要用什么还", "b": "近代的赔款多靠向外国银行借款，以关税、盐税作抵押，财政的自主权被逐步抵押出去。", "x": "借来的钱，往往要用未来的选择权来还。"}, {"e": "近代·专题", "t": "教案与地方社会", "b": "传教士进入内地后，民教冲突频发，涉及土地、司法与地方权威。教案背后是旧秩序与新秩序在乡村层面的碰撞。", "x": "宏大的变化，最后都在具体的地方关系里显现。"}, {"e": "近代·专题", "t": "从士绅到新知识分子", "b": "科举废除后，读书人不再靠功名上升，转而成为教师、记者、律师、工程师。精英的构成和思维方式都变了。", "x": "精英的定义一变，社会的话语权也跟着变。"}, {"e": "近代·专题", "t": "女性与近代", "b": "废缠足、办女学、女性进入公共职业，这些变化首先出现在口岸城市。妇女解放与民族救亡结合，成为一种新的社会议题。", "x": "社会变革最先在最日常的地方留下痕迹。"}, {"e": "近代·专题", "t": "铁路与近代国家", "b": "铁路缩短了地理距离，也让中央能更快抵达边疆。同时，铁路修建与收回牵动了地方利益与民族情绪。", "x": "交通能力提升后，国家的边界也变得清晰。"}, {"e": "近代·专题", "t": "近代的公共舆论与知识分子", "b": "报刊、学会、学校构成了新的公共空间，知识分子以议论时政的方式参与政治，这种参与方式一直延续。", "x": "有读者的人，就有了某种政治力量。"}]}, {"id": "all", "name": "全部", "desc": "所有朝代一起看 · 611 张", "parts": ["xianqin", "qinhan", "weijin", "suitang", "songyuan", "ming", "qing", "modern"]}];
window.__GLOSSARY__ = {"孔子": "春秋鲁国人，儒家创始人。做过鲁国司寇，政治主张没被采纳，后半生办学讲学，主张以礼和道德秩序治理社会。", "老子": "春秋时期思想家，道家代表。主张少干预、顺自然，认为反复折腾往往带来更坏的后果。", "墨子": "战国时期思想家，墨家创始人。主张兼爱、非攻，同时擅长守城器械和组织纪律，是先秦少有的技术型团体。", "韩非": "战国末期法家代表，韩国公子。主张以法、术、势治国，让治理不依赖个人贤能，不依赖贤人。", "商鞅": "战国时期秦国改革家。推行军功授爵、废井田、奖励耕战，把秦国改造成高度动员的国家机器。", "管仲": "春秋时期齐国政治家，辅佐齐桓公称霸。善用经济手段，被后世视为早期重商与宏观调控的代表。", "屈原": "战国时期楚国大夫、诗人。主张联齐抗秦，不被采纳而流放，作《离骚》，最终投汨罗江。", "陈胜": "秦末农民起义领袖，与吴广在大泽乡起事，是第一次大规模反秦起义。", "吴广": "秦末起义领袖，与陈胜一同在大泽乡起兵，后被部下所杀。", "秦始皇": "名嬴政，结束战国分裂建立秦朝，统一文字、度量衡、货币，推行郡县制，也因高压统治迅速亡国。", "李斯": "秦朝丞相，法家代表。辅佐秦始皇统一制度，也参与沙丘之变，后被赵高陷害处死。", "刘邦": "汉高祖，起于沛县，推翻秦朝、击败项羽建立汉朝，实行郡国并行与休养生息。", "项羽": "秦末西楚霸王，巨鹿之战击败秦军主力，后与刘邦争天下，垓下兵败自刎。", "汉武帝": "名刘彻，西汉第七位皇帝。北击匈奴、通西域、独尊儒术，同时盐铁官营，连年征战耗尽民生。", "司马迁": "西汉史学家。因替李陵辩护受宫刑，忍辱完成《史记》，开创纪传体通史。", "张骞": "西汉使者。两次出使西域，本为联合大月氏夹击匈奴，军事目的落空，却打通了丝绸之路。", "王莽": "西汉外戚，代汉建立新朝。照《周礼》强行复古改制，失败后新朝速亡。", "刘秀": "汉光武帝，东汉开国皇帝。战乱后休养生息、裁撤冗员，重建中央集权的文书行政。", "蔡伦": "东汉宦官，改进造纸术，使纸张逐渐取代竹简，书籍成本大幅下降。", "曹操": "东汉末政治家、军事家。统一北方，推行屯田，为曹魏奠基，一生未称帝。", "刘备": "三国时期蜀汉开国皇帝，以宗室身份起兵，据益州与蜀汉对抗曹魏、东吴。", "孙权": "三国时期东吴建立者，据长江天险，与魏、蜀鼎立，开发江南。", "诸葛亮": "三国时期蜀汉丞相，辅佐刘备、刘禅，主政蜀汉，以《出师表》与北伐著称。", "祖逖": "东晋将领，自行招募军队北伐，一度收复黄河以南，因朝廷支持不足无功。", "苻坚": "前秦皇帝，统一北方后南征东晋，在淝水之战大败，前秦随后崩解。", "孝文帝": "北魏皇帝拓跋宏，迁都洛阳，推行改汉姓、穿汉服、说汉话的汉化改革。", "高欢": "东魏权臣，六镇之乱后崛起，掌控东魏朝政，为北齐奠基。", "宇文泰": "西魏权臣，创立府兵制雏形，为北周和隋唐的军事制度打下基础。", "隋炀帝": "名杨广，隋朝第二位皇帝。修大运河、建东都、三征高句丽，工程与战争叠加压垮民力。", "唐太宗": "名李世民，唐朝第二位皇帝。以纳谏著称，与魏征等讨论隋亡教训，开创贞观之治。", "魏征": "唐太宗时期名臣，以敢言直谏著称，前后上谏二百余事。", "武则天": "唐朝女皇，先为高宗皇后，后称帝改国号周。提拔寒门、设北门学士，也任用酷吏清除异己。", "玄奘": "唐代高僧，西行天竺取经，归国后主持译经，著《大唐西域记》。", "鉴真": "唐代高僧，六次东渡日本，最终抵达，传播律宗与建筑、医药技术。", "安禄山": "唐朝节度使，兼领平卢、范阳、河东三镇，755 年发动安史之乱。", "史思明": "唐朝节度使，与安禄山共同发动安史之乱，后自立为帝，被其子所杀。", "杜甫": "唐代诗人，经历安史之乱，作品记录战乱中的民生，被称为诗史。", "李白": "唐代诗人，盛唐气象的代表，诗风豪放，一生仕途不顺。", "黄巢": "唐末起义领袖，从山东起兵，转战大半个中国，攻入长安，加速唐朝灭亡。", "宋太祖": "名赵匡胤，宋朝开国皇帝。陈桥兵变黄袍加身，杯酒释兵权，确立重文轻武的国策。", "王安石": "北宋政治家，主持熙宁变法，推行青苗、免役、市易等法，意在富国强兵，执行中多有扰民。", "司马光": "北宋政治家、史学家，反对王安石变法，主持编撰编年体通史《资治通鉴》。", "苏轼": "北宋文学家，因乌台诗案被贬，一生宦海起伏，诗文书画皆成大家。", "沈括": "北宋科学家，著《梦溪笔谈》，记录毕昇活字印刷等重要技术。", " function hydrateThemes() {

  if (!window.__THEMES__.some(t => t.cards && t.cards.length && t.id !== 'all')) {

  }
}

function loadSeen() {
  try {
    const raw = JSON.parse(localStorage.getItem(seenKey()) || '{}');
    if (!raw || typeof raw !== 'object') return {};
    // 卡片数量变化后，越界的旧索引会污染统计，这里直接丢掉
    const clean = {};
    for (const k in raw) {
      const i = Number(k);
      if (Number.isInteger(i) && i >= 0 && i < pool.length) clean[i] = raw[k];
    }
    return clean;
  } catch (e) { return {}; }
}

function saveSeen() {
  try { localStorage.setItem(seenKey(), JSON.stringify(seen)); } catch (e) {}
}

/* ---------- 权重抽取 ---------- */
function weightOf(i) {
  const n = Number(seen[i]) || 0;
  if (!n) return 1;
  return Math.max(CONFIG.floor, Math.pow(CONFIG.decay, n));
}

function pick(exclude) {
  exclude = exclude || [];
  let total = 0;
  const weights = [];
  for (let i = 0; i < pool.length; i++) {
    const w = exclude.indexOf(i) >= 0 ? 0 : weightOf(i);
    weights.push(w);
    total += w;
  }
  if (total <= 0) {
    // 全部看过了：均匀随机，但尽量避开刚看过的
    const avail = [];
    for (let i = 0; i < pool.length; i++) if (exclude.indexOf(i) < 0) avail.push(i);
    const src = avail.length ? avail : Array.from({ length: pool.length }, (_, i) => i);
    return src[Math.floor(Math.random() * src.length)];
  }
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return pool.length - 1;
}

/* ---------- 顶部信息 ---------- */
function seenCount() {
  let n = 0;
  for (const k in seen) {
    // 只统计当前池子范围内的索引（卡片内容换过之后，旧记录会越界）
    const i = Number(k);
    if (seen[k] > 0 && i >= 0 && i < pool.length) n++;
  }
  return n;
}

function updateHeader() {
  document.getElementById('themeName').textContent = theme.name;
}

/* ---------- 渲染 ---------- */
function place(el, offsetY, scale, opacity) {
  el.style.transform = 'translate3d(0, calc(-50% + ' + offsetY + 'px), 0) scale(' + scale + ')';
  el.style.opacity = String(opacity);
}

function markSeen(i) {
  seen[i] = (seen[i] || 0) + 1;
  saveSeen();
  updateHeader();
}

/** 把卡片内容刷成第 i 张（复用同一个元素） */
function fillCard(el, i) {
  const c = pool[i];
  el.innerHTML = '<div class="era"></div><h2></h2><p></p><div class="think"></div>';

  const era = el.querySelector('.era');
  if (c.e) era.textContent = c.e; else era.remove();

  el.querySelector('h2').textContent = c.t;
  el.querySelector('p').innerHTML = markTerms(c.b, c.terms);
  bindTerms(el);

  const think = el.querySelector('.think');
  if (c.x) think.textContent = c.x; else think.remove();

  el.dataset.i = i;
  curIdx = i;
  markSeen(i);
}

/**
 * 换卡：总是「当面这一张原地换内容」，不做双卡叠层动画。
 * 上下滑动时卡片跟手移动，松手后归位；成功翻页就用新内容复位。
 * 这样无论多快连滑，都不会出现卡片飞出后没有新卡接管、或者透明度停在 0。
 */
function render(i, fromDir) {
  if (!pool.length) return;
  i = Math.max(0, Math.min(i, pool.length - 1));

  const dir = fromDir || 0;
  resetGestures();

  // 清掉多余卡片，只留一张
  const cards = stage.querySelectorAll('.card');
  for (let k = 1; k < cards.length; k++) cards[k].remove();

  let el = cards[0];
  if (!el) {
    el = document.createElement('div');
    el.className = 'card';
    stage.appendChild(el);
  }

  fillCard(el, i);
  bindSwipe(el);

  // 新内容从滑动来的方向轻轻归位
  el.style.transition = 'none';
  place(el, dir === 0 ? 0 : -(dir * 26), 1, 1);

  requestAnimationFrame(() => {
    el.style.transition = '';
    place(el, 0, 1, 1);
  });
}

function next() {
  // 只记最近几张用于去重，不再支持回看
  history.push(curIdx);
  if (history.length > CONFIG.recent + 2) history.shift();
  const recent = history.slice(-CONFIG.recent).filter(x => x >= 0);
  render(pick(recent), 1);
}

/* ---------- 手势（上下滑，像短视频那样一屏一张） ---------- */
let gestureLock = false;
let currentCleanup = null;

function bindSwipe(el) {
  el.addEventListener('touchstart', onTouchStart, { passive: true });

  // 鼠标 / 桌面预览
  let my = 0, down = false;
  el.addEventListener('mousedown', e => {
    down = true;
    my = e.clientY;
    el.style.transition = 'none';
  });
  window.addEventListener('mousemove', e => {
    if (!down) return;
    const d = e.clientY - my;
    el.style.transform = 'translate3d(0, calc(-50% + ' + d + 'px), 0)';
  });
  window.addEventListener('mouseup', e => {
    if (!down) return;
    down = false;
    el.style.transition = '';
    const d = e.clientY - my;
    if (d <= -CONFIG.threshold) fan(el, -1);
    else place(el, 0, 1, 1);
  });
}

function onTouchStart(e) {
  if (e.touches.length !== 1 || gestureLock) return;
  const el = e.currentTarget;
  const x0 = e.touches[0].clientX;
  const y0 = e.touches[0].clientY;
  let dy = 0, axis = null, done = false;

  el.style.transition = 'none';

  function move(ev) {
    if (!(ev.touches && ev.touches.length)) return;
    const tx = ev.touches[0].clientX;
    const ty = ev.touches[0].clientY;
    dy = ty - y0;
    const dx = tx - x0;

    if (axis === null && (Math.abs(dx) > CONFIG.axisLock || Math.abs(dy) > CONFIG.axisLock)) {
      axis = Math.abs(dy) > Math.abs(dx) ? 'y' : 'x';
    }
    if (axis === 'x') return;

    if (ev.cancelable) ev.preventDefault();
    const damped = dy * 0.92;
    el.style.transform = 'translate3d(0, calc(-50% + ' + damped + 'px), 0)';
    el.style.opacity = String(Math.max(0.35, 1 - Math.abs(damped) / 620));
  }

  function cleanup() {
    window.removeEventListener('touchmove', move);
    window.removeEventListener('touchend', end);
    window.removeEventListener('touchcancel', cancel);
    currentCleanup = null;
  }

  function end() {
    if (done) return;
    done = true;
    cleanup();
    if (axis === 'x') return;

    el.style.transition = '';
    if (dy <= -CONFIG.threshold) fan(el, -1);       // 上滑 → 下一张
    else place(el, 0, 1, 1);                        // 下滑 → 弹回
  }

  function cancel() {
    if (done) return;
    done = true;
    cleanup();
    el.style.transition = '';
    place(el, 0, 1, 1);
  }

  currentCleanup = cleanup;
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', end, { passive: true });
  window.addEventListener('touchcancel', cancel, { passive: true });
}

/** 收起旧的手势监听并解锁 */
function resetGestures() {
  if (typeof currentCleanup === 'function') {
    try { currentCleanup(); } catch (e) {}
    currentCleanup = null;
  }
  gestureLock = false;
}

/** 手势确认：dir=-1 下一张（上滑），1 上一张（下滑） */
function fan(el, dir) {
  hidePop();

  // 只支持往下滑（上滑）切下一张，反方向一律弹回原位
  if (dir > 0) {
    el.style.transition = '';
    place(el, 0, 1, 1);
    return;
  }

  next();
}

/* ---------- 键盘 ---------- */
window.addEventListener('keydown', e => {
  if (sheet.classList.contains('on')) {
    if (e.key === 'Escape') closeSheet();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
});

/* ---------- 词条 ---------- */
const GLOSSARY = window.__GLOSSARY__ || {};
let activePop = null;
let activeTerm = null;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/**
 * 正文里的词条包成 <span class="term">。
 * 同一张卡里同一个词只标第一次出现；优先匹配长词。
 */
function markTerms(text, allowed) {
  if (!text) return '';
  let keys = Object.keys(GLOSSARY);
  if (allowed && allowed.length) keys = keys.filter(k => allowed.indexOf(k) >= 0);
  keys.sort((a, b) => b.length - a.length);
  if (!keys.length) return escapeHtml(text);

  const used = [];
  let out = '', i = 0;
  while (i < text.length) {
    let hit = null;
    for (const k of keys) {
      if (text.startsWith(k, i) && used.indexOf(k) < 0) { hit = k; break; }
    }
    if (hit) {
      used.push(hit);
      out += '<span class="term" data-term="' + escapeHtml(hit) + '">' + escapeHtml(hit) + '</span>';
      i += hit.length;
    } else {
      out += escapeHtml(text[i]);
      i++;
    }
  }
  return out;
}

function ensurePop() {
  if (activePop) return activePop;
  activePop = document.createElement('div');
  activePop.id = 'pop';
  document.body.appendChild(activePop);
  return activePop;
}

function hidePop() {
  if (activePop) activePop.classList.remove('on');
  activeTerm = null;
}

function showPop(term, anchor) {
  const def = GLOSSARY[term];
  if (!def) return;
  const pop = ensurePop();
  pop.innerHTML = '<b>' + escapeHtml(term) + '</b>' + escapeHtml(def);

  const r = anchor.getBoundingClientRect();
  const pad = 12;
  pop.style.visibility = 'hidden';
  pop.classList.add('on');

  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(pad, Math.min(left, window.innerWidth - pw - pad));

  const above = r.top - ph - 12;
  let top;
  if (above >= pad + 8) {
    top = above;
    pop.classList.remove('below');
    pop.classList.add('above');
  } else {
    top = r.bottom + 12;
    pop.classList.remove('above');
    pop.classList.add('below');
  }

  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.setProperty('--arrow-x', Math.max(14, Math.min(pw - 14, r.left + r.width / 2 - left)) + 'px');
  pop.style.visibility = '';
  activeTerm = term;
}

function bindTerms(el) {
  el.querySelectorAll('.term').forEach(t => {
    t.addEventListener('click', e => {
      e.stopPropagation();
      const term = t.dataset.term;
      if (activeTerm === term && activePop && activePop.classList.contains('on')) hidePop();
      else showPop(term, t);
    });
  });
}

document.addEventListener('touchstart', e => {
  if (e.target.closest && e.target.closest('.term')) return;
  hidePop();
}, { passive: true });
document.addEventListener('mousedown', e => {
  if (e.target.closest && e.target.closest('.term')) return;
  hidePop();
});
window.addEventListener('resize', hidePop);

/* ---------- 主题选择 ---------- */
function renderThemeList() {
  themeList.innerHTML = '';
  window.__THEMES__.forEach(t => {
    const b = document.createElement('button');
    b.className = 'titem' + (t.id === theme.id ? ' now' : '');
    b.innerHTML =
      '<div><span>' + t.name + '</span><small>' + t.desc.replace(t.name, '').replace(/^\s*·?\s*/, '') + '</small></div>' +
      '<span class="dot">●</span>';
    b.onclick = () => switchTheme(t.id);
    themeList.appendChild(b);
  });
}

function openSheet() {
  renderThemeList();
  sheet.classList.add('on');
}

function closeSheet() {
  sheet.classList.remove('on');
}

function switchTheme(id) {
  theme = window.__THEMES__.find(t => t.id === id) || window.__THEMES__[0];
  try { localStorage.setItem(KEY_THEME, theme.id); } catch (e) {}
  pool = theme.cards;
  seen = loadSeen();
  history = [];
  closeSheet();
  updateHeader();
  render(pick([]), 0);
}

document.getElementById('themeBtn').onclick = openSheet;
document.getElementById('closeSheet').onclick = closeSheet;
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

/* ---------- 启动 ---------- */
(function init() {
  const saved = localStorage.getItem(KEY_THEME);
  theme = window.__THEMES__.find(t => t.id === saved) || window.__THEMES__[0];
  pool = theme.cards;
  seen = loadSeen();

  // 只有一个主题时，隐藏切换按钮
  if (window.__THEMES__.length < 2) {
    document.getElementById('themeBtn').style.display = 'none';
  }
  const seenEl = document.getElementById('seen');
  if (seenEl) seenEl.remove();

  updateHeader();
  render(pick([]), 0);
})();

</script>

</body>
</html>
