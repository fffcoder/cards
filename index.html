: "为筹措军饷，清廷允许地方设卡征收过境税，即厘金。它效率高、见效快，但层层设卡，成为商业流通的长期负担。", "x": "应急的办法一旦好用，就没多少人愿意再改回去。"}, {"e": "清·咸丰", "t": "总理衙门：清廷第一个外交机构", "b": "1861 年设立总理各国事务衙门，由奕訢主持，处理对外交涉、通商、海防等事务。传统朝贡体系之外，终于有了一个现代意义上的对外机构。", "x": "承认需要专门机构处理某件事，本身就是一次观念转变。"}, {"e": "清·同治", "t": "洋务运动：只换工具，不动结构", "b": "曾国藩、李鸿章、左宗棠等人办工厂、设船政局、练新军，主张师夷长技以制夷。技术层面的追赶推进得很快，制度层面的改革几乎没动。", "x": "只换工具、不改结构，关键时刻就会被打回原形。"}, {"e": "清·同治", "t": "江南制造总局：中国第一座机器工厂", "b": "1865 年李鸿章在上海创办江南制造总局，生产枪炮弹药并附设翻译馆，翻译西方科技书籍，培养了一批早期技术人才。", "x": "一个工厂能带出的，往往不只是产品。"}, {"e": "清·同治", "t": "福州船政局：自己造船的尝试", "b": "左宗棠在福州马尾创办船政局，附设船政学堂，培养了严复、邓世昌等一批人。它让中国第一次系统接触近代造船与海军教育。", "x": "技术引进最值钱的副产品，是人。"}, {"e": "清·同治", "t": "留美幼童：被提前叫回来的那一批孩子", "b": "1872 年起清政府派幼童赴美留学，原定十五年，因担心西化过深在 1881 年提前召回。其中出了詹天佑等人，但多数人的学业被中断。", "x": "担心被改变得太多，往往会失去本来能得到的东西。"}, {"e": "清·同治", "t": "京师同文馆：培养第一批翻译与外交人才", "b": "1862 年设立同文馆，教授外语与西学，是中国最早的近代官办学校之一。反对者认为读洋文有失体统，争议持续多年。", "x": "学习对方的语言，常常比学技术更让人抗拒。"}, {"e": "清·同治", "t": "天津教案：民愤与外交的双重夹击", "b": "1870 年天津因传闻教堂拐卖儿童引发骚乱，法国领事等数十人被杀。曾国藩处理时既遭外国压力，又被国内舆论指责软弱。", "x": "夹在两边的中间人，往往两边都不讨好。"}, {"e": "清·光绪", "t": "左宗棠收复新疆：一场赌国库的远征", "b": "1870 年代阿古柏占据新疆，沙俄占伊犁。左宗棠主张塞防，率军西征，靠借款和转运粮草完成收复，新疆随后建省。", "x": "最难的不是打，是把部队送到能打的地方。"}, {"e": "清·光绪", "t": "海防与塞防之争：有限的银子往哪放", "b": "李鸿章主张优先海防，左宗棠主张塞防，最终两边都办，两边都不够。资源约束下，选择题往往没有让人满意的答案。", "x": "预算不够时，真正的决策是决定哪件事不做。"}, {"e": "清·光绪", "t": "北洋水师：亚洲第一，然后呢", "b": "1888 年成军的北洋水师一度号称亚洲第一，但此后购舰停滞、弹药不足、训练流于形式。领先是暂时的，投入一停就开始落后。", "x": "排名是最会骗人的东西，尤其是靠一次投入换来的排名。"}, {"e": "清·光绪", "t": "甲午战争：输的不只是海战", "b": "1894 年战争在朝鲜爆发，陆战与海战接连失利，北洋水师在威海卫覆没。清廷战前对日本实力评估严重不足。", "x": "判断错了对手，后面的准备都白做。"}, {"e": "清·光绪", "t": "《马关条约》：两亿两白银的重量", "b": "1895 年条约割让台湾、澎湖与辽东，赔款两亿两白银。赔款逼出了后来的借款与列强瓜分，财政被彻底绑住。", "x": "一次赔款的数字，会成为之后十几年的枷锁。"}, {"e": "清·光绪", "t": "三国干涉还辽：弱国需要别人来保", "b": "马关条约后俄德法三国出面干涉，日本退还辽东，清廷以三千万两赎回。表面收复失地，实际上把自己放进了列强的博弈盘里。", "x": "靠别人拿回来的东西，往往要用别的方式还。"}, {"e": "清·光绪", "t": "公车上书：读书人第一次集体发声", "b": "马关条约签订后，康有为等举人上书反对议和，主张变法。虽然没送到皇帝手里，但形成了士人公开议论国事的氛围。", "x": "一个诉求有没有被听到不重要，重要的是有人开始说了。"}, {"e": "清·光绪", "t": "强学会与《时务报》：维新派的传播机器", "b": "康有为办强学会，梁启超主笔《时务报》，用报纸把变法主张传播到各地。思想动员先于政治行动。", "x": "改变舆论的成本一降低，行动的门槛就跟着降低。"}, {"e": "清·光绪", "t": "戊戌变法：一百零三天的改革", "b": "1898 年光绪推行新政，涉及教育、军事、工商、官制，百余日间发布大量诏令，触动了大量既得利益者。", "x": "改革失败往往不是因为目标错，而是节奏超出了承受力。"}, {"e": "清·光绪", "t": "戊戌政变的直接导火索", "b": "变法派试图拉拢袁世凯以武力对抗慈禧，事机泄露，慈禧发动政变，光绪被软禁，谭嗣同等六君子被杀。", "x": "没有可靠力量的政变计划，等于把牌摊给对方看。"}, {"e": "清·光绪", "t": "废除科举前的那场争论", "b": "变法期间主张废八股、改试策论，虽随变法失败而中止，但议题已经摆上台面。制度的改变常常在失败后被下一轮接手。", "x": "失败的主张也可能赢，只是晚几年。"}, {"e": "清·光绪", "t": "义和团：民间焦虑的爆发", "b": "1890 年代末山东直隶教案与民教冲突频发，义和团以扶清灭洋为号，攻击教堂教民。背后是旱灾、失业与对变化的恐惧。", "x": "看起来是情绪的行动，底下是具体的生计问题。"}, {"e": "清·光绪", "t": "庚子西狩：清廷的又一次出逃", "b": "1900 年八国联军攻入北京，慈禧带光绪逃往西安。这是四十年内清廷第二次弃都，中央权威进一步削弱。", "x": "同一个组织如果反复靠撤离保命，最后就没人再当真。"}, {"e": "清·光绪", "t": "《辛丑条约》：四亿五千万两", "b": "1901 年条约规定赔款四亿五千万两，分三十九年还清，本息合计近十亿两，并允许列强驻兵北京至山海关沿线。", "x": "把赔款按人头算，是让每个中国人都背上这笔账。"}, {"e": "清·光绪", "t": "新政：清廷最后一次认真的自救", "b": "1901 年后清廷推行新政，废科举、练新军、办学堂、筹备立宪、奖励实业。改革力度很大，但财政与时间都不站在它这边。", "x": "改革来得太晚时，它本身也会成为旧秩序崩解的一部分。"}, {"e": "清·光绪", "t": "废科举：一条路的终点", "b": "1905 年清廷下诏停止科举，读书人失去延续千年的上升通道，转向新式学堂、军队、商业与革命。这项改革促进了近代化，也移走了一块稳定的基础。", "x": "砸掉一条路时，要想清楚人会往哪里走。"}, {"e": "清·宣统", "t": "新军：清廷亲手培养的掘墓人", "b": "清末编练新军，装备近代、军官多为留学生，但思想上也更接近革命。湖北新军后来成为武昌起义的主力。", "x": "一支军队的组织形式，也会改变它的政治倾向。"}, {"e": "清·宣统", "t": "预备立宪与皇族内阁", "b": "1906 年清廷宣布预备立宪，1908 年颁布《钦定宪法大纲》，1911 年成立内阁，但十三名大臣中满族占九席。承诺一旦被看成敷衍，信任就回不来了。", "x": "给出承诺却不肯真的让权，比不承诺更伤信任。"}, {"e": "清·宣统", "t": "保路运动：一条铁路点燃全国", "b": "1911 年清廷宣布铁路国有，将民办的川汉、粤汉铁路收归，补偿条件引发强烈不满，四川爆发大规模抗议。地方与中央的对立被彻底撕开。", "x": "具体的利益问题，最容易变成全国性的情绪。"}, {"e": "清·宣统", "t": "武昌起义：一颗子弹引发的连锁", "b": "1911 年 10 月 10 日新军起义，占领武昌，各省随后纷纷宣布独立。清廷此时已无力调动可靠军队，只能请袁世凯出面。", "x": "压垮系统的往往不是最强的一击，而是最后一下。"}, {"e": "清·宣统", "t": "袁世凯的算术：谁能调动军队谁说了算", "b": "袁世凯掌控北洋新军，在清廷与革命党之间周旋，一面逼清帝退位，一面与南方谈判，最终成为民国临时大总统。", "x": "到了最后，决定权落在谁手里，比谁更有道理更重要。"}, {"e": "清·宣统", "t": "清帝退位：中国最后一份退位诏书", "b": "1912 年 2 月 12 日宣统退位，诏书由张謇起草，承认共和，延续两千一百多年的帝制结束。", "x": "制度的终结往往是一纸文书，但支撑它的结构早就松了。"}, {"e": "清·宣统", "t": "孙中山与辛亥革命的角色", "b": "孙中山长期在海外组织革命、宣传三民主义，武装起义多次失败。辛亥革命爆发时他不在国内，但此前的舆论与组织积累不可替代。", "x": "关键事件的爆发看似偶然，背后是长期的准备。"}, {"e": "清·制度", "t": "军机处与内阁：清朝的中枢怎么运转", "b": "清朝政务实际由军机处拟旨、皇帝朱批后执行，内阁处理日常。中枢机构重叠，相互牵制，效率取决于皇帝个人的精力。", "x": "权力越集中，运转效率就越依赖一个人的状态。"}, {"e": "清·制度", "t": "满汉双轨：一个政权两种官员", "b": "清朝重要职位多设满汉两员，相互牵制。满族在核心职位上占据优势，汉族官员实际治理地方。这种安排维持了平衡，也限制了用人。", "x": "为防止某一方坐大而设计的结构，往往牺牲了效率。"}, {"e": "清·制度", "t": "督抚与中央：地方权力为何越来越重", "b": "太平天国以后，地方督抚掌握军队、财权与人事，中央对南方的控制减弱。清后期很多决策实际上是地方在做。", "x": "中央把救火的任务交给地方，火权也一并交出去了。"}, {"e": "清·制度", "t": "捐纳制度：卖官的那笔账", "b": "清朝允许捐钱买官，以补财政缺口。短期填补了收入，长期让官场充斥不专业的人，也让行政效率持续下滑。", "x": "一旦把公职当成商品，治理的质量就很难保证。"}, {"e": "清·制度", "t": "漕运与盐政：清朝的两大财源", "b": "清朝靠运河漕粮供应北京，靠盐专卖获得巨额收入。运河淤塞与私盐泛滥让这两项优势逐渐削弱，财政随之紧张。", "x": "财政的根基一旦松动，所有问题都会跟着冒出来。"}, {"e": "清·制度", "t": "保甲制度：国家治理的最末端", "b": "清代地方以保甲编户，负责治安、催税、统计人口。国家治理只到县一级，基层实际依靠宗族与乡绅维持。", "x": "治理成本过高时，国家会把一部分责任留给社会自己。"}, {"e": "清·制度", "t": "幕府与师爷：衙门里真正办事的人", "b": "清代官员多不熟悉律例与钱粮，实权往往在幕僚手里，刑名、钱谷师爷是地方行政的实际执行者。", "x": "名义上的权力和实际办事的人，常常不是同一批。"}, {"e": "清·制度", "t": "《大清律例》：帝国的行为边界", "b": "清代律例详细规定刑罚与行政规则，是帝国治理的重要依据。它稳定了秩序，但也让地方司法高度依赖条文与惯例。", "x": "规则越细，越能减少随意，也越容易跟不上变化。"}, {"e": "清·社会", "t": "清代的人口爆炸", "b": "清代人口从一亿多增长到四亿左右，得益于长期和平、摊丁入亩、新作物推广。人口压力同时意味着人均资源紧张。", "x": "总量增长的背后，往往是每个人分到的越来越少。"}, {"e": "清·社会", "t": "番薯与玉米：养活中国的美洲作物", "b": "番薯、玉米、马铃薯自明末传入，清代在山地丘陵广泛种植，支撑了人口增长，也带来过度开垦与水土流失。", "x": "救急的办法，用久了也会变成新的负担。"}, {"e": "清·社会", "t": "一条辫子的政治含义", "b": "剃发留辫是清朝统治的象征，清初强制推行，清末又成为革命的对象。同一件事，在不同时期被读成完全相反的信号。", "x": "符号的意义，往往由当时的人赋予，而不是它本身。"}, {"e": "清·社会", "t": "缠足：一个社会的自我约束", "b": "缠足在清代社会各阶层广泛存在，既是审美偏好，也是婚姻竞争的结果。直到清末才被逐渐视为陋习而反对。", "x": "一种伤害被普遍接受时，往往不是没人看见，而是没人能先停下。"}, {"e": "清·社会", "t": "清代女性的实际位置", "b": "女性在法律与礼教上受压制，但实际经济与家庭角色复杂，寡妇主家、女性经营商业并不罕见。规范与生活之间总有距离。", "x": "制度写得再严，生活也会自己找到缝隙。"}, {"e": "清·社会", "t": "宗族：乡村的自我治理", "b": "清代宗族通过族田、祠堂、族规管理成员，处理纠纷与救济。国家无力覆盖的基层事务，很大一部分落在宗族身上。", "x": "公共治理不足时，社会会自己长出一些结构。"}, {"e": "清·社会", "t": "会馆与商帮：流动人口的组织", "b": "清代商业发达，同乡商人设会馆，提供住宿、借贷、调解与互助，晋商、徽商由此形成全国网络。", "x": "人一旦流动起来，就会需要新的组织来接住他们。"}, {"e": "清·社会", "t": "晋商与票号：中国早期的金融网络", "b": "山西商人经营票号，做汇兑与存放款业务，分号遍及全国。信用靠同乡与宗族关系保障，在没有现代银行的时代运转了几百年。", "x": "信任这个东西，可以靠关系替代制度运转一阵子。"}, {"e": "清·社会", "t": "徽商：靠科举与商业的结合", "b": "徽商经营盐、茶、木材与典当，重视子弟读书，商而优则仕。商业资本与科举身份相互支撑。", "x": "资本与身份结合，是最稳的一种积累方式。"}, {"e": "清·社会", "t": "清代的城市与市镇", "b": "清代江南市镇密集，工商业与手工业发达，苏州、杭州、汉口等城市人口众多。城市化带来新的社会问题与管理需求。", "x": "城市一变大，旧的治理方式就不够用了。"}, {"e": "清·社会", "t": "《红楼梦》背后的清代社会", "b": "曹雪芹写贾府的兴衰，展示清代贵族家庭的经济结构、人际网络与礼法压力。一个家族的败落，也在写制度如何运转。", "x": "最好的社会史，常常藏在小说里。"}, {"e": "清·社会", "t": "京剧的形成", "b": "清代徽班进京，融合昆曲、秦腔等，形成京剧。宫廷与市民的双重需求，共同推动了这门艺术。", "x": "一种艺术成熟，往往需要两边同时喜欢它。"}, {"e": "清·对外", "t": "朝贡体系：清廷理解世界的框架", "b": "清朝以朝贡关系理解对外交往，视外国为藩属或蛮夷。这套框架在遇到平等交往的要求时，既无法理解，也无法应对。", "x": "理解世界用的框架，决定了你能看见什么、又看不见什么。"}, {"e": "清·对外", "t": "广州体制：只有一条缝的通商", "b": "乾隆以后西洋贸易限于广州，由十三行代理，外商活动受限。贸易集中在一点，信息与技术输入也同样被压缩。", "x": "把门留成一条缝，进来的东西也就只有那么一点。"}, {"e": "清·对外", "t": "传教士与西学东渐", "b": "明末清初耶稣会士带来天文、历法、地图与数学知识，在宫廷任职。后来礼仪之争导致传教受限，交流中断。", "x": "知识的流动常常走一条非正式的窄路，断了就很难恢复。"}, {"e": "清·对外", "t": "礼仪之争：跪与不跪的问题", "b": "罗马教廷禁止中国教徒祭祖祭孔，康熙认为这是干涉内政，下令禁教。文化交流中最难谈的，往往不是知识，而是规则。", "x": "看起来是礼节的分歧，实际上是权威归属的分歧。"}, {"e": "清·对外", "t": "徐继畬与《瀛寰志略》", "b": "徐继畬在福建任职时搜集资料，编成《瀛寰志略》，介绍各国地理与政体，其中对美国制度的描述相当正面。此书在当时影响有限。", "x": "有人已经看清了，不等于整个系统会跟着改变。"}, {"e": "清·对外", "t": "魏源与《海国图志》", "b": "魏源编《海国图志》，提出师夷长技以制夷，介绍各国地理与军事技术。书在中国反响平平，在日本却被广泛阅读。", "x": "同一条信息，落在不同的环境里，价值完全不同。"}, {"e": "清·对外", "t": "郭嵩焘：第一个驻外使节的孤立", "b": "郭嵩焘出使英国，认真观察西方制度与生活，写日记如实记录，却被朝野斥为崇洋。他回国后几乎被排挤。", "x": "最先看见真相的人，往往最先被自己人攻击。"}, {"e": "清·对外", "t": "关税自主权的丧失", "b": "鸦片战争后协定关税，中国不能自主设定进口税率，税率长期很低。海关收入成为财政支柱，但税率由别人决定。", "x": "把一项关键权力交出去，恢复起来要花很久。"}, {"e": "清·对外", "t": "海关总税务司与赫德", "b": "英国人赫德长期主持中国海关，建立了高效、廉洁的税务体系，同时深度参与外交事务。能力很强，但权力掌握在外国人手里。", "x": "效率高的机构，如果归属不清，也是一种风险。"}, {"e": "清·对外", "t": "甲午之后的瓜分狂潮", "b": "1895 年后列强争相租借港口、划分势力范围，中国面临被瓜分的危机。危机会同时催生改革与激进化。", "x": "外部压力最大的时候，内部往往也最分裂。"}, {"e": "清·人物", "t": "康熙：一个长期执政者做了什么", "b": "康熙在位六十一年，平三藩、收台湾、抗沙俄、编《康熙字典》，同时晚期吏治松弛、继承问题未决。长任期既积累成就，也积累问题。", "x": "在位越久，留下的未解决问题也越多。"}, {"e": "清·人物", "t": "雍正：十三年把制度拧了一遍", "b": "雍正勤政、严苛，推行摊丁入亩、密折、军机处、养廉银，整顿财政与吏治。他做的多是费力不讨好的基础工作。", "x": "最不显眼的制度建设，往往决定后面几十年的稳定。"}, {"e": "清·人物", "t": "乾隆：把盛世用完了", "b": "乾隆前期疆域扩张、文化工程浩大，后期宠信和珅、吏治败坏、财政透支。一个盛世在他手里走向尽头。", "x": "盛世的消耗，往往在同一代人身上完成。"}, {"e": "清·人物", "t": "和珅：一个人能贪到什么程度", "b": "和珅受乾隆宠信，身兼多职，聚敛巨额财富，嘉庆即位后被赐死抄家。个人得势的极限，也取决于制度对他的约束有多松。", "x": "一个人的胃口，取决于容器有多松。"}, {"e": "清·人物", "t": "纪晓岚与《四库全书》", "b": "纪昀主持《四库全书》编纂，整理了大量典籍，也在查禁书籍的过程中承担了大量工作。", "x": "整理和删除，常常出自同一双手。"}, {"e": "清·人物", "t": "曹雪芹：把家族兴衰写成书", "b": "曹雪芹出身江宁织造世家，家道中落后写《红楼梦》，以贾府兴衰写出清代社会的结构与人心。", "x": "最深的观察，常常来自自己失去的东西。"}, {"e": "清·人物", "t": "林则徐：认真但不完全清醒", "b": "林则徐禁烟坚决，收集西洋资料编《四洲志》，但同样受限于时代认知，对英国的军事反应估计不足。", "x": "再认真的人，也受限于他所在时代的边界。"}, {"e": "清·人物", "t": "曾国藩：笨办法与硬功夫", "b": "曾国藩以结硬寨、打呆仗著称，重视后勤与组织，办湘军、开洋务。他不投机，靠可靠的组织一点一点推进。", "x": "面对复杂局面，笨办法常常是有效办法。"}, {"e": "清·人物", "t": "李鸿章：替清廷签了最多的字", "b": "李鸿章掌握北洋与外交资源，代表清廷签订马关、辛丑等条约。他既是能力最强的实务者，也是被骂得最多的人。", "x": "站在最前面的人，往往要替整个系统担责。"}, {"e": "清·人物", "t": "左宗棠：抬着棺材去西北", "b": "左宗棠主张塞防，率军收复新疆，坚持寸土不让。他办事风格强硬，与李鸿章多有冲突。", "x": "有些事不坚持，就真的没有了。"}, {"e": "清·人物", "t": "张之洞：中学为体，西学为用", "b": "张之洞办汉阳铁厂、自强学堂，提出中学为体西学为用，试图在保留制度的前提下引进技术。这条路线后来被证明走不通。", "x": "只借用工具而不改结构，最终还是会被逼到结构上。"}, {"e": "清·人物", "t": "康有为：托古改制", "b": "康有为借孔子的名义推动变法，著《新学伪经考》《孔子改制考》，用旧权威包装新主张以减小阻力。", "x": "改动的阻力越大，越需要借旧的外壳。"}, {"e": "清·人物", "t": "梁启超：一支笔的力量", "b": "梁启超流亡日本后办《清议报》《新民丛报》，以通俗有力的文章传播新思想，影响了一代青年。", "x": "在没有权力的地方，文字仍然可以塑造一代人。"}, {"e": "清·人物", "t": "谭嗣同：可以选择走却留下的人", "b": "戊戌政变后谭嗣同拒绝出逃，说各国变法无不从流血而成，最终与其他五人一同被杀。", "x": "有些选择的意义，不在结果，而在它表明了什么。"}, {"e": "清·人物", "t": "慈禧：掌权四十七年的代价", "b": "慈禧以垂帘听政掌握晚清实权，支持过洋务与新政，也支持过义和团。她的判断在关键节点上多次错过时机。", "x": "长期掌权者的判断失误，代价会由整个组织承担。"}, {"e": "清·人物", "t": "奕訢：被猜忌的有能力者", "b": "恭亲王奕訢主持总理衙门，是晚清少有的了解对外事务的高层，但长期受到慈禧猜忌，难以施展。", "x": "对有能力者的猜忌，本身就是一种治理成本。"}, {"e": "清·人物", "t": "光绪：有心无力的皇帝", "b": "光绪支持戊戌变法，但无实权、无军队、无地方支持，政变后被软禁。志愿与能力之间隔着一整套结构。", "x": "只有意愿没有实权，改革就无法落地。"}, {"e": "清·人物", "t": "袁世凯：在最关键处站着的人", "b": "袁世凯掌握北洋新军，在清廷与革命党之间周旋，逼清帝退位后成为民国大总统，后来又试图称帝失败。", "x": "谁掌握兵力，谁就有资格谈条件。"}]}, {"id": "modern", "name": "近代史", "desc": "1840 到 1949 · 44 张", "cards": [{"e": "近代·晚清", "t": "近代的起点：1840 年为什么是个分水岭", "b": "鸦片战争之前，中国与外部世界的接触限于朝贡与广州贸易；之后条约体系、通商口岸、外籍税务司、传教士进入内地，原有的秩序被一层层改写。", "x": "一个时代结束的标志，往往是旧规则再也管不住新问题。"}, {"e": "近代·晚清", "t": "通商口岸：新城市是怎么长出来的", "b": "上海、天津、汉口、广州等开埠城市出现租界、洋行、银行、报馆、教堂，形成中外混杂的城市空间。近代的城市形态在很大程度上由口岸塑造。", "x": "开放最先改变的不是政策，而是城市的形状。"}, {"e": "近代·晚清", "t": "租界：一块主权模糊的地", "b": "租界由外国侨民自治管理，有自己的巡捕、法庭与税收，中国政府在其中的权力受限。它同时是近代市政的样本和主权的缺口。", "x": "治理能力强的外来区块，最容易让人产生复杂的心态。"}, {"e": "近代·晚清", "t": "海关总税务司：效率与主权之间的张力", "b": "赫德主持下的海关建立了近代化的征税与统计体系，廉洁高效，但决定权掌握在外国人手里。制度先进与主权受损同时存在。", "x": "效率高的机构，如果归属不清，也是一种长期风险。"}, {"e": "近代·晚清", "t": "洋务企业与官督商办", "b": "轮船招商局、汉阳铁厂、开平矿务局等多采用官督商办，官方给资源和保护，商人出资经营。这种模式起步快，也容易滋生权责不清。", "x": "官方背书能加速起步，也容易让经营者不承担真实后果。"}, {"e": "近代·晚清", "t": "电报与铁路：让帝国的反应变快", "b": "电报线在 1870 年代后铺设，铁路在争议中逐步修建。它们让信息和兵力快速流动，也冲击了旧有的运输与风水观念。", "x": "基础设施一变，组织的反应速度就变了。"}, {"e": "近代·晚清", "t": "新式学堂与废科举后的读书人", "b": "京师大学堂、南洋公学等新式学堂建立，废除科举后读书人转向新学。一批人成了工程师、记者、教师和革命者。", "x": "上升通道一改，一代人的去向就全变了。"}, {"e": "近代·晚清", "t": "报馆与舆论的崛起", "b": "《申报》《时务报》《民报》等报刊出现，识字率的提升与印刷技术的普及让舆论成为政治力量。近代政治第一次需要考虑读者。", "x": "当读的人变多，说服就成为一门新的政治技术。"}, {"e": "近代·晚清", "t": "留日学生：革命思想的中转站", "b": "清末大量学生赴日本留学，日本的译著、社团与革命组织成为新思想的集散地，同盟会即在东京成立。", "x": "思想常常是在别处先成形，再带回来的。"}, {"e": "近代·晚清", "t": "商会与地方自治", "b": "清末商会在通商城市兴起，参与市政、治安、教育与调解。地方精英第一次以组织化的方式介入公共事务。", "x": "国家的空隙里，会自己长出管理公共事务的组织。"}, {"e": "近代·晚清", "t": "孙中山的三民主义", "b": "民族、民权、民生三条纲领，试图把反满、共和与社会改良整合在一起。它为分散的革命力量提供了共同语言。", "x": "把诉求整合成语言，是动员的第一步。"}, {"e": "近代·晚清", "t": "同盟会与多次起义", "b": "1905 年同盟会在东京成立，之后发动多次起义，均告失败，但积累了组织与舆论基础。辛亥革命爆发时，这些积累成了现成的骨架。", "x": "关键事件的爆发看似偶然，背后是长期的准备。"}, {"e": "近代·晚清", "t": "辛亥革命：清朝倒下的那一天", "b": "1911 年 10 月 10 日武昌起义，各省相继宣布独立，1912 年清帝退位。共和制度的建立速度远超多数人的预期。", "x": "旧秩序一旦失去军心，结束会快得不可思议。"}, {"e": "近代·民国", "t": "袁世凯与北洋：军队成了政治资本", "b": "袁世凯掌握北洋新军，在清廷与革命党之间周旋，成为民国临时大总统。此后北洋军队成了政治的最终裁决者。", "x": "谁掌握暴力，谁就有资格谈条件。"}, {"e": "近代·民国", "t": "民国初年的政党与议会", "b": "民国初年政党林立，国会选举、内阁更替频繁。制度形式已经搭起来，但没有相应的社会基础与军队支持。", "x": "制度移植得快，社会基础跟不上就会反复。"}, {"e": "近代·民国", "t": "宋教仁遇刺：一次关键人物的消失", "b": "1913 年宋教仁在上海遇刺，国民党与袁世凯的合作彻底破裂，议会政治的道路基本被堵死。", "x": "关键人物的消失，会让一条路线直接断掉。"}, {"e": "近代·民国", "t": "二次革命与护法运动", "b": "袁世凯控制中央后，国民党发动二次革命失败，孙中山南下广州组织护法。中央与地方的对抗成为民国初年的主线。", "x": "没有军队支撑的政治主张，很难落地。"}, {"e": "近代·民国", "t": "袁世凯称帝：一次失败的赌注", "b": "1915 年袁世凯宣布称帝，遭到各方反对，不到三个月取消，次年病死。旧式权威在共和时代已经失去合法性。", "x": "用旧脚本演新戏，观众不会买账。"}, {"e": "近代·民国", "t": "军阀混战：地方割据的二十年", "b": "北洋分裂后，直系、皖系、奉系等军阀争夺中央，地方军事化加剧。国家统一在很长时间里只是一种名义。", "x": "中央权威一旦碎裂，地方军事力量会迅速填补空白。"}, {"e": "近代·民国", "t": "五四运动：学生走上街头", "b": "1919 年巴黎和会消息传来，北京学生上街抗议，随后全国响应。新文化运动的思想积累与民族情绪在这里汇合。", "x": "社会情绪需要现成的组织才能变成行动。"}, {"e": "近代·民国", "t": "新文化运动：从语言开始改造", "b": "胡适提倡白话文，陈独秀办《新青年》，鲁迅写《狂人日记》。语言工具的改造，让新思想能进入更多人的阅读范围。", "x": "语言一变，思想的传播半径就变了。"}, {"e": "近代·民国", "t": "科学与民主：一个时代的两个关键词", "b": "五四提出的科学与民主，把批判的矛头指向传统礼教与家族制度。它既是思想解放，也是对旧社会结构的公开质疑。", "x": "口号之所以有力，是因为它同时说中了理想和不满。"}, {"e": "近代·民国", "t": "马克思主义在中国的传播", "b": "十月革命后，李大钊、陈独秀等人开始介绍马克思主义，1921 年中国共产党成立。一种新的组织方式进入中国的政治场。", "x": "新的组织方式进来，往往比新的理论更改变局面。"}, {"e": "近代·民国", "t": "第一次国共合作与北伐", "b": "1924 年国民党改组，与共产党合作，1926 年北伐迅速推进，击败吴佩孚、孙传芳，国民政府定都南京。", "x": "合作能迅速改变力量对比，也埋下分歧的伏笔。"}, {"e": "近代·民国", "t": "1927 年：合作破裂与新的分裂", "b": "北伐途中，国共合作破裂，随后进入十年内战。此后的政治主线，变成党内、党外的多条冲突同时进行。", "x": "旧问题没解决，新矛盾已经叠加上来。"}, {"e": "近代·民国", "t": "南京国民政府的十年", "b": "国民政府推行币制改革、修铁路、办教育，同时面临内部军阀与外部威胁。国家能力有限，很多政策难以真正落地。", "x": "现代化需要的不只是意愿，还有执行能力。"}, {"e": "近代·民国", "t": "法币改革：一次成功的货币统一", "b": "1935 年废银元、行法币，纸币统一，财政与市场得到稳定。抗日战争爆发后，为筹款大量发行，埋下通胀隐患。", "x": "短期有效的财政工具，用久了会反噬。"}, {"e": "近代·民国", "t": "农村问题：土地与佃租", "b": "近代中国农村土地集中、佃租高、借贷利息重，加上天灾与苛捐，大量农民生活艰难。农村问题贯穿整个近代。", "x": "所有宏大的政治，最终都要在村子里兑现。"}, {"e": "近代·抗战", "t": "日本侵华：从九一八到七七", "b": "1931 年九一八事变日本占领东北，1937 年七七事变全面侵华。民族危机压过了此前的内部纷争。", "x": "外部的压力，有时会短暂压下内部的矛盾，但不会解决它。"}, {"e": "近代·抗战", "t": "抗战中的后方工业内迁", "b": "大批工厂、学校与机构迁往重庆、昆明、成都等地，形成临时的工业与教育中心。战争迫使国家组织能力大幅提升。", "x": "极端的压力，也会逼出原本不存在的能力。"}, {"e": "近代·抗战", "t": "陕甘宁边区与根据地", "b": "中共在根据地推行土地政策、群众动员与基层政权建设，形成了与国统区不同的治理模式。", "x": "治理模式的竞争，往往比战争本身更决定长期走向。"}, {"e": "近代·抗战", "t": "重庆与延安：两种政治语言的对照", "b": "抗战时期，国民政府与中共在动员方式、社会政策与话语体系上差异明显。同一场战争里，有两条不同的组织路径。", "x": "同一个目标下，往往同时存在几种做法，看哪种能持续。"}, {"e": "近代·战后", "t": "抗战胜利后的局面", "b": "1945 年胜利后，国共对未来的政治安排分歧明显，谈判与冲突并行。国家重建的机会与内战的危险同时存在。", "x": "胜利之后的选择，往往比战争期间的判断更难。"}, {"e": "近代·战后", "t": "通货膨胀：民国后期的财政崩塌", "b": "内战期间军费浩大，货币超发，物价飞涨，城市居民的储蓄迅速蒸发。经济崩溃对政权的合法性的打击，往往比战场失利更直接。", "x": "一个政权失去货币信用时，公众对它的信任也会跟着耗光。"}, {"e": "近代·战后", "t": "土地改革：一次彻底的社会改造", "b": "在解放区推行的土地改革改变了农村的产权结构，把大量农民与新的政权绑定在一起。", "x": "把利益结构改掉，往往比赢几场仗更能改变格局。"}, {"e": "近代·战后", "t": "三大战役", "b": "辽沈、淮海、平津三大战役在不到半年内改变了军事力量对比，东北、华东、华北的控制权转移。", "x": "决定性战役的价值，在于让它后面的事变得不必再打。"}, {"e": "近代·战后", "t": "1949：近代的落幕", "b": "1949 年新中国成立，此后进入新的历史阶段。近代的很多议题，比如工业化、外交、农村问题，换了一种方式继续存在。", "x": "时代的名字会变，问题的清单往往还在。"}, {"e": "近代·专题", "t": "条约体系：一层层叠加的约束", "b": "从南京条约到辛丑条约，每次战败都带来新的条款，割地、赔款、通商、驻兵、传教，积累成一套结构性约束。", "x": "让步一旦成为惯例，下一轮谈判的起点就会更低。"}, {"e": "近代·专题", "t": "赔款与财政：借来的钱要用什么还", "b": "近代的赔款多靠向外国银行借款，以关税、盐税作抵押，财政的自主权被逐步抵押出去。", "x": "借来的钱，往往要用未来的选择权来还。"}, {"e": "近代·专题", "t": "教案与地方社会", "b": "传教士进入内地后，民教冲突频发，涉及土地、司法与地方权威。教案背后是旧秩序与新秩序在乡村层面的碰撞。", "x": "宏大的变化，最后都在具体的地方关系里显现。"}, {"e": "近代·专题", "t": "从士绅到新知识分子", "b": "科举废除后，读书人不再靠功名上升，转而成为教师、记者、律师、工程师。精英的构成和思维方式都变了。", "x": "精英的定义一变，社会的话语权也跟着变。"}, {"e": "近代·专题", "t": "女性与近代", "b": "废缠足、办女学、女性进入公共职业，这些变化首先出现在口岸城市。妇女解放与民族救亡结合，成为一种新的社会议题。", "x": "社会变革最先在最日常的地方留下痕迹。"}, {"e": "近代·专题", "t": "铁路与近代国家", "b": "铁路缩短了地理距离，也让中央能更快抵达边疆。同时，铁路修建与收回牵动了地方利益与民族情绪。", "x": "交通能力提升后，国家的边界也变得清晰。"}, {"e": "近代·专题", "t": "近代的公共舆论与知识分子", "b": "报刊、学会、学校构成了新的公共空间，知识分子以议论时政的方式参与政治，这种参与方式一直延续。", "x": "有读者的人，就有了某种政治力量。"}]}, {"id": "all", "name": "全部", "desc": "所有朝代一起看 · 611 张", "parts": ["xianqin", "qinhan", "weijin", "suitang", "songyuan", "mingqing", "modern"]}];
window.__GLOSSARY__ = {"孔子": "春秋鲁国人，儒家创始人。做过鲁国司寇，政治主张没被采纳，后半生办学讲学，主张以礼和道德秩序治理社会。", "老子": "春秋时期思想家，道家代表。主张少干预、顺自然，认为反复折腾往往带来更坏的后果。", "墨子": "战国时期思想家，墨家创始人。主张兼爱、非攻，同时擅长守城器械和组织纪律，是先秦少有的技术型团体。", "韩非": "战国末期法家代表，韩国公子。主张以法、术、势治国，让治理不依赖个人贤能，不依赖贤人。", "商鞅": "战国时期秦国改革家。推行军功授爵、废井田、奖励耕战，把秦国改造成高度动员的国家机器。", "管仲": "春秋时期齐国政治家，辅佐齐桓公称霸。善用经济手段，被后世视为早期重商与宏观调控的代表。", "屈原": "战国时期楚国大夫、诗人。主张联齐抗秦，不被采纳而流放，作《离骚》，最终投汨罗江。", "陈胜": "秦末农民起义领袖，与吴广在大泽乡起事，是第一次大规模反秦起义。", "吴广": "秦末起义领袖，与陈胜一同在大泽乡起兵，后被部下所杀。", "秦始皇": "名嬴政，结束战国分裂建立秦朝，统一文字、度量衡、货币，推行郡县制，也因高压统治迅速亡国。", "李斯": "秦朝丞相，法家代表。辅佐秦始皇统一制度，也参与沙丘之变，后被赵高陷害处死。", "刘邦": "汉高祖，起于沛县，推翻秦朝、击败项羽建立汉朝，实行郡国并行与休养生息。", "项羽": "秦末西楚霸王，巨鹿之战击败秦军主力，后与刘邦争天下，垓下兵败自刎。", "汉武帝": "名刘彻，西汉第七位皇帝。北击匈奴、通西域、独尊儒术，同时盐铁官营，连年征战耗尽民生。", "司马迁": "西汉史学家。因替李陵辩护受宫刑，忍辱完成《史记》，开创纪传体通史。", "张骞": "西汉使者。两次出使西域，本为联合大月氏夹击匈奴，军事目的落空，却打通了丝绸之路。", "王莽": "西汉外戚，代汉建立新朝。照《周礼》强行复古改制，失败后新朝速亡。", "刘秀": "汉光武帝，东汉开国皇帝。战乱后休养生息、裁撤冗员，重建中央集权的文书行政。", "蔡伦": "东汉宦官，改进造纸术，使纸张逐渐取代竹简，书籍成本大幅下降。", "曹操": "东汉末政治家、军事家。统一北方，推行屯田，为曹魏奠基，一生未称帝。", "刘备": "三国时期蜀汉开国皇帝，以宗室身份起兵，据益州与蜀汉对抗曹魏、东吴。", "孙权": "三国时期东吴建立者，据长江天险，与魏、蜀鼎立，开发江南。", "诸葛亮": "三国时期蜀汉丞相，辅佐刘备、刘禅，主政蜀汉，以《出师表》与北伐著称。", "祖逖": "东晋将领，自行招募军队北伐，一度收复黄河以南，因朝廷支持不足无功。", "苻坚": "前秦皇帝，统一北方后南征东晋，在淝水之战大败，前秦随后崩解。", "孝文帝": "北魏皇帝拓跋宏，迁都洛阳，推行改汉姓、穿汉服、说汉话的汉化改革。", "高欢": "东魏权臣，六镇之乱后崛起，掌控东魏朝政，为北齐奠基。", "宇文泰": "西魏权臣，创立府兵制雏形，为北周和隋唐的军事制度打下基础。", "隋炀帝": "名杨广，隋朝第二位皇帝。修大运河、建东都、三征高句丽，工程与战争叠加压垮民力。", "唐太宗": "名李世民，唐朝第二位皇帝。以纳谏著称，与魏征等讨论隋亡教训，开创贞观之治。", "魏征": "唐太宗时期名臣，以敢言直谏著称，前后上谏二百余事。", "武则天": "唐朝女皇，先为高宗皇后，后称帝改国号周。提拔寒门、设北门学士，也任用酷吏清除异己。", "玄奘": "唐代高僧，西行天竺取经，归国后主持译经，著《大唐西域记》。", "鉴真": "唐代高僧，六次东渡日本，最终抵达，传播律宗与建筑、医药技术。", "安禄山": "唐朝节度使，兼领平卢、范阳、河东三镇，755 年发动安史之乱。", "史思明": "唐朝节度使，与安禄山共同发动安史之乱，后自立为帝，被其子所杀。", "杜甫": "唐代诗人，经历安史之乱，作品记录战乱中的民生，被称为诗史。", "李白": "唐代诗人，盛唐气象的代表，诗风豪放，一生仕途不顺。", "黄巢": "唐末起义领袖，从山东起兵，转战大半个中国，攻入长安，加速唐朝灭亡。", "宋太祖": "名赵匡胤，宋朝开国皇帝。陈桥兵变黄袍加身，杯酒释兵权，确立重文轻武的国策。", "王安石": "北宋政治家，主持熙宁变法，推行青苗、免役、市易等法，意在富国强兵，执行中多有扰民。", "司马光": "北宋政治家、史学家，反对王安石变法，主持编撰编年体通史《资治通鉴》。", "苏轼": "北宋文学家，因乌台诗案被贬，一生宦海起伏，诗文书画皆成大家。", "沈括": "北宋科学家，著《梦溪笔谈》，记录毕昇活字印刷等重要技术。", "毕昇": "北宋工匠，发明泥活字印刷，记载于《梦溪笔谈》。", "岳飞": "南宋抗金名将，率岳家军多次北伐，被宋高宗、秦桧以莫须有罪名杀害。", "秦桧": "南宋宰相，主张与金议和，促成绍兴和议，后世被视为奸臣代表。", "朱熹": "南宋理学家，集理学之大成，主张格物致知、存天理灭人欲，其学说后来成为科举正统。", "成吉思汗": "名铁木真，统一蒙古诸部，建立大蒙古国，以千户制重组社会，发动大规模西征。", "忽必烈": "成吉思汗之孙，建立元朝，定都大都，灭南宋统一中国。", "朱元璋": "明太祖，出身贫寒，参加红巾军起家，建立明朝，废除丞相，强化皇权。", "郑和": "明代航海家，率船队七下西洋，规模远超同期欧洲航海，后因财政与政治原因终止。", "张居正": "明代内阁首辅，推行考成法和一条鞭法，整顿吏治充实财政，死后被清算。", "海瑞": "明代官员，以清廉刚直著称，敢于上书批评皇帝，但难以改变体制。", "戚继光": "明代抗倭名将，编练戚家军，在东南沿海大破倭寇。", "康熙": "清朝皇帝，名玄烨，平三藩、收台湾、抗沙俄，奠定清朝前期疆域。", "雍正": "清朝皇帝，名胤禛，推行摊丁入亩、秘密奏折，以严苛勤政著称。", "乾隆": "清朝皇帝，名弘历，在位期间疆域最广，后期吏治松弛、财政吃紧。", "咸丰": "清朝皇帝，名奕詝，在位期间遇上太平天国与第二次鸦片战争，勤于批折却屡屡误判，逃往热河。", "慈禧": "清咸丰帝妃，同治、光绪两朝实际掌权者，主导晚清政局近半个世纪。", "光绪": "清朝皇帝，名载湉，支持戊戌变法，被慈禧软禁，变法百日而终。", "奕訢": "道光帝第六子，恭亲王，主持总理衙门，是晚清少数了解对外事务的高层，长期受猜忌。", "曾国藩": "晚清重臣，组建湘军平定太平天国，倡导洋务，主张结硬寨打呆仗的务实路线。", "李鸿章": "晚清重臣，主持北洋水师与洋务运动，代表清廷签订多个不平等条约。", "左宗棠": "晚清重臣，率军收复新疆，主张塞防与海防并重。", "张之洞": "晚清重臣，洋务派代表，办汉阳铁厂、自强学堂，提出中学为体西学为用。", "林则徐": "清朝官员，1839 年在虎门销烟，是清廷中较早注意西洋情况的人。", "魏源": "清代思想家，编《海国图志》，提出师夷长技以制夷，此书在日本影响更大。", "康有为": "晚清维新派领袖，以托古改制的方式推动变法，主张君主立宪。", "梁启超": "晚清维新派，康有为弟子，戊戌变法后流亡日本，办报鼓吹新民与立宪。", "孙中山": "中国民主革命先行者，提出三民主义，领导辛亥革命推翻清朝，创建中华民国。", "袁世凯": "清末民初军政人物，北洋新军统帅，辛亥革命后任民国大总统，后称帝失败。", "陈霸先": "南朝陈的建立者，出身寒微，在梁末乱局中崛起。", "刘裕": "南朝宋的建立者，出身寒门，北伐灭南燕、后秦，后取代东晋。", "石勒": "十六国时期后赵建立者，出身羯族奴隶，后成为一方霸主。", "冉闵": "十六国时期人物，建立冉魏，发布杀胡令，历史评价极具争议。", "茅海建": "中国近代史学者，著有《天朝的崩溃》《苦命天子》等，以大量档案重建鸦片战争与咸丰朝决策过程。", "孔飞力": "美国汉学家，著有《叫魂》，研究清代官僚体系与皇权的关系。", "魏斐德": "美国汉学家，著有《洪业》，研究明清易代中的地方秩序与精英合作。", "史景迁": "美国汉学家，以叙事方式写中国史，著有《太平天国》《王氏之死》等。", "瞿同祖": "中国法律史学者，著有《清代地方政府》，研究州县行政的实际运作。", "佩雷菲特": "法国学者，著有《停滞的帝国》，记录马戛尔尼使团访华的见闻与冲突。", "何伟亚": "美国学者，著有《怀柔远人》，重新解释马戛尔尼访华中的礼仪之争。", "曾静": "清代湖南书生，派学生上书川陕总督岳钟琪劝其反清，案发后雍正亲自审问并编《大义觉迷录》。", "洪秀全": "太平天国领导人，屡试不第，受基督教小册子影响创拜上帝会，1851 年金田起义，定都天京。", "马戛尔尼": "英国外交官，1793 年率使团访华，请求扩大通商被拒。", "三元里": "广州城北村落，鸦片战争期间当地民众自发抗击英军，是近代较早的民间抵抗。", "岳钟琪": "清代将领，雍正年间任川陕总督，因曾静案主动上报，避免了自己被牵连。", "乾嘉学派": "清代乾隆、嘉庆年间的考据学派，重训诂、校勘、辨伪，方法严谨，避谈时政。", "常平仓": "清代官办的粮仓，丰年购入、荒年平价卖出，用于平抑粮价与赈灾。", "蠲免": "清代皇帝下诏减免赋税的做法，多用于灾荒或庆典。", "团练": "清代由地方士绅自筹自办的地方武装，太平天国时期大规模兴起。", "十三行": "清代广州经营对外贸易的商人团体，垄断西洋贸易，乾隆以后成为唯一对外通道。", "大禹": "传说中治水有功的部落首领，因疏导洪水而被推为共主，是夏朝的奠基人物。", "妇好": "商王武丁之妻，甲骨文记载她多次率军出征并主持祭祀，是中国最早有明确记载的女将。", "周厉王": "西周第十位君主，因暴虐与专利政策引发国人暴动，出逃后由周定公、召穆公共同执政。", "齐桓公": "春秋第一位霸主，任用管仲改革内政，以尊王攘夷为号召，九合诸侯。", "晋文公": "名重耳，流亡十九年后回国即位，城濮之战击败楚国，成为霸主。", "勾践": "越国君主，被吴国击败后卧薪尝胆，最终灭吴。", "李悝": "战国魏国政治家，推行尽地力之教与平籴法，著《法经》，开启战国变法。", "吴起": "战国军事家与改革者，先在魏国创建魏武卒，后在楚国变法，被旧贵族所杀。", "孙膑": "战国军事家，孙武后人，以围魏救赵与马陵之战闻名，著有《孙膑兵法》。", "苏秦": "战国纵横家，主张合纵抗秦，游说六国联合。", "张仪": "战国纵横家，主张连横，为秦国分化六国联盟。", "孟子": "战国思想家，主张性善、仁政、民贵君轻，被后世尊为亚圣。", "荀子": "战国思想家，主张性恶、礼法并施，教出韩非与李斯。", "庄子": "战国思想家，道家代表，以寓言拆解是非界限，主张逍遥。", "赵高": "秦朝宦官，沙丘之变的主谋之一，后专权，最终被子婴所杀。", "班超": "东汉外交家与将领，在西域活动三十余年，重新打通西域通道。", "班固": "东汉史学家，撰《汉书》，开创断代史体例。", "张衡": "东汉科学家，制浑天仪、地动仪，提出浑天说。", "司马懿": "曹魏权臣，高平陵之变后掌握实权，为晋朝奠基。", "司马炎": "晋武帝，代魏建晋，280 年灭吴统一全国。", "王导": "东晋政治家，辅佐司马睿建立东晋，时称王与马共天下。", "谢安": "东晋政治家，淝水之战时任宰相，镇定指挥。", "萧衍": "梁武帝，南朝梁的建立者，在位四十八年，晚年因侯景之乱饿死台城。", "侯景": "东魏降将，投梁后发动叛乱，攻入建康，造成巨大破坏。", "贾思勰": "北魏农学家，著《齐民要术》，总结北方农业生产技术。", "郦道元": "北魏地理学家，著《水经注》，记录河流与沿岸地理风俗。", "杨坚": "隋文帝，代周建隋，589 年灭陈统一全国，开创开皇之治。", "李渊": "唐高祖，从太原起兵入关中，建立唐朝。", "李世民": "唐太宗，发动玄武门之变即位，以纳谏著称，开创贞观之治。", "朱温": "黄巢降将，后控制唐廷，907 年废唐建立后梁。", "冯道": "五代政治家，历仕四朝十君，自号长乐老，评价极具争议。", "石敬瑭": "后晋建立者，为求契丹支持割让燕云十六州，称儿皇帝。", "柴荣": "后周世宗，整顿军制、改革税制，为宋朝统一打下基础。", "赵匡胤": "宋太祖，陈桥兵变建立宋朝，杯酒释兵权，确立重文轻武。", "郭守敬": "元代天文学家，编《授时历》，测算一年长度为 365.2425 日。", "宋慈": "南宋官员，著《洗冤集录》，是世界最早的法医学专著之一。", "秦九韶": "南宋数学家，著《数书九章》，讨论高次方程与实用算法。", "张择端": "北宋画家，绘《清明上河图》，记录汴京街市生活。", "孟元老": "北宋末人，著《东京梦华录》，追忆汴京城市生活。", "马端临": "宋元之际学者，编《文献通考》，续《通典》记录制度沿革。"};
window.__ARTICLES__ = [{"id": "900-脉络", "title": "历史脉络：一张图看完五千年", "subtitle": "不是年表，是六条主线怎么一层层搭起来", "era": "通史", "tags": ["脉络", "通史", "学习路径"], "date": "2026-11-28", "track": "导航", "order": 0, "html": "<h2>怎么用这份东西</h2>\n<p>下面不是年表。年表记的是「哪年发生了什么事」，看完还是记不住。</p>\n<p>这份东西只有六条线。每条线讲一件中国历史一直在处理的问题，从三千年前一直讲到今天。<strong>六条线读完，你会知道每个朝代在忙什么，也就知道一段史事该挂在哪个位置了。</strong></p>\n<p>每条线后面都标了三样东西：</p>\n<ul>\n<li><strong>脉络</strong>：这条线怎么走</li>\n<li><strong>已有的文章</strong>：这个号里能直接读的</li>\n<li><strong>要补的</strong>：还没写，但该写的</li>\n<li><strong>读书</strong>：想再深入，看哪一本</li>\n</ul>\n<hr>\n<h1>线一：怎么把几千万人管起来</h1>\n<p><strong>这是中国历史最核心的问题，也是最早解决的一个。</strong></p>\n<p>三千年前，一个村子几十户，谁跟谁都是亲戚，不用谁管谁。可是到了商代，一个王后能调动一万三千人。这中间发生了什么？</p>\n<p>答案是行政能力。商靠祭祀（谁能跟祖先说上话谁就是王），周靠分封（地给你，你自己管，记得来朝贡），秦靠郡县（官由中央派，不世袭），汉靠文书（户籍、上计、邮驿）。</p>\n<p>然后这套东西越做越细。唐代有三省六部，宋代有科举选官，明清有黄册鱼鳞图册。<strong>每一次改进，都是因为上一次的办法出现了漏洞。</strong></p>\n<p>漏洞是什么？分封留下诸侯坐大，郡县留下地方瞒报，科举留下八股僵化。</p>\n<p><strong>一线方法：读一个朝代，先问一句「它的官是谁派的、税怎么收的、账怎么核的」。答出这三个，这个朝代就懂了一半。</strong></p>\n<p><strong>已有文章</strong></p>\n<ul>\n<li><a href=\"#010-fuhao\" data-article=\"010-fuhao\">妇好：一座没被盗过的墓</a> —— 商代靠什么组织一万三千人</li>\n<li><a href=\"#003-juyan\" data-article=\"003-juyan\">元延二年，一份报到郡府的账</a> —— 汉代的文书行政怎么运转</li>\n<li><a href=\"#001-jiaohun\" data-article=\"001-jiaohun\">1768：一场由官僚自保催生的全国冤案</a> —— 官僚为什么宁可办错</li>\n</ul>\n<p><strong>要补的</strong></p>\n<ul>\n<li>秦的郡县制到底怎么落地（睡虎地秦简）</li>\n<li>唐代的三省六部怎么实际运转（唐六典）</li>\n<li>明代的黄册与鱼鳞图册</li>\n<li>清代的督抚与中央</li>\n</ul>\n<p><strong>读书</strong></p>\n<ol>\n<li>阎步克《从爵本位到官本位》—— 秦汉官阶怎么变</li>\n<li>卜宪群《秦汉官僚制度》</li>\n<li>瞿同祖《清代地方政府》—— 一个县到底怎么运行</li>\n<li>孔飞力《叫魂》—— 官僚的自保逻辑</li>\n</ol>\n<hr>\n<h1>线二：钱从哪来，人从哪来</h1>\n<p><strong>没有钱和兵，什么制度都撑不住。中国的财政史，是一部不断重新找税基的历史。</strong></p>\n<p>最早按人收（人丁税），因为人是唯一能种地打仗的东西。后来按地收（两税法、一条鞭法、摊丁入亩），因为人到处跑，地跑不了。再后来按商税和专卖收（盐、铁、茶），因为商业起来了。</p>\n<p>每一次改，都是因为旧的收不上来了。</p>\n<p>还有一条暗线：<strong>货币</strong>。铜钱、白银、纸币，换了一次又一次。明代白银货币化，等于把中国的物价跟美洲的银矿挂上了钩。</p>\n<p><strong>二线方法：读一个朝代，问「它的钱从哪来」。财政一紧，后面所有事都会变形。</strong></p>\n<p><strong>已有文章</strong></p>\n<ul>\n<li><a href=\"#004-anshi\" data-article=\"004-anshi\">天宝十四载，长安城里没人相信会打仗</a> —— 边镇的军力和财权怎么跑到了一个人手里</li>\n</ul>\n<p><strong>要补的</strong></p>\n<ul>\n<li>汉代盐铁官营的争论（《盐铁论》）</li>\n<li>明代的银本位与全球贸易</li>\n<li>晚清的关税与外债</li>\n</ul>\n<p><strong>读书</strong></p>\n<ol>\n<li>全汉昇《中国经济史研究》</li>\n<li>黄仁宇《十六世纪明代中国之财政与税收》</li>\n<li>王业键《清代田赋刍论》</li>\n</ol>\n<hr>\n<h1>线三：谁有资格做官</h1>\n<p><strong>这是中国社会流动性的主线。</strong></p>\n<p>先秦是世卿世禄，官是爹传儿子的。汉代察举，看名声，也要有人推荐。魏晋九品中正，最后成了「上品无寒门」。隋唐科举，考试定终身。宋以后科举成了唯一正路。清末废科举，读书人从此四散。</p>\n<p>这条线的每一次变化，都改变了一代人的活法。汉代的读书人去州郡求举主；唐代的士子去长安行卷；宋代的书生在家苦读，因为糊名誊录不怕没人推荐；清末的读书人，废科举之后跑去办报、从军、革命。</p>\n<p><strong>三线方法：读一个朝代，问「读书人怎么才能当官」。答案变了，这个社会的样子就变了。</strong></p>\n<p><strong>要补的</strong></p>\n<ul>\n<li>汉代察举与门阀的形成</li>\n<li>科举在宋代的制度化（糊名、誊录）</li>\n<li>八股文与明清士人的思维</li>\n<li>1905 年废科举之后，读书人去了哪里</li>\n</ul>\n<p><strong>读书</strong></p>\n<ol>\n<li>何炳棣《明清社会史论》—— 用统计看科举流动</li>\n<li>宫崎市定《九品官人法研究》</li>\n<li>艾尔曼《明清科举文化史》</li>\n</ol>\n<hr>\n<h1>线四：外面的人是谁</h1>\n<p><strong>中国怎么看外国，决定了它怎么应对危机。</strong></p>\n<p>周的时候讲华夷之辨，是文化的区别。汉唐讲天下，能纳进来就纳。宋辽金讲和战，打不动就签条约。明清讲朝贡，视外国为藩属。到了近代，被迫面对平等的条约体系，整个认知框架崩了。</p>\n<p>这条线最要紧的地方在于：<strong>每一次认知更新都很晚。</strong> 不是没人看出来，是看出来的那个人被当成异类。郭嵩焘出使英国，写了本日记，回来被骂得一塌糊涂。</p>\n<p><strong>四线方法：读一个朝代，问「它觉得外面的人是什么」。这决定了它碰到危机时会做什么反应。</strong></p>\n<p><strong>要补的</strong></p>\n<ul>\n<li>汉匈关系与丝绸之路</li>\n<li>唐长安的胡人与外来宗教</li>\n<li>马戛尔尼访华与礼仪之争</li>\n<li>鸦片战争前后的认知落差</li>\n</ul>\n<p><strong>读书</strong></p>\n<ol>\n<li>佩雷菲特《停滞的帝国》</li>\n<li>何伟亚《怀柔远人》—— 重新解释礼仪之争</li>\n<li>茅海建《天朝的崩溃》</li>\n</ol>\n<hr>\n<h1>线五：普通人怎么活</h1>\n<p><strong>前面四条是皇帝和官员的事。这一条是人怎么吃饭、怎么种地、怎么生孩子。</strong></p>\n<p>先秦的井田制，汉代的小农经济，魏晋的庄园与坞堡，宋代的市镇与商业，明清的人口爆炸。还有：女人怎么过，孩子怎么养，灾年怎么活，生病怎么办。</p>\n<p>这条线在正史里几乎没有。材料在别处：居延汉简的账簿、敦煌文书、徽州契约、清代刑科题本、地方志、族谱。</p>\n<p><strong>五线方法：读一个朝代，想办法找到一个普通人的名字。找到之后，这个人怎么吃饭，这个朝代就活起来了。</strong></p>\n<p><strong>已有文章</strong></p>\n<ul>\n<li><a href=\"#003-juyan\" data-article=\"003-juyan\">元延二年，一份报到郡府的账</a> —— 一个戍卒「忠」的一年</li>\n</ul>\n<p><strong>要补的</strong></p>\n<ul>\n<li>宋代的城市生活（《东京梦华录》）</li>\n<li>明代的徽州契约与土地买卖</li>\n<li>清代的灾荒与赈济</li>\n</ul>\n<p><strong>读书</strong></p>\n<ol>\n<li>谢和耐《蒙元入侵前夜的中国日常生活》</li>\n<li>史景迁《王氏之死》—— 用县志写一个村妇</li>\n<li>伊懋可《大象的退却》—— 中国的环境史</li>\n</ol>\n<hr>\n<h1>线六：天和人</h1>\n<p><strong>这是最容易被忽略的一条，但它决定了很多事。</strong></p>\n<p>气候变冷，北方歉收，就有人南下。黄河改道，漕运就断，京城就吃紧。瘟疫来了，人口锐减，税基就崩。</p>\n<p>明末的小冰期，十七世纪全球降温，北方连年绝收。崇祯年间陕西大旱、蝗灾、鼠疫同时来。这些事跟朝政没关系，但它们决定了明朝能不能撑住。</p>\n<p><strong>六线方法：读一个朝代，看看那几百年地球在干什么。</strong></p>\n<p><strong>要补的</strong></p>\n<ul>\n<li>气候重建与中国历史的对应</li>\n<li>黄河与漕运</li>\n<li>明清的瘟疫与人口</li>\n</ul>\n<p><strong>读书</strong></p>\n<ol>\n<li>布雷特·辛斯基《气候变迁和中国历史》</li>\n<li>马立博《虎、米、丝、泥》</li>\n<li>曹树基《中国人口史》</li>\n</ol>\n<hr>\n<h1>这六条线怎么用</h1>\n<p><strong>别按顺序读。</strong> 六条线是并行的，不是阶梯。</p>\n<p>一个朝代读四篇就够了：管人、钱、官、外面。读完这四篇，这个朝代就有骨架了。想再加厚度，再补普通人和环境。</p>\n<p><strong>每周一个朝代，六周一轮。</strong> 一轮下来，你会有一条清晰的时间轴，以及六个可以反复追问的问题。</p>\n<p><strong>读某一篇时，先想它在哪条线上。</strong> 找不到线，说明这条文章没写清自己的位置。</p>\n<hr>\n<h1>现在有的六篇，各自站在哪</h1>\n<p>| 文章 | 主线 | 时代 |</p>\n<p>|---|---|---|</p>\n<p>| 妇好：一座没被盗过的墓 | 线一 管人 | 商 |</p>\n<p>| 二里头的一件铜爵 | 线一 管人 | 夏 |</p>\n<p>| 元延二年，一份报到郡府的账 | 线一 管人 / 线五 普通人 | 汉 |</p>\n<p>| 天宝十四载，长安城里没人相信会打仗 | 线二 钱与兵 / 线四 外面 | 唐 |</p>\n<p>| 1768：一场由官僚自保催生的全国冤案 | 线一 管人 | 清 |</p>\n<p>| 从部落到国家 | 线一 管人（综述） | 先秦 |</p>\n<p><strong>缺口很明显</strong>：线三（做官）一篇都没有，线六（天与人）也一篇都没有。下一批应该先补这两条。</p>", "text": "怎么用这份东西\n下面不是年表。年表记的是「哪年发生了什么事」，看完还是记不住。\n这份东西只有六条线。每条线讲一件中国历史一直在处理的问题，从三千年前一直讲到今天。六条线读完，你会知道每个朝代在忙什么，也就知道一段史事该挂在哪个位置了。\n每条线后面都标了三样东西：\n\n脉络：这条线怎么走\n已有的文章：这个号里能直接读的\n要补的：还没写，但该写的\n读书：想再深入，看哪一本\n\n\n线一：怎么把几千万人管起来\n这是中国历史最核心的问题，也是最早解决的一个。\n三千年前，一个村子几十户，谁跟谁都是亲戚，不用谁管谁。可是到了商代，一个王后能调动一万三千人。这中间发生了什么？\n答案是行政能力。商靠祭祀（谁能跟祖先说上话谁就是王），周靠分封（地给你，你自己管，记得来朝贡），秦靠郡县（官由中央派，不世袭），汉靠文书（户籍、上计、邮驿）。\n然后这套东西越做越细。唐代有三省六部，宋代有科举选官，明清有黄册鱼鳞图册。每一次改进，都是因为上一次的办法出现了漏洞。\n漏洞是什么？分封留下诸侯坐大，郡县留下地方瞒报，科举留下八股僵化。\n一线方法：读一个朝代，先问一句「它的官是谁派的、税怎么收的、账怎么核的」。答出这三个，这个朝代就懂了一半。\n已有文章\n\n妇好：一座没被盗过的墓 —— 商代靠什么组织一万三千人\n元延二年，一份报到郡府的账 —— 汉代的文书行政怎么运转\n1768：一场由官僚自保催生的全国冤案 —— 官僚为什么宁可办错\n\n要补的\n\n秦的郡县制到底怎么落地（睡虎地秦简）\n唐代的三省六部怎么实际运转（唐六典）\n明代的黄册与鱼鳞图册\n清代的督抚与中央\n\n读书\n\n阎步克《从爵本位到官本位》—— 秦汉官阶怎么变\n卜宪群《秦汉官僚制度》\n瞿同祖《清代地方政府》—— 一个县到底怎么运行\n孔飞力《叫魂》—— 官僚的自保逻辑\n\n\n线二：钱从哪来，人从哪来\n没有钱和兵，什么制度都撑不住。中国的财政史，是一部不断重新找税基的历史。\n最早按人收（人丁税），因为人是唯一能种地打仗的东西。后来按地收（两税法、一条鞭法、摊丁入亩），因为人到处跑，地跑不了。再后来按商税和专卖收（盐、铁、茶），因为商业起来了。\n每一次改，都是因为旧的收不上来了。\n还有一条暗线：货币。铜钱、白银、纸币，换了一次又一次。明代白银货币化，等于把中国的物价跟美洲的银矿挂上了钩。\n二线方法：读一个朝代，问「它的钱从哪来」。财政一紧，后面所有事都会变形。\n已有文章\n\n天宝十四载，长安城里没人相信会打仗 —— 边镇的军力和财权怎么跑到了一个人手里\n\n要补的\n\n汉代盐铁官营的争论（《盐铁论》）\n明代的银本位与全球贸易\n晚清的关税与外债\n\n读书\n\n全汉昇《中国经济史研究》\n黄仁宇《十六世纪明代中国之财政与税收》\n王业键《清代田赋刍论》\n\n\n线三：谁有资格做官\n这是中国社会流动性的主线。\n先秦是世卿世禄，官是爹传儿子的。汉代察举，看名声，也要有人推荐。魏晋九品中正，最后成了「上品无寒门」。隋唐科举，考试定终身。宋以后科举成了唯一正路。清末废科举，读书人从此四散。\n这条线的每一次变化，都改变了一代人的活法。汉代的读书人去州郡求举主；唐代的士子去长安行卷；宋代的书生在家苦读，因为糊名誊录不怕没人推荐；清末的读书人，废科举之后跑去办报、从军、革命。\n三线方法：读一个朝代，问「读书人怎么才能当官」。答案变了，这个社会的样子就变了。\n要补的\n\n汉代察举与门阀的形成\n科举在宋代的制度化（糊名、誊录）\n八股文与明清士人的思维\n1905 年废科举之后，读书人去了哪里\n\n读书\n\n何炳棣《明清社会史论》—— 用统计看科举流动\n宫崎市定《九品官人法研究》\n艾尔曼《明清科举文化史》\n\n\n线四：外面的人是谁\n中国怎么看外国，决定了它怎么应对危机。\n周的时候讲华夷之辨，是文化的区别。汉唐讲天下，能纳进来就纳。宋辽金讲和战，打不动就签条约。明清讲朝贡，视外国为藩属。到了近代，被迫面对平等的条约体系，整个认知框架崩了。\n这条线最要紧的地方在于：每一次认知更新都很晚。 不是没人看出来，是看出来的那个人被当成异类。郭嵩焘出使英国，写了本日记，回来被骂得一塌糊涂。\n四线方法：读一个朝代，问「它觉得外面的人是什么」。这决定了它碰到危机时会做什么反应。\n要补的\n\n汉匈关系与丝绸之路\n唐长安的胡人与外来宗教\n马戛尔尼访华与礼仪之争\n鸦片战争前后的认知落差\n\n读书\n\n佩雷菲特《停滞的帝国》\n何伟亚《怀柔远人》—— 重新解释礼仪之争\n茅海建《天朝的崩溃》\n\n\n线五：普通人怎么活\n前面四条是皇帝和官员的事。这一条是人怎么吃饭、怎么种地、怎么生孩子。\n先秦的井田制，汉代的小农经济，魏晋的庄园与坞堡，宋代的市镇与商业，明清的人口爆炸。还有：女人怎么过，孩子怎么养，灾年怎么活，生病怎么办。\n这条线在正史里几乎没有。材料在别处：居延汉简的账簿、敦煌文书、徽州契约、清代刑科题本、地方志、族谱。\n五线方法：读一个朝代，想办法找到一个普通人的名字。找到之后，这个人怎么吃饭，这个朝代就活起来了。\n已有文章\n\n元延二年，一份报到郡府的账 —— 一个戍卒「忠」的一年\n\n要补的\n\n宋代的城市生活（《东京梦华录》）\n明代的徽州契约与土地买卖\n清代的灾荒与赈济\n\n读书\n\n谢和耐《蒙元入侵前夜的中国日常生活》\n史景迁《王氏之死》—— 用县志写一个村妇\n伊懋可《大象的退却》—— 中国的环境史\n\n\n线六：天和人\n这是最容易被忽略的一条，但它决定了很多事。\n气候变冷，北方歉收，就有人南下。黄河改道，漕运就断，京城就吃紧。瘟疫来了，人口锐减，税基就崩。\n明末的小冰期，十七世纪全球降温，北方连年绝收。崇祯年间陕西大旱、蝗灾、鼠疫同时来。这些事跟朝政没关系，但它们决定了明朝能不能撑住。\n六线方法：读一个朝代，看看那几百年地球在干什么。\n要补的\n\n气候重建与中国历史的对应\n黄河与漕运\n明清的瘟疫与人口\n\n读书\n\n布雷特·辛斯基《气候变迁和中国历史》\n马立博《虎、米、丝、泥》\n曹树基《中国人口史》\n\n\n这六条线怎么用\n别按顺序读。 六条线是并行的，不是阶梯。\n一个朝代读四篇就够了：管人、钱、官、外面。读完这四篇，这个朝代就有骨架了。想再加厚度，再补普通人和环境。\n每周一个朝代，六周一轮。 一轮下来，你会有一条清晰的时间轴，以及六个可以反复追问的问题。\n读某一篇时，先想它在哪条线上。 找不到线，说明这条文章没写清自己的位置。\n\n现在有的六篇，各自站在哪\n| 文章 | 主线 | 时代 |\n|---|---|---|\n| 妇好：一座没被盗过的墓 | 线一 管人 | 商 |\n| 二里头的一件铜爵 | 线一 管人 | 夏 |\n| 元延二年，一份报到郡府的账 | 线一 管人 / 线五 普通人 | 汉 |\n| 天宝十四载，长安城里没人相信会打仗 | 线二 钱与兵 / 线四 外面 | 唐 |\n| 1768：一场由官僚自保催生的全国冤案 | 线一 管人 | 清 |\n| 从部落到国家 | 线一 管人（综述） | 先秦 |\n缺口很明显：线三（做官）一篇都没有，线六（天与人）也一篇都没有。下一批应该先补这两条。", "words": 2276}, {"id": "010-fuhao", "title": "妇好：一座没被盗过的墓", "subtitle": "1976 年安阳小屯村西北，一个被挖出来的女人", "era": "先秦·商", "tags": ["先秦", "商代", "考古", "妇好", "甲骨文"], "date": "2026-11-28", "track": "人物", "order": 1, "html": "<h2>一</h2>\n<p>1976 年 5 月，安阳小屯村西北的一片高地上，考古队开始清理一座墓。</p>\n<p>之所以选这儿，是因为前一天有人在旁边打探铲，带出来的土是夯土。夯土说明底下有东西。</p>\n<p>挖下去，很快见底。这是一座墓，不大，墓口只有五米多。</p>\n<p>但这座墓没被盗过。</p>\n<p>殷墟挖了这么多年，王陵区那几座大墓，全被盗空了。有的连棺材板都被抽走。1976 年之前，没人指望还能挖到一座完整的商代大墓。</p>\n<p>这座墓里有青铜器四百六十多件，玉器七百五十多件，骨器五百多件，还有六十八件铜器上铸着同一个名字：妇好。</p>\n<h2>二</h2>\n<p>先说这个名字是怎么来的，再说为什么是它。</p>\n<p>甲骨上刻着大量的占卜记录。有一类很短，两三个字到十几个字，内容是王在问某个人会不会有事。</p>\n<p>比如：「妇好其延有疾」，意思是妇好的病会不会拖下去。</p>\n<p>「妇好娩，嘉」，问的是妇好生孩子顺不顺利。</p>\n<p>还有「妇好亡祸」，问她不会出事吧。</p>\n<p>王给一个人问这么多问题，那个人不会是普通女人。</p>\n<h2>三</h2>\n<p>同一个名字也出现在另一类卜辞里，内容完全不一样。</p>\n<p>「辛巳卜，登妇好三千，登旅万，呼伐羌。」大意是：登记妇好的三千人，再征集一万人的队伍，命令去打羌方。一万三。</p>\n<p>然后是：「妇好先共人于庞」，说的是妇好先在庞这个地方把人召集起来。</p>\n<p>「妇好其伐」，妇好要去讨伐。</p>\n<p>还有一条记得具体：商王自己出征，妇好从另一个方向进攻，两路夹击，赢了。卜辞里叫「受佑」。</p>\n<p>王后能带兵，这在商代不是孤例。甲骨上还有别的女性带兵的记录。但妇好是记载最多的一个。</p>\n<h2>四</h2>\n<p>墓里的东西，跟甲骨对得上。</p>\n<p>墓中出土四件青铜大钺，两件大的，两件小的。大的一件重九公斤，上面铸着「妇好」两个字。</p>\n<p>钺不是武器。它是一种礼仪性的兵器，用来表示统帅的身份。汉字的「王」字，就是从钺的形状来的。</p>\n<p>一个女人的墓里放两把九公斤重的铜钺，意思很清楚：这个人是带兵的，而且是主将。</p>\n<h2>五</h2>\n<p>墓里还有别的东西，说明了她的另一重身份。</p>\n<p>六百多件玉器。其中不少是红山文化、龙山文化的旧玉，比商代早一两千年。这说明这些玉不是新做的，是收集来的。</p>\n<p>商王占卜要用龟甲。妇好墓里出了七百多片海贝。海贝在商代是货币，从南海或者更远的印度洋一带运来。</p>\n<p>所以她的墓里有三样东西：比商代早一两千年的红山玉器、从南海甚至更远的海域运来的贝壳，还有两把九公斤重、铸着她名字的铜钺，这三样东西平时分属完全不同的世界，祭祀、贸易、战争，却在同一座五米多宽的墓里聚到了一起。</p>\n<p>这就是商代上层的样子。<strong>她既带兵，也管祭祀和财富。</strong> 卜辞里确实有「妇好示」，那是她主持祭献。</p>\n<h2>六</h2>\n<p>还有一件小事值得说说。</p>\n<p>墓里出过一个玉人，跪坐着，两只手放在膝上。发髻高盘，穿着交领的衣服。有学者认为这是妇好的形象，也有人谨慎地说，不确定。</p>\n<p>我倾向于后一种。商代的玉人很多，不一定都是墓主人。</p>\n<p>但我愿意多看一下这件东西。商朝的三百多年里，谁也没留下过一张脸，包括商王自己。这是少数几个能让人想象「他长什么样」的东西。</p>\n<h2>七</h2>\n<p>商王叫武丁，在位大约五十九年。商代最盛的时候就是他。</p>\n<p>妇好死得比武丁早。甲骨上有卜辞在问她去世后的事，还有「妇好其桑」，问的是她会不会在某个地方作祟。这些记录让人觉得，武丁是把她当作还存在着的人。</p>\n<p>她死后，武丁又娶了别人当王后。商代的制度里，王后是职位，不是唯一的那个人。</p>\n<h2>八</h2>\n<p>1976 年那座墓挖出来以后，学界重新讨论了商代女性。</p>\n<p>在此之前，商的形象是「王、战争、祭祀」。妇好让这个形象多出一个侧面：王后可以带兵，可以主持祭祀，可以有自己的封地（卜辞里有「妇好受年」，问的是妇好那块田的收成）。</p>\n<p>不过也别急着套「女性地位高」这个结论。商代的婚姻是多妻的，王后是其中之一；她的权力大概来自身份，身份来自王的授予。一个女人的权力，跟她丈夫在不在，关系很大。这事我知道自己想不清，也就不硬下结论了。</p>\n<h2>九</h2>\n<p>现在那座墓的原址上盖了房子，旁边就是殷墟博物馆。</p>\n<p>妇好墓出的青铜器，很多在国博和河南博物院。那两把钺摆在一起，一把里铸着「妇好」，一把没铸字。</p>\n<p>我上次看到照片的时候想的是：她大概见过很多人，说过很多话，做过很多决定。甲骨上留下的只有那几个问题：病会不会好，生孩子顺不顺利。</p>\n<p>问这些问题的人，是她的丈夫，也是她的君王。</p>\n<hr>\n<p><strong>这一篇要抓住的三个问题</strong></p>\n<p>一、为什么王后能带兵？这个权力是从哪来的？</p>\n<p>二、墓里的旧玉和海贝，说明商代已经有了什么样的网络？</p>\n<p>三、甲骨文是占卜记录，不是史书。用它来写历史，局限在哪？</p>\n<p><strong>接下来读</strong>：《甲骨上的一天》《商王朝的边疆》</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>中国社会科学院考古研究所：《殷墟妇好墓》，文物出版社，1980 年。</li>\n<li>王宇信、杨升南：《甲骨学一百年》，社会科学文献出版社，1999 年。</li>\n<li>李学勤：《殷代地理简论》，科学出版社，1959 年。</li>\n<li>张光直：《中国青铜时代》，三联书店，1999 年。</li>\n<li>宋镇豪：《夏商社会生活史》，中国社会科学出版社，1994 年。</li>\n</ol>", "text": "一\n1976 年 5 月，安阳小屯村西北的一片高地上，考古队开始清理一座墓。\n之所以选这儿，是因为前一天有人在旁边打探铲，带出来的土是夯土。夯土说明底下有东西。\n挖下去，很快见底。这是一座墓，不大，墓口只有五米多。\n但这座墓没被盗过。\n殷墟挖了这么多年，王陵区那几座大墓，全被盗空了。有的连棺材板都被抽走。1976 年之前，没人指望还能挖到一座完整的商代大墓。\n这座墓里有青铜器四百六十多件，玉器七百五十多件，骨器五百多件，还有六十八件铜器上铸着同一个名字：妇好。\n二\n先说这个名字是怎么来的，再说为什么是它。\n甲骨上刻着大量的占卜记录。有一类很短，两三个字到十几个字，内容是王在问某个人会不会有事。\n比如：「妇好其延有疾」，意思是妇好的病会不会拖下去。\n「妇好娩，嘉」，问的是妇好生孩子顺不顺利。\n还有「妇好亡祸」，问她不会出事吧。\n王给一个人问这么多问题，那个人不会是普通女人。\n三\n同一个名字也出现在另一类卜辞里，内容完全不一样。\n「辛巳卜，登妇好三千，登旅万，呼伐羌。」大意是：登记妇好的三千人，再征集一万人的队伍，命令去打羌方。一万三。\n然后是：「妇好先共人于庞」，说的是妇好先在庞这个地方把人召集起来。\n「妇好其伐」，妇好要去讨伐。\n还有一条记得具体：商王自己出征，妇好从另一个方向进攻，两路夹击，赢了。卜辞里叫「受佑」。\n王后能带兵，这在商代不是孤例。甲骨上还有别的女性带兵的记录。但妇好是记载最多的一个。\n四\n墓里的东西，跟甲骨对得上。\n墓中出土四件青铜大钺，两件大的，两件小的。大的一件重九公斤，上面铸着「妇好」两个字。\n钺不是武器。它是一种礼仪性的兵器，用来表示统帅的身份。汉字的「王」字，就是从钺的形状来的。\n一个女人的墓里放两把九公斤重的铜钺，意思很清楚：这个人是带兵的，而且是主将。\n五\n墓里还有别的东西，说明了她的另一重身份。\n六百多件玉器。其中不少是红山文化、龙山文化的旧玉，比商代早一两千年。这说明这些玉不是新做的，是收集来的。\n商王占卜要用龟甲。妇好墓里出了七百多片海贝。海贝在商代是货币，从南海或者更远的印度洋一带运来。\n所以她的墓里有三样东西：比商代早一两千年的红山玉器、从南海甚至更远的海域运来的贝壳，还有两把九公斤重、铸着她名字的铜钺，这三样东西平时分属完全不同的世界，祭祀、贸易、战争，却在同一座五米多宽的墓里聚到了一起。\n这就是商代上层的样子。她既带兵，也管祭祀和财富。 卜辞里确实有「妇好示」，那是她主持祭献。\n六\n还有一件小事值得说说。\n墓里出过一个玉人，跪坐着，两只手放在膝上。发髻高盘，穿着交领的衣服。有学者认为这是妇好的形象，也有人谨慎地说，不确定。\n我倾向于后一种。商代的玉人很多，不一定都是墓主人。\n但我愿意多看一下这件东西。商朝的三百多年里，谁也没留下过一张脸，包括商王自己。这是少数几个能让人想象「他长什么样」的东西。\n七\n商王叫武丁，在位大约五十九年。商代最盛的时候就是他。\n妇好死得比武丁早。甲骨上有卜辞在问她去世后的事，还有「妇好其桑」，问的是她会不会在某个地方作祟。这些记录让人觉得，武丁是把她当作还存在着的人。\n她死后，武丁又娶了别人当王后。商代的制度里，王后是职位，不是唯一的那个人。\n八\n1976 年那座墓挖出来以后，学界重新讨论了商代女性。\n在此之前，商的形象是「王、战争、祭祀」。妇好让这个形象多出一个侧面：王后可以带兵，可以主持祭祀，可以有自己的封地（卜辞里有「妇好受年」，问的是妇好那块田的收成）。\n不过也别急着套「女性地位高」这个结论。商代的婚姻是多妻的，王后是其中之一；她的权力大概来自身份，身份来自王的授予。一个女人的权力，跟她丈夫在不在，关系很大。这事我知道自己想不清，也就不硬下结论了。\n九\n现在那座墓的原址上盖了房子，旁边就是殷墟博物馆。\n妇好墓出的青铜器，很多在国博和河南博物院。那两把钺摆在一起，一把里铸着「妇好」，一把没铸字。\n我上次看到照片的时候想的是：她大概见过很多人，说过很多话，做过很多决定。甲骨上留下的只有那几个问题：病会不会好，生孩子顺不顺利。\n问这些问题的人，是她的丈夫，也是她的君王。\n\n这一篇要抓住的三个问题\n一、为什么王后能带兵？这个权力是从哪来的？\n二、墓里的旧玉和海贝，说明商代已经有了什么样的网络？\n三、甲骨文是占卜记录，不是史书。用它来写历史，局限在哪？\n接下来读：《甲骨上的一天》《商王朝的边疆》\n\n主要参考文献\n\n中国社会科学院考古研究所：《殷墟妇好墓》，文物出版社，1980 年。\n王宇信、杨升南：《甲骨学一百年》，社会科学文献出版社，1999 年。\n李学勤：《殷代地理简论》，科学出版社，1959 年。\n张光直：《中国青铜时代》，三联书店，1999 年。\n宋镇豪：《夏商社会生活史》，中国社会科学出版社，1994 年。\n", "words": 1613}, {"id": "001-jiaohun", "title": "1768：一场由官僚自保催生的全国冤案", "subtitle": "从《叫魂》看专制权力、官僚理性与底层恐惧如何共同制造恐慌", "era": "清·乾隆", "tags": ["清代", "社会史", "官僚制", "孔飞力"], "date": "2026-11-28", "track": "", "order": 99, "html": "<h2>一、德清县，一个修水闸的木匠</h2>\n<p>乾隆三十三年春天，浙江德清县城外，几个木匠在修一座水闸。</p>\n<p>这一带有个说法：木匠会把人的名字写在纸片上，打进桥桩，借修桥的法术摄人魂魄。被摄的人会生病，会死。这种法术叫\"叫魂\"。</p>\n<p>一个叫沈士良的农民找到了木匠吴东明。沈士良和自己的两个侄子有仇，他想请吴东明把侄子的名字打进桥桩。</p>\n<p>吴东明拒绝了。然后他去报了官。</p>\n<p>按说事情到这里就完了。沈士良挨了打，吴东明接着修水闸，德清县的春天照常过去。</p>\n<p>但它没有就这样结束。</p>\n<p>到那年夏天，山东、江苏、直隶的衙门里挤满了人，罪名大同小异：剪人发辫，施行妖术。到秋天，军机处奉旨审结，说全案查无实据。这时已经有几十个人死在狱里。</p>\n<p>这件事距离德清县那座水闸，是一千多里。</p>\n<h2>二、谣言走在运河上</h2>\n<p>把各地报上来的案子按时间排一排，会发现一条很清楚的路线：德清、杭州、苏州、扬州、山东、直隶。</p>\n<p>这条线跟大运河几乎重合。</p>\n<p>十八世纪中叶的江南，是当时世界上人口最稠密的地区之一。康熙末年，全国大约一亿五千万人；到乾隆末年，这个数字接近三亿。人多，地不够，很多人离开土地，成了流动的人。</p>\n<p>大运河两头连着粮仓和京城。运粮的船、做买卖的商人、赶考的士子、找活计的工匠，都在同一条水路上走。一条传闻上了船，跟着往北，几天就能换一个省。</p>\n<p>被指认的人里，有很大一部分是这样一些人：游方的和尚、走街的乞丐、剃头的匠人、四处卖艺的。他们没有本地户籍，住在庙里或客栈，身边没有亲族，也没有能替他们担保的人。</p>\n<p>有个案子在山东。一个叫觉性的和尚被抓，罪名是剪人发辫。审讯时他说自己只是个走方和尚，不认识举报他的人。这话在当时没什么用——没有保人，就等于没有身份；没有身份，就等于可以被怀疑。</p>\n<h2>三、富尼汉的那本账</h2>\n<p>最先上折子的是山东巡抚富尼汉。</p>\n<p>他抓了人，审了，然后把案子报上去。奏折写得很有分寸，先叙述听说的情况，再说自己如何追查，最后说\"事关重大，不敢隐匿\"。</p>\n<p>这句\"不敢隐匿\"，把一种处境说得很清楚。</p>\n<p>如果富尼汉在折子里写\"查无此事\"，会是什么结果？乾隆面前摆着的是一份密报，说山东出了妖术；接着一份来自山东的奏折，说山东没有妖术。皇帝多半不会觉得山东太平，只会觉得这个巡抚要么无能，要么在瞒他。</p>\n<p>所以富尼汉的选择其实只有一种。写\"有\"，他是尽职的；写\"没有\"，他要冒失职的风险。<strong>风险不对称，判断就会歪。</strong></p>\n<p>案子一旦报成\"有\"，下级就跟着办。审讯要用刑，因为妖术按重案办，重案可以用刑。被捕的人在刑下供出更多的人名，于是又抓人，再审，再供。供词越来越详细：什么时辰、什么地点、用的什么东西、摄走谁的魂魄。越详细，上面越相信。</p>\n<p>江苏、直隶的地方官也陆续上折子，说同样的事。没有谁在撒谎，也没有谁特别贪婪。<strong>每个人都做了对自己最安全的选择，加在一起，产出的却是一件根本不存在的事。</strong></p>\n<h2>四、承德的一封信</h2>\n<p>案子的规模，是皇帝给的。</p>\n<p>乾隆在承德避暑山庄读到山东的密报，很快下了谕旨。此后的几个月里，谕旨一道接一道，语气一次比一次重。他要求各省严查，要求把拿获的人解京审问，甚至对已经查明的案子也要求\"再行严讯\"。</p>\n<p>孔飞力注意到一个细节：这些谕旨里反复出现的，不是\"妖术可恨\"，而是\"各省督抚何以并不奏闻\"。</p>\n<p>皇帝真正不安的，是江南的官员和士绅关系太近，近到可能一起瞒着他。妖术案给了他一个机会，让整个官僚系统为他一件事转起来，转得越快，越能看出谁是主人。</p>\n<p>还有一层。剪的是发辫。清朝初年为了剃发令杀过很多人，辫子从那时起就不只是头发。妖术专剪发辫这件事，在皇帝看来不可能只是一个乡下人的迷信。</p>\n<h2>五、收场的人是官僚</h2>\n<p>有意思的是，最后把这件案子结束掉的，还是那批皇帝不太信任的人。</p>\n<p>负责审理的是军机处。几位大臣把解京的人犯逐一过堂，反复复核，发现供词互相冲突，很多根本是刑讯之下编出来的。他们没有正面顶撞，只是把案子一件一件往回收。到了秋天，军机处奏报，称各案均无实据。</p>\n<p>乾隆接受了这个结果。此后谕旨不再提。地方上也渐渐安静下来。</p>\n<p>一个高度集权的体制，可以用一纸谕旨发动一场席卷十二省的运动；但要停下来，仍然要靠它平时最不放心的那套常规机器。孔飞力在书里把这一对关系叫做\"专制权力\"和\"常规权力\"：前者可以无限扩张，但要落地，总要经过后者。</p>\n<h2>六、后来的争论</h2>\n<p>《叫魂》出版于 1990 年，三十多年来讨论不断。</p>\n<p>有人说孔飞力把乾隆想得太聪明、太有逻辑了。真实的皇帝可能只是焦躁、信息不全、脾气上来了，未必是在下一盘大棋。</p>\n<p>也有人重新统计过案件分布，认为孔飞力手上的样本集中在几个省，全国的实际规模可能被高估；而且清代刑科题本里涉及\"邪术\"的案子本来就多，与民间信仰日常纠缠，不好都算进同一场恐慌。</p>\n<p>还有一种看法更看重底下那层：十八世纪的人口压力、粮价波动、地方社会失序，这才是恐慌的土壤。皇权动员只是火柴，柴堆是早就堆好的。</p>\n<p>这些争论没有推翻这本书。反倒是因为它把\"制度如何生产事实\"这个问题放在了一个材料极好的案子上，才经得起一遍遍地重新翻检。</p>\n<h2>七、几个可以自己想的问题</h2>\n<p>我看完这本书，最放不下的不是乾隆，是富尼汉。他写那句\"不敢隐匿\"的时候，大概知道自己抓的人未必真有问题。</p>\n<p>如果你坐在 1768 年山东巡抚的位置上，手里就是那份密报，你会怎么落笔？</p>\n<p>\"报有比报无安全\"这件事，在今天的机构里还剩下多少？它换成了什么样子？</p>\n<p>还有一层：整件事的材料，都是审讯时留下来的。人在刑具前说的话，怎么拿来当历史用？</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>孔飞力：《叫魂：1768年中国妖术大恐慌》，陈兼、刘昶译，上海三联书店，1999 年。</li>\n<li>《清高宗实录》卷八一二至八一六，乾隆三十三年相关谕旨。</li>\n<li>《宫中档乾隆朝奏折》，台北故宫博物院藏。</li>\n<li>中国人民大学清史研究所编：《清史编年》第五卷，中国人民大学出版社。</li>\n<li>关于人口背景，参看何炳棣《明初以降人口及其相关问题》。</li>\n</ol>", "text": "一、德清县，一个修水闸的木匠\n乾隆三十三年春天，浙江德清县城外，几个木匠在修一座水闸。\n这一带有个说法：木匠会把人的名字写在纸片上，打进桥桩，借修桥的法术摄人魂魄。被摄的人会生病，会死。这种法术叫\"叫魂\"。\n一个叫沈士良的农民找到了木匠吴东明。沈士良和自己的两个侄子有仇，他想请吴东明把侄子的名字打进桥桩。\n吴东明拒绝了。然后他去报了官。\n按说事情到这里就完了。沈士良挨了打，吴东明接着修水闸，德清县的春天照常过去。\n但它没有就这样结束。\n到那年夏天，山东、江苏、直隶的衙门里挤满了人，罪名大同小异：剪人发辫，施行妖术。到秋天，军机处奉旨审结，说全案查无实据。这时已经有几十个人死在狱里。\n这件事距离德清县那座水闸，是一千多里。\n二、谣言走在运河上\n把各地报上来的案子按时间排一排，会发现一条很清楚的路线：德清、杭州、苏州、扬州、山东、直隶。\n这条线跟大运河几乎重合。\n十八世纪中叶的江南，是当时世界上人口最稠密的地区之一。康熙末年，全国大约一亿五千万人；到乾隆末年，这个数字接近三亿。人多，地不够，很多人离开土地，成了流动的人。\n大运河两头连着粮仓和京城。运粮的船、做买卖的商人、赶考的士子、找活计的工匠，都在同一条水路上走。一条传闻上了船，跟着往北，几天就能换一个省。\n被指认的人里，有很大一部分是这样一些人：游方的和尚、走街的乞丐、剃头的匠人、四处卖艺的。他们没有本地户籍，住在庙里或客栈，身边没有亲族，也没有能替他们担保的人。\n有个案子在山东。一个叫觉性的和尚被抓，罪名是剪人发辫。审讯时他说自己只是个走方和尚，不认识举报他的人。这话在当时没什么用——没有保人，就等于没有身份；没有身份，就等于可以被怀疑。\n三、富尼汉的那本账\n最先上折子的是山东巡抚富尼汉。\n他抓了人，审了，然后把案子报上去。奏折写得很有分寸，先叙述听说的情况，再说自己如何追查，最后说\"事关重大，不敢隐匿\"。\n这句\"不敢隐匿\"，把一种处境说得很清楚。\n如果富尼汉在折子里写\"查无此事\"，会是什么结果？乾隆面前摆着的是一份密报，说山东出了妖术；接着一份来自山东的奏折，说山东没有妖术。皇帝多半不会觉得山东太平，只会觉得这个巡抚要么无能，要么在瞒他。\n所以富尼汉的选择其实只有一种。写\"有\"，他是尽职的；写\"没有\"，他要冒失职的风险。风险不对称，判断就会歪。\n案子一旦报成\"有\"，下级就跟着办。审讯要用刑，因为妖术按重案办，重案可以用刑。被捕的人在刑下供出更多的人名，于是又抓人，再审，再供。供词越来越详细：什么时辰、什么地点、用的什么东西、摄走谁的魂魄。越详细，上面越相信。\n江苏、直隶的地方官也陆续上折子，说同样的事。没有谁在撒谎，也没有谁特别贪婪。每个人都做了对自己最安全的选择，加在一起，产出的却是一件根本不存在的事。\n四、承德的一封信\n案子的规模，是皇帝给的。\n乾隆在承德避暑山庄读到山东的密报，很快下了谕旨。此后的几个月里，谕旨一道接一道，语气一次比一次重。他要求各省严查，要求把拿获的人解京审问，甚至对已经查明的案子也要求\"再行严讯\"。\n孔飞力注意到一个细节：这些谕旨里反复出现的，不是\"妖术可恨\"，而是\"各省督抚何以并不奏闻\"。\n皇帝真正不安的，是江南的官员和士绅关系太近，近到可能一起瞒着他。妖术案给了他一个机会，让整个官僚系统为他一件事转起来，转得越快，越能看出谁是主人。\n还有一层。剪的是发辫。清朝初年为了剃发令杀过很多人，辫子从那时起就不只是头发。妖术专剪发辫这件事，在皇帝看来不可能只是一个乡下人的迷信。\n五、收场的人是官僚\n有意思的是，最后把这件案子结束掉的，还是那批皇帝不太信任的人。\n负责审理的是军机处。几位大臣把解京的人犯逐一过堂，反复复核，发现供词互相冲突，很多根本是刑讯之下编出来的。他们没有正面顶撞，只是把案子一件一件往回收。到了秋天，军机处奏报，称各案均无实据。\n乾隆接受了这个结果。此后谕旨不再提。地方上也渐渐安静下来。\n一个高度集权的体制，可以用一纸谕旨发动一场席卷十二省的运动；但要停下来，仍然要靠它平时最不放心的那套常规机器。孔飞力在书里把这一对关系叫做\"专制权力\"和\"常规权力\"：前者可以无限扩张，但要落地，总要经过后者。\n六、后来的争论\n《叫魂》出版于 1990 年，三十多年来讨论不断。\n有人说孔飞力把乾隆想得太聪明、太有逻辑了。真实的皇帝可能只是焦躁、信息不全、脾气上来了，未必是在下一盘大棋。\n也有人重新统计过案件分布，认为孔飞力手上的样本集中在几个省，全国的实际规模可能被高估；而且清代刑科题本里涉及\"邪术\"的案子本来就多，与民间信仰日常纠缠，不好都算进同一场恐慌。\n还有一种看法更看重底下那层：十八世纪的人口压力、粮价波动、地方社会失序，这才是恐慌的土壤。皇权动员只是火柴，柴堆是早就堆好的。\n这些争论没有推翻这本书。反倒是因为它把\"制度如何生产事实\"这个问题放在了一个材料极好的案子上，才经得起一遍遍地重新翻检。\n七、几个可以自己想的问题\n我看完这本书，最放不下的不是乾隆，是富尼汉。他写那句\"不敢隐匿\"的时候，大概知道自己抓的人未必真有问题。\n如果你坐在 1768 年山东巡抚的位置上，手里就是那份密报，你会怎么落笔？\n\"报有比报无安全\"这件事，在今天的机构里还剩下多少？它换成了什么样子？\n还有一层：整件事的材料，都是审讯时留下来的。人在刑具前说的话，怎么拿来当历史用？\n\n主要参考文献\n\n孔飞力：《叫魂：1768年中国妖术大恐慌》，陈兼、刘昶译，上海三联书店，1999 年。\n《清高宗实录》卷八一二至八一六，乾隆三十三年相关谕旨。\n《宫中档乾隆朝奏折》，台北故宫博物院藏。\n中国人民大学清史研究所编：《清史编年》第五卷，中国人民大学出版社。\n关于人口背景，参看何炳棣《明初以降人口及其相关问题》。\n", "words": 2005}, {"id": "000-xianqin-framework", "title": "从部落到国家：先秦五百年在解决的到底是什么问题", "subtitle": "三千年前，一群人开始试着管理比村子更大的东西", "era": "先秦", "tags": ["先秦", "国家起源", "考古", "制度"], "date": "2026-11-28", "track": "骨架", "order": 1, "html": "<h2>一</h2>\n<p>1976 年，安阳小屯村西北，考古队清理一座墓。</p>\n<p>墓不大，但没被盗过。挖开以后，青铜器两百多件，玉器七百多件，还有十六个人陪葬。</p>\n<p>墓主人叫妇好。甲骨上她的名字出现了两百多次。</p>\n<p>武丁的王后，也是带兵的人。有一次她领兵一万三千去打羌方。</p>\n<p>一个女人，在公元前十三世纪，能调动一万三千人。这件事我读了好几遍才习惯。</p>\n<h2>二</h2>\n<p>先说清楚一个问题：一万三千人是什么概念。</p>\n<p>同一年代，两河流域的城邦，一个城的人口大约几千。商的一个将领能带兵一万三，说明它背后有一个能征粮、能造兵器、能传达命令的组织。</p>\n<p>这个组织不是天上掉下来的。</p>\n<p>往前推一千年，黄河中游的村子，一个几十户。种地、祭祀、打猎，都是这几户人一起。谁跟谁都是亲戚，不用谁管谁。</p>\n<p>从几十户到上万人，中间隔着的，就是先秦五百年要解决的事。</p>\n<h2>三</h2>\n<p>关于夏，我到现在也没想明白。</p>\n<p>《史记》写得很清楚：十四代，四百多年，最后一个王叫桀，被商汤流放了。司马迁写这些的时候，手里大概有一些他没说清楚的来源。</p>\n<p>可是考古挖到今天，二里头有宫殿、有大道、有铸铜作坊，什么都有，就是没有能读出“夏”这个字的文字。</p>\n<p>许宏主持二里头发掘很多年，他在书里写：我能证明这里是一个国家，不能证明它叫夏。</p>\n<p>这话很老实，也很别扭。</p>\n<h2>四</h2>\n<p>商人的答案在神那里。安阳出土的甲骨，十几万片。上面刻的问题大多很短：今天下雨吗？这次出去打猎有收获吗？妇好的牙疼会不会好？</p>\n<p>商王几乎每天都在问。问完，把答案也刻上。得到的结果，甲骨上就刻一个“允”字。</p>\n<p>我不是研究甲骨的，但读那些卜辞有种奇怪的感觉。他管着那么多人，最关心的还是下雨和牙疼。</p>\n<p>张光直说中国早期文明的核心是政治与宗教的结合。青铜器造得最好的几件，都是鼎、簋、爵，祭祀用的。武器不是没有，但比例小得多。</p>\n<p>我想他的意思是：在那个年代，谁能跟祖先说上话，谁就是王——这比养多少官吏都管用，因为官吏要发俸禄，要说谎，会偷懒，而祖先只认跟谁有血缘，这个资格谁也抢不走，也省了每年核对一次。</p>\n<h2>五</h2>\n<p>周人换了一条路，不再靠祭祀，靠分地。武王灭商之后，把土地分给自己的兄弟和功臣。史书上说七十一国，其中姬姓五十三。</p>\n<p>这个做法现在看有点奇怪：好不容易打下来的地盘，为什么要分给别人？原因说起来也很简单，就是管不过来。从镐京到齐国，中间隔着几百里山路。一道命令要走多久，一支军队要走多久，粮食从哪来。这些问题在当时没有解法。</p>\n<p>分封是一种省事的办法。地给你，人归你管，你自己收税，你自己打仗，只要记得按时来朝贡就行。</p>\n<p>省了钱，也省了力。代价是，几代之后，这些诸侯就不再听招呼了。</p>\n<h2>六</h2>\n<p>撑住这套东西的，除了血缘，还有礼。</p>\n<p>礼听起来很虚。其实很具体：天子用九鼎，诸侯七鼎，大夫五鼎。什么人坐什么车，走几步，什么时候跪。</p>\n<p>你早上起来，就知道自己在哪个位置。</p>\n<p>公元前 770 年，周平王东迁。往后两百年，诸侯开始互相吞并，礼就不太管用了。孔子把这个叫“礼崩乐坏”。</p>\n<p>我原来以为这是一句感叹，后来发现它其实是个很准确的描述：礼确实崩了，而且有具体的年份可以指出来。</p>\n<h2>七</h2>\n<p>战国是另一回事，争的不再是名分，而是谁能把整个天下吞下去。前面还剩一百多个国，后来打剩七个，再打剩一个。</p>\n<p>不过值得看的其实不是打仗，是这七个国家都在改自己。魏国有李悝，楚国用吴起，秦国有商鞅。改的内容差不多：按田亩收税，按人头征兵，把土地和军功挂钩。</p>\n<p>商鞅那一套最彻底。爵位分二十级，在战场上砍下一颗脑袋，升一级。种地种得多，免徭役。什么都不干，老老实实交税。</p>\n<p>几十年下来，秦国成了一台机器。一个农民的一生被安排好了：种地，服役，打仗，可能死在外地。</p>\n<p>残酷是一条。另一条是，在那个环境里，没有比它更有效的办法。</p>\n<h2>八</h2>\n<p>公元前 221 年，秦统一。</p>\n<p>秦始皇做了一件之前没人做过的事：不分封了，改郡县。地方官由中央派，定期调走，不许传给儿子。</p>\n<p>同一年还做了几件小事：车轨统一，文字统一，度量衡统一，货币统一。</p>\n<p>我第一次读到这里的时候没觉得什么。后来想了一下：一个楚国人写的字，一个齐国人能看懂。一斗米在哪个郡，都是同一个量。</p>\n<p>这才慢慢有了国家的样子。</p>\n<h2>九</h2>\n<p>回头看这五百年，中国人在解决的是同一件事：怎么让几千万人按同一套规则过日子。</p>\n<p>办法是一层一层加上去的。先是宗族和祭祀，然后是分封，然后是礼，然后是变法，最后是郡县。</p>\n<p>每一层都是对上一层的修补。</p>\n<p>分封解决了管不过来的问题，但留下了诸侯坐大。礼解决了秩序的问题，但礼会失效。变法解决了动员的问题，但变法太狠会反噬。郡县解决了割据的问题，秦二世就亡了。</p>\n<p>没有一步是完美的，每一步都是在上一步的麻烦里找办法。</p>\n<hr>\n<p><strong>读这一篇要抓住的三个问题</strong></p>\n<p>一、为什么“国家”最早是跟祭祀绑在一起的？</p>\n<p>二、分封制省了什么，又留下了什么？</p>\n<p>三、秦为什么统一得这么快，又亡得这么快？</p>\n<p><strong>接下来读</strong>：《二里头的一件铜爵》、《商鞅那二十年》</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>张光直：《中国青铜时代》，三联书店，1999 年。</li>\n<li>许宏：《最早的中国》，科学出版社，2009 年。</li>\n<li>李峰：《西周的政体》，三联书店，2010 年。</li>\n<li>许倬云：《西周史》，三联书店，1994 年。</li>\n<li>赵鼎新：《东周战争与儒法国家的诞生》，华东师范大学出版社，2006 年。</li>\n</ol>", "text": "一\n1976 年，安阳小屯村西北，考古队清理一座墓。\n墓不大，但没被盗过。挖开以后，青铜器两百多件，玉器七百多件，还有十六个人陪葬。\n墓主人叫妇好。甲骨上她的名字出现了两百多次。\n武丁的王后，也是带兵的人。有一次她领兵一万三千去打羌方。\n一个女人，在公元前十三世纪，能调动一万三千人。这件事我读了好几遍才习惯。\n二\n先说清楚一个问题：一万三千人是什么概念。\n同一年代，两河流域的城邦，一个城的人口大约几千。商的一个将领能带兵一万三，说明它背后有一个能征粮、能造兵器、能传达命令的组织。\n这个组织不是天上掉下来的。\n往前推一千年，黄河中游的村子，一个几十户。种地、祭祀、打猎，都是这几户人一起。谁跟谁都是亲戚，不用谁管谁。\n从几十户到上万人，中间隔着的，就是先秦五百年要解决的事。\n三\n关于夏，我到现在也没想明白。\n《史记》写得很清楚：十四代，四百多年，最后一个王叫桀，被商汤流放了。司马迁写这些的时候，手里大概有一些他没说清楚的来源。\n可是考古挖到今天，二里头有宫殿、有大道、有铸铜作坊，什么都有，就是没有能读出“夏”这个字的文字。\n许宏主持二里头发掘很多年，他在书里写：我能证明这里是一个国家，不能证明它叫夏。\n这话很老实，也很别扭。\n四\n商人的答案在神那里。安阳出土的甲骨，十几万片。上面刻的问题大多很短：今天下雨吗？这次出去打猎有收获吗？妇好的牙疼会不会好？\n商王几乎每天都在问。问完，把答案也刻上。得到的结果，甲骨上就刻一个“允”字。\n我不是研究甲骨的，但读那些卜辞有种奇怪的感觉。他管着那么多人，最关心的还是下雨和牙疼。\n张光直说中国早期文明的核心是政治与宗教的结合。青铜器造得最好的几件，都是鼎、簋、爵，祭祀用的。武器不是没有，但比例小得多。\n我想他的意思是：在那个年代，谁能跟祖先说上话，谁就是王——这比养多少官吏都管用，因为官吏要发俸禄，要说谎，会偷懒，而祖先只认跟谁有血缘，这个资格谁也抢不走，也省了每年核对一次。\n五\n周人换了一条路，不再靠祭祀，靠分地。武王灭商之后，把土地分给自己的兄弟和功臣。史书上说七十一国，其中姬姓五十三。\n这个做法现在看有点奇怪：好不容易打下来的地盘，为什么要分给别人？原因说起来也很简单，就是管不过来。从镐京到齐国，中间隔着几百里山路。一道命令要走多久，一支军队要走多久，粮食从哪来。这些问题在当时没有解法。\n分封是一种省事的办法。地给你，人归你管，你自己收税，你自己打仗，只要记得按时来朝贡就行。\n省了钱，也省了力。代价是，几代之后，这些诸侯就不再听招呼了。\n六\n撑住这套东西的，除了血缘，还有礼。\n礼听起来很虚。其实很具体：天子用九鼎，诸侯七鼎，大夫五鼎。什么人坐什么车，走几步，什么时候跪。\n你早上起来，就知道自己在哪个位置。\n公元前 770 年，周平王东迁。往后两百年，诸侯开始互相吞并，礼就不太管用了。孔子把这个叫“礼崩乐坏”。\n我原来以为这是一句感叹，后来发现它其实是个很准确的描述：礼确实崩了，而且有具体的年份可以指出来。\n七\n战国是另一回事，争的不再是名分，而是谁能把整个天下吞下去。前面还剩一百多个国，后来打剩七个，再打剩一个。\n不过值得看的其实不是打仗，是这七个国家都在改自己。魏国有李悝，楚国用吴起，秦国有商鞅。改的内容差不多：按田亩收税，按人头征兵，把土地和军功挂钩。\n商鞅那一套最彻底。爵位分二十级，在战场上砍下一颗脑袋，升一级。种地种得多，免徭役。什么都不干，老老实实交税。\n几十年下来，秦国成了一台机器。一个农民的一生被安排好了：种地，服役，打仗，可能死在外地。\n残酷是一条。另一条是，在那个环境里，没有比它更有效的办法。\n八\n公元前 221 年，秦统一。\n秦始皇做了一件之前没人做过的事：不分封了，改郡县。地方官由中央派，定期调走，不许传给儿子。\n同一年还做了几件小事：车轨统一，文字统一，度量衡统一，货币统一。\n我第一次读到这里的时候没觉得什么。后来想了一下：一个楚国人写的字，一个齐国人能看懂。一斗米在哪个郡，都是同一个量。\n这才慢慢有了国家的样子。\n九\n回头看这五百年，中国人在解决的是同一件事：怎么让几千万人按同一套规则过日子。\n办法是一层一层加上去的。先是宗族和祭祀，然后是分封，然后是礼，然后是变法，最后是郡县。\n每一层都是对上一层的修补。\n分封解决了管不过来的问题，但留下了诸侯坐大。礼解决了秩序的问题，但礼会失效。变法解决了动员的问题，但变法太狠会反噬。郡县解决了割据的问题，秦二世就亡了。\n没有一步是完美的，每一步都是在上一步的麻烦里找办法。\n\n读这一篇要抓住的三个问题\n一、为什么“国家”最早是跟祭祀绑在一起的？\n二、分封制省了什么，又留下了什么？\n三、秦为什么统一得这么快，又亡得这么快？\n接下来读：《二里头的一件铜爵》、《商鞅那二十年》\n\n主要参考文献\n\n张光直：《中国青铜时代》，三联书店，1999 年。\n许宏：《最早的中国》，科学出版社，2009 年。\n李峰：《西周的政体》，三联书店，2010 年。\n许倬云：《西周史》，三联书店，1994 年。\n赵鼎新：《东周战争与儒法国家的诞生》，华东师范大学出版社，2006 年。\n", "words": 1731}, {"id": "002-erlitou", "title": "二里头的一件铜爵，和一段找不到名字的历史", "subtitle": "夏朝存在吗？考古能给的东西，和文字能给的东西", "era": "先秦·夏", "tags": ["先秦", "考古", "二里头", "夏商周断代"], "date": "2026-11-27", "track": "", "order": 99, "html": "<h2>一、洛阳盆地，一片灰土</h2>\n<p>1959 年夏天，考古学家徐旭生在河南偃师一带调查。</p>\n<p>他是来找\"夏墟\"的。司马迁在《史记》里写过夏，写了十四代、四百多年，写了最后一个叫桀的王，写了他被商汤流放。可商朝有甲骨文，有安阳的宫殿基址，有青铜器上的铭文，夏什么都没有。<strong>一个写在两千年前书里的王朝，在地底下找不到对应的东西。</strong></p>\n<p>徐旭生走到二里头村的时候，看到地里有一片灰土。灰土下面，是陶片。</p>\n<h2>二、这里挖出了什么</h2>\n<p>往后六十年的发掘，二里头给了一件东西的各个部分。</p>\n<p>宫城。夯土的墙基，围出一块十万平方米的城，中间是一号宫殿，三十多米见方，前面有庭院。这种布局，后来的商周宫殿也在用。</p>\n<p>道路。城里有几条主干道，宽十几米，路面有车辙。</p>\n<p>作坊。城南是铸铜的遗址，出土了陶范、坩埚、铜渣。那里铸出来的青铜器，是中国目前发现最早的青铜礼器群。</p>\n<p>一件铜爵。三足，长流，器壁很薄。铸造这样的东西，需要合范、需要配比、需要控制温度。这不是一个村子的手艺。</p>\n<p>还有一样东西没挖出来：字。</p>\n<p>二里头有刻画符号，陶器上零零星星几十个。但那不是文字。没有甲骨，没有铭文，没有能读出\"夏\"这个字的东西。</p>\n<h2>三、两拨人吵了四十年</h2>\n<p>于是问题变成了这样：二里头是夏都，还是早商都？</p>\n<p>一派以邹衡为代表。他认为二里头一至四期全是夏文化，商的早期都邑是郑州商城。理由是二里头与之后的二里岗文化差别明显，中间有断裂。</p>\n<p>另一派认为，二里头晚期（三、四期）已经进入商代，很可能是汤都西亳。理由是这个阶段出现了新的器物组合和礼制变化。</p>\n<p>两边都拿地层和陶器说话，谁也说服不了谁。因为<strong>争论的其实不是器物，是名字</strong>。</p>\n<p>年代是清楚的。二里头的绝对年代大约在公元前 1750 到 1530 年，用碳十四测过很多次。这个时间跟《竹书纪年》里夏的纪年大致对得上。</p>\n<p>但对得上，不等于就是那个名字。</p>\n<p>许宏后来在《最早的中国》里说得很坦白：他能证明二里头是一个广域王权国家的都邑，是这个区域最早的国家级聚落；他不能证明它叫\"夏\"。</p>\n<h2>四、名字是后来的人给的</h2>\n<p>\"夏\"这个称呼，最早出现在西周人的话里。</p>\n<p>周公反复讲\"殷革夏命\"，讲夏的失德、商的天命、周的承接。这套话在当时有非常实际的作用：周要证明自己取代商是合法的，就需要一个先例；商取代夏，正好就是这个先例。</p>\n<p>顾颉刚当年提出过\"层累地造成的古史\"，说的就是这个意思：越往后，上古的历史越详细，越整齐。</p>\n<p>所以有一种可能是：夏确实存在，就是二里头那样一个国家；但\"夏\"这个名字，是周人为了讲自己的故事才安上去的。</p>\n<h2>五、另一条路</h2>\n<p>也不是完全没有别的办法。</p>\n<p>商朝人自己也记过。甲骨文里有\"西邑\"，有学者认为那指的是一个更早的西边的都城。如果这个推测成立，那么商人心里的\"前朝\"，可能叫西邑，不叫夏。</p>\n<p>陶寺遗址在山西襄汾，年代比二里头还早，有观象台、有城墙、有大墓。良渚在浙江，有水利系统、有玉礼器。石峁在陕西神木，石头砌的城几百万立方米。</p>\n<p>这些地方都不叫夏。但它们加在一起，说明公元前两千年上下的中国大地上，早就有若干个复杂社会同时存在。<strong>夏的问题，可能从一开始就问错了：我们总想找一个王朝，实际上找到的是好几个并立的文明。</strong></p>\n<h2>六、那件铜爵</h2>\n<p>二里头出土的铜爵，现在在中国社会科学院考古研究所的库房里。</p>\n<p>它不高，二十厘米左右，壁厚两毫米。铸造的时候，陶范要做得非常精确，否则铜水浇进去就漏了。做这件东西的人，肯定有师傅教，有分工，有人给他准备料。</p>\n<p>这件爵说明，四千年前洛阳盆地有人能组织起足够多的人、足够长的工序，去做一件只用来倒酒的东西。</p>\n<p>至于这个组织叫什么，我们不知道。</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>许宏：《最早的中国》，科学出版社，2009 年。</li>\n<li>邹衡：《夏商周考古学论文集》，文物出版社，1980 年。</li>\n<li>张光直：《中国青铜时代》，三联书店，1999 年。</li>\n<li>李学勤：《走出疑古时代》，辽宁大学出版社，1997 年。</li>\n<li>中国社会科学院考古研究所：《二里头（1999—2006）》，文物出版社，2014 年。</li>\n</ol>", "text": "一、洛阳盆地，一片灰土\n1959 年夏天，考古学家徐旭生在河南偃师一带调查。\n他是来找\"夏墟\"的。司马迁在《史记》里写过夏，写了十四代、四百多年，写了最后一个叫桀的王，写了他被商汤流放。可商朝有甲骨文，有安阳的宫殿基址，有青铜器上的铭文，夏什么都没有。一个写在两千年前书里的王朝，在地底下找不到对应的东西。\n徐旭生走到二里头村的时候，看到地里有一片灰土。灰土下面，是陶片。\n二、这里挖出了什么\n往后六十年的发掘，二里头给了一件东西的各个部分。\n宫城。夯土的墙基，围出一块十万平方米的城，中间是一号宫殿，三十多米见方，前面有庭院。这种布局，后来的商周宫殿也在用。\n道路。城里有几条主干道，宽十几米，路面有车辙。\n作坊。城南是铸铜的遗址，出土了陶范、坩埚、铜渣。那里铸出来的青铜器，是中国目前发现最早的青铜礼器群。\n一件铜爵。三足，长流，器壁很薄。铸造这样的东西，需要合范、需要配比、需要控制温度。这不是一个村子的手艺。\n还有一样东西没挖出来：字。\n二里头有刻画符号，陶器上零零星星几十个。但那不是文字。没有甲骨，没有铭文，没有能读出\"夏\"这个字的东西。\n三、两拨人吵了四十年\n于是问题变成了这样：二里头是夏都，还是早商都？\n一派以邹衡为代表。他认为二里头一至四期全是夏文化，商的早期都邑是郑州商城。理由是二里头与之后的二里岗文化差别明显，中间有断裂。\n另一派认为，二里头晚期（三、四期）已经进入商代，很可能是汤都西亳。理由是这个阶段出现了新的器物组合和礼制变化。\n两边都拿地层和陶器说话，谁也说服不了谁。因为争论的其实不是器物，是名字。\n年代是清楚的。二里头的绝对年代大约在公元前 1750 到 1530 年，用碳十四测过很多次。这个时间跟《竹书纪年》里夏的纪年大致对得上。\n但对得上，不等于就是那个名字。\n许宏后来在《最早的中国》里说得很坦白：他能证明二里头是一个广域王权国家的都邑，是这个区域最早的国家级聚落；他不能证明它叫\"夏\"。\n四、名字是后来的人给的\n\"夏\"这个称呼，最早出现在西周人的话里。\n周公反复讲\"殷革夏命\"，讲夏的失德、商的天命、周的承接。这套话在当时有非常实际的作用：周要证明自己取代商是合法的，就需要一个先例；商取代夏，正好就是这个先例。\n顾颉刚当年提出过\"层累地造成的古史\"，说的就是这个意思：越往后，上古的历史越详细，越整齐。\n所以有一种可能是：夏确实存在，就是二里头那样一个国家；但\"夏\"这个名字，是周人为了讲自己的故事才安上去的。\n五、另一条路\n也不是完全没有别的办法。\n商朝人自己也记过。甲骨文里有\"西邑\"，有学者认为那指的是一个更早的西边的都城。如果这个推测成立，那么商人心里的\"前朝\"，可能叫西邑，不叫夏。\n陶寺遗址在山西襄汾，年代比二里头还早，有观象台、有城墙、有大墓。良渚在浙江，有水利系统、有玉礼器。石峁在陕西神木，石头砌的城几百万立方米。\n这些地方都不叫夏。但它们加在一起，说明公元前两千年上下的中国大地上，早就有若干个复杂社会同时存在。夏的问题，可能从一开始就问错了：我们总想找一个王朝，实际上找到的是好几个并立的文明。\n六、那件铜爵\n二里头出土的铜爵，现在在中国社会科学院考古研究所的库房里。\n它不高，二十厘米左右，壁厚两毫米。铸造的时候，陶范要做得非常精确，否则铜水浇进去就漏了。做这件东西的人，肯定有师傅教，有分工，有人给他准备料。\n这件爵说明，四千年前洛阳盆地有人能组织起足够多的人、足够长的工序，去做一件只用来倒酒的东西。\n至于这个组织叫什么，我们不知道。\n\n主要参考文献\n\n许宏：《最早的中国》，科学出版社，2009 年。\n邹衡：《夏商周考古学论文集》，文物出版社，1980 年。\n张光直：《中国青铜时代》，三联书店，1999 年。\n李学勤：《走出疑古时代》，辽宁大学出版社，1997 年。\n中国社会科学院考古研究所：《二里头（1999—2006）》，文物出版社，2014 年。\n", "words": 1312}, {"id": "003-juyan", "title": "元延二年，一份报到郡府的账", "subtitle": "从居延汉简看两千年前的基层行政，究竟怎么运转", "era": "秦汉", "tags": ["秦汉", "简牍", "基层治理", "居延"], "date": "2026-11-26", "track": "", "order": 99, "html": "<h2>一、1930 年，额济纳河边上</h2>\n<p>1930 年，中瑞西北科学考察团在内蒙古额济纳河流域的汉代烽燧遗址里，挖出了一万多枚木简。</p>\n<p>那些简被埋在沙里，一千九百多年没有烂。有的写着公文，有的写着名册，有的只有几个字：某年某月某人取粟几斗。</p>\n<p>这就是居延汉简。后来 1970 年代又出土一批，编成《居延新简》。</p>\n<p>简上记的东西琐碎到让人吃惊：某队有多少人、每人每天吃几升米、马病了喂什么药、谁欠谁几文钱。<strong>正史里没有一个字写这些。可边关就是这么一天天过去的。</strong></p>\n<h2>二、账本上的名字</h2>\n<p>汉成帝元延二年，居延某地的县令（简文中多作\"令\"或\"丞\"）向郡府上报上计簿。簿上列着这一年的户口、垦田、钱谷出入、刑狱案件。</p>\n<p>简文残破，只留下片段：\"元延二年……户八百廿三，口四千卅七……田二千一百顷……\"</p>\n<p>八百多户，四千多人。这是当时一个县的规模。</p>\n<p>紧接着几支简，是郡府核对后的批语。有一处写着户数和上一年对不上，要求说明原因；另一处写着某乡上报的垦田数小于实际，责令复核。</p>\n<p><strong>这就是上计。</strong> 每年秋天，县把一年的账报到郡，郡汇总报中央。户口、垦田、钱粮、盗贼、狱讼，逐项核对。</p>\n<h2>三、为什么必须这么细</h2>\n<p>因为要收税，要派人服役，要调兵。</p>\n<p>汉代的赋役建立在人口登记上。一个人是不是在册，决定了他全年要交多少算赋、要服多少天徭役、家里有几个男丁会被征去戍边。</p>\n<p>所以户籍不是虚文。居延简里有大量\"戍卒名籍\"，记着每一个从内地来戍边的士兵的姓名、籍贯、年龄、身高、肤色。为什么要记肤色？因为逃跑时要发通缉。</p>\n<p>还有一个细节。简里有很多\"病书\"，写某卒患病、不能值勤，请予免除当日劳役。这些病书要经过上级审核，有的还附了医官的诊断。<strong>一个边塞小卒请一天病假，要走完一整套文书流程。</strong></p>\n<h2>四、行政的代价</h2>\n<p>看起来很严密。但代价也在这里。</p>\n<p>一份公文从县到郡，从郡到都尉府，再到朝廷，中间要经过多少双手、多少站。居延出土的简里，有一种\"邮书刺\"，专门记录某份文书几时发出、几时到达、由谁传递。如果超期，要追责。</p>\n<p>有个简上写着：“前书到，期会已过，至今未报。”</p>\n<p>这是上级在催。催了还要写进档案。</p>\n<p>阎步克、卜宪群这些学者研究汉代官僚制时，都提到同一个问题：<strong>秦汉的行政能力，来于文书；它的负担，也来于文书。</strong> 一个县要养多少书吏，抄多少份，才能维持这套流程。</p>\n<p>居延的边塞是最考验这套系统的地方——离中央几千里，补给靠内地转运，一个环节断了，整条线就废了。</p>\n<h2>五、一个卒的日常</h2>\n<p>简里有一个叫\"忠\"的戍卒，出现在好几支简上。</p>\n<p>他某月某日领粟三石三斗三升少；某日与同伍的人一起巡烽；某日他的弩损坏，上报换新；某日他病了，同伍的人替他值勤。</p>\n<p>这些记录毫无戏剧性。但如果把他一年里出现在简上的所有条目连起来，就能看出一个边疆士兵的生活节奏：领粮、巡烽、修器、生病、被人替、替别人。</p>\n<p><strong>历史书里没有\"忠\"这个人。他没打过有名的仗，没说过一句被记下来的话。他只是被记在账上。</strong></p>\n<h2>六、这批简改变了什么</h2>\n<p>居延汉简出土之前，秦汉史的主要材料是《史记》《汉书》，加上一点金石。那都是上层视角。</p>\n<p>简牍出来之后，学界对秦汉基层的认识整个变了。原来\"郡县制\"三个字底下，是上计、是名籍、是邮书、是病书、是每月的粮账。</p>\n<p>劳榦花了几十年考释这批简。邢义田后来研究\"治国安邦\"，专门讨论这套文书体系如何把一个大帝国连起来。</p>\n<p>有意思的是，这些研究越深入，秦汉的形象就越不像“严刑峻法”四个字能概括的。它更像一个<strong>极其依赖流程、极其依赖纸张（准确说是木片）的组织</strong>。它的强，在于流程；它的弱，也在于流程。</p>\n<h2>七、最后</h2>\n<p>额济纳河边那些烽燧，今天还在。</p>\n<p>风把沙吹过残墙，木简当年就堆在墙根下。写字的人不知道这些东西会留下来，他只是照规矩，把该记的记上。</p>\n<p>两千年后，我们靠这些记账的木片，才知道一个汉代的边塞是怎么运转的。</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>劳榦：《居延汉简考释》，中央研究院历史语言研究所，1957 年。</li>\n<li>邢义田：《治国安邦：法制、行政与军事》，中华书局，2011 年。</li>\n<li>卜宪群：《秦汉官僚制度》，社会科学文献出版社，2002 年。</li>\n<li>阎步克：《从爵本位到官本位》，三联书店，2009 年。</li>\n<li>甘肃省文物考古研究所等：《居延新简》，文物出版社，1990 年。</li>\n</ol>", "text": "一、1930 年，额济纳河边上\n1930 年，中瑞西北科学考察团在内蒙古额济纳河流域的汉代烽燧遗址里，挖出了一万多枚木简。\n那些简被埋在沙里，一千九百多年没有烂。有的写着公文，有的写着名册，有的只有几个字：某年某月某人取粟几斗。\n这就是居延汉简。后来 1970 年代又出土一批，编成《居延新简》。\n简上记的东西琐碎到让人吃惊：某队有多少人、每人每天吃几升米、马病了喂什么药、谁欠谁几文钱。正史里没有一个字写这些。可边关就是这么一天天过去的。\n二、账本上的名字\n汉成帝元延二年，居延某地的县令（简文中多作\"令\"或\"丞\"）向郡府上报上计簿。簿上列着这一年的户口、垦田、钱谷出入、刑狱案件。\n简文残破，只留下片段：\"元延二年……户八百廿三，口四千卅七……田二千一百顷……\"\n八百多户，四千多人。这是当时一个县的规模。\n紧接着几支简，是郡府核对后的批语。有一处写着户数和上一年对不上，要求说明原因；另一处写着某乡上报的垦田数小于实际，责令复核。\n这就是上计。 每年秋天，县把一年的账报到郡，郡汇总报中央。户口、垦田、钱粮、盗贼、狱讼，逐项核对。\n三、为什么必须这么细\n因为要收税，要派人服役，要调兵。\n汉代的赋役建立在人口登记上。一个人是不是在册，决定了他全年要交多少算赋、要服多少天徭役、家里有几个男丁会被征去戍边。\n所以户籍不是虚文。居延简里有大量\"戍卒名籍\"，记着每一个从内地来戍边的士兵的姓名、籍贯、年龄、身高、肤色。为什么要记肤色？因为逃跑时要发通缉。\n还有一个细节。简里有很多\"病书\"，写某卒患病、不能值勤，请予免除当日劳役。这些病书要经过上级审核，有的还附了医官的诊断。一个边塞小卒请一天病假，要走完一整套文书流程。\n四、行政的代价\n看起来很严密。但代价也在这里。\n一份公文从县到郡，从郡到都尉府，再到朝廷，中间要经过多少双手、多少站。居延出土的简里，有一种\"邮书刺\"，专门记录某份文书几时发出、几时到达、由谁传递。如果超期，要追责。\n有个简上写着：“前书到，期会已过，至今未报。”\n这是上级在催。催了还要写进档案。\n阎步克、卜宪群这些学者研究汉代官僚制时，都提到同一个问题：秦汉的行政能力，来于文书；它的负担，也来于文书。 一个县要养多少书吏，抄多少份，才能维持这套流程。\n居延的边塞是最考验这套系统的地方——离中央几千里，补给靠内地转运，一个环节断了，整条线就废了。\n五、一个卒的日常\n简里有一个叫\"忠\"的戍卒，出现在好几支简上。\n他某月某日领粟三石三斗三升少；某日与同伍的人一起巡烽；某日他的弩损坏，上报换新；某日他病了，同伍的人替他值勤。\n这些记录毫无戏剧性。但如果把他一年里出现在简上的所有条目连起来，就能看出一个边疆士兵的生活节奏：领粮、巡烽、修器、生病、被人替、替别人。\n历史书里没有\"忠\"这个人。他没打过有名的仗，没说过一句被记下来的话。他只是被记在账上。\n六、这批简改变了什么\n居延汉简出土之前，秦汉史的主要材料是《史记》《汉书》，加上一点金石。那都是上层视角。\n简牍出来之后，学界对秦汉基层的认识整个变了。原来\"郡县制\"三个字底下，是上计、是名籍、是邮书、是病书、是每月的粮账。\n劳榦花了几十年考释这批简。邢义田后来研究\"治国安邦\"，专门讨论这套文书体系如何把一个大帝国连起来。\n有意思的是，这些研究越深入，秦汉的形象就越不像“严刑峻法”四个字能概括的。它更像一个极其依赖流程、极其依赖纸张（准确说是木片）的组织。它的强，在于流程；它的弱，也在于流程。\n七、最后\n额济纳河边那些烽燧，今天还在。\n风把沙吹过残墙，木简当年就堆在墙根下。写字的人不知道这些东西会留下来，他只是照规矩，把该记的记上。\n两千年后，我们靠这些记账的木片，才知道一个汉代的边塞是怎么运转的。\n\n主要参考文献\n\n劳榦：《居延汉简考释》，中央研究院历史语言研究所，1957 年。\n邢义田：《治国安邦：法制、行政与军事》，中华书局，2011 年。\n卜宪群：《秦汉官僚制度》，社会科学文献出版社，2002 年。\n阎步克：《从爵本位到官本位》，三联书店，2009 年。\n甘肃省文物考古研究所等：《居延新简》，文物出版社，1990 年。\n", "words": 1380}, {"id": "004-anshi", "title": "天宝十四载，长安城里没人相信会打仗", "subtitle": "安史之乱前的十年，一场被所有人低估的危机", "era": "隋唐", "tags": ["隋唐", "安史之乱", "藩镇", "长安"], "date": "2026-11-25", "track": "", "order": 99, "html": "<h2>一、那年冬天，长安下了场雪</h2>\n<p>天宝十四载十一月初九，范阳节度使安禄山起兵，十五万人，号称二十万，以\"奉密诏讨杨国忠\"为名南下。</p>\n<p>消息传到长安，是几天之后。</p>\n<p>《资治通鉴》记了当时朝廷的反应，写得很简短。玄宗起初不信，说这是厌恶安禄山的人在造谣。后来消息越来越确凿，他才召集宰相商议。</p>\n<p>而在这之前，几乎没有人认为安禄山会反。</p>\n<h2>二、他为什么会坐到那个位置上</h2>\n<p>安禄山是胡人，父系是康国粟特人，母系是突厥人。他早年在幽州做互市牙郎，也就是在边境市场上做中间人，会六种蕃语。</p>\n<p>这个出身很重要。唐代的东北边境，是胡汉杂处的地方。会说话、能办事、两边都吃得开的人，最容易往上走。</p>\n<p>他靠军功升迁，也靠另一样东西：<strong>在皇帝面前的表现</strong>。</p>\n<p>史书写他\"外若痴直，内实狡黠\"。他体重三百多斤，进京时在玄宗面前跳胡旋舞，转得飞快。他认杨贵妃做母亲——他比杨贵妃大十几岁。每次入朝，先拜贵妃，再拜皇帝；玄宗问他为什么，他说胡人先母而后父。</p>\n<p>这些事看起来很荒唐，但很有效。天宝年间，玄宗对他几乎不设防。</p>\n<h2>三、他手里的三镇</h2>\n<p>到天宝十载，安禄山已经身兼平卢、范阳、河东三镇节度使。</p>\n<p>节度使这个职位，本意是边防。唐代在边境设十节度，各管一段防线。问题是，一个节度使掌的不只是兵。他还掌财权——可以自己收税、自己征粮；掌行政权——可以自己任免属官；掌监察权——可以自己处置部下。</p>\n<p>三镇加起来，兵力接近二十万，占当时全国边兵的近一半。</p>\n<p>陈寅恪讨论过这个格局：中央的兵力在内地，精锐在边镇；边镇越强，中央越依赖边镇；而边镇又离中央越来越远。</p>\n<p>仇鹿鸣后来的研究补了一层：这种格局不只是军事问题，也是政治问题。边镇形成了一个相对独立的权力网络，其中的将领、幕僚、商人都跟节度使绑在一起。</p>\n<h2>四、长安知道的，和不知道的</h2>\n<p>玄宗不是没收到过警告。</p>\n<p>杨国忠多次说安禄山必反。太子也说过。有人上奏说安禄山私养战马、储备军械，玄宗派人去看，回来的人报\"无他\"。</p>\n<p>还有一个细节。天宝十三载，玄宗想召安禄山入朝，试探他。安禄山来了。来了之后，玄宗就更放心了——他都敢来，怎么会反？</p>\n<p>这个逻辑在当时并不算错。只是安禄山来的时候，把所有能见到的信息都处理得很好。</p>\n<p>事情的转折在杨国忠。他为了逼安禄山反，做了几件事：查抄安禄山在长安的宅第，杀了他的女婿，还上奏说安禄山必反，请朝廷先动手。</p>\n<p><strong>把一个人逼反，然后证明自己说对了。</strong> 这在政治上很常见，代价通常由整个国家付。</p>\n<h2>五、兵到洛阳的时候</h2>\n<p>起兵之后，一个月内，安禄山渡过黄河，攻下陈留、荥阳，进逼洛阳。</p>\n<p>唐军不是没有兵。封常清在洛阳募兵六万，但都是临时招募的市井之人，没受过训练。高仙芝退守陕郡，又退到潼关。</p>\n<p>玄宗听信宦官边令诚的话，把封常清、高仙芝一起杀了。</p>\n<p>潼关是长安的门户。守将换成哥舒翰，二十万兵，据险而守。哥舒翰主张坚守不出，拖住叛军。玄宗和杨国忠却一再催他出战。</p>\n<p>天宝十五载六月，哥舒翰被迫出关，在灵宝西原中伏，二十万人几乎全军覆没。潼关失守。</p>\n<h2>六、那天早上，长安的街上</h2>\n<p>六月十三日，天还没亮，玄宗带着杨贵妃、皇子皇孙、少数亲信，从延秋门出了长安，向西走。</p>\n<p>第二天早上，百官照常上朝，到了宫门外，发现宫门开着，里面没有人。</p>\n<p>《资治通鉴》写的是：\"百官犹未知，至是，犹有入朝者，见宫门洞开，内人乱出，乃惊散。\"</p>\n<p>当天，长安城里有人抢了国库。几天后，安禄山的军队进城。</p>\n<h2>七、为什么没人相信</h2>\n<p>回过头看，这场动乱有太多信号：三镇合一、边兵过重、杨国忠与安禄山的私怨、朝廷一再拒绝报警。</p>\n<p>为什么这些信号都没起作用？</p>\n<p>第一层，是信息的过滤。皇帝听到的都是经过筛选的，说安禄山反的人被当成构陷，说安禄山忠的人被当成可靠。</p>\n<p>第二层，是玄宗本人的状态。他在位四十多年，前期开明，后期倦怠。天宝年间，他把政事交给李林甫、杨国忠，自己在宫里研究音律。《霓裳羽衣曲》就作于这个时期。</p>\n<p>第三层，是结构。藩镇制度本身让边将获得了他不该有的资源，而中央又没有能力收回。制度一旦成形，个人的警觉也就有限了。</p>\n<p>蒲立本在一本小书里说过一句话，大意是：安禄山之乱不是某个人的野心造成的，而是唐代边防体制运作到某个阶段的自然结果。</p>\n<h2>八、后来的事</h2>\n<p>安史之乱打了整整八年。</p>\n<p>唐朝没有亡，但它再也没能回到战前的样子。藩镇割据、财政重心南移、府兵制彻底瓦解，这些变化都从这八年开始。</p>\n<p>长安还在，宫城还在，但那个\"天宝\"的盛世，是在那年冬天结束的。</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>司马光：《资治通鉴》卷二一七，天宝十四载。</li>\n<li>蒲立本（Edwin G. Pulleyblank）：《安禄山叛乱的背景》，1955 年。</li>\n<li>仇鹿鸣：《长安与河北之间：中晚唐的政治与文化》，北京师范大学出版社，2018 年。</li>\n<li>张国刚：《唐代藩镇研究》，中国人民大学出版社，2010 年。</li>\n<li>陈寅恪：《唐代政治史述论稿》，上海古籍出版社。</li>\n</ol>", "text": "一、那年冬天，长安下了场雪\n天宝十四载十一月初九，范阳节度使安禄山起兵，十五万人，号称二十万，以\"奉密诏讨杨国忠\"为名南下。\n消息传到长安，是几天之后。\n《资治通鉴》记了当时朝廷的反应，写得很简短。玄宗起初不信，说这是厌恶安禄山的人在造谣。后来消息越来越确凿，他才召集宰相商议。\n而在这之前，几乎没有人认为安禄山会反。\n二、他为什么会坐到那个位置上\n安禄山是胡人，父系是康国粟特人，母系是突厥人。他早年在幽州做互市牙郎，也就是在边境市场上做中间人，会六种蕃语。\n这个出身很重要。唐代的东北边境，是胡汉杂处的地方。会说话、能办事、两边都吃得开的人，最容易往上走。\n他靠军功升迁，也靠另一样东西：在皇帝面前的表现。\n史书写他\"外若痴直，内实狡黠\"。他体重三百多斤，进京时在玄宗面前跳胡旋舞，转得飞快。他认杨贵妃做母亲——他比杨贵妃大十几岁。每次入朝，先拜贵妃，再拜皇帝；玄宗问他为什么，他说胡人先母而后父。\n这些事看起来很荒唐，但很有效。天宝年间，玄宗对他几乎不设防。\n三、他手里的三镇\n到天宝十载，安禄山已经身兼平卢、范阳、河东三镇节度使。\n节度使这个职位，本意是边防。唐代在边境设十节度，各管一段防线。问题是，一个节度使掌的不只是兵。他还掌财权——可以自己收税、自己征粮；掌行政权——可以自己任免属官；掌监察权——可以自己处置部下。\n三镇加起来，兵力接近二十万，占当时全国边兵的近一半。\n陈寅恪讨论过这个格局：中央的兵力在内地，精锐在边镇；边镇越强，中央越依赖边镇；而边镇又离中央越来越远。\n仇鹿鸣后来的研究补了一层：这种格局不只是军事问题，也是政治问题。边镇形成了一个相对独立的权力网络，其中的将领、幕僚、商人都跟节度使绑在一起。\n四、长安知道的，和不知道的\n玄宗不是没收到过警告。\n杨国忠多次说安禄山必反。太子也说过。有人上奏说安禄山私养战马、储备军械，玄宗派人去看，回来的人报\"无他\"。\n还有一个细节。天宝十三载，玄宗想召安禄山入朝，试探他。安禄山来了。来了之后，玄宗就更放心了——他都敢来，怎么会反？\n这个逻辑在当时并不算错。只是安禄山来的时候，把所有能见到的信息都处理得很好。\n事情的转折在杨国忠。他为了逼安禄山反，做了几件事：查抄安禄山在长安的宅第，杀了他的女婿，还上奏说安禄山必反，请朝廷先动手。\n把一个人逼反，然后证明自己说对了。 这在政治上很常见，代价通常由整个国家付。\n五、兵到洛阳的时候\n起兵之后，一个月内，安禄山渡过黄河，攻下陈留、荥阳，进逼洛阳。\n唐军不是没有兵。封常清在洛阳募兵六万，但都是临时 <script>
/* ==========================================================================
   卡片 · 逻辑
   数据从 window.__THEMES__ 读（build.py 注入）。
   ========================================================================== */

/* ---------- 配置 ---------- */
const CONFIG = {
  decay: 0.3,        // 看过一次后的权重倍数
  floor: 0.03,       // 权重下限，避免老卡片彻底不出现
  recent: 8,         // 最近抽过的若干张不重复
  threshold: 55,     // 滑动多少像素算翻页
  axisLock: 8        // 手势方向判定阈值
};

const KEY_THEME = 'cards.theme.v1';

/* ---------- 状态 ---------- */
let theme = null;
let pool = [];
let seen = {};
let history = [];
let curIdx = -1;

const stage = document.getElementById('stage');
const sheet = document.getElementById('sheet');
const themeList = document.getElementById('themeList');

/* ---------- 主题拼装 ---------- */
// 「全部」这类主题只存来源列表，启动时在内存里拼一次，避免页面里存重复数据
function hydrateThemes() {
  const byId = {};
  // 先把真实主题的卡片收起来
  window.__THEMES__.forEach(t => { if (t.cards) byId[t.id] = t.cards; });
  // 再给「全部」这类主题拼出完整的卡片数组
  window.__THEMES__.forEach(t => {
    if ((!t.cards || !t.cards.length) && t.parts) {
      const merged = [];
      t.parts.forEach(id => {
        const src = byId[id];
        if (src) for (let i = 0; i < src.length; i++) merged.push(src[i]);
      });
      t.cards = merged;
    }
  });
  // 兜底：任何主题都没有卡片时，退回第一个有卡片的主题
  if (!window.__THEMES__.some(t => t.cards && t.cards.length && t.id !== 'all')) {
    console.error('没有可用的卡片数据');
  }
}
hydrateThemes();

/* ---------- 存储 ---------- */
function seenKey() {
  // 带上内容版本号：卡片内容一变，旧的阅读记录自动作废
  return 'cards.seen.' + theme.id + '.' + (window.__VERSION__ || 'v1');
}

function loadSeen() {
  try {
    const raw = JSON.parse(localStorage.getItem(seenKey()) || '{}');
    if (!raw || typeof raw !== 'object') return {};
    // 卡片数量变化后，越界的旧索引会污染统计，这里直接丢掉
    const clean = {};
    for (const k in raw) {
      const i = Number(k);
      if (Number.isInteger(i) && i >= 0 && i < pool.length) clean[i] = raw[k];
    }
    return clean;
  } catch (e) { return {}; }
}

function saveSeen() {
  try { localStorage.setItem(seenKey(), JSON.stringify(seen)); } catch (e) {}
}

/* ---------- 权重抽取 ---------- */
function weightOf(i) {
  const n = Number(seen[i]) || 0;
  if (!n) return 1;
  return Math.max(CONFIG.floor, Math.pow(CONFIG.decay, n));
}

function pick(exclude) {
  exclude = exclude || [];
  let total = 0;
  const weights = [];
  for (let i = 0; i < pool.length; i++) {
    const w = exclude.indexOf(i) >= 0 ? 0 : weightOf(i);
    weights.push(w);
    total += w;
  }
  if (total <= 0) {
    // 全部看过了：均匀随机，但尽量避开刚看过的
    const avail = [];
    for (let i = 0; i < pool.length; i++) if (exclude.indexOf(i) < 0) avail.push(i);
    const src = avail.length ? avail : Array.from({ length: pool.length }, (_, i) => i);
    return src[Math.floor(Math.random() * src.length)];
  }
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return pool.length - 1;
}

/* ---------- 顶部信息 ---------- */
function seenCount() {
  let n = 0;
  for (const k in seen) {
    // 只统计当前池子范围内的索引（卡片内容换过之后，旧记录会越界）
    const i = Number(k);
    if (seen[k] > 0 && i >= 0 && i < pool.length) n++;
  }
  return n;
}

function updateHeader() {
  document.getElementById('themeName').textContent = theme.name;
}

/* ---------- 渲染 ---------- */
function place(el, offsetY, scale, opacity) {
  el.style.transform = 'translate3d(0, calc(-50% + ' + offsetY + 'px), 0) scale(' + scale + ')';
  el.style.opacity = String(opacity);
}

function markSeen(i) {
  seen[i] = (seen[i] || 0) + 1;
  saveSeen();
  updateHeader();
}

/** 把卡片内容刷成第 i 张（复用同一个元素） */
function fillCard(el, i) {
  const c = pool[i];
  el.innerHTML = '<div class="era"></div><h2></h2><p></p><div class="think"></div>';

  const era = el.querySelector('.era');
  if (c.e) era.textContent = c.e; else era.remove();

  el.querySelector('h2').textContent = c.t;
  el.querySelector('p').innerHTML = markTerms(c.b, c.terms);
  bindTerms(el);

  const think = el.querySelector('.think');
  if (c.x) think.textContent = c.x; else think.remove();

  el.dataset.i = i;
  curIdx = i;
  markSeen(i);
}

/**
 * 换卡：总是「当面这一张原地换内容」，不做双卡叠层动画。
 * 上下滑动时卡片跟手移动，松手后归位；成功翻页就用新内容复位。
 * 这样无论多快连滑，都不会出现卡片飞出后没有新卡接管、或者透明度停在 0。
 */
function render(i, fromDir) {
  if (!pool.length) return;
  i = Math.max(0, Math.min(i, pool.length - 1));

  const dir = fromDir || 0;
  resetGestures();

  // 清掉多余卡片，只留一张
  const cards = stage.querySelectorAll('.card');
  for (let k = 1; k < cards.length; k++) cards[k].remove();

  let el = cards[0];
  if (!el) {
    el = document.createElement('div');
    el.className = 'card';
    stage.appendChild(el);
  }

  fillCard(el, i);
  bindSwipe(el);

  // 新内容从滑动来的方向轻轻归位
  el.style.transition = 'none';
  place(el, dir === 0 ? 0 : -(dir * 26), 1, 1);

  requestAnimationFrame(() => {
    el.style.transition = '';
    place(el, 0, 1, 1);
  });
}

function next() {
  // 只记最近几张用于去重，不再支持回看
  history.push(curIdx);
  if (history.length > CONFIG.recent + 2) history.shift();
  const recent = history.slice(-CONFIG.recent).filter(x => x >= 0);
  render(pick(recent), 1);
}

/* ---------- 换卡 ---------- */
// 只靠底部的按钮切下一张，卡片不再跟手滑动

function bindSwipe(el) {
  // 预留：当前版本不绑定滑动手势
}

function resetGestures() {}

/** 轻触反馈（iOS 支持时） */
function haptic(ms) {
  try {
    if (navigator.vibrate) navigator.vibrate(ms || 8);
  } catch (e) {}
}

/** 点按钮：切到下一张 */
function nextCard() {
  hidePop();
  haptic(8);
  const el = stage.querySelector('.card');

  if (!el) {
    render(pick([]), 0);
    return;
  }

  // 轻轻往上一推，然后换内容
  el.style.transition = '';
  el.style.transform = 'translate3d(0, calc(-50% - 40px), 0)';
  el.style.opacity = '0';

  setTimeout(() => {
    next();
  }, 130);
}

/* ---------- 键盘 ---------- */
window.addEventListener('keydown', e => {
  if (sheet.classList.contains('on')) {
    if (e.key === 'Escape') closeSheet();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    nextCard();
  }
});

/* ---------- 词条 ---------- */
const GLOSSARY = window.__GLOSSARY__ || {};
let activePop = null;
let activeTerm = null;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/**
 * 正文里的词条包成 <span class="term">。
 * 同一张卡里同一个词只标第一次出现；优先匹配长词。
 */
function markTerms(text, allowed) {
  if (!text) return '';
  let keys = Object.keys(GLOSSARY);
  if (allowed && allowed.length) keys = keys.filter(k => allowed.indexOf(k) >= 0);
  keys.sort((a, b) => b.length - a.length);
  if (!keys.length) return escapeHtml(text);

  const used = [];
  let out = '', i = 0;
  while (i < text.length) {
    let hit = null;
    for (const k of keys) {
      if (text.startsWith(k, i) && used.indexOf(k) < 0) { hit = k; break; }
    }
    if (hit) {
      used.push(hit);
      out += '<span class="term" data-term="' + escapeHtml(hit) + '">' + escapeHtml(hit) + '</span>';
      i += hit.length;
    } else {
      out += escapeHtml(text[i]);
      i++;
    }
  }
  return out;
}

function ensurePop() {
  if (activePop) return activePop;
  activePop = document.createElement('div');
  activePop.id = 'pop';
  document.body.appendChild(activePop);
  return activePop;
}

function hidePop() {
  if (activePop) activePop.classList.remove('on');
  activeTerm = null;
}

function showPop(term, anchor) {
  const def = GLOSSARY[term];
  if (!def) return;
  const pop = ensurePop();
  pop.innerHTML = '<b>' + escapeHtml(term) + '</b>' + escapeHtml(def);

  const r = anchor.getBoundingClientRect();
  const pad = 12;
  pop.style.visibility = 'hidden';
  pop.classList.add('on');

  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(pad, Math.min(left, window.innerWidth - pw - pad));

  const above = r.top - ph - 12;
  let top;
  if (above >= pad + 8) {
    top = above;
    pop.classList.remove('below');
    pop.classList.add('above');
  } else {
    top = r.bottom + 12;
    pop.classList.remove('above');
    pop.classList.add('below');
  }

  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.setProperty('--arrow-x', Math.max(14, Math.min(pw - 14, r.left + r.width / 2 - left)) + 'px');
  pop.style.visibility = '';
  activeTerm = term;
}

function bindTerms(el) {
  el.querySelectorAll('.term').forEach(t => {
    t.addEventListener('click', e => {
      e.stopPropagation();
      const term = t.dataset.term;
      if (activeTerm === term && activePop && activePop.classList.contains('on')) hidePop();
      else showPop(term, t);
    });
  });
}

document.addEventListener('touchstart', e => {
  if (e.target.closest && e.target.closest('.term')) return;
  hidePop();
}, { passive: true });
document.addEventListener('mousedown', e => {
  if (e.target.closest && e.target.closest('.term')) return;
  hidePop();
});
window.addEventListener('resize', hidePop);

/* ---------- 主题选择 ---------- */
function renderThemeList() {
  themeList.innerHTML = '';
  window.__THEMES__.forEach(t => {
    const b = document.createElement('button');
    b.className = 'titem' + (t.id === theme.id ? ' now' : '');
    b.innerHTML =
      '<div><span>' + t.name + '</span><small>' + t.desc.replace(t.name, '').replace(/^\s*·?\s*/, '') + '</small></div>' +
      '<span class="dot">●</span>';
    b.onclick = () => switchTheme(t.id);
    themeList.appendChild(b);
  });
}

function openSheet() {
  renderThemeList();
  sheet.classList.add('on');
}

function closeSheet() {
  sheet.classList.remove('on');
}

function switchTheme(id) {
  theme = window.__THEMES__.find(t => t.id === id) || window.__THEMES__[0];
  try { localStorage.setItem(KEY_THEME, theme.id); } catch (e) {}
  pool = theme.cards;
  seen = loadSeen();
  history = [];
  closeSheet();
  updateHeader();
  render(pick([]), 0);
}

document.getElementById('themeBtn').onclick = openSheet;
document.getElementById('nextBtn').onclick = nextCard;
document.getElementById('closeSheet').onclick = closeSheet;
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

/* ---------- 启动 ---------- */
(function init() {
  const saved = localStorage.getItem(KEY_THEME);
  theme = window.__THEMES__.find(t => t.id === saved) || window.__THEMES__[0];
  pool = theme.cards;
  seen = loadSeen();

  // 只有一个主题时，隐藏切换按钮
  if (window.__THEMES__.length < 2) {
    document.getElementById('themeBtn').style.display = 'none';
  }
  const seenEl = document.getElementById('seen');
  if (seenEl) seenEl.remove();

  updateHeader();
  render(pick([]), 0);
})();

</script>
<script>
/* ===== Tab 切换 ===== */
(function () {
  const LS = 'app.tab.v1';
  const panels = { cards: document.getElementById('panel-cards'), articles: document.getElementById('panel-articles') };
  const tabs = document.querySelectorAll('#tabbar .tab');

  function show(name, save) {
    if (!panels[name]) name = 'cards';
    Object.keys(panels).forEach(k => panels[k].classList.toggle('on', k === name));
    tabs.forEach(t => t.classList.toggle('on', t.dataset.tab === name));
    document.body.classList.toggle('in-articles', name === 'articles');
    if (save !== false) { try { localStorage.setItem(LS, name); } catch (e) {} }
    window.scrollTo(0, 0);
  }

  tabs.forEach(t => { t.onclick = () => show(t.dataset.tab); });

  let saved = 'cards';
  try { saved = localStorage.getItem(LS) || 'cards'; } catch (e) {}
  // 如果链接里带文章锚点，直接进史论
  if (location.hash && location.hash.length > 1) saved = 'articles';
  show(saved, false);

  window.__showTab = show;
})();

/* ==========================================================================
   历史文章集 · 逻辑
   列表 + 阅读页 + 全局搜索
   ========================================================================== */

const ARTS = window.__ARTICLES__ || [];
const LS_READ = 'articles.read.v1';

const listEl = document.getElementById('list');
const readerEl = document.getElementById('reader');
const qEl = document.getElementById('q');
const clearBtn = document.getElementById('clearBtn');
const backBtn = document.getElementById('backBtn');
const progressEl = document.getElementById('progress');

let currentId = null;

/* ---------- 已读记录 ---------- */
function readSet() {
  try {
    const a = JSON.parse(localStorage.getItem(LS_READ) || '[]');
    return new Set(Array.isArray(a) ? a : []);
  } catch (e) { return new Set(); }
}
function markRead(id) {
  const s = readSet();
  s.add(id);
  try { localStorage.setItem(LS_READ, JSON.stringify([...s])); } catch (e) {}
}

/* ---------- 高亮 ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function highlight(text, terms) {
  let out = esc(text);
  if (!terms.length) return out;
  terms.forEach(t => {
    if (!t) return;
    const safe = esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(safe, 'gi'), m => '<mark>' + m + '</mark>');
  });
  return out;
}

/* ---------- 搜索 ---------- */
function tokenize(q) {
  return q.trim().toLowerCase().split(/\s+/).filter(Boolean);
}

/** 在正文里取包含关键词的一小段 */
function snippet(a, terms) {
  if (!terms.length) return '';
  const lower = a.text.toLowerCase();
  let idx = -1;
  for (const t of terms) {
    idx = lower.indexOf(t);
    if (idx >= 0) break;
  }
  if (idx < 0) return '';
  const start = Math.max(0, idx - 34);
  const end = Math.min(a.text.length, idx + 80);
  return (start > 0 ? '…' : '') + a.text.slice(start, end) + (end < a.text.length ? '…' : '');
}

function score(a, terms) {
  if (!terms.length) return 1;
  const title = a.title.toLowerCase();
  const sub = a.subtitle.toLowerCase();
  const tags = a.tags.join(' ').toLowerCase();
  const era = a.era.toLowerCase();
  const text = a.text.toLowerCase();
  let s = 0;
  for (const t of terms) {
    let hit = 0;
    if (title.includes(t)) hit += 10;
    if (sub.includes(t)) hit += 5;
    if (tags.includes(t)) hit += 6;
    if (era.includes(t)) hit += 5;
    if (text.includes(t)) hit += 1;
    if (!hit) return 0; // 所有词都要出现
    s += hit;
  }
  return s;
}

/* ---------- 列表渲染 ---------- */
function renderList() {
  const terms = tokenize(qEl.value);
  const read = readSet();

  const items = ARTS
    .map(a => ({ a, s: score(a, terms) }))
    .filter(x => x.a.track !== '导航')
    .filter(x => x.s > 0)
    .sort((x, y) => (terms.length ? y.s - x.s : 0) || (y.a.date > x.a.date ? 1 : -1));

  if (!items.length) {
    listEl.innerHTML = '<div class="empty">没有找到相关文章<br>试试换个词，比如「叫魂」「官僚」「鸦片」</div>';
    return;
  }

  const nav = ARTS.find(x => x.track === '导航');
  const navCard = (nav && !terms.length) ? `<button class="art nav-card" data-id="${nav.id}">
      <div class="meta"><span>从这里开始</span></div>
      <h2>${esc(nav.title)}</h2>
      <p class="sub">${esc(nav.subtitle)}</p>
    </button>` : '';

  listEl.innerHTML = navCard + items.map(({ a }) => {
    const snip = snippet(a, terms);
    return `<button class="art" data-id="${a.id}">
      <div class="meta">
        <span>${highlight(a.era, terms)}</span>
        <span class="sep">·</span>
        <span>${a.words} 字</span>
        ${read.has(a.id) ? '<span class="sep">·</span><span>已读</span>' : ''}
      </div>
      <h2>${highlight(a.title, terms)}</h2>
      ${a.subtitle ? `<p class="sub">${highlight(a.subtitle, terms)}</p>` : ''}
      ${snip ? `<p class="snippet">${highlight(snip, terms)}</p>` : ''}
      <div class="tags">${a.tags.map(t => `<span class="tag">${highlight(t, terms)}</span>`).join('')}</div>
    </button>`;
  }).join('');

  listEl.querySelectorAll('.art').forEach(btn => {
    btn.onclick = () => openArticle(btn.dataset.id);
  });
}

/* ---------- 阅读页 ---------- */
function openArticle(id) {
  const a = ARTS.find(x => x.id === id);
  if (!a) return;
  currentId = id;

  readerEl.innerHTML = `
    <div class="era">${esc(a.era)}</div>
    <h1>${esc(a.title)}</h1>
    ${a.subtitle ? `<p class="lede">${esc(a.subtitle)}</p>` : ''}
    <div class="body">${a.html}</div>
    <div class="reading-meta">${a.words} 字 · ${a.tags.map(t => '#' + t).join(' ')}</div>
  `;

  // 文内链接：跳到对应文章
  readerEl.querySelectorAll('a[data-article]').forEach(link => {
    link.onclick = e => {
      e.preventDefault();
      openArticle(link.dataset.article);
    };
  });

  document.body.classList.add('reading');
  window.scrollTo(0, 0);
  markRead(id);
  history.pushState({ id }, '', '#' + id);
  updateProgress();
}

function closeArticle(fromPop) {
  document.body.classList.remove('reading');
  readerEl.innerHTML = '';
  currentId = null;
  progressEl.style.width = '0';
  renderList();
  if (!fromPop) {
    history.pushState({}, '', location.pathname + location.search);
  }
  window.scrollTo(0, 0);
}

backBtn.onclick = () => {
  if (history.state && history.state.id) history.back();
  else closeArticle();
};

window.addEventListener('popstate', e => {
  if (e.state && e.state.id) openArticle(e.state.id);
  else if (document.body.classList.contains('reading')) closeArticle(true);
});

/* ---------- 阅读进度 ---------- */
function updateProgress() {
  if (!document.body.classList.contains('reading')) return;
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? Math.min(1, window.scrollY / h) : 0;
  progressEl.style.width = (p * 100) + '%';
}
window.addEventListener('scroll', updateProgress, { passive: true });

/* ---------- 搜索交互 ---------- */
let t = null;
qEl.addEventListener('input', () => {
  clearBtn.classList.toggle('on', !!qEl.value);
  clearTimeout(t);
  t = setTimeout(renderList, 90);
});
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const first = listEl.querySelector('.art');
    if (first) openArticle(first.dataset.id);
    qEl.blur();
  }
});
clearBtn.onclick = () => {
  qEl.value = '';
  clearBtn.classList.remove('on');
  renderList();
  qEl.focus();
};

// 在阅读页里输入则先返回列表
qEl.addEventListener('focus', () => {
  if (document.body.classList.contains('reading')) closeArticle();
});

/* ---------- 启动 ---------- */
(function init() {
  renderList();
  const hash = decodeURIComponent(location.hash.replace('#', ''));
  if (hash && ARTS.some(a => a.id === hash)) {
    openArticle(hash);
  } else {
    history.replaceState({}, '', location.pathname + location.search);
  }
})();

</script>
