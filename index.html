<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卡片">
<meta name="theme-color" content="#0f0e0c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f0e0c'/%3E%3Crect x='30' y='38' width='120' height='104' rx='12' fill='none' stroke='%23d9bf8a' stroke-width='5'/%3E%3Cpath d='M52 66h76M52 86h76M52 106h48' stroke='%23d9bf8a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>卡片</title>
<style>
/* ==========================================================================
   卡片 · 样式
   改配色改最上面的变量就行，下面的规则基本不用动。
   ========================================================================== */

:root {
  /* 底色与层次 */
  --bg: #0f0e0c;
  --card-a: #221e1a;          /* 卡片渐变的起点 */
  --card-b: #16130f;          /* 卡片渐变的终点 */
  --line: rgba(217, 191, 138, .14);

  /* 文字 */
  --fg: #f2ebdf;              /* 标题 */
  --fg-body: #c2b8aa;         /* 正文 */
  --fg-dim: #8c8175;          /* 时代标签 */
  --fg-faint: #5b544b;        /* 底部提示 */
  --accent: #d9bf8a;          /* 强调色：多想一层、主题名 */

  /* 形状 */
  --radius: 24px;
  --card-w: min(87vw, 430px);

  /* 动效 */
  --ease: cubic-bezier(.22, .9, .3, 1);
  --dur: .36s;

  /* 字号 */
  --t-title: clamp(20px, 5.4vw, 25px);
  --t-body: clamp(14.5px, 4vw, 16px);
  --t-think: clamp(13px, 3.6vw, 14px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

/* ---------- 页面骨架 ---------- */
#deck {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 8px);
}

header {
  flex: 0 0 auto;
  padding: 0 24px 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

#themeBtn {
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: .06em;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
#themeBtn i {
  font-style: normal;
  font-size: 10px;
  opacity: .55;
  transform: translateY(-1px);
}

#seen {
  font-size: 12px;
  letter-spacing: .06em;
  color: #7a7166;
}
#seen b {
  color: var(--accent);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

#stage {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
}

footer {
  flex: 0 0 auto;
  padding: 14px 24px 0;
  text-align: center;
  font-size: 11.5px;
  color: var(--fg-faint);
  letter-spacing: .08em;
}

/* ---------- 卡片 ---------- */
.card {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--card-w);
  margin-left: calc(var(--card-w) / -2);
  transform: translate3d(0, -50%, 0);

  border-radius: var(--radius);
  padding: 32px 26px 30px;
  background: linear-gradient(165deg, var(--card-a), var(--card-b) 70%);
  box-shadow: 0 20px 50px -22px #000, 0 0 0 1px rgba(255, 255, 255, .055) inset;

  transition: transform var(--dur) var(--ease), opacity var(--dur) ease;
  will-change: transform, opacity;
  touch-action: pan-y;

  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: min(46vh, 360px);
  max-height: 74vh;
  overflow: hidden;
}

/* 卡片顶部的一层暖光 */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  pointer-events: none;
  background: radial-gradient(130% 80% at 50% -10%, rgba(217, 191, 138, .075), transparent 62%);
}

.era {
  font-size: 11px;
  letter-spacing: .16em;
  color: var(--fg-dim);
  margin-bottom: 14px;
}

.card h2 {
  font-size: var(--t-title);
  margin: 0 0 14px;
  line-height: 1.42;
  font-weight: 600;
  color: var(--fg);
}

.card p {
  margin: 0;
  font-size: var(--t-body);
  line-height: 1.88;
  color: var(--fg-body);
}

.think {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: var(--t-think);
  line-height: 1.8;
  color: var(--accent);
  opacity: .9;
}
.think::before {
  content: "多想一层 · ";
  color: #8c7a55;
  letter-spacing: .04em;
  font-size: 11px;
}

/* ---------- 主题选择 ---------- */
#sheet {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  background: rgba(8, 7, 6, .9);
  backdrop-filter: blur(10px);
  padding: calc(env(safe-area-inset-top) + 46px) 22px calc(env(safe-area-inset-bottom) + 24px);
  overflow-y: auto;
}
#sheet.on { display: block; }

#sheet h3 {
  margin: 0 0 16px;
  padding-left: 4px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .16em;
  color: #7a7166;
}

.titem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 15px 18px;
  margin-bottom: 10px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  background: #1b1815;
  color: var(--fg);
  font-family: inherit;
  font-size: 16px;
  text-align: left;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .05) inset;
  transition: box-shadow .2s;
}
.titem small {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  color: #7a7166;
  letter-spacing: .04em;
  font-weight: 400;
}
.titem.now { box-shadow: 0 0 0 1px rgba(217, 191, 138, .45) inset; }
.titem .dot { opacity: 0; color: var(--accent); font-size: 9px; }
.titem.now .dot { opacity: 1; }

#closeSheet {
  margin-top: 6px;
  width: 100%;
  padding: 15px;
  border-radius: 16px;
  border: none;
  background: transparent;
  color: #6d6459;
  font-family: inherit;
  font-size: 14px;
}

</style>
</head>
<body>

<div id="deck">
  <header>
    <button id="themeBtn"><span id="themeName"></span><i>⌄</i></button>
    <span id="seen"></span>
  </header>
  <div id="stage"></div>
  <footer>左滑下一张 · 右滑上一张</footer>
</div>

<div id="sheet">
  <h3>选择主题</h3>
  <div id="themeList"></div>
  <button id="closeSheet">关闭</button>
</div>

<script>
window.__THEMES__ = [{"id": "history", "name": "历史", "desc": "三皇五帝到民国 · 180 张", "cards": [{"e": "上古", "t": "三皇五帝不是宗教神话，而是记忆的压缩", "b": "三皇五帝常被当作神话，但考古发现仰韶、龙山时期的聚落规模和水利工程，需要跨部落协作。这些名字可能是把几代人共同完成的事迹压缩到少数祖先身上，用故事传承。", "x": "没有文字的社会，只能用人物故事保存制度经验。"}, {"e": "夏商", "t": "二里头：夏朝到底存不存在", "b": "河南偃师的二里头遗址有宫殿、青铜作坊和规划道路，时间约在公元前 1800 年，很多学者认为就是夏的都城。但没有发现能自证的文字，所以“夏”到底叫不叫夏，仍有争议。", "x": "考古能给实物，文字能给名字，两者不总对得上。"}, {"e": "商", "t": "甲骨文是写给神看的，不是给人看的", "b": "商王占卜后把结果刻在龟甲和牛骨上，记录的是“问雨、问战、问病”。这些文字不是档案，而是与神沟通的凭据，所以刻意保存。我们今天读到的商朝，其实是商王对神说的话。", "x": "留存下来的史料，往往是一次沟通的副产品。"}, {"e": "商", "t": "商朝的灭国不是因为纣王酒池肉林", "b": "牧野之战商军大批倒戈，核心原因是商朝长期征东夷，主力在外，都城空虚，加上盟国离心。纣王的个人品行更多是周人战后写史的叙事需要。", "x": "胜利者写的史书，把制度失败写成了道德失败。"}, {"e": "西周", "t": "分封制是一种成本极低的管理方式", "b": "西周把王族功臣分到各地建立诸侯国，规定他们守边、纳贡、随王出征。中央不用养官员，只需维持宗法和礼乐，代价是诸侯一旦做强就收不回来。", "x": "用血缘分权能省钱，但省不掉日后的战争。"}, {"e": "西周", "t": "礼乐不是繁文缛节，是一套行为操作系统", "b": "周礼规定不同等级的人怎么吃饭、坐车、下葬，这套规则让人从行为上习惯尊卑。春秋时“礼崩乐坏”指的不是人没礼貌，而是这套约束力失效了，社会开始按照实力排序。", "x": "制度崩解从仪式失效开始，因为仪式先撑不住共识。"}, {"e": "商周", "t": "青铜器的用途主要是祭祀，不是打仗", "b": "青铜是商周最贵重的材料，却大量做成鼎、簋、爵用于祭祀，武器并不占多数。谁掌握青铜和祭祀，谁就掌握与祖先沟通的权力。", "x": "最稀缺的资源，往往投放在合法性的再生产上。"}, {"e": "春秋", "t": "管仲的经济战：用丝绸买下一个国家", "b": "齐桓公想制衡鲁国，管仲让齐国高价收购鲁国丝绸，鲁人纷纷弃农种桑。等到农田荒废，齐国突然停止收购并禁止卖粮，鲁国只好屈服。这种打法后世反复出现。", "x": "把对手的生存方式改成单一依赖，比打败他更便宜。"}, {"e": "春秋", "t": "孔子一生没成功，他的学说靠弟子传下去", "b": "孔子做过鲁国司寇，政治失败后周游列国十四年，没人真正用他的方案。他的影响是死后由弟子整理《论语》并办学扩散，才慢慢成为主流。", "x": "思想的力量常常滞后于思想者本人。"}, {"e": "春秋战国", "t": "百家争鸣的土壤是诸侯怕输", "b": "春秋战国近百个政治实体互相竞争，每个都急需能打的方案，所以儒、墨、道、法、兵、阴阳家都有人供养。思想繁荣的直接原因是竞争压力，而不是那个时代更自由。", "x": "一旦停止竞争，思想供给会迅速收窄。"}, {"e": "战国", "t": "墨家是最早的技术型组织", "b": "墨家讲兼爱非攻，同时擅长守城器械和严密组织，成员称“墨者”，有首领“巨子”，纪律严格到可赴死。他们对技术的重视和组织的严密，在先秦诸子中独一无二。", "x": "理想主义的组织，往往也需要最硬的纪律做支撑。"}, {"e": "战国", "t": "商鞅变法真正改变的是人心里的账本", "b": "商鞅确立军功授爵、废井田、励耕战，最狠之处是让一切价值都可以用军功换算。秦国人在几十年里被改造成一部愿意为国家打仗的社会机器。", "x": "制度改造的最终目标是改掉人的偏好。"}, {"e": "战国", "t": "长平之战：四十万降卒为什么会被坑杀", "b": "秦赵长平之战，赵军粮尽投降，秦军难以供养几十万俘虏又怕其哗变，最终将其坑杀。这场战役不只是屠杀，也是补给线决定的结局。", "x": "在最紧张的资源约束下，选择往往最残酷。"}, {"e": "春秋", "t": "《孙子兵法》首先是讲不要打", "b": "《孙子》开篇即言“兵者，国之大事”，反复强调速胜、庙算、不战而屈人之兵。它讨论的重点是如何减少成本，而不是如何打得更猛。", "x": "最高级的胜利，是让战争不发生。"}, {"e": "战国", "t": "秦能统一靠的不只是军队，还有道路", "b": "秦修驰道、直道、灵渠，形成快速调动兵力和粮草的网络，配合郡县制和文书行政，效率远超六国。统一的实质是交通和行政基础设施的统一。", "x": "谁能更快传递信息和物资，谁就能更大规模地组织。"}, {"e": "秦", "t": "秦始皇焚书坑儒烧的是哪些书", "b": "焚书主要针对民间私藏的《诗》《书》和诸子书，医药、卜筮、种树等实用书不在其列。坑儒所坑多为方士术士。统一的代价之一，是消除异议被制度化。", "x": "思想统一的动作，往往伴随信息的损失。"}, {"e": "秦", "t": "秦亡于它的效率太强、缓冲太少", "b": "秦制高压高效，但民众没有发声渠道，也没有缓冲层，一旦负担超过承受线，反抗便迅速席卷。二世而亡不是因为皇帝昏庸一个原因，而是系统缺少减震装置。", "x": "没有上下通道的组织，崩溃来得更快也更彻底。"}, {"e": "秦", "t": "汉代的选择：总结秦亡教训", "b": "汉初用黄老无为、轻徭薄赋，让社会从战争后恢复。陆贾劝刘邦“逆取顺守”：造反能用法家手段，坐天下要靠仁义。这是中国第一次系统的治国反思。", "x": "能自我修正的政权，比一味强硬的政权活得久。"}, {"e": "西汉", "t": "文景之治的关键是不要乱动", "b": "文帝景帝不搞大工程、少征税、允许民间铸钱、减轻刑罚。三十年间社会财富积累，为汉武帝的扩张提供底气。休养生息不是懦弱，是给系统充能。", "x": "不动手，有时是最好的治理。"}, {"e": "西汉", "t": "推恩令：让一个封国自己碎掉", "b": "汉武帝时主父偃建议：诸侯王必须把土地分给所有子孙，而不只是长子。几代之后，大国自然碎成小侯，中央一兵不发就解决了郡国问题。", "x": "最好的方案，是让对手被迫自己瓦解。"}, {"e": "西汉", "t": "张骞出使西域的真实目的不是贸易", "b": "张骞两次出使是为了找大月氏结盟夹击匈奴，军事目的完全失败，但带回大量地理和物产信息，开启了后来丝绸之路的通道。副产品有时比主目标更重要。", "x": "长期价值往往出现在目标的边缘。"}, {"e": "西汉", "t": "汉武帝的另一面：国家的钱从哪里来", "b": "连年征战耗尽国库，武帝推行盐铁官营、均输平准、算缗告缗，向商人收重税。战争让财政手段变得激进，社会的商业活力随之萎缩。", "x": "战争先吃掉财政，再吃掉商业。"}, {"e": "新", "t": "王莽是被自己照的书办砸的", "b": "王莽摄政时声望极高，上台后强行照《周礼》复古，频繁改名改币改土地制度，社会无从执行。他不是坏人，是被理想模型和现实间的距离压垮的人。", "x": "用一本书改造一个复杂社会，几乎注定失败。"}, {"e": "东汉", "t": "光武中兴：换一套柔和的治理办法", "b": "刘秀在战乱后裁撤冗员、释放奴婢、削弱三公、强化尚书台。他把事务交给效率更高的文书系统处理，减少了贵族直接干预国家事务的空间。", "x": "把决策流放到流程里，能减少个人好恶的影响。"}, {"e": "东汉", "t": "纸的普及没让国家变强，却让文化下沉", "b": "东汉蔡伦改良造纸之后，纸张逐渐替代竹简，书籍成本下降，读书开始不只是上层特权。技术改变往往会先改变知识分布，再改变社会结构。", "x": "信息成本下降，往往伴随权力扩散。"}, {"e": "东汉", "t": "黄巾起义的根本原因是地方失控", "b": "东汉末年外戚宦官轮流乱政，地方豪族兼并土地，天灾与赋税叠加。口号“苍天已死”之所以能拉拢这么多的人，是因为当时太多人活不下去。", "x": "起义的口号总是社会的账单。"}, {"e": "三国", "t": "三国鼎立的基础是地形和粮食", "b": "曹操占中原，孙权有长江天险，刘备据四川盆地。三方的地理条件互相牵制，军事优势被地形抵消，才出现几十年均势。", "x": "在军事对抗里，地形是最稳定的因素。"}, {"e": "曹魏", "t": "九品中正制本来是改革，最后变成门阀", "b": "曹丕用中正官评定人才出身和品第，本意是纠正汉末名士评议的混乱。后来评定标准被世家主导，变成“上品无寒门”，反而固化了阶层。", "x": "设计的初衷，挡不住执行者的利益。"}, {"e": "西晋", "t": "司马氏篡魏靠的不是兵变，是时间", "b": "司马懿在高平陵之变后才实质掌权，此后几十年通过联姻、提拔亲信、掌控都督区，一步步把魏国装进自己口袋。权力转移往往不是一夜之间发生的。", "x": "真正稳固的权力，是一点一点积累出来的。"}, {"e": "西晋", "t": "八王之乱：一场自毁长城的内战", "b": "西晋把宗室分封到要地掌兵，晋惠帝暗弱，诸王为争夺中央控制权混战十六年，国家精锐尽损，才有后来的五胡乱华。", "x": "把兵权分给兄弟，往往换来兄弟相攻。"}, {"e": "东晋", "t": "永嘉之乱与衣冠南渡", "b": "西晋灭亡后，大批北方士族和百姓南迁，带来人口、技术和文化。东晋在南方重建政权，江南从此成为经济重心，中国的南北格局在这一刻成型。", "x": "大规模人口流动，常把一个失败变成另一个开端。"}, {"e": "东晋十六国", "t": "五胡乱华的另一面是族群融合", "b": "十六国到北魏，鲜卑、匈奴、羯、氐、羌先后建国并逐渐汉化，同时汉人也吸收胡俗，胡汉通婚。隋唐的开放气质多来自这几百年的融合。", "x": "混乱期积累下来的变化，往往比稳定期更多。"}, {"e": "东晋", "t": "祖逖北伐：一个人撑不起整个国家", "b": "祖逖自行招募军队、自行筹粮，收复黄河以南，但东晋朝廷担心他做大，支援始终不足，北伐无功。国家的资源调配方式，决定了前线能做到什么。", "x": "关键支持来自后方，而非前线。"}, {"e": "东晋", "t": "淝水之战：八万打赢八十万不是奇迹", "b": "前秦苻坚集结大军南征，军队由多个民族拼凑，士气不齐。东晋靠组织度和地形优势，抓住对方阵型移动时的混乱取胜。数量不是必然优势。", "x": "人数优势需要组织支持，不然容易变成负担。"}, {"e": "北魏", "t": "北魏孝文帝迁都洛阳的代价", "b": "孝文帝强制鲜卑贵族改汉姓、穿汉服、说汉话、与汉人通婚，迁都洛阳。改革极大提高了治理效率，但也使北方边镇将士被边缘化，成为后来六镇起义的火药。", "x": "改革总会有受益者，也有被落下的人。"}, {"e": "北魏", "t": "六镇之乱：被改革抛下的人的反叛", "b": "迁都后，原先守边的鲜卑军户地位骤降，待遇远不如洛阳新贵，不满积累终成叛乱。乱局中，高欢、宇文泰等人崛起，为隋唐的军事体系打下基础。", "x": "在改革中受损的群体，往往是下一轮风波的起点。"}, {"e": "南北朝", "t": "佛教东传靠的是战乱中的安慰", "b": "佛教在南北朝迅速传播，是因为社会长期动荡，人们需要解释苦难的体系。寺院提供救济、医疗、教育，也吸收了大量逃役人口。", "x": "能提供慰藉的东西，往往也能组织人。"}, {"e": "北魏", "t": "云冈、龙门石窟是政治宣传", "b": "北魏皇室开凿石窟造像，不止为了信仰，更在展示皇权与佛法的合一。巨大的造像工程同时消耗资源并凝聚人心。", "x": "最宏大的建筑，常常也承担着政治功能。"}, {"e": "北魏", "t": "《齐民要术》里写的都是活下去的办法", "b": "贾思勰记录农、林、牧、副、渔的各种技术，包括如何酿酒、如何储藏、如何救荒。它不写理想，写的是普通人家在灾年如何保住口粮。", "x": "最朴素的知识，往往最接近权力的边界。"}, {"e": "南朝", "t": "南朝四百八十寺：寺庙经済学", "b": "南朝佛教极盛，寺院占田、免税、接受布施，形成庞大的独立经济实体，甚至影响国家财政。后来北朝和唐代多次灭佛，本质上是财政动作。", "x": "宗教和财政的冲突，常常表现为信仰之争。"}, {"e": "南北朝", "t": "门阀的没落靠的是皇权和寒门", "b": "隋唐科举兴起之前，寒门通过军功或皇帝提拔进入权力核心，逐步削弱世家大族。任何统治结构的改变，常源于统治者对既有精英结构的反制。", "x": "打破既有利益结构，常是新力量的任务。"}, {"e": "隋", "t": "大运河是一条财政血管", "b": "隋炀帝修运河的直接动机是把江南粮食和物资送到北方政治中心。它让南北经济连成一体，但工程极重，压垮了当时的民力。", "x": "基础设施的价值，要过一两代人才能看清。"}, {"e": "隋", "t": "隋炀帝的问题不是昏，而是急", "b": "他修运河、建东都、三征高句丽都在十几年内完成，每件事单独看是战略，叠加起来超出当时社会的承受能力。", "x": "节奏决定成败：同一个动作，慢一步就是另一回事。"}, {"e": "唐", "t": "贞观之治的核心是问得出问题", "b": "唐太宗与魏征的君臣对话反复讨论“为什么隋亡”。他通过纳谏降低决策失误，用制度让批评有出口，实际是把秦隋的教训直接变成了治理原则。", "x": "能听到不同意见，等于给判断加了保险。"}, {"e": "唐", "t": "三省六部：一种互相检查的制度设计", "b": "中书省出主意，门下省可以驳回，尚书省执行。这使决策需经过审核才能落地，减少一人拍板的失误。制度本质是用流程约束个人。", "x": "让不同环节互相制衡，能减少决策的随意性。"}, {"e": "隋唐", "t": "科举制的真正意义是给了出路", "b": "隋唐确立科举后，平民可通过考试进入官员队伍。它并不能消灭特权，但它给社会一个可见的上升通道，使精英的精力流向读书而非造反。", "x": "一个社会是否稳定，部分取决于它有没有上升通道。"}, {"e": "唐", "t": "唐长安是一个国际城市", "b": "长安城有大量西域商人、僧侣、留学生、乐工，胡食胡乐胡服在贵族中流行。唐朝的开放建立在军事优势和丝绸之路贸易之上。", "x": "开放需要实力做基础。"}, {"e": "唐", "t": "安史之乱：节度使制度养出了割据", "b": "唐朝在边境设节度使，给了他们兵权、财权和行政权。安禄山一人兼三镇兵力，中央却无足够力量制衡。", "x": "把多个权力交给同一个角色，风险会放大。"}, {"e": "唐", "t": "安史之乱后唐朝为何还能撑一百多年", "b": "乱后唐朝依靠藩镇互相牵制、运河财赋继续供应，以及皇帝的灵活妥协维持运转。王朝的衰落往往是个长期过程。", "x": "衰落不是一次性崩塌，而是长期缓慢的滑落。"}, {"e": "唐", "t": "两税法：国家不再管你怎么赚钱", "b": "唐朝中后期税制从按人丁征收改为按财产和田亩征收，一年分夏秋两次。政府从“管人口”转向“管资产”，货币经济因此进一步扩大。", "x": "税制形态反映国家对社会的掌控方式。"}, {"e": "唐", "t": "佛骨迎奉与灭佛：唐武宗为什么动手", "b": "唐武宗灭佛，拆寺四千余所，勒令僧尼还俗，核心是寺院占田免税、吸收劳力，影响国家财政与兵源。宗教政策背后是资源争夺。", "x": "当公共资源吃紧，最先受影响的就是特权群体。"}, {"e": "唐", "t": "《唐律疏议》为什么被邻国照搬", "b": "唐律体系完整、条款清晰，附有官方解释，日本、朝鲜、越南的律法都受其影响。法律输出的前提是制度成熟和长期稳定。", "x": "能被别人借鉴的，一定是可执行的。"}, {"e": "唐", "t": "李白杜甫各自活在一个时代的两端", "b": "李白看到了盛唐的余晖和开放的浪漫，杜甫经历了安史之乱后的凋敝。文学气质的变化，往往是社会状态变化的早期信号。", "x": "文学是时代最敏感的温度计。"}, {"e": "唐", "t": "鉴真东渡是双向的文化交易", "b": "鉴真六次东渡，失败五次、失明一次，最终到达日本，传播律宗和建筑、医药。日本同时输入唐朝制度与技术，形成早期的知识流动。", "x": "真正的影响，是互相的，不是单向的。"}, {"e": "唐", "t": "武则天是怎么打破规则的", "b": "她通过科举提拔寒门、设置北门学士绕过三省、用酷吏清除反对者，也进行了社会流动性的实验。她的统治方式在短期内有效，但代价很高。", "x": "改规则的人，往往同时承担风险和代价。"}, {"e": "唐", "t": "藩镇为什么不推翻唐朝", "b": "藩镇需要朝廷给予合法性和名分，也需要彼此制衡；同时唐廷垄断着盐铁和运河带来的财源。结构上的相互依赖，让各方都没有彻底的动机掀桌。", "x": "互相依赖的关系，比单纯的实力更能维持稳定。"}, {"e": "唐末", "t": "黄巢起义跨越了半个中国", "b": "唐末饥荒与赋税加重，黄巢从山东起兵，一路攻入广州、洛阳、长安，最终推翻唐廷的实质统治。起义能走这么远，说明交通已经连成一片。", "x": "同一套网络，也能把人组织起来反抗。"}, {"e": "北宋", "t": "宋朝重文轻武是从五代吸取的教训", "b": "五代武将频繁篡位，宋太祖因此以杯酒释兵权，把军事指挥权分散给文官体系，以免武将再次坐大。这带来了内部稳定，也带来了边境的被动。", "x": "解决上一轮问题的方法，往往会在下一轮造成新的问题。"}, {"e": "北宋", "t": "交子：四川商人先发明的纸币", "b": "北宋四川铁钱笨重，商人自发发行存款凭证“交子”，后由官方接办。纸币能成立依赖信用和防伪，两个条件缺一不可。", "x": "货币的本质是信任，而不是金属。"}, {"e": "北宋", "t": "宋朝的财政收入主要来自商业税", "b": "北宋商税、专卖（盐、茶、酒）、海外贸易收入比重很高，城市经济繁荣，汴京人口超百万。宋代的经济形态提前出现了许多近代特征。", "x": "财政结构改变，会带动整个社会形态的变化。"}, {"e": "北宋", "t": "王安石变法的根本矛盾", "b": "青苗、免役、市易等法的目标是增加财政收入、减轻农民负担，但执行时常常强制摊派，反成扰民。好的设计与执行能力是两件事。", "x": "设计再好的政策，执行时也可能走样。"}, {"e": "北宋", "t": "澶渊之盟：花钱买和平是否值得", "b": "宋辽订立和约，宋每年给辽银绢，换得百余年边境安定。从财政账看支出有限，但军事压力转为外交依赖，长期让宋失去主动权。", "x": "花钱买来的和平，也会带来依赖。"}, {"e": "北宋", "t": "活字印刷在宋代已经出现", "b": "毕昇的泥活字记录在《梦溪笔谈》，但因汉字字数多、排版成本高，长期未能普及。宋代真正流行的是雕版印刷。", "x": "技术的普及，取决于它是否适配当时的现实条件。"}, {"e": "宋", "t": "理学回应的问题是：世界为什么有秩序", "b": "程朱理学用天理、气、性来解释宇宙与道德的秩序，为士人提供一套内在修养与外在规范。它后来成为科举正统，影响中国社会数百年。", "x": "一套理论能长期占据主流，往往是因为它回答了当时最迫切的秩序问题。"}, {"e": "北宋", "t": "靖康之变：一个王朝的整体崩塌", "b": "金军攻破汴京，掳走徽钦二帝、宗室、工匠、书籍。灭国不只是军事失败，还是一次文化和人才的大规模抽空。", "x": "战争的代价，常常要以文明损失来计量。"}, {"e": "南宋", "t": "岳飞之死的政治算术", "b": "宋高宗担心迎回钦帝会威胁自己的皇位，秦桧主和以维持南北对峙，岳飞的军事优势反而成为和议的障碍。权力逻辑与军事逻辑并不总是一致。", "x": "在国家利益之外，常还有个人利益的算计。"}, {"e": "南宋", "t": "南宋的经济扩张：海上丝绸之路", "b": "南宋失去北方后更依赖海上贸易，泉州、广州成为国际港口，瓷器、丝绸、铜钱外流，市舶司成为重要财源。", "x": "外部压力常常逼迫一个社会重新定义自己的资源。"}, {"e": "宋元", "t": "蒙古崛起靠的不只是骑兵", "b": "成吉思汗用千户制重组部落，建立严明的军纪与情报系统，并吸纳各地工匠与技术，把游牧骑兵变成可以攻城的复合军。", "x": "一个组织的强盛，往往来自系统性的整合，而不只是单点优势。"}, {"e": "南宋", "t": "宋末崖山之后的延续", "b": "崖山海战后南宋灭亡，大量士人和百姓南逃，文化随人流散落。政权消亡不代表社会结构的立即消失。", "x": "政治实体的结束，未必意味着社会组织的终止。"}, {"e": "宋", "t": "宋代的城市生活是真正繁荣的", "b": "汴京、临安有夜市、瓦舍勾栏、酒楼茶坊，市民文化兴盛。宋代的城市不仅是行政中心，也成了消费与娱乐的场所。", "x": "当城市不再只服务权力，它才开始拥有自己的生命力。"}, {"e": "元", "t": "行省制是元代留下的最大遗产", "b": "元朝设中书省派出机构“行省”管理地方，后来演化为地方最高行政单位。今天的省级行政区划，可以追溯到元。", "x": "治理疆域的技术，常先解决边界问题。"}, {"e": "元", "t": "元朝的四等人制与其实际程度", "b": "蒙古人、色目人、汉人、南人分等，法律与仕途差异明显。不过实际治理中大量汉人参与行政，等级制度存在，但并非简单的一刀切。", "x": "制度文本与实施效果之间，常有差距。"}, {"e": "元", "t": "驿站网络是帝国的信息骨架", "b": "元代驿站遍布欧亚，可快速传递政令、情报与使节。信息的传递速度，决定了帝国可以扩张到多大。", "x": "组织的边界，很大程度由信息传输速度决定。"}, {"e": "元", "t": "《马可·波罗游记》：一份充满了夸张的见闻", "b": "游记描述元大都的繁华、纸币、驿站，许多细节与中文史料相合，也有夸张和遗漏。它影响了欧洲对东方的想象，也促成了后来的大航海。", "x": "描述不准确的材料，依然会塑造历史。"}, {"e": "元", "t": "元曲为什么繁荣", "b": "元代科举长期停顿，大量读书人无法进入仕途，转向市井文艺创作。一个社会精英流动受阻时，他们的精力往往会流向别处。", "x": "渠道堵塞的能量，往往会寻找新的出口。"}, {"e": "元末", "t": "红巾军起义与元末的社会崩溃", "b": "黄河治水、赋税加重、瘟疫流行，加上纸币通胀，社会秩序全面失控。朱元璋从底层崛起，最终建立明朝。", "x": "当多个问题叠加，任何一个都可能成为压垮系统的最后因素。"}, {"e": "明", "t": "废丞相是明代最重大的制度变化", "b": "朱元璋废除丞相，六部直接对皇帝负责。皇帝工作量大增，后来不得不依赖内阁和宦官协理，权力结构变得更加集中也更不稳定。", "x": "把决策权收归一人，会带来效率与稳定之间的张力。"}, {"e": "明", "t": "锦衣卫与东厂：特务制度的逻辑", "b": "明代的锦衣卫和宦官特务系统用于监视官员、收集情报，强化皇权。它们没有监督机制，容易沦为政治斗争的工具。", "x": "没有 accountability 的权力，往往会被滥用。"}, {"e": "明", "t": "郑和下西洋为何终止", "b": "七次远航规模巨大，但以宣示国威、获取珍奇为主，财政上不可持续。朝中反对声音上升，加上北方威胁，航线终止。", "x": "一个行动能否持续，取决于它能否自我维持。"}, {"e": "明", "t": "一条鞭法：把一切折算成银子", "b": "明代中后期推行一条鞭法，把各种赋役合并为一条，折成白银缴纳。简化了税制，也促使白银成为主要货币。", "x": "简化流程，往往能带动更深的货币化。"}, {"e": "明", "t": "白银流入与明代的全球化", "b": "明代大量白银来自日本和美洲，通过贸易流入中国。海外白银的波动，会直接影响国内物价与财政，明代就已经卷入全球市场。", "x": "全球化的影响，比我们通常想象的要早。"}, {"e": "明", "t": "张居正的改革与被清算", "b": "张居正推行考成法与一条鞭法，整顿吏治、充实财政，但他依赖权力集中，死后被彻底清算。改革者的处境是：要做事就要集中权力，集中权力又非常脆弱。", "x": "改革需要的权力，也是改革风险所在。"}, {"e": "明", "t": "明代的卫所制为何崩溃", "b": "卫所军户世袭、屯田自养，初期节省开支，后期土地被侵占、军户逃亡，战斗力下降，最终改为募兵。制度在长期运行后，逐渐暴露其局限。", "x": "长期运行的制度，需要不断调整才能持续。"}, {"e": "明", "t": "海禁与倭寇", "b": "明代前期海禁，反而逼迫民间走私，走私集团与倭寇结合，造成沿海大乱。后来开放月港贸易，才部分缓解。", "x": "压制合理需求，往往会催生更难管控的替代渠道。"}, {"e": "明", "t": "万历十五年里看到的困境", "b": "黄仁宇写万历十五年，展示了一个制度僵化、道德代替技术的帝国：皇帝与文官系统长期僵持，没有能力解决财政与管理问题。", "x": "制度的僵化往往不是一天造成的，而是长期积累的结果。"}, {"e": "明末", "t": "明末的小冰期与民生", "b": "17 世纪气候变冷导致歉收、饥荒、瘟疫，与加派赋税、财政危机叠加，成为明末大规模动乱的背景之一。", "x": "自然条件是历史中常被忽略的底层变量。"}, {"e": "明", "t": "东林党与党争", "b": "东林书院出身的官员以清议批评朝政，与非东林派系激烈对立。集团化竞争耗费国家注意力，削弱了应对危机的能力。", "x": "内部分裂，常常比外部压力更致命。"}, {"e": "清", "t": "八旗制度是一种社会组织方式", "b": "八旗把满洲社会编为军事与民政合一的组织，旗人世代服役，享有俸禄。既保证了战斗力，又形成了长期的身份集团。", "x": "把军事与社会结合，能高效动员；但也会形成难以改变的身份壁垒。"}, {"e": "清", "t": "康雍乾盛世的基本面", "b": "清朝前期人口大增、疆域扩张、农业与商业繁荣，但人口增长也带来资源压力。盛世的评价需要区分国力、民生和制度活力。", "x": "繁荣的表面，底下常藏着慢变量。"}, {"e": "清", "t": "摊丁入亩：税收逻辑的重大变化", "b": "雍正推行摊丁入亩，把人头税并入土地税，减轻无地者负担，鼓励人口流动。税基从人转向地，国家与社会的关系因此调整。", "x": "税制的改变，比一次政令更深地影响社会。"}, {"e": "清", "t": "闭关锁国政策的本质", "b": "清朝限制对外贸易，只保留广州口岸，目的在于控制民间与外部的接触。结果是情报与技术的输入被压缩。", "x": "对外封闭的代价，往往会在冲突中一次性暴露。"}, {"e": "清", "t": "咸丰为什么会觉得自己委屈", "b": "他继位时面临太平天国、捻军、西方列强三方压力，勤于批奏折却不断做出误判。问题在于他继承的制度已经无力应对新的挑战。", "x": "一个人接手的局面，很大程度上决定了他能做什么。"}, {"e": "清", "t": "奕訢：那个被猜忌的有能力者", "b": "奕訢主持总理衙门，是清廷少数了解对外事务的高层，能力在宗室中突出，但长期被咸丰和慈禧压制。组织对能力者的猜忌，会直接减少可用的人才。", "x": "不信任有能力者，本身就是一种治理成本。"}, {"e": "清", "t": "《南京条约》：不只是一条条约", "b": "1842 年的条约开了割地、赔款、通商的先例，更重要是在认知上打破天朝上国的框架。此后一系列条约形成体系性约束。", "x": "结构性改变往往从第一次让步开始。"}, {"e": "清", "t": "太平天国的社会土壤", "b": "清朝中后期人口压力、土地集中、官僚腐败与灾荒叠加，为太平天国提供了群众基础。宗教只是动员工具，不是全部原因。", "x": "组织化的反抗，需要先有社会条件。"}, {"e": "清", "t": "洋务运动的逻辑与局限", "b": "曾国藩、李鸿章等人以“师夷长技以制夷”为思路，办工厂、建船局、练新军，但未触及制度层面。技术层面的追赶可以解决一部分问题，无法解决结构问题。", "x": "只改工具不改制度，往往会在关键时刻被打回原形。"}, {"e": "清", "t": "甲午战争为什么输得那么彻底", "b": "北洋水师在火炮、航速、弹药、指挥体系上均落后于日本，且战备管理混乱。这不是一场偶然的败仗，而是长期投入方向的结果。", "x": "胜负常常在开战前很久就已经确定。"}, {"e": "清", "t": "戊戌变法一百天", "b": "光绪帝与康有为等人推行改革，触动既得利益集团，慈禧发动政变，变法失败。改革的阻力不仅来自理念，更来自利益局面。", "x": "一项改革能不能成，得先看它动了谁的饭碗。"}, {"e": "清", "t": "义和团与八国联军", "b": "义和团的反洋运动得到部分朝廷支持，最终引来列强联军，导致《辛丑条约》和巨额赔款。情绪动员代替不了组织能力。", "x": "情绪凝聚得快，散得也快。"}, {"e": "清末", "t": "清末新政：最后的自救", "b": "废科举、练新军、设学堂、筹备立宪，都是实质性改革，但推行太晚，且中央财政与地方离心，改革反而加速了旧秩序的瓦解。", "x": "改革太晚，其本身也会成为旧体系瓦解的一部分。"}, {"e": "清末", "t": "科举废除的连锁反应", "b": "1905 年废科举，读书人失去传统通道，转向新式学堂、军队、商业甚至革命。制度变革的连带影响，往往超过变革的本意。", "x": "砸掉一条路的人，往往不知道他们会走向哪里。"}, {"e": "清末民初", "t": "辛亥革命：一个王朝的结束", "b": "武昌起义后各省纷纷独立，清廷失去对军队与地方的控制，最终退位。革命成功依赖的是旧体制的全面松动，而不只是起义本身。", "x": "一个体系的结束，往往是多个条件同时满足的结果。"}, {"e": "民国", "t": "从帝制到共和：制度变革的困难", "b": "民国建立后，共和制度在中国缺乏社会基础，军阀割据、政治分裂持续。制度移植需要相应的社会结构与条件，否则往往会反复。", "x": "好的制度需要相应的土壤。"}, {"e": "西周", "t": "井田制：土地分给谁，决定了谁能动员谁", "b": "周代井田制把土地划成九块，中间为公田，八家共耕。它既是土地制度也是赋役制度。土地、劳动力与军事义务被绑在一起，是最早的动员结构。", "x": "任何动员能力，最终都落在‘谁拥有地’上。"}, {"e": "春秋", "t": "战车时代的战争逻辑", "b": "春秋以前的战争以战车为核，数量有限，交战规模不大，讲究礼仪和阵型。战争规模扩张要到步兵和铁器普及之后。", "x": "战争形态的升级，往往先来自工具，而不是战略。"}, {"e": "战国", "t": "铁器与牛耕改变了整个社会", "b": "战国时铁农具和牛耕普及，开垦荒地变得容易，井田制难以维持，私田出现，农民从集体劳作转向个体家庭生产。", "x": "技术变化常常是制度变化的前置条件。"}, {"e": "春秋", "t": "《左传》为什么这么重视‘礼’", "b": "《左传》记载春秋史事，评价人物常以是否符合礼为标准。它反映的是一种秩序观：社会的稳定依赖共同认可的行为边界。", "x": "史书用什么标准评价人，反映的是当时的秩序焦虑。"}, {"e": "春秋", "t": "孔子对‘名’的执着", "b": "孔子强调“名不正则言不顺”，认为名分混乱会导致事事不顺。这不是迂腐的讲究，而是认为秩序需要共同的符号基础。", "x": "共同认可的名分，能减少很多无谓的冲突。"}, {"e": "春秋", "t": "老子反向思考的治理思路", "b": "老子主张“治大国若烹小鲜”，反对频繁干预。他观察到反复折腾往往带来更坏的后果，强调顺应而非强行改造。", "x": "有时候最重要的工作，是忍住不动。"}, {"e": "战国", "t": "《韩非子》的核心是让规则不依赖人", "b": "法家主张法、术、势，通过明确的赏罚制度和官僚考核，让治理不依赖贤人。这套设计的优点是可预期，代价是缺乏弹性。", "x": "追求可预期是好的，但可预期也需要容纳变化。"}, {"e": "战国", "t": "屈原之死：个人与体制的冲突", "b": "屈原因政治主张不被采纳而流放，最终投江。他的悲剧被反复讲述，正因为它是一种常见情形：个人价值与体制需要的错位。", "x": "体制与个人的错位，历史上很少被妥善处理。"}, {"e": "春秋", "t": "春秋五霸：霸主本身就是秩序的产物", "b": "所谓霸主，是在周王室衰弱后维持秩序形成的机制。霸主需要一定的合法性，依靠周王背书；同时用实力约束诸侯。", "x": "权力真空里，最先出现的往往是半合法化的秩序形式。"}, {"e": "秦", "t": "郡县制：把地方官变成可替换的人", "b": "秦设郡县，地方官由中央任免、定期调动，不再世袭。这让国家能直接管理地方，但也要求有足够的文书和交通支持。", "x": "把职位变成可替换的，才能真正控制它。"}, {"e": "秦", "t": "秦的文书行政有多细致", "b": "睡虎地秦简显示，秦朝规定公文格式、传递期限、责任追究，甚至规定了路上遇到雨怎么处理。这套体系是秦效率的来源。", "x": "严密的记录体系，是官僚制的基础。"}, {"e": "秦", "t": "陈胜吴广起义的导火索", "b": "秦法规定服役误期要受重罚，陈胜吴广在雨中误期，面临严惩。起义的直接原因是制度的刚性超过了人的承受力。", "x": "规则越刚性，就越需要留出例外。"}, {"e": "西汉", "t": "汉初的黄老之治与休养", "b": "汉初奉行无为而治，减少徭役、轻税、缓刑，社会得以恢复生产。休养的本质是把资源留在民间，慢慢积累。", "x": "恢复元气需要时间，而制度需要为‘等待’留出空间。"}, {"e": "西汉", "t": "文景之治时期的钱多到什么程度", "b": "史载当时国库粮食陈陈相因，串钱的绳子都朽烂了。这样的记载可能夸张，但反映出长期轻徭薄赋后的积累。", "x": "治理的成果，常常体现为民间积累了多少。"}, {"e": "西汉", "t": "汉武帝用兵之下的社会代价", "b": "连年征战导致人口锐减、财政紧张，后期不得不下轮台诏，承认民生疲敝。扩张的边际成本会迅速上升。", "x": "任何扩张，都在消耗长远的储备。"}, {"e": "西汉", "t": "司马迁的选择", "b": "司马迁因替李陵辩护受宫刑，忍辱著《史记》。他写史重视人物性格与处境，不只为帝王作传，也记录游侠、商人。", "x": "看待历史的角度，往往由个人处境塑造。"}, {"e": "西汉", "t": "《史记》中‘人’的位置", "b": "司马迁用本纪、世家、列传构成叙事体系，关注人物的选择与命运。这是史书从编年记事向理解人生过渡的时刻。", "x": "写人，比记事更能留下理解。"}, {"e": "汉代", "t": "史记与资治通鉴的差别", "b": "《史记》是纪传体通史，重视人物与性情；《资治通鉴》编年体，按时间为帝王提供治理参考。写作目的不同，材料与取舍也会不同。", "x": "史书的价值取决于它服务于什么问题。"}, {"e": "汉", "t": "汉代的吏治考核", "b": "汉代对地方官有上计制度，定期上报户口、赋税、治安等。考核体系让中央能看到地方状况，但也容易被数据美化。", "x": "考核指标一旦固定，就会有人专门做指标。"}, {"e": "南朝", "t": "世说新语与名士风度", "b": "《世说新语》记录名士的言谈与做派，展示动荡时代里一种自我保存的方式：以清谈和放达维持个人尊严。", "x": "社会秩序松动时，个人风格常成为价值寄托。"}, {"e": "魏晋", "t": "魏晋玄学为什么流行", "b": "频繁的政权更迭让士人难以在政治上有所作为，他们转向讨论“有”与“无”、名教与自然。思想的转向往往有其现实处境。", "x": "一个时代讨论什么，往往取决于它回避什么。"}, {"e": "南朝", "t": "南朝四百八十寺背后的劳动与财富", "b": "寺院不仅依靠布施，也占田、经营碾坊、组织生产。寺院经济与世俗政权的关系，是理解南北朝社会的一个切面。", "x": "任何信仰组织，也需要一套经济基础。"}, {"e": "北魏", "t": "北魏孝文帝的迁都决定", "b": "孝文帝迁都洛阳，试图摆脱旧贵族的势力范围，直接用汉化制度整合国家。迁都既是战略也是政治上的重塑。", "x": "改变地理中心，往往也是改变权力中心。"}, {"e": "北朝", "t": "木兰辞背后的兵制", "b": "《木兰辞》反映的是府兵制环境：家庭出征服役。花木兰代父从军，因此可以理解成兵役制度下的家庭策略。", "x": "制度压力往往最终落在普通家庭内部消化。"}, {"e": "南北朝", "t": "南北朝的对峙带来了什么", "b": "南北对立促成了各自社会的发展，南朝保持商业与文化的活力，北朝积累军事与土地制度经验。分裂期并非空洞的时间。", "x": "分裂的时期，是不同路径的试验期。"}, {"e": "宋", "t": "科举的‘糊名’与公平", "b": "宋朝以后科举采用糊名、誊录等制度，减少主考官凭姓名偏私。这些技术手段让公平更有制度保障。", "x": "公平感，很大程度上来自可见的流程。"}, {"e": "唐", "t": "唐代的均田制为什么维持不下去", "b": "均田制要求人口有限、土地充足，但人口增长、土地兼并和商品经济发展使制度难以维持，最终被两税法替代。", "x": "制度有它适用的条件，条件一变就要调整。"}, {"e": "唐", "t": "唐长安的坊市制度", "b": "长安将居民区（坊）与商业区（市）分开，夜间关闭坊门，管理严格。宋代突破坊市制，出现了街市和夜市。", "x": "城市形态的变化，常反映管理方式的变化。"}, {"e": "宋", "t": "宋代女性的经济角色", "b": "宋代城市的商业、纺织、饮食业中，女性参与度较高，也有部分女性经商。叙事中的‘闺阁’并不覆盖可见的全部。", "x": "历史记录越强调规范，越可能掩盖现实。"}, {"e": "宋", "t": "宋代海上贸易与市舶司", "b": "宋在广州、泉州设置市舶司，管理对外贸易并抽税，出口瓷器丝绸，进口香料药物。海洋贸易是国家财政的一部分。", "x": "开放往往是经济需要，而非单纯的胸襟。"}, {"e": "南宋", "t": "宋代的纸币为何仍然出现通胀", "b": "南宋会子长期超发，导致物价上涨、信用下降。货币发行者一旦能通过印钞解决问题，通胀就成为结构性风险。", "x": "一旦能印钱解决困难，就很难克制不印。"}, {"e": "宋", "t": "宋代印刷业与知识的流动", "b": "宋代雕版印刷普及、书坊遍布，书籍价格大幅下降，民间藏书和私学增多。知识的下沉，会逐渐改变社会结构。", "x": "文化传播成本一降，社会变化就难以阻挡。"}, {"e": "唐", "t": "唐代的边塞诗与帝国心理", "b": "盛唐边塞诗雄浑开阔，反映当时的军事自信；中晚唐的边塞诗更多是悲凉与现实。文学气质变化暗示着国力心气的变化。", "x": "诗歌，是一个国家的内心状态。"}, {"e": "元", "t": "元代的纸币与财政", "b": "元代发行交钞，曾长期使用，后期因超发和管理不善导致通货膨胀，经济动荡。财政工具的滥用，会影响货币的信用。", "x": "货币信用一旦受损，恢复往往要付出很高的成本。"}, {"e": "明", "t": "明朝的内阁：不是丞相，胜似丞相", "b": "明代内阁起初只是顾问，后来通过票拟、批红参与决策，实际承担类似宰相的功能，但地位完全取决于皇帝信任。", "x": "非正式权力，往往在实际运转中变得最强大。"}, {"e": "明", "t": "明代的一条编审与户口登记", "b": "明代通过黄册登记户籍、丈量土地，形成系统的税收依据。编制户籍本身就是治理能力的基础。", "x": "能看见人民，才有可能治理人民。"}, {"e": "明", "t": "海瑞式的官员为何难成功", "b": "海瑞清廉刚直，严格守法，但仍难以改变体制。个人品行的力量有限，制度的运行依赖系统，而不只是几个好官。", "x": "靠个体道德修补系统性缺陷，代价极高且效果有限。"}, {"e": "明末", "t": "明亡时的财政困境", "b": "明末战事频繁、加派辽饷等赋税，财政负担加重，军队欠饷，社会矛盾激化。财政问题往往是政治崩溃的直接导火索。", "x": "一个体系的崩溃，往往最早在账本上显露。"}, {"e": "清", "t": "清代的秘密奏折", "b": "雍正扩大秘密奏折制度，允许官员直接向皇帝密报，绕过常规层级。这让皇帝掌握更多信息，也加剧了官员之间的猜忌与竞争。", "x": "改变信息流，就改变了权力关系。"}, {"e": "清", "t": "清代文字狱对社会的后果", "b": "严酷的文字狱使读书人转向考据、经学，避免议论时政。思想的活力与风险感知，往往成反比。", "x": "当表达的风险太高，创新会转向安全的领域。"}, {"e": "清", "t": "摊丁入亩与人口的‘隐匿’", "b": "税制改为按地征收后，人口登记压力减小，人口数字更接近真实。数据的变化，有时候反映的是制度的变化。", "x": "统计数据的改变，未必是现实变了，可能只是动机变了。"}, {"e": "清", "t": "清代的海禁与对外接触", "b": "清初海禁与台湾局势相关，后来设广州一口通商，限制民间海外往来。长期限制对外接触，扩大了信息差距。", "x": "信息差距，往往在冲突时才被发现有多严重。"}, {"e": "清", "t": "乾嘉考据学的价值", "b": "清代学者整理古籍、辨伪、校勘，形成严谨的学术方法。虽然避开了现实批评，但也为后世留下了可靠的知识基础。", "x": "在受限的环境中，仍可以积累真正有用的东西。"}, {"e": "清代", "t": "从林则徐看官员的世界观局限", "b": "林则徐注意到西洋的船炮与地理材料，收集资料编《四洲志》，但当时对国际法与条约的理解仍然有限。他算是认识差距的人之一。", "x": "个体再认真，也受制于所处时代的认知边界。"}, {"e": "清代", "t": "《海国图志》与魏源的清醒", "b": "魏源编《海国图志》，提出“师夷长技以制夷”。这本书在国内影响有限，却在日本被广泛阅读。知识的迁移，方向常常出乎意料。", "x": "同一条信息，如果落在不同的环境里，价值完全不同。"}, {"e": "明清", "t": "闭关与开市的争论从未真正解决", "b": "从明到清，对外开市与闭市反复发生，实质上是担心民间与外部互动削弱控制。争论双方各有理由，代价却很难被衡量。", "x": "安全与开放之间的取舍，往往没有完美答案。"}, {"e": "清", "t": "天朝上国的认知框架", "b": "清代体系以朝贡关系理解外部世界，视外国为蛮夷。这种认知框架在遭遇平等交往要求时，会造成交流与判断的双重困难。", "x": "理解世界时使用的框架，会决定你能看到什么。"}, {"e": "清", "t": "鸦片战争中的信息失灵", "b": "清廷对战况的了解极为迟缓，前线奏报与实情不符，朝廷据此作出错误判断。战争的失败，部分来自决策者无法获得真实信息。", "x": "看不清战场的人，也无法赢得战争。"}, {"e": "清", "t": "五口通商改变了沿海城市", "b": "上海、广州、厦门等开埠城市迅速发展，形成新的贸易网络和中外混合社会。开放的影响首先是城市结构的改变。", "x": "政策的影响，常常通过城市的变化显现。"}, {"e": "清", "t": "太平天国的制度尝试", "b": "太平天国推行圣库制，没收财产统一分配，废除私产。这在短期内支撑了战争，但在治理上难以持续。", "x": "能打仗的制度，不等于能治理的制度。"}, {"e": "晚清", "t": "曾国藩的自救逻辑", "b": "曾国藩练湘军、办洋务，强调“结硬寨、打呆仗”，注重可靠的组织与后勤。他的方法体现了一种务实的路径。", "x": "面对复杂局面，笨办法常常是有效办法。"}, {"e": "晚清", "t": "淮军与湘军的公私差别", "b": "湘军和淮军都属于地方招募、私人关系的军队，更灵活但也容易形成地方势力。中央对军队的控制随之变弱。", "x": "效率与集中，很难同时达到。"}, {"e": "晚清", "t": "李鸿章的困局", "b": "他掌握最大实务与外交资源，却总在妥协的位置上签字。他个人的判断受制于朝廷、财政与时局，不能只看个人能力。", "x": "最能左右结果的人，往往是约束最多的人。"}, {"e": "晚清", "t": "北洋水师的军费从哪里来", "b": "海军经费受财政、政治与内务项目挤占，弹药与训练受到影响。资源的分配方式，是能力的直接来源。", "x": "预算分配最能说明一个组织的真实优先级。"}, {"e": "晚清", "t": "康有为的‘托古改制’", "b": "康有为以孔子为改革者，用儒家的语言包装现代化主张，减少阻力。改革者常常需要借用旧权威来推动新方案。", "x": "改动的阻力越大，越需要借旧的壳。"}, {"e": "清", "t": "戊戌变法的失败原因分层", "b": "变法失败的原因包括：皇权基础薄弱、改革措施过密、缺乏执行系统、既得利益反弹。短时间内的密集变革容易激化冲突。", "x": "激进改革的最大风险，不是目标错，而是节奏错。"}, {"e": "清", "t": "义和团与民间的生存焦虑", "b": "民间反洋情绪背后有生计焦虑、社会失序与文化恐慌。运动以强烈象征表达情绪，但缺乏明确组织目标。", "x": "看似情绪失控的行动，背后可以看到具体的担忧。"}, {"e": "清末", "t": "清末新政为什么反成了催命符", "b": "新政需要钱，筹钱需要加税，加税加剧民怨；练新军产生新的军力，反而成为推翻朝廷的力量。改革的副作用会反噬改革者。", "x": "解决老问题的办法，可能制造新问题。"}, {"e": "清末", "t": "从科举到学堂：读书人的分流", "b": "废科举后，读书人转向新学堂、留学、从军、经商。精英的流向改变，社会力量的分布也随之改变。", "x": "流动的方向，决定社会资源积压在哪一侧。"}, {"e": "民国", "t": "孙中山的‘三民主义’作为一个框架", "b": "民族、民权、民生三者的组合，试图把多种诉求整合进一个纲领。社会变革需要一个能把人聚集起来的说法。", "x": "把诉求整合成语言，是动员的第一步。"}, {"e": "清末", "t": "保路运动：局部的火种", "b": "四川保路运动反对铁路国有化，引发大规模抗议与武装冲突，进而成为武昌起义的契机。地方事件常常成为全局的引线。", "x": "结构性矛盾，往往在某个具体事件上爆发。"}, {"e": "民国", "t": "民国初年的军阀政治", "b": "辛亥革命后，军权分裂到地方，军阀混战，中央权威不足。政权转换期间，如果军队整合失败，制度难以稳定。", "x": "政权更替的关键，往往是对暴力的整合。"}, {"e": "民国", "t": "五四运动的文化诉求", "b": "五四知识分子提出“民主与科学”，批评传统家庭与礼教，倡导白话文。思想运动不只是口号，它重塑了阅读与表达的方式。", "x": "语言的变化，是思想变化最具体的体现。"}, {"e": "民国", "t": "五四之后的三种道路", "b": "五四之后，自由主义的改良、国民党的统一路线和共产党的社会革命三条路并进，各自寻找适合中国的组织方式。", "x": "社会危机时，最先被比较的是组织形式。"}, {"e": "民国", "t": "民国时期留学生的回流", "b": "欧美、日本留学的学生带回技术、制度和思想，成为中国各领域的关键人物。知识的迁移常常以具体的人为载体。", "x": "传播最快的是人，不是书。"}, {"e": "民国", "t": "抗战时期的后方与工业內迁", "b": "抗日战争中大批工厂、学校与人口迁往西南，形成临时工业基地。战争促使国家组织能力被迫提升。", "x": "巨大的压力，也会逼出原本不存在的能力。"}, {"e": "通史", "t": "赋税史：从人丁到土地再到商业", "b": "中国税制大致经历了从按人丁（租庸调）到按土地（两税法、一条鞭法、摊丁入亩），再到商业税与专卖并重的演变。", "x": "税制形态反映国家对‘谁创造了财富’的理解。"}, {"e": "通史", "t": "货币史：从铜钱到白银再到纸币", "b": "长期以铜钱为主，宋出现纸币，明代白银货币化，清代受外来白银影响，近代转向法币。货币变化与财政和贸易紧密相连。", "x": "货币的形态，记录了国家与世界的关系。"}, {"e": "通史", "t": "历朝对‘外’的认知变迁", "b": "从先秦的华夷之辨、汉唐的开放交往，到明清的海禁，再到近代的被迫开放，认知的变化常由实力与安全感驱动。", "x": "开放的程度，往往更取决于安全感，而不是理念。"}, {"e": "通史", "t": "中国官僚体系的稳定性来源", "b": "文官选拔、考核、品级、文书制度，形成可以自我延续的行政体系。它的优点是有延续性，缺点是容易僵化。", "x": "持久往往依靠稳定的规则，而非优秀的个体。"}, {"e": "通史", "t": "中国历史上的‘治乱周期’", "b": "许多王朝经历初期的休养、中期的扩张、后期的财政与治理压力，再到崩溃。但这不是宿命，而常与财政、土地和行政能力相关。", "x": "周期并不是注定的，它更多是结构问题的表现。"}, {"e": "通史", "t": "官营与民营的长期摇摆", "b": "盐、铁、茶、矿等重要资源长期在国家专营与民间经营之间摇摆。国家需要收入与控制，民间需要活力，两者反复拉锯。", "x": "国家与市场的边界，历史上一直在调整。"}, {"e": "通史", "t": "灾害与治理能力", "b": "历史上频繁的水旱与瘟疫，考验国家的仓储、赈济和动员能力。能有效救灾的政权往往更稳定。", "x": "危机应对能力是社会信任的直接来源。"}, {"e": "通史", "t": "宗族与基层治理", "b": "许多朝代国家治理只到县一级，基层依靠宗族、乡绅处理纠纷与救济，形成低成本治理结构。", "x": "治理成本过高时，社会会自己长出一些结构。"}, {"e": "通史", "t": "重农抑商的实践后果", "b": "限制商人流动性以保农业与稳定，但商业被压制后，财政与就业也受到影响。清朝后期商业力量反而成为变革的推动者。", "x": "对某些群体的压制，之后常以意料之外的方式反弹。"}, {"e": "通史", "t": "中国历史上的技术：领先与停滞", "b": "造纸、印刷、火药、指南针都曾领先，但长期缺少系统的实验与理论积累，影响持续创新和扩散。", "x": "领先一时靠的是经验，行远则靠方法与传承。"}, {"e": "通史", "t": "女性在史书中的影子", "b": "正史多为男性政治书写，女性记载少而简化。读史时能看到她们在家庭、经济与文化的具体位置，靠的是寻找记录边缘处。", "x": "史书写什么，也暗示了谁被认为重要。"}]}];

<script>
/* ==========================================================================
   卡片 · 逻辑
   数据从 window.__THEMES__ 读（build.py 注入）。
   ========================================================================== */

/* ---------- 配置 ---------- */
const CONFIG = {
  decay: 0.3,        // 看过一次后的权重倍数
  floor: 0.03,       // 权重下限，避免老卡片彻底不出现
  recent: 8,         // 最近抽过的若干张不重复
  threshold: 55,     // 滑动多少像素算翻页
  axisLock: 8        // 手势方向判定阈值
};

const KEY_THEME = 'cards.theme.v1';

/* ---------- 状态 ---------- */
let theme = null;
let pool = [];
let seen = {};
let history = [];
let curIdx = -1;

const stage = document.getElementById('stage');
const sheet = document.getElementById('sheet');
const themeList = document.getElementById('themeList');

/* ---------- 存储 ---------- */
function seenKey() { return 'cards.seen.' + theme.id + '.v1'; }

function loadSeen() {
  try {
    const o = JSON.parse(localStorage.getItem(seenKey()) || '{}');
    return (o && typeof o === 'object') ? o : {};
  } catch (e) { return {}; }
}

function saveSeen() {
  try { localStorage.setItem(seenKey(), JSON.stringify(seen)); } catch (e) {}
}

/* ---------- 权重抽取 ---------- */
function weightOf(i) {
  const n = seen[i] || 0;
  if (!n) return 1;
  return Math.max(CONFIG.floor, Math.pow(CONFIG.decay, n));
}

function pick(exclude) {
  exclude = exclude || [];
  let total = 0;
  const weights = [];
  for (let i = 0; i < pool.length; i++) {
    const w = exclude.indexOf(i) >= 0 ? 0 : weightOf(i);
    weights.push(w);
    total += w;
  }
  if (total <= 0) {
    // 全部看过了：均匀随机，但尽量避开刚看过的
    let i;
    do { i = Math.floor(Math.random() * pool.length); }
    while (exclude.indexOf(i) >= 0 && exclude.length < pool.length);
    return i;
  }
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return pool.length - 1;
}

/* ---------- 顶部信息 ---------- */
function seenCount() {
  let n = 0;
  for (const k in seen) if (seen[k] > 0) n++;
  return n;
}

function updateHeader() {
  document.getElementById('themeName').textContent = theme.name;
  document.getElementById('seen').innerHTML =
    '已看 <b>' + seenCount() + '</b> / ' + pool.length;
}

/* ---------- 渲染 ---------- */
function makeCard(i) {
  const c = pool[i];
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = '<div class="era"></div><h2></h2><p></p><div class="think"></div>';

  const era = el.querySelector('.era');
  if (c.e) era.textContent = c.e; else era.remove();

  el.querySelector('h2').textContent = c.t;
  el.querySelector('p').textContent = c.b;

  const think = el.querySelector('.think');
  if (c.x) think.textContent = c.x; else think.remove();

  return el;
}

function place(el, offsetY, scale, opacity) {
  el.style.transform = 'translate3d(0, calc(-50% + ' + offsetY + 'px), 0) scale(' + scale + ')';
  el.style.opacity = String(opacity);
}

function markSeen(i) {
  seen[i] = (seen[i] || 0) + 1;
  saveSeen();
  updateHeader();
}

function render(i, fromDir) {
  if (!pool.length) return;
  i = Math.max(0, Math.min(i, pool.length - 1));

  stage.innerHTML = '';
  const el = makeCard(i);
  el.style.transition = 'none';
  place(el, fromDir ? fromDir * 36 : 0, fromDir ? 0.95 : 1, 0);
  stage.appendChild(el);
  bindSwipe(el);

  requestAnimationFrame(() => {
    el.style.transition = '';
    place(el, 0, 1, 1);
  });

  curIdx = i;
  markSeen(i);
}

function next() {
  history.push(curIdx);
  const recent = history.slice(-CONFIG.recent).concat([curIdx]).filter(x => x >= 0);
  render(pick(recent), 1);
}

function prev() {
  if (history.length < 2) return;
  history.pop();
  render(history[history.length - 1], -1);
}

/* ---------- 手势 ---------- */
function bindSwipe(el) {
  let x0 = 0, y0 = 0, dx = 0, active = false, axis = null;

  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    active = true;
    dx = 0;
    axis = null;
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    el.style.transition = 'none';
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!active) return;
    const tx = e.touches[0].clientX;
    const ty = e.touches[0].clientY;
    dx = tx - x0;
    const dy = ty - y0;

    if (axis === null && (Math.abs(dx) > CONFIG.axisLock || Math.abs(dy) > CONFIG.axisLock)) {
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (axis === 'y') return;

    if (e.cancelable) e.preventDefault();
    el.style.transform = 'translate3d(' + dx + 'px, -50%, 0) rotate(' + (dx * 0.025) + 'deg)';
    el.style.opacity = String(Math.max(0.4, 1 - Math.abs(dx) / 460));
  }, { passive: false });

  // 用 endIndex 防止重复触发（touchend 和 touchcancel 只会有一个生效）
  let endToken = 0;

  function finish() {
    if (!active) return;
    active = false;
    el.style.transition = '';

    if (dx <= -CONFIG.threshold) {
      el.style.transform = 'translate3d(-120vw, -50%, 0) rotate(-10deg)';
      el.style.opacity = '0';
      // 兜底：万一动画回调没跑，也不能把界面卡死
      const token = ++endToken;
      setTimeout(() => { if (token === endToken) next(); }, 170);
    } else if (dx >= CONFIG.threshold) {
      el.style.transform = 'translate3d(120vw, -50%, 0) rotate(10deg)';
      el.style.opacity = '0';
      const token = ++endToken;
      setTimeout(() => { if (token === endToken) prev(); }, 170);
    } else {
      place(el, 0, 1, 1);
    }
  }

  el.addEventListener('touchend', finish, { passive: true });
  el.addEventListener('touchcancel', () => {
    if (!active) return;
    active = false;
    el.style.transition = '';
    place(el, 0, 1, 1);
  }, { passive: true });


  /* 桌面 / 鼠标 */
  let mx = 0, down = false;
  el.addEventListener('mousedown', e => {
    down = true;
    mx = e.clientX;
    el.style.transition = 'none';
  });
  window.addEventListener('mousemove', e => {
    if (!down) return;
    const d = e.clientX - mx;
    el.style.transform = 'translate3d(' + d + 'px, -50%, 0) rotate(' + (d * 0.025) + 'deg)';
  });
  window.addEventListener('mouseup', e => {
    if (!down) return;
    down = false;
    el.style.transition = '';
    const d = e.clientX - mx;
    if (d <= -CONFIG.threshold) next();
    else if (d >= CONFIG.threshold) prev();
    else place(el, 0, 1, 1);
  });
}

/* ---------- 键盘 ---------- */
window.addEventListener('keydown', e => {
  if (sheet.classList.contains('on')) {
    if (e.key === 'Escape') closeSheet();
    return;
  }
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

/* ---------- 主题切换 ---------- */
function renderThemeList() {
  themeList.innerHTML = '';
  window.__THEMES__.forEach(t => {
    const b = document.createElement('button');
    b.className = 'titem' + (t.id === theme.id ? ' now' : '');
    b.innerHTML =
      '<div><span>' + t.name + '</span><small>' + t.desc + '</small></div>' +
      '<span class="dot">●</span>';
    b.onclick = () => switchTheme(t.id);
    themeList.appendChild(b);
  });
}

function openSheet() {
  renderThemeList();
  sheet.classList.add('on');
}

function closeSheet() {
  sheet.classList.remove('on');
}

function switchTheme(id) {
  theme = window.__THEMES__.find(t => t.id === id) || window.__THEMES__[0];
  try { localStorage.setItem(KEY_THEME, theme.id); } catch (e) {}
  pool = theme.cards;
  seen = loadSeen();
  history = [];
  closeSheet();
  updateHeader();
  render(pick([]), 0);
}

document.getElementById('themeBtn').onclick = openSheet;
document.getElementById('closeSheet').onclick = closeSheet;
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

/* ---------- 启动 ---------- */
(function init() {
  const saved = localStorage.getItem(KEY_THEME);
  theme = window.__THEMES__.find(t => t.id === saved) || window.__THEMES__[0];
  pool = theme.cards;
  seen = loadSeen();

  // 只有一个主题时，隐藏切换按钮
  if (window.__THEMES__.length < 2) {
    document.getElementById('themeBtn').style.display = 'none';
  }

  updateHeader();
  render(pick([]), 0);
})();

</script>
