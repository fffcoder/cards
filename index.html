<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卡片">
<meta name="theme-color" content="#0f0e0c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f0e0c'/%3E%3Crect x='30' y='38' width='120' height='104' rx='12' fill='none' stroke='%23d9bf8a' stroke-width='5'/%3E%3Cpath d='M52 66h76M52 86h76M52 106h48' stroke='%23d9bf8a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>卡片</title>
<style>
/* ==========================================================================
   卡片 · 样式
   改配色改最上面的变量就行，下面的规则基本不用动。
   ========================================================================== */

:root {
  /* 底色与层次 */
  --bg: #0f0e0c;
  --card-a: #221e1a;          /* 卡片渐变的起点 */
  --card-b: #16130f;          /* 卡片渐变的终点 */
  --line: rgba(217, 191, 138, .14);

  /* 文字 */
  --fg: #f2ebdf;              /* 标题 */
  --fg-body: #c2b8aa;         /* 正文 */
  --fg-dim: #8c8175;          /* 时代标签 */
  --fg-faint: #5b544b;        /* 底部提示 */
  --accent: #d9bf8a;          /* 强调色：多想一层、主题名 */

  /* 形状 */
  --radius: 24px;
  --card-w: min(87vw, 430px);

  /* 动效 */
  --ease: cubic-bezier(.22, .9, .3, 1);
  --dur: .36s;

  /* 字号 */
  --t-title: clamp(20px, 5.4vw, 25px);
  --t-body: clamp(14.5px, 4vw, 16px);
  --t-think: clamp(13px, 3.6vw, 14px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

/* ---------- 页面骨架 ---------- */
#deck {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 8px);
}

header {
  flex: 0 0 auto;
  padding: 0 24px 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

#themeBtn {
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: .06em;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
#themeBtn i {
  font-style: normal;
  font-size: 10px;
  opacity: .55;
  transform: translateY(-1px);
}

#seen {
  font-size: 12px;
  letter-spacing: .06em;
  color: #7a7166;
}
#seen b {
  color: var(--accent);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

#stage {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
}

footer {
  flex: 0 0 auto;
  padding: 14px 24px 0;
  text-align: center;
  font-size: 11.5px;
  color: var(--fg-faint);
  letter-spacing: .08em;
}

/* ---------- 卡片 ---------- */
.card {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--card-w);
  margin-left: calc(var(--card-w) / -2);
  transform: translate3d(0, -50%, 0);

  border-radius: var(--radius);
  padding: 32px 26px 30px;
  background: linear-gradient(165deg, var(--card-a), var(--card-b) 70%);
  box-shadow: 0 20px 50px -22px #000, 0 0 0 1px rgba(255, 255, 255, .055) inset;

  transition: transform var(--dur) var(--ease), opacity var(--dur) ease;
  will-change: transform, opacity;
  touch-action: pan-y;

  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: min(46vh, 360px);
  max-height: 74vh;
  overflow: hidden;
}

/* 卡片顶部的一层暖光 */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  pointer-events: none;
  background: radial-gradient(130% 80% at 50% -10%, rgba(217, 191, 138, .075), transparent 62%);
}

.era {
  font-size: 11px;
  letter-spacing: .16em;
  color: var(--fg-dim);
  margin-bottom: 14px;
}

.card h2 {
  font-size: var(--t-title);
  margin: 0 0 14px;
  line-height: 1.42;
  font-weight: 600;
  color: var(--fg);
}

.card p {
  margin: 0;
  font-size: var(--t-body);
  line-height: 1.88;
  color: var(--fg-body);
}

.think {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: var(--t-think);
  line-height: 1.8;
  color: var(--accent);
  opacity: .9;
}
.think::before {
  content: "多想一层 · ";
  color: #8c7a55;
  letter-spacing: .04em;
  font-size: 11px;
}

/* ---------- 词条 ---------- */
.term {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px dashed rgba(217, 191, 138, .55);
  padding-bottom: .5px;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.term:active { border-bottom-color: var(--accent); }

/* 词条气泡 */
#pop {
  position: fixed;
  z-index: 30;
  max-width: min(76vw, 320px);
  padding: 13px 15px;
  border-radius: 14px;
  background: #2a2520;
  color: #ded4c6;
  font-size: 13.5px;
  line-height: 1.72;
  box-shadow: 0 14px 40px -12px #000, 0 0 0 1px rgba(217, 191, 138, .22) inset;
  opacity: 0;
  transform: translateY(6px) scale(.96);
  transition: opacity .18s ease, transform .18s cubic-bezier(.22, .9, .3, 1);
  pointer-events: none;
}
#pop.on { opacity: 1; transform: translateY(0) scale(1); }
#pop b {
  display: block;
  margin-bottom: 5px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: .02em;
}
/* 小三角 */
#pop::after {
  content: "";
  position: absolute;
  left: var(--arrow-x, 50%);
  width: 10px;
  height: 10px;
  margin-left: -5px;
  background: #2a2520;
  transform: rotate(45deg);
}
#pop.below::after { top: -5px; box-shadow: -1px -1px 0 rgba(217, 191, 138, .22) inset; }
#pop.above::after { bottom: -5px; box-shadow: 1px 1px 0 rgba(217, 191, 138, .22) inset; }

/* ---------- 主题选择 ---------- */
#sheet {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  background: rgba(8, 7, 6, .9);
  backdrop-filter: blur(10px);
  padding: calc(env(safe-area-inset-top) + 46px) 22px calc(env(safe-area-inset-bottom) + 24px);
  overflow-y: auto;
}
#sheet.on { display: block; }

#sheet h3 {
  margin: 0 0 16px;
  padding-left: 4px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .16em;
  color: #7a7166;
}

.titem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 15px 18px;
  margin-bottom: 10px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  background: #1b1815;
  color: var(--fg);
  font-family: inherit;
  font-size: 16px;
  text-align: left;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .05) inset;
  transition: box-shadow .2s;
}
.titem small {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  color: #7a7166;
  letter-spacing: .04em;
  font-weight: 400;
}
.titem.now { box-shadow: 0 0 0 1px rgba(217, 191, 138, .45) inset; }
.titem .dot { opacity: 0; color: var(--accent); font-size: 9px; }
.titem.now .dot { opacity: 1; }

#closeSheet {
  margin-top: 6px;
  width: 100%;
  padding: 15px;
  border-radius: 16px;
  border: none;
  background: transparent;
  color: #6d6459;
  font-family: inherit;
  font-size: 14px;
}

</style>
</head>
<body>

<div id="deck">
  <header>
    <button id="themeBtn"><span id="themeName"></span><i>⌄</i></button>
    <span id="seen"></span>
  </header>
  <div id="stage"></div>
  <footer>上滑下一张 · 下滑上一张</footer>
</div>

<div id="sheet">
  <h3>选择主题</h3>
  <div id="themeList"></div>
  <button id="closeSheet">关闭</button>
</div>

<script>

window.__THEMES__ = [{"id": "history", "name": "历史", "desc": "三皇五帝到民国 · 119 张", "cards": [{"e": "清", "t": "八旗不是军队，是社会组织", "b": "八旗把满洲人编成军事与民政合一的单位，旗人世代当兵领饷，不事生产。这套组织让几十万人的族群能高效动员，代价是形成很难拆解的身份集团，一直延续到清末。", "x": "把军事和社会捆在一起很高效，但也会造出难以改变的身份壁垒。"}, {"e": "清", "t": "清军入关，靠的是吴三桂开的门", "b": "1644 年李自成攻入北京、崇祯自尽，吴三桂在山海关引清军入关，共同击败李自成。清军以替明复仇的名义进入北京，随后迅速接管政权，而不是纯靠武力硬打下来。", "x": "政权更替时常有内部人开门，门一旦打开就关不回去了。"}, {"e": "清", "t": "剃发令：一道命令引发的全面抵抗", "b": "清廷要求汉人剃发编辫，口号是留头不留发、留发不留头。这道命令把原本可以妥协的征服，变成必须选择立场的对抗，江南各地因此爆发激烈抵抗。", "x": "让人在无法回头的象征上表态，会把中间派全推到对面。"}, {"e": "清", "t": "迁界禁海：为了断郑成功，代价是沿海民生", "b": "清初为切断郑氏政权的补给，下令沿海居民内迁数十里，禁止出海。海防压力暂时缓解，但沿海渔农商贸几乎崩溃，恢复花了几十年。", "x": "为了安全切掉的，常常是更难重建的生计。"}, {"e": "清", "t": "《尼布楚条约》是中国第一次按国际法谈边界", "b": "1689 年中俄签订尼布楚条约，划定了东段边界，用拉丁文和满、俄文本，按对等谈判的方式完成。这是清廷少有的以平等姿态处理对外关系的案例。", "x": "有实力时按规则谈判，谈判结果才守得住。"}, {"e": "清", "t": "三藩之乱：一次差点掀翻新王朝的内战", "b": "吴三桂、尚可喜、耿精忠三个藩王掌控南方，康熙决定撤藩，引发八年战乱，波及十余省。清廷最终获胜，但暴露出用降将守边留下的隐患。", "x": "靠临时力量换来的稳定，迟早要还账。"}, {"e": "清", "t": "统一台湾：施琅与澎湖海战", "b": "1683 年施琅率水师在澎湖击败郑军，郑克塽投降，清朝设台湾府隶属福建。军事上是一次海战，政治上是把东南沿海纳入统一管辖。", "x": "关键节点上的胜负，往往决定几百年的格局。"}, {"e": "清", "t": "雅克萨之战：清军为什么打得这么吃力", "b": "两次雅克萨之战中，清军面对人数不多的哥萨克据守的堡垒，围攻数月才拿下。火器与工事的差距，在此时已经露出苗头。", "x": "在赢得漂亮的时候，往往最容易忽略正在拉开的差距。"}, {"e": "清", "t": "多伦会盟：把蒙古纳入制度而不是只靠联姻", "b": "康熙在多伦与喀尔喀蒙古诸部会盟，编设旗制，确立清朝对漠北蒙古的管理。相比单纯联姻，制度化的编制更持久。", "x": "把关系写进制度里，比靠人情维系更久。"}, {"e": "清", "t": "摊丁入亩的前身：一条鞭法的思路延续", "b": "清朝在明代一条鞭法的基础上，把丁银摊入田赋，纳税跟着土地走。税基从人头转向土地，国家跟每个人的关系随之改变。", "x": "税制一变，国家和百姓的关系就跟着变。"}, {"e": "清", "t": "九子夺嫡：康熙晚年的继承困局", "b": "康熙晚年诸皇子结党争夺储位，朝臣分裂，政务受影响。没有明确的继承规则，权力交接就必然演变成派系斗争。", "x": "继承制度不清晰，代价是整个朝廷的注意力。"}, {"e": "清", "t": "雍正为什么被骂得那么狠", "b": "雍正严苛、勤政、追缴亏空、整顿吏治，得罪了大批既得利益者，死后流言极多。改革者往往在任时就被写坏，评价要看他做成了什么。", "x": "被骂得最凶的人，可能恰恰在动最硬的骨头。"}, {"e": "清", "t": "密折制度：皇帝绕过整个官僚系统", "b": "雍正扩大密折制度，官员可以直接给皇帝上密报，内容不经上级。皇帝拿到更多真实信息，但官员之间互相监视，猜忌成为常态。", "x": "改变信息流的方向，就改变了权力的形状。"}, {"e": "清", "t": "军机处：效率最高的机构，也最没有制约", "b": "雍正设立军机处，处理紧急军务，后来成为实际的中枢。它办事快、保密强，但完全依附皇帝，没有独立权力。", "x": "跑得最快的机构，往往也是最没有刹车的。"}, {"e": "清", "t": "养廉银：用钱来解决贪腐", "b": "雍正推行养廉银，给官员远高于俸禄的补贴，希望以此减少贪腐。短期有效，但总督巡抚的开支和摊派依然存在，问题没有根除。", "x": "提高待遇能缓解症状，不改结构就治不了病根。"}, {"e": "清", "t": "摊丁入亩全覆盖：清代的财政底盘", "b": "雍正时摊丁入亩在全国推开，丁税并入地税，无地农民的负担减轻，人口登记随之宽松，清代人口在十八世纪大幅增长。", "x": "一项税制改动能悄悄改变一整个世纪的人口曲线。"}, {"e": "清", "t": "改土归流：把土司换成流动的官", "b": "雍正年间在西南推行改土归流，废除世袭土司，改派流动的流官。中央对边疆的控制加强，但过程中的冲突与反抗也不少。", "x": "把世袭换成可替换的，才能真正收进中央。"}, {"e": "清", "t": "乾隆的十全武功，账怎么算", "b": "乾隆自述十全武功，包括平准噶尔、定回部、征缅甸、安南等。疆域达到极盛，代价是财政消耗巨大，部分战役打得相当勉强。", "x": "把战果集中宣传，容易掩盖付出的成本。"}, {"e": "清", "t": "《四库全书》：最大的典籍工程，也是最大的一次筛选", "b": "乾隆修《四库全书》，收录三千多种书，同时大量禁毁被认为有问题的著作。整合知识的同时，也在决定哪些知识不该被记住。", "x": "整理和删除，往往在同一项工程里完成。"}, {"e": "清", "t": "文字狱：清代思想最紧的几十年", "b": "康雍乾三朝文字狱频发，一句诗、一个别号都可能招祸。读书人转向考据与经学，避开时政议论。", "x": "当表达的风险太高，创新会转向安全的地方。"}, {"e": "清", "t": "广州十三行：唯一对外的窗口", "b": "乾隆时规定西洋贸易只能通过广州，由十三行商人代理。贸易被集中管理，方便控制，也让信息和技术输入变得极其有限。", "x": "把门留成一条缝，进来的东西也就只有那么一点。"}, {"e": "清", "t": "马戛尔尼访华：两个世界第一次正面碰撞", "b": "1793 年英国使团来华，请求扩大通商，清廷按朝贡礼仪接待，拒绝了请求。双方都没听懂对方在说什么，代价在几十年后支付。", "x": "沟通失败往往不是谈崩了，而是从头就没在同一个频道上。"}, {"e": "清", "t": "大小金川：一场花掉巨款的边地战争", "b": "乾隆两次用兵大小金川，地形险恶、碉楼坚固，清军伤亡与军费消耗巨大。这是盛世里最费钱的一场战争。", "x": "账面繁荣底下，总有一笔被忽略的开支。"}, {"e": "清", "t": "土尔扈特东归：一场横跨草原的大迁徙", "b": "伏尔加河流域的土尔扈特部因沙俄压迫决定东归，历时数月、损失惨重，最终抵达伊犁，被清廷接纳安置。", "x": "一个群体选择去哪里，往往能说明它在那里过不下去。"}, {"e": "清", "t": "白莲教起义：盛世末尾的第一道裂缝", "b": "嘉庆初年白莲教起义波及数省，清廷调集大量兵力镇压，耗时九年，军费消耗严重。这场战争标志清朝由盛转衰。", "x": "转折点常常出现在看起来最安稳的时候。"}, {"e": "清", "t": "和珅跌倒，嘉庆吃饱", "b": "乾隆晚年宠信和珅，贪腐积累巨大；嘉庆即位后查抄和珅家产，数额震惊朝野。抄家能补一时国库，补不了制度上的漏洞。", "x": "靠抄一个人救急，说明问题不在那个人身上。"}, {"e": "清·嘉道", "t": "嘉道中衰：一个王朝的缓慢漏气", "b": "嘉庆、道光两朝没有大的战乱，却问题频出：吏治腐败、财政紧张、河道失修、白银外流。表面平稳，底下的缓冲垫一点点被磨薄。", "x": "衰落很少是突然发生的，更多是缓冲余地一点一点被耗掉。"}, {"e": "清·道光", "t": "白银外流：鸦片背后的货币危机", "b": "十九世纪初英国向中国大量输入鸦片，中国白银持续外流，银贵钱贱，农民实际税负加重。鸦片问题首先是经济问题，不只是道德问题。", "x": "看起来是风气的问题，算下来往往是账的问题。"}, {"e": "清·道光", "t": "林则徐禁烟：一次坚决但不彻底的行动", "b": "1839 年林则徐在虎门销毁两万余箱鸦片，态度坚决。但他和清廷对英国的反应估计不足，也没有相应军备作为后盾。", "x": "决心可以快，配套的能力不会跟着决心一起长出来。"}, {"e": "清·道光", "t": "定海、镇江：清军为什么打不过", "b": "鸦片战争中英军舰队沿海机动，清军火炮射程短、指挥分散，各口岸之间难以互相支援。战争暴露的是体系差距，不是勇气差距。", "x": "在体系级别的差距面前，个体的勇敢解决不了问题。"}, {"e": "清·道光", "t": "《南京条约》：中国近代第一个不平等条约", "b": "1842 年条约规定割让香港岛、赔款两千一百万银元、开放五口通商、协定关税。协定关税这一条影响最深远，中国失去了自主定税的权力。", "x": "最伤人的条款往往不在明面上的赔款里。"}, {"e": "清·咸丰", "t": "《瑷珲条约》与东北的失地", "b": "1858 年沙俄趁第二次鸦片战争之机，迫使黑龙江将军奕山签订瑷珲条约，割去黑龙江以北六十多万平方公里土地。", "x": "别人打仗的时候，最容易在旁边丢东西。"}, {"e": "清·咸丰", "t": "《天津条约》《北京条约》：更多的开口与权限", "b": "第二次鸦片战争后，清政府签订天津条约与北京条约，增开商埠、允许公使驻京、允许传教、割让九龙司。外国势力从沿海进入首都。", "x": "让步一旦形成惯例，就会变成下一轮谈判的起点。"}, {"e": "清·咸丰", "t": "咸丰为什么觉得自己委屈", "b": "咸丰继位就撞上太平天国与英法联军，勤于批折却一再误判。他继承的是一套已经无法应对新局面的制度，个人的勤勉顶不住整体的失灵。", "x": "一个人的努力，填不平一整个体系的窟窿。"}, {"e": "清·咸丰", "t": "逃往热河：皇帝一走，中枢就空了", "b": "1860 年英法联军逼近北京，咸丰逃往承德，留下奕訢在京议和。皇帝离开政治中心，决策与信息都变得迟滞。", "x": "关键人物离场，组织就会陷入没有主心骨的等待。"}, {"e": "清·咸丰", "t": "辛酉政变：慈禧上台的那一年", "b": "咸丰死后，肃顺等八大臣辅政，慈禧与恭亲王奕訢联手发动政变，肃顺被处死，两宫垂帘听政。晚清半个世纪的政治格局在此定型。", "x": "权力交接的瞬间，决定后面几十年的走向。"}, {"e": "清·咸丰", "t": "太平天国：一场持续十四年的内战", "b": "1851 年洪秀全在金田起义，建号太平天国，攻下南京后改名天京，控制大半个江南。清廷的正规军屡战屡败，只能依靠地方团练。", "x": "正规军打不动的仗，最后交给了体制外的力量。"}, {"e": "清·咸丰", "t": "圣库制度：能打仗，不能治国", "b": "太平天国推行圣库制，财产充公、统一分配，在战争时期能集中资源，但长期无法激励生产，占领区的经济很快难以为继。", "x": "能动员的制度，不等于能持续运转的制度。"}, {"e": "清·咸丰", "t": "天京事变：内部一刀比外部更致命", "b": "1856 年天京内部权力斗争激化，杨秀清被杀，韦昌辉又被处死，石达开率部出走。太平天国元气大伤，从此由盛转衰。", "x": "撑得住外部压力，未必撑得住内部的账。"}, {"e": "清·咸丰", "t": "湘军：体制外的军队救了体制", "b": "曾国藩以书生带兵，招募同乡、自筹军饷，湘军成为平定太平天国的主力。军队由地方组织起来，中央对军权的垄断就此松动。", "x": "到了危急时刻借来的力量，事后不容易收回。"}, {"e": "清·咸丰", "t": "厘金：一个临时税种活了几十年", "b": "为筹措军饷，清廷允许地方设卡征收过境税，即厘金。它效率高、见效快，但层层设卡，成为商业流通的长期负担。", "x": "应急的办法一旦好用，就没多少人愿意再改回去。"}, {"e": "清·咸丰", "t": "总理衙门：清廷第一个外交机构", "b": "1861 年设立总理各国事务衙门，由奕訢主持，处理对外交涉、通商、海防等事务。传统朝贡体系之外，终于有了一个现代意义上的对外机构。", "x": "承认需要专门机构处理某件事，本身就是一次观念转变。"}, {"e": "清·同治", "t": "洋务运动：只换工具，不动结构", "b": "曾国藩、李鸿章、左宗棠等人办工厂、设船政局、练新军，主张师夷长技以制夷。技术层面的追赶推进得很快，制度层面的改革几乎没动。", "x": "只换工具、不改结构，关键时刻就会被打回原形。"}, {"e": "清·同治", "t": "江南制造总局：中国第一座机器工厂", "b": "1865 年李鸿章在上海创办江南制造总局，生产枪炮弹药并附设翻译馆，翻译西方科技书籍，培养了一批早期技术人才。", "x": "一个工厂能带出的，往往不只是产品。"}, {"e": "清·同治", "t": "福州船政局：自己造船的尝试", "b": "左宗棠在福州马尾创办船政局，附设船政学堂，培养了严复、邓世昌等一批人。它让中国第一次系统接触近代造船与海军教育。", "x": "技术引进最值钱的副产品，是人。"}, {"e": "清·同治", "t": "留美幼童：被提前叫回来的那一批孩子", "b": "1872 年起清政府派幼童赴美留学，原定十五年，因担心西化过深在 1881 年提前召回。其中出了詹天佑等人，但多数人的学业被中断。", "x": "担心被改变得太多，往往会失去本来能得到的东西。"}, {"e": "清·同治", "t": "京师同文馆：培养第一批翻译与外交人才", "b": "1862 年设立同文馆，教授外语与西学，是中国最早的近代官办学校之一。反对者认为读洋文有失体统，争议持续多年。", "x": "学习对方的语言，常常比学技术更让人抗拒。"}, {"e": "清·同治", "t": "天津教案：民愤与外交的双重夹击", "b": "1870 年天津因传闻教堂拐卖儿童引发骚乱，法国领事等数十人被杀。曾国藩处理时既遭外国压力，又被国内舆论指责软弱。", "x": "夹在两边的中间人，往往两边都不讨好。"}, {"e": "清·光绪", "t": "左宗棠收复新疆：一场赌国库的远征", "b": "1870 年代阿古柏占据新疆，沙俄占伊犁。左宗棠主张塞防，率军西征，靠借款和转运粮草完成收复，新疆随后建省。", "x": "最难的不是打，是把部队送到能打的地方。"}, {"e": "清·光绪", "t": "海防与塞防之争：有限的银子往哪放", "b": "李鸿章主张优先海防，左宗棠主张塞防，最终两边都办，两边都不够。资源约束下，选择题往往没有让人满意的答案。", "x": "预算不够时，真正的决策是决定哪件事不做。"}, {"e": "清·光绪", "t": "北洋水师：亚洲第一，然后呢", "b": "1888 年成军的北洋水师一度号称亚洲第一，但此后购舰停滞、弹药不足、训练流于形式。领先是暂时的，投入一停就开始落后。", "x": "排名是最会骗人的东西，尤其是靠一次投入换来的排名。"}, {"e": "清·光绪", "t": "甲午战争：输的不只是海战", "b": "1894 年战争在朝鲜爆发，陆战与海战接连失利，北洋水师在威海卫覆没。清廷战前对日本实力评估严重不足。", "x": "判断错了对手，后面的准备都白做。"}, {"e": "清·光绪", "t": "《马关条约》：两亿两白银的重量", "b": "1895 年条约割让台湾、澎湖与辽东，赔款两亿两白银。赔款逼出了后来的借款与列强瓜分，财政被彻底绑住。", "x": "一次赔款的数字，会成为之后十几年的枷锁。"}, {"e": "清·光绪", "t": "三国干涉还辽：弱国需要别人来保", "b": "马关条约后俄德法三国出面干涉，日本退还辽东，清廷以三千万两赎回。表面收复失地，实际上把自己放进了列强的博弈盘里。", "x": "靠别人拿回来的东西，往往要用别的方式还。"}, {"e": "清·光绪", "t": "公车上书：读书人第一次集体发声", "b": "马关条约签订后，康有为等举人上书反对议和，主张变法。虽然没送到皇帝手里，但形成了士人公开议论国事的氛围。", "x": "一个诉求有没有被听到不重要，重要的是有人开始说了。"}, {"e": "清·光绪", "t": "强学会与《时务报》：维新派的传播机器", "b": "康有为办强学会，梁启超主笔《时务报》，用报纸把变法主张传播到各地。思想动员先于政治行动。", "x": "改变舆论的成本一降低，行动的门槛就跟着降低。"}, {"e": "清·光绪", "t": "戊戌变法：一百零三天的改革", "b": "1898 年光绪推行新政，涉及教育、军事、工商、官制，百余日间发布大量诏令，触动了大量既得利益者。", "x": "改革失败往往不是因为目标错，而是节奏超出了承受力。"}, {"e": "清·光绪", "t": "戊戌政变的直接导火索", "b": "变法派试图拉拢袁世凯以武力对抗慈禧，事机泄露，慈禧发动政变，光绪被软禁，谭嗣同等六君子被杀。", "x": "没有可靠力量的政变计划，等于把牌摊给对方看。"}, {"e": "清·光绪", "t": "废除科举前的那场争论", "b": "变法期间主张废八股、改试策论，虽随变法失败而中止，但议题已经摆上台面。制度的改变常常在失败后被下一轮接手。", "x": "失败的主张也可能赢，只是晚几年。"}, {"e": "清·光绪", "t": "义和团：民间焦虑的爆发", "b": "1890 年代末山东直隶教案与民教冲突频发，义和团以扶清灭洋为号，攻击教堂教民。背后是旱灾、失业与对变化的恐惧。", "x": "看起来是情绪的行动，底下是具体的生计问题。"}, {"e": "清·光绪", "t": "庚子西狩：清廷的又一次出逃", "b": "1900 年八国联军攻入北京，慈禧带光绪逃往西安。这是四十年内清廷第二次弃都，中央权威进一步削弱。", "x": "同一个组织如果反复靠撤离保命，最后就没人再当真。"}, {"e": "清·光绪", "t": "《辛丑条约》：四亿五千万两", "b": "1901 年条约规定赔款四亿五千万两，分三十九年还清，本息合计近十亿两，并允许列强驻兵北京至山海关沿线。", "x": "把赔款按人头算，是让每个中国人都背上这笔账。"}, {"e": "清·光绪", "t": "新政：清廷最后一次认真的自救", "b": "1901 年后清廷推行新政，废科举、练新军、办学堂、筹备立宪、奖励实业。改革力度很大，但财政与时间都不站在它这边。", "x": "改革来得太晚时，它本身也会成为旧秩序崩解的一部分。"}, {"e": "清·光绪", "t": "废科举：一条路的终点", "b": "1905 年清廷下诏停止科举，读书人失去延续千年的上升通道，转向新式学堂、军队、商业与革命。这项改革促进了近代化，也移走了一块稳定的基础。", "x": "砸掉一条路时，要想清楚人会往哪里走。"}, {"e": "清·宣统", "t": "新军：清廷亲手培养的掘墓人", "b": "清末编练新军，装备近代、军官多为留学生，但思想上也更接近革命。湖北新军后来成为武昌起义的主力。", "x": "一支军队的组织形式，也会改变它的政治倾向。"}, {"e": "清·宣统", "t": "预备立宪与皇族内阁", "b": "1906 年清廷宣布预备立宪，1908 年颁布《钦定宪法大纲》，1911 年成立内阁，但十三名大臣中满族占九席。承诺一旦被看成敷衍，信任就回不来了。", "x": "给出承诺却不肯真的让权，比不承诺更伤信任。"}, {"e": "清·宣统", "t": "保路运动：一条铁路点燃全国", "b": "1911 年清廷宣布铁路国有，将民办的川汉、粤汉铁路收归，补偿条件引发强烈不满，四川爆发大规模抗议。地方与中央的对立被彻底撕开。", "x": "具体的利益问题，最容易变成全国性的情绪。"}, {"e": "清·宣统", "t": "武昌起义：一颗子弹引发的连锁", "b": "1911 年 10 月 10 日新军起义，占领武昌，各省随后纷纷宣布独立。清廷此时已无力调动可靠军队，只能请袁世凯出面。", "x": "压垮系统的往往不是最强的一击，而是最后一下。"}, {"e": "清·宣统", "t": "袁世凯的算术：谁能调动军队谁说了算", "b": "袁世凯掌控北洋新军，在清廷与革命党之间周旋，一面逼清帝退位，一面与南方谈判，最终成为民国临时大总统。", "x": "到了最后，决定权落在谁手里，比谁更有道理更重要。"}, {"e": "清·宣统", "t": "清帝退位：中国最后一份退位诏书", "b": "1912 年 2 月 12 日宣统退位，诏书由张謇起草，承认共和，延续两千一百多年的帝制结束。", "x": "制度的终结往往是一纸文书，但支撑它的结构早就松了。"}, {"e": "清·宣统", "t": "孙中山与辛亥革命的角色", "b": "孙中山长期在海外组织革命、宣传三民主义，武装起义多次失败。辛亥革命爆发时他不在国内，但此前的舆论与组织积累不可替代。", "x": "关键事件的爆发看似偶然，背后是长期的准备。"}, {"e": "清·制度", "t": "军机处与内阁：清朝的中枢怎么运转", "b": "清朝政务实际由军机处拟旨、皇帝朱批后执行，内阁处理日常。中枢机构重叠，相互牵制，效率取决于皇帝个人的精力。", "x": "权力越集中，运转效率就越依赖一个人的状态。"}, {"e": "清·制度", "t": "满汉双轨：一个政权两种官员", "b": "清朝重要职位多设满汉两员，相互牵制。满族在核心职位上占据优势，汉族官员实际治理地方。这种安排维持了平衡，也限制了用人。", "x": "为防止某一方坐大而设计的结构，往往牺牲了效率。"}, {"e": "清·制度", "t": "督抚与中央：地方权力为何越来越重", "b": "太平天国以后，地方督抚掌握军队、财权与人事，中央对南方的控制减弱。清后期很多决策实际上是地方在做。", "x": "中央把救火的任务交给地方，火权也一并交出去了。"}, {"e": "清·制度", "t": "捐纳制度：卖官的那笔账", "b": "清朝允许捐钱买官，以补财政缺口。短期填补了收入，长期让官场充斥不专业的人，也让行政效率持续下滑。", "x": "一旦把公职当成商品，治理的质量就很难保证。"}, {"e": "清·制度", "t": "漕运与盐政：清朝的两大财源", "b": "清朝靠运河漕粮供应北京，靠盐专卖获得巨额收入。运河淤塞与私盐泛滥让这两项优势逐渐削弱，财政随之紧张。", "x": "财政的根基一旦松动，所有问题都会跟着冒出来。"}, {"e": "清·制度", "t": "保甲制度：国家治理的最末端", "b": "清代地方以保甲编户，负责治安、催税、统计人口。国家治理只到县一级，基层实际依靠宗族与乡绅维持。", "x": "治理成本过高时，国家会把一部分责任留给社会自己。"}, {"e": "清·制度", "t": "幕府与师爷：衙门里真正办事的人", "b": "清代官员多不熟悉律例与钱粮，实权往往在幕僚手里，刑名、钱谷师爷是地方行政的实际执行者。", "x": "名义上的权力和实际办事的人，常常不是同一批。"}, {"e": "清·制度", "t": "《大清律例》：帝国的行为边界", "b": "清代律例详细规定刑罚与行政规则，是帝国治理的重要依据。它稳定了秩序，但也让地方司法高度依赖条文与惯例。", "x": "规则越细，越能减少随意，也越容易跟不上变化。"}, {"e": "清·社会", "t": "清代的人口爆炸", "b": "清代人口从一亿多增长到四亿左右，得益于长期和平、摊丁入亩、新作物推广。人口压力同时意味着人均资源紧张。", "x": "总量增长的背后，往往是每个人分到的越来越少。"}, {"e": "清·社会", "t": "番薯与玉米：养活中国的美洲作物", "b": "番薯、玉米、马铃薯自明末传入，清代在山地丘陵广泛种植，支撑了人口增长，也带来过度开垦与水土流失。", "x": "救急的办法，用久了也会变成新的负担。"}, {"e": "清·社会", "t": "一条辫子的政治含义", "b": "剃发留辫是清朝统治的象征，清初强制推行，清末又成为革命的对象。同一件事，在不同时期被读成完全相反的信号。", "x": "符号的意义，往往由当时的人赋予，而不是它本身。"}, {"e": "清·社会", "t": "缠足：一个社会的自我约束", "b": "缠足在清代社会各阶层广泛存在，既是审美偏好，也是婚姻竞争的结果。直到清末才被逐渐视为陋习而反对。", "x": "一种伤害被普遍接受时，往往不是没人看见，而是没人能先停下。"}, {"e": "清·社会", "t": "清代女性的实际位置", "b": "女性在法律与礼教上受压制，但实际经济与家庭角色复杂，寡妇主家、女性经营商业并不罕见。规范与生活之间总有距离。", "x": "制度写得再严，生活也会自己找到缝隙。"}, {"e": "清·社会", "t": "宗族：乡村的自我治理", "b": "清代宗族通过族田、祠堂、族规管理成员，处理纠纷与救济。国家无力覆盖的基层事务，很大一部分落在宗族身上。", "x": "公共治理不足时，社会会自己长出一些结构。"}, {"e": "清·社会", "t": "会馆与商帮：流动人口的组织", "b": "清代商业发达，同乡商人设会馆，提供住宿、借贷、调解与互助，晋商、徽商由此形成全国网络。", "x": "人一旦流动起来，就会需要新的组织来接住他们。"}, {"e": "清·社会", "t": "晋商与票号：中国早期的金融网络", "b": "山西商人经营票号，做汇兑与存放款业务，分号遍及全国。信用靠同乡与宗族关系保障，在没有现代银行的时代运转了几百年。", "x": "信任这个东西，可以靠关系替代制度运转一阵子。"}, {"e": "清·社会", "t": "徽商：靠科举与商业的结合", "b": "徽商经营盐、茶、木材与典当，重视子弟读书，商而优则仕。商业资本与科举身份相互支撑。", "x": "资本与身份结合，是最稳的一种积累方式。"}, {"e": "清·社会", "t": "清代的城市与市镇", "b": "清代江南市镇密集，工商业与手工业发达，苏州、杭州、汉口等城市人口众多。城市化带来新的社会问题与管理需求。", "x": "城市一变大，旧的治理方式就不够用了。"}, {"e": "清·社会", "t": "《红楼梦》背后的清代社会", "b": "曹雪芹写贾府的兴衰，展示清代贵族家庭的经济结构、人际网络与礼法压力。一个家族的败落，也在写制度如何运转。", "x": "最好的社会史，常常藏在小说里。"}, {"e": "清·社会", "t": "京剧的形成", "b": "清代徽班进京，融合昆曲、秦腔等，形成京剧。宫廷与市民的双重需求，共同推动了这门艺术。", "x": "一种艺术成熟，往往需要两边同时喜欢它。"}, {"e": "清·对外", "t": "朝贡体系：清廷理解世界的框架", "b": "清朝以朝贡关系理解对外交往，视外国为藩属或蛮夷。这套框架在遇到平等交往的要求时，既无法理解，也无法应对。", "x": "理解世界用的框架，决定了你能看见什么、又看不见什么。"}, {"e": "清·对外", "t": "广州体制：只有一条缝的通商", "b": "乾隆以后西洋贸易限于广州，由十三行代理，外商活动受限。贸易集中在一点，信息与技术输入也同样被压缩。", "x": "把门留成一条缝，进来的东西也就只有那么一点。"}, {"e": "清·对外", "t": "传教士与西学东渐", "b": "明末清初耶稣会士带来天文、历法、地图与数学知识，在宫廷任职。后来礼仪之争导致传教受限，交流中断。", "x": "知识的流动常常走一条非正式的窄路，断了就很难恢复。"}, {"e": "清·对外", "t": "礼仪之争：跪与不跪的问题", "b": "罗马教廷禁止中国教徒祭祖祭孔，康熙认为这是干涉内政，下令禁教。文化交流中最难谈的，往往不是知识，而是规则。", "x": "看起来是礼节的分歧，实际上是权威归属的分歧。"}, {"e": "清·对外", "t": "徐继畬与《瀛寰志略》", "b": "徐继畬在福建任职时搜集资料，编成《瀛寰志略》，介绍各国地理与政体，其中对美国制度的描述相当正面。此书在当时影响有限。", "x": "有人已经看清了，不等于整个系统会跟着改变。"}, {"e": "清·对外", "t": "魏源与《海国图志》", "b": "魏源编《海国图志》，提出师夷长技以制夷，介绍各国地理与军事技术。书在中国反响平平，在日本却被广泛阅读。", "x": "同一条信息，落在不同的环境里，价值完全不同。"}, {"e": "清·对外", "t": "郭嵩焘：第一个驻外使节的孤立", "b": "郭嵩焘出使英国，认真观察西方制度与生活，写日记如实记录，却被朝野斥为崇洋。他回国后几乎被排挤。", "x": "最先看见真相的人，往往最先被自己人攻击。"}, {"e": "清·对外", "t": "关税自主权的丧失", "b": "鸦片战争后协定关税，中国不能自主设定进口税率，税率长期很低。海关收入成为财政支柱，但税率由别人决定。", "x": "把一项关键权力交出去，恢复起来要花很久。"}, {"e": "清·对外", "t": "海关总税务司与赫德", "b": "英国人赫德长期主持中国海关，建立了高效、廉洁的税务体系，同时深度参与外交事务。能力很强，但权力掌握在外国人手里。", "x": "效率高的机构，如果归属不清，也是一种风险。"}, {"e": "清·对外", "t": "甲午之后的瓜分狂潮", "b": "1895 年后列强争相租借港口、划分势力范围，中国面临被瓜分的危机。危机会同时催生改革与激进化。", "x": "外部压力最大的时候，内部往往也最分裂。"}, {"e": "清·人物", "t": "康熙：一个长期执政者做了什么", "b": "康熙在位六十一年，平三藩、收台湾、抗沙俄、编《康熙字典》，同时晚期吏治松弛、继承问题未决。长任期既积累成就，也积累问题。", "x": "在位越久，留下的未解决问题也越多。"}, {"e": "清·人物", "t": "雍正：十三年把制度拧了一遍", "b": "雍正勤政、严苛，推行摊丁入亩、密折、军机处、养廉银，整顿财政与吏治。他做的多是费力不讨好的基础工作。", "x": "最不显眼的制度建设，往往决定后面几十年的稳定。"}, {"e": "清·人物", "t": "乾隆：把盛世用完了", "b": "乾隆前期疆域扩张、文化工程浩大，后期宠信和珅、吏治败坏、财政透支。一个盛世在他手里走向尽头。", "x": "盛世的消耗，往往在同一代人身上完成。"}, {"e": "清·人物", "t": "和珅：一个人能贪到什么程度", "b": "和珅受乾隆宠信，身兼多职，聚敛巨额财富，嘉庆即位后被赐死抄家。个人得势的极限，也取决于制度对他的约束有多松。", "x": "一个人的胃口，取决于容器有多松。"}, {"e": "清·人物", "t": "纪晓岚与《四库全书》", "b": "纪昀主持《四库全书》编纂，整理了大量典籍，也在查禁书籍的过程中承担了大量工作。", "x": "整理和删除，常常出自同一双手。"}, {"e": "清·人物", "t": "曹雪芹：把家族兴衰写成书", "b": "曹雪芹出身江宁织造世家，家道中落后写《红楼梦》，以贾府兴衰写出清代社会的结构与人心。", "x": "最深的观察，常常来自自己失去的东西。"}, {"e": "清·人物", "t": "林则徐：认真但不完全清醒", "b": "林则徐禁烟坚决，收集西洋资料编《四洲志》，但同样受限于时代认知，对英国的军事反应估计不足。", "x": "再认真的人，也受限于他所在时代的边界。"}, {"e": "清·人物", "t": "曾国藩：笨办法与硬功夫", "b": "曾国藩以结硬寨、打呆仗著称，重视后勤与组织，办湘军、开洋务。他不投机，靠可靠的组织一点一点推进。", "x": "面对复杂局面，笨办法常常是有效办法。"}, {"e": "清·人物", "t": "李鸿章：替清廷签了最多的字", "b": "李鸿章掌握北洋与外交资源，代表清廷签订马关、辛丑等条约。他既是能力最强的实务者，也是被骂得最多的人。", "x": "站在最前面的人，往往要替整个系统担责。"}, {"e": "清·人物", "t": "左宗棠：抬着棺材去西北", "b": "左宗棠主张塞防，率军收复新疆，坚持寸土不让。他办事风格强硬，与李鸿章多有冲突。", "x": "有些事不坚持，就真的没有了。"}, {"e": "清·人物", "t": "张之洞：中学为体，西学为用", "b": "张之洞办汉阳铁厂、自强学堂，提出中学为体西学为用，试图在保留制度的前提下引进技术。这条路线后来被证明走不通。", "x": "只借用工具而不改结构，最终还是会被逼到结构上。"}, {"e": "清·人物", "t": "康有为：托古改制", "b": "康有为借孔子的名义推动变法，著《新学伪经考》《孔子改制考》，用旧权威包装新主张以减小阻力。", "x": "改动的阻力越大，越需要借旧的外壳。"}, {"e": "清·人物", "t": "梁启超：一支笔的力量", "b": "梁启超流亡日本后办《清议报》《新民丛报》，以通俗有力的文章传播新思想，影响了一代青年。", "x": "在没有权力的地方，文字仍然可以塑造一代人。"}, {"e": "清·人物", "t": "谭嗣同：可以选择走却留下的人", "b": "戊戌政变后谭嗣同拒绝出逃，说各国变法无不从流血而成，最终与其他五人一同被杀。", "x": "有些选择的意义，不在结果，而在它表明了什么。"}, {"e": "清·人物", "t": "慈禧：掌权四十七年的代价", "b": "慈禧以垂帘听政掌握晚清实权，支持过洋务与新政，也支持过义和团。她的判断在关键节点上多次错过时机。", "x": "长期掌权者的判断失误，代价会由整个组织承担。"}, {"e": "清·人物", "t": "奕訢：被猜忌的有能力者", "b": "恭亲王奕訢主持总理衙门，是晚清少有的了解对外事务的高层，但长期受到慈禧猜忌，难以施展。", "x": "对有能力者的猜忌，本身就是一种治理成本。"}, {"e": "清·人物", "t": "光绪：有心无力的皇帝", "b": "光绪支持戊戌变法，但无实权、无军队、无地方支持，政变后被软禁。志愿与能力之间隔着一整套结构。", "x": "只有意愿没有实权，改革就无法落地。"}, {"e": "清·人物", "t": "袁世凯：在最关键处站着的人", "b": "袁世凯掌握北洋新军，在清廷与革命党之间周旋，逼清帝退位后成为民国大总统，后来又试图称帝失败。", "x": "谁掌握兵力，谁就有资格谈条件。"}]}];
window.__GLOSSARY__ = {"孔子": "春秋鲁国人，儒家创始人。做过鲁国司寇，政治主张没被采纳，后半生办学讲学，主张以礼和道德秩序治理社会。", "老子": "春秋时期思想家，道家代表。主张少干预、顺自然，认为反复折腾往往带来更坏的后果。", "墨子": "战国时期思想家，墨家创始人。主张兼爱、非攻，同时擅长守城器械和组织纪律，是先秦少有的技术型团体。", "韩非": "战国末期法家代表，韩国公子。主张以法、术、势治国，让治理不依赖个人贤能，不依赖贤人。", "商鞅": "战国时期秦国改革家。推行军功授爵、废井田、奖励耕战，把秦国改造成高度动员的国家机器。", "管仲": "春秋时期齐国政治家，辅佐齐桓公称霸。善用经济手段，被后世视为早期重商与宏观调控的代表。", "屈原": "战国时期楚国大夫、诗人。主张联齐抗秦，不被采纳而流放，作《离骚》，最终投汨罗江。", "陈胜": "秦末农民起义领袖，与吴广在大泽乡起事，是第一次大规模反秦起义。", "吴广": "秦末起义领袖，与陈胜一同在大泽乡起兵，后被部下所杀。", "秦始皇": "名嬴政，结束战国分裂建立秦朝，统一文字、度量衡、货币，推行郡县制，也因高压统治迅速亡国。", "李斯": "秦朝丞相，法家代表。辅佐秦始皇统一制度，也参与沙丘之变，后被赵高陷害处死。", "刘邦": "汉高祖，起于沛县，推翻秦朝、击败项羽建立汉朝，实行郡国并行与休养生息。", "项羽": "秦末西楚霸王，巨鹿之战击败秦军主力，后与刘邦争天下，垓下兵败自刎。", "汉武帝": "名刘彻，西汉第七位皇帝。北击匈奴、通西域、独尊儒术，同时盐铁官营，连年征战耗尽民生。", "司马迁": "西汉史学家。因替李陵辩护受宫刑，忍辱完成《史记》，开创纪传体通史。", "张骞": "西汉使者。两次出使西域，本为联合大月氏夹击匈奴，军事目的落空，却打通了丝绸之路。", "王莽": "西汉外戚，代汉建立新朝。照《周礼》强行复古改制，失败后新朝速亡。", "刘秀": "汉光武帝，东汉开国皇帝。战乱后休养生息、裁撤冗员，重建中央集权的文书行政。", "蔡伦": "东汉宦官，改进造纸术，使纸张逐渐取代竹简，书籍成本大幅下降。", "曹操": "东汉末政治家、军事家。统一北方，推行屯田，为曹魏奠基，一生未称帝。", "刘备": "三国时期蜀汉开国皇帝，以宗室身份起兵，据益州与蜀汉对抗曹魏、东吴。", "孙权": "三国时期东吴建立者，据长江天险，与魏、蜀鼎立，开发江南。", "诸葛亮": "三国时期蜀汉丞相，辅佐刘备、刘禅，主政蜀汉，以《出师表》与北伐著称。", "祖逖": "东晋将领，自行招募军队北伐，一度收复黄河以南，因朝廷支持不足无功。", "苻坚": "前秦皇帝，统一北方后南征东晋，在淝水之战大败，前秦随后崩解。", "孝文帝": "北魏皇帝拓跋宏，迁都洛阳，推行改汉姓、穿汉服、说汉话的汉化改革。", "高欢": "东魏权臣，六镇之乱后崛起，掌控东魏朝政，为北齐奠基。", "宇文泰": "西魏权臣，创立府兵制雏形，为北周和隋唐的军事制度打下基础。", "隋炀帝": "名杨广，隋朝第二位皇帝。修大运河、建东都、三征高句丽，工程与战争叠加压垮民力。", "唐太宗": "名李世民，唐朝第二位皇帝。以纳谏著称，与魏征等讨论隋亡教训，开创贞观之治。", "魏征": "唐太宗时期名臣，以敢言直谏著称，前后上谏二百余事。", "武则天": "唐朝女皇，先为高宗皇后，后称帝改国号周。提拔寒门、设北门学士，也任用酷吏清除异己。", "玄奘": "唐代高僧，西行天竺取经，归国后主持译经，著《大唐西域记》。", "鉴真": "唐代高僧，六次东渡日本，最终抵达，传播律宗与建筑、医药技术。", "安禄山": "唐朝节度使，兼领平卢、范阳、河东三镇，755 年发动安史之乱。", "史思明": "唐朝节度使，与安禄山共同发动安史之乱，后自立为帝，被其子所杀。", "杜甫": "唐代诗人，经历安史之乱，作品记录战乱中的民生，被称为诗史。", "李白": "唐代诗人，盛唐气象的代表，诗风豪放，一生仕途不顺。", "黄巢": "唐末起义领袖，从山东起兵，转战大半个中国，攻入长安，加速唐朝灭亡。", "宋太祖": "名赵匡胤，宋朝开国皇帝。陈桥兵变黄袍加身，杯酒释兵权，确立重文轻武的国策。", "王安石": "北宋政治家，主持熙宁变法，推行青苗、免役、市易等法，意在富国强兵，执行中多有扰民。", "司马光": "北宋政治家、史学家，反对王安石变法，主持编撰编年体通史《资治通鉴》。", "苏轼": "北宋文学家，因乌台诗案被贬，一生宦海起伏，诗文书画皆成大家。", "沈括": "北宋科学家，著《梦溪笔谈》，记录毕昇活字印刷等重要技术。", " <script>
/* ==========================================================================
   卡片 · 逻辑
   数据从 window.__THEMES__ 读（build.py 注入）。
   ========================================================================== */

/* ---------- 配置 ---------- */
const CONFIG = {
  decay: 0.3,        // 看过一次后的权重倍数
  floor: 0.03,       // 权重下限，避免老卡片彻底不出现
  recent: 8,         // 最近抽过的若干张不重复
  threshold: 55,     // 滑动多少像素算翻页
  axisLock: 8        // 手势方向判定阈值
};

const KEY_THEME = 'cards.theme.v1';

/* ---------- 状态 ---------- */
let theme = null;
let pool = [];
let seen = {};
let history = [];
let curIdx = -1;

const stage = document.getElementById('stage');
const sheet = document.getElementById('sheet');
const themeList = document.getElementById('themeList');

/* ---------- 存储 ---------- */
function seenKey() {
  // 带上内容版本号：卡片内容一变，旧的阅读记录自动作废
  return 'cards.seen.' + theme.id + '.' + (window.__VERSION__ || 'v1');
}

function loadSeen() {
  try {
    const raw = JSON.parse(localStorage.getItem(seenKey()) || '{}');
    if (!raw || typeof raw !== 'object') return {};
    // 卡片数量变化后，越界的旧索引会污染统计，这里直接丢掉
    const clean = {};
    for (const k in raw) {
      const i = Number(k);
      if (Number.isInteger(i) && i >= 0 && i < pool.length) clean[i] = raw[k];
    }
    return clean;
  } catch (e) { return {}; }
}

function saveSeen() {
  try { localStorage.setItem(seenKey(), JSON.stringify(seen)); } catch (e) {}
}

/* ---------- 权重抽取 ---------- */
function weightOf(i) {
  const n = Number(seen[i]) || 0;
  if (!n) return 1;
  return Math.max(CONFIG.floor, Math.pow(CONFIG.decay, n));
}

function pick(exclude) {
  exclude = exclude || [];
  let total = 0;
  const weights = [];
  for (let i = 0; i < pool.length; i++) {
    const w = exclude.indexOf(i) >= 0 ? 0 : weightOf(i);
    weights.push(w);
    total += w;
  }
  if (total <= 0) {
    // 全部看过了：均匀随机，但尽量避开刚看过的
    const avail = [];
    for (let i = 0; i < pool.length; i++) if (exclude.indexOf(i) < 0) avail.push(i);
    const src = avail.length ? avail : Array.from({ length: pool.length }, (_, i) => i);
    return src[Math.floor(Math.random() * src.length)];
  }
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return pool.length - 1;
}

/* ---------- 顶部信息 ---------- */
function seenCount() {
  let n = 0;
  for (const k in seen) {
    // 只统计当前池子范围内的索引（卡片内容换过之后，旧记录会越界）
    const i = Number(k);
    if (seen[k] > 0 && i >= 0 && i < pool.length) n++;
  }
  return n;
}

function updateHeader() {
  document.getElementById('themeName').textContent = theme.name;
  document.getElementById('seen').innerHTML =
    '已看 <b>' + seenCount() + '</b> / ' + pool.length;
}

/* ---------- 渲染 ---------- */
function place(el, offsetY, scale, opacity) {
  el.style.transform = 'translate3d(0, calc(-50% + ' + offsetY + 'px), 0) scale(' + scale + ')';
  el.style.opacity = String(opacity);
}

function markSeen(i) {
  seen[i] = (seen[i] || 0) + 1;
  saveSeen();
  updateHeader();
}

/** 把卡片内容刷成第 i 张（复用同一个元素） */
function fillCard(el, i) {
  const c = pool[i];
  el.innerHTML = '<div class="era"></div><h2></h2><p></p><div class="think"></div>';

  const era = el.querySelector('.era');
  if (c.e) era.textContent = c.e; else era.remove();

  el.querySelector('h2').textContent = c.t;
  el.querySelector('p').innerHTML = markTerms(c.b, c.terms);
  bindTerms(el);

  const think = el.querySelector('.think');
  if (c.x) think.textContent = c.x; else think.remove();

  el.dataset.i = i;
  curIdx = i;
  markSeen(i);
}

/**
 * 始终只有两张卡在动：current（当前）和 incoming（新滑进来的）。
 * 无论怎么连滑，当前卡片的 opacity 永远被设回 1，不会停在 0。
 */
function render(i, fromDir) {
  if (!pool.length) return;
  i = Math.max(0, Math.min(i, pool.length - 1));

  const dir = fromDir || 0;
  resetGestures();

  // 把上一轮遗留的 incoming 收掉
  stage.querySelectorAll('.card').forEach((c, idx, arr) => {
    if (idx < arr.length - 1) c.remove();
  });

  let cur = stage.querySelector('.card');
  if (!cur) {
    cur = document.createElement('div');
    cur.className = 'card';
    stage.appendChild(cur);
    fillCard(cur, i);
    cur.style.transition = 'none';
    place(cur, 0, 1, 1);
    bindSwipe(cur);
    return;
  }

  if (dir === 0) {
    // 切主题 / 初始化：直接替换内容
    fillCard(cur, i);
    cur.style.transition = '';
    cur.style.pointerEvents = '';
    place(cur, 0, 1, 1);
    bindSwipe(cur);
    return;
  }

  // 新卡从滑动来的方向进入
  const incoming = document.createElement('div');
  incoming.className = 'card';
  stage.appendChild(incoming);
  fillCard(incoming, i);
  bindSwipe(incoming);

  incoming.style.transition = 'none';
  place(incoming, dir * 46, 0.96, 0);
  requestAnimationFrame(() => {
    incoming.style.transition = '';
    place(incoming, 0, 1, 1);
  });

  // 旧卡离开
  const old = cur;
  old.style.transition = '';
  old.style.pointerEvents = 'none';
  old.style.transform = 'translate3d(0, calc(-50% + ' + (-dir * 46) + 'vh), 0)';
  old.style.opacity = '0';
  setTimeout(() => { if (old.parentNode) old.remove(); }, 420);
}

function next() {
  history.push(curIdx);
  const recent = history.slice(-CONFIG.recent).concat([curIdx]).filter(x => x >= 0);
  render(pick(recent), 1);
}

function prev() {
  if (history.length < 2) return;
  history.pop();
  render(history[history.length - 1], -1);
}

/* ---------- 手势（上下滑，像短视频那样一屏一张） ---------- */
let gestureLock = false;
let currentCleanup = null;

function bindSwipe(el) {
  el.addEventListener('touchstart', onTouchStart, { passive: true });

  // 鼠标 / 桌面预览
  let my = 0, down = false;
  el.addEventListener('mousedown', e => {
    down = true;
    my = e.clientY;
    el.style.transition = 'none';
  });
  window.addEventListener('mousemove', e => {
    if (!down) return;
    const d = e.clientY - my;
    el.style.transform = 'translate3d(0, calc(-50% + ' + d + 'px), 0)';
  });
  window.addEventListener('mouseup', e => {
    if (!down) return;
    down = false;
    el.style.transition = '';
    const d = e.clientY - my;
    if (d <= -CONFIG.threshold) fan(el, -1);
    else if (d >= CONFIG.threshold) fan(el, 1);
    else place(el, 0, 1, 1);
  });
}

function onTouchStart(e) {
  if (e.touches.length !== 1 || gestureLock) return;
  const el = e.currentTarget;
  const x0 = e.touches[0].clientX;
  const y0 = e.touches[0].clientY;
  let dy = 0, axis = null, done = false;

  el.style.transition = 'none';

  function move(ev) {
    if (!(ev.touches && ev.touches.length)) return;
    const tx = ev.touches[0].clientX;
    const ty = ev.touches[0].clientY;
    dy = ty - y0;
    const dx = tx - x0;

    if (axis === null && (Math.abs(dx) > CONFIG.axisLock || Math.abs(dy) > CONFIG.axisLock)) {
      axis = Math.abs(dy) > Math.abs(dx) ? 'y' : 'x';
    }
    if (axis === 'x') return;

    if (ev.cancelable) ev.preventDefault();
    const damped = dy * 0.92;
    el.style.transform = 'translate3d(0, calc(-50% + ' + damped + 'px), 0)';
    el.style.opacity = String(Math.max(0.35, 1 - Math.abs(damped) / 620));
  }

  function cleanup() {
    window.removeEventListener('touchmove', move);
    window.removeEventListener('touchend', end);
    window.removeEventListener('touchcancel', cancel);
    currentCleanup = null;
  }

  function end() {
    if (done) return;
    done = true;
    cleanup();
    if (axis === 'x') return;

    el.style.transition = '';
    if (dy <= -CONFIG.threshold) fan(el, -1);       // 上滑 → 下一张
    else if (dy >= CONFIG.threshold) fan(el, 1);    // 下滑 → 上一张
    else place(el, 0, 1, 1);
  }

  function cancel() {
    if (done) return;
    done = true;
    cleanup();
    el.style.transition = '';
    place(el, 0, 1, 1);
  }

  currentCleanup = cleanup;
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', end, { passive: true });
  window.addEventListener('touchcancel', cancel, { passive: true });
}

/** 收起旧的手势监听并解锁 */
function resetGestures() {
  if (typeof currentCleanup === 'function') {
    try { currentCleanup(); } catch (e) {}
    currentCleanup = null;
  }
  gestureLock = false;
}

/** 手势确认：dir=-1 下一张（上滑），1 上一张（下滑） */
function fan(el, dir) {
  hidePop();
  el.style.transition = '';
  el.style.transform = 'translate3d(0, calc(-50% + ' + (dir * -1) * 120 + 'vh), 0)';
  el.style.opacity = '0';
  if (dir < 0) next(); else prev();
}

/* ---------- 键盘 ---------- */
window.addEventListener('keydown', e => {
  if (sheet.classList.contains('on')) {
    if (e.key === 'Escape') closeSheet();
    return;
  }
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

/* ---------- 词条 ---------- */
const GLOSSARY = window.__GLOSSARY__ || {};
let activePop = null;
let activeTerm = null;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/**
 * 正文里的词条包成 <span class="term">。
 * 同一张卡里同一个词只标第一次出现；优先匹配长词。
 */
function markTerms(text, allowed) {
  if (!text) return '';
  let keys = Object.keys(GLOSSARY);
  if (allowed && allowed.length) keys = keys.filter(k => allowed.indexOf(k) >= 0);
  keys.sort((a, b) => b.length - a.length);
  if (!keys.length) return escapeHtml(text);

  const used = [];
  let out = '', i = 0;
  while (i < text.length) {
    let hit = null;
    for (const k of keys) {
      if (text.startsWith(k, i) && used.indexOf(k) < 0) { hit = k; break; }
    }
    if (hit) {
      used.push(hit);
      out += '<span class="term" data-term="' + escapeHtml(hit) + '">' + escapeHtml(hit) + '</span>';
      i += hit.length;
    } else {
      out += escapeHtml(text[i]);
      i++;
    }
  }
  return out;
}

function ensurePop() {
  if (activePop) return activePop;
  activePop = document.createElement('div');
  activePop.id = 'pop';
  document.body.appendChild(activePop);
  return activePop;
}

function hidePop() {
  if (activePop) activePop.classList.remove('on');
  activeTerm = null;
}

function showPop(term, anchor) {
  const def = GLOSSARY[term];
  if (!def) return;
  const pop = ensurePop();
  pop.innerHTML = '<b>' + escapeHtml(term) + '</b>' + escapeHtml(def);

  const r = anchor.getBoundingClientRect();
  const pad = 12;
  pop.style.visibility = 'hidden';
  pop.classList.add('on');

  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(pad, Math.min(left, window.innerWidth - pw - pad));

  const above = r.top - ph - 12;
  let top;
  if (above >= pad + 8) {
    top = above;
    pop.classList.remove('below');
    pop.classList.add('above');
  } else {
    top = r.bottom + 12;
    pop.classList.remove('above');
    pop.classList.add('below');
  }

  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.setProperty('--arrow-x', Math.max(14, Math.min(pw - 14, r.left + r.width / 2 - left)) + 'px');
  pop.style.visibility = '';
  activeTerm = term;
}

function bindTerms(el) {
  el.querySelectorAll('.term').forEach(t => {
    t.addEventListener('click', e => {
      e.stopPropagation();
      const term = t.dataset.term;
      if (activeTerm === term && activePop && activePop.classList.contains('on')) hidePop();
      else showPop(term, t);
    });
  });
}

document.addEventListener('touchstart', e => {
  if (e.target.closest && e.target.closest('.term')) return;
  hidePop();
}, { passive: true });
document.addEventListener('mousedown', e => {
  if (e.target.closest && e.target.closest('.term')) return;
  hidePop();
});
window.addEventListener('resize', hidePop);

/* ---------- 主题选择 ---------- */
function renderThemeList() {
  themeList.innerHTML = '';
  window.__THEMES__.forEach(t => {
    const b = document.createElement('button');
    b.className = 'titem' + (t.id === theme.id ? ' now' : '');
    b.innerHTML =
      '<div><span>' + t.name + '</span><small>' + t.desc + '</small></div>' +
      '<span class="dot">●</span>';
    b.onclick = () => switchTheme(t.id);
    themeList.appendChild(b);
  });
}

function openSheet() {
  renderThemeList();
  sheet.classList.add('on');
}

function closeSheet() {
  sheet.classList.remove('on');
}

function switchTheme(id) {
  theme = window.__THEMES__.find(t => t.id === id) || window.__THEMES__[0];
  try { localStorage.setItem(KEY_THEME, theme.id); } catch (e) {}
  pool = theme.cards;
  seen = loadSeen();
  history = [];
  closeSheet();
  updateHeader();
  render(pick([]), 0);
}

document.getElementById('themeBtn').onclick = openSheet;
document.getElementById('closeSheet').onclick = closeSheet;
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

/* ---------- 启动 ---------- */
(function init() {
  const saved = localStorage.getItem(KEY_THEME);
  theme = window.__THEMES__.find(t => t.id === saved) || window.__THEMES__[0];
  pool = theme.cards;
  seen = loadSeen();

  // 只有一个主题时，隐藏切换按钮
  if (window.__THEMES__.length < 2) {
    document.getElementById('themeBtn').style.display = 'none';
  }

  updateHeader();
  render(pick([]), 0);
})();

</script>

</body>
