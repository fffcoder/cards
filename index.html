<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卡片">
<meta name="theme-color" content="#0f0e0c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f0e0c'/%3E%3Crect x='30' y='38' width='120' height='104' rx='12' fill='none' stroke='%23d9bf8a' stroke-width='5'/%3E%3Cpath d='M52 66h76M52 86h76M52 106h48' stroke='%23d9bf8a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>卡片</title>
<style>
/* ==========================================================================
   卡片 · 样式
   改配色改最上面的变量就行，下面的规则基本不用动。
   ========================================================================== */

:root {
  /* 底色与层次 */
  --bg: #0f0e0c;
  --card-a: #221e1a;          /* 卡片渐变的起点 */
  --card-b: #16130f;          /* 卡片渐变的终点 */
  --line: rgba(217, 191, 138, .14);

  /* 文字 */
  --fg: #f2ebdf;              /* 标题 */
  --fg-body: #c2b8aa;         /* 正文 */
  --fg-dim: #8c8175;          /* 时代标签 */
  --fg-faint: #5b544b;        /* 底部提示 */
  --accent: #d9bf8a;          /* 强调色：多想一层、主题名 */

  /* 形状 */
  --radius: 24px;
  --card-w: min(87vw, 430px);

  /* 动效 */
  --ease: cubic-bezier(.22, .9, .3, 1);
  --dur: .36s;

  /* 字号 */
  --t-title: clamp(20px, 5.4vw, 25px);
  --t-body: clamp(14.5px, 4vw, 16px);
  --t-think: clamp(13px, 3.6vw, 14px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

/* ---------- 页面骨架 ---------- */
#deck {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 8px);
}

header {
  flex: 0 0 auto;
  padding: 0 24px 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

#themeBtn {
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: .06em;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
#themeBtn i {
  font-style: normal;
  font-size: 10px;
  opacity: .55;
  transform: translateY(-1px);
}

#seen {
  font-size: 12px;
  letter-spacing: .06em;
  color: #7a7166;
}
#seen b {
  color: var(--accent);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

#stage {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
}

footer {
  flex: 0 0 auto;
  padding: 14px 24px 0;
  text-align: center;
  font-size: 11.5px;
  color: var(--fg-faint);
  letter-spacing: .08em;
}

/* ---------- 卡片 ---------- */
.card {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--card-w);
  margin-left: calc(var(--card-w) / -2);
  transform: translate3d(0, -50%, 0);

  border-radius: var(--radius);
  padding: 32px 26px 30px;
  background: linear-gradient(165deg, var(--card-a), var(--card-b) 70%);
  box-shadow: 0 20px 50px -22px #000, 0 0 0 1px rgba(255, 255, 255, .055) inset;

  transition: transform var(--dur) var(--ease), opacity var(--dur) ease;
  will-change: transform, opacity;
  touch-action: pan-y;

  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: min(46vh, 360px);
  max-height: 74vh;
  overflow: hidden;
}

/* 卡片顶部的一层暖光 */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  pointer-events: none;
  background: radial-gradient(130% 80% at 50% -10%, rgba(217, 191, 138, .075), transparent 62%);
}

.era {
  font-size: 11px;
  letter-spacing: .16em;
  color: var(--fg-dim);
  margin-bottom: 14px;
}

.card h2 {
  font-size: var(--t-title);
  margin: 0 0 14px;
  line-height: 1.42;
  font-weight: 600;
  color: var(--fg);
}

.card p {
  margin: 0;
  font-size: var(--t-body);
  line-height: 1.88;
  color: var(--fg-body);
}

.think {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: var(--t-think);
  line-height: 1.8;
  color: var(--accent);
  opacity: .9;
}
.think::before {
  content: "多想一层 · ";
  color: #8c7a55;
  letter-spacing: .04em;
  font-size: 11px;
}

/* ---------- 词条 ---------- */
.term {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px dashed rgba(217, 191, 138, .55);
  padding-bottom: .5px;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.term:active { border-bottom-color: var(--accent); }

/* 词条气泡 */
#pop {
  position: fixed;
  z-index: 30;
  max-width: min(76vw, 320px);
  padding: 13px 15px;
  border-radius: 14px;
  background: #2a2520;
  color: #ded4c6;
  font-size: 13.5px;
  line-height: 1.72;
  box-shadow: 0 14px 40px -12px #000, 0 0 0 1px rgba(217, 191, 138, .22) inset;
  opacity: 0;
  transform: translateY(6px) scale(.96);
  transition: opacity .18s ease, transform .18s cubic-bezier(.22, .9, .3, 1);
  pointer-events: none;
}
#pop.on { opacity: 1; transform: translateY(0) scale(1); }
#pop b {
  display: block;
  margin-bottom: 5px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: .02em;
}
/* 小三角 */
#pop::after {
  content: "";
  position: absolute;
  left: var(--arrow-x, 50%);
  width: 10px;
  height: 10px;
  margin-left: -5px;
  background: #2a2520;
  transform: rotate(45deg);
}
#pop.below::after { top: -5px; box-shadow: -1px -1px 0 rgba(217, 191, 138, .22) inset; }
#pop.above::after { bottom: -5px; box-shadow: 1px 1px 0 rgba(217, 191, 138, .22) inset; }

/* ---------- 主题选择 ---------- */
#sheet {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  background: rgba(8, 7, 6, .9);
  backdrop-filter: blur(10px);
  padding: calc(env(safe-area-inset-top) + 46px) 22px calc(env(safe-area-inset-bottom) + 24px);
  overflow-y: auto;
}
#sheet.on { display: block; }

#sheet h3 {
  margin: 0 0 16px;
  padding-left: 4px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .16em;
  color: #7a7166;
}

.titem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 15px 18px;
  margin-bottom: 10px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  background: #1b1815;
  color: var(--fg);
  font-family: inherit;
  font-size: 16px;
  text-align: left;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .05) inset;
  transition: box-shadow .2s;
}
.titem small {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  color: #7a7166;
  letter-spacing: .04em;
  font-weight: 400;
}
.titem.now { box-shadow: 0 0 0 1px rgba(217, 191, 138, .45) inset; }
.titem .dot { opacity: 0; color: var(--accent); font-size: 9px; }
.titem.now .dot { opacity: 1; }

#closeSheet {
  margin-top: 6px;
  width: 100%;
  padding: 15px;
  border-radius: 16px;
  border: none;
  background: transparent;
  color: #6d6459;
  font-family: inherit;
  font-size: 14px;
}

</style>
</head>
<body>

<div id="deck">
  <header>
    <button id="themeBtn"><span id="themeName"></span><i>⌄</i></button>
  </header>
  <div id="stage"></div>
  <footer>上滑下一张</footer>
</div>

<div id="sheet">
  <h3>选择主题</h3>
  <div id="themeList"></div>
  <button id="closeSheet">关闭</button>
</div>

<script>
window.__VERSION__ = 'b7d5ed22ff';
window.__THEMES__ = [{"id": "ming", "name": "明朝", "desc": "洪武到南明 · 83 张", "cards": [{"e": "明·开国", "t": "红巾军起义：元末的社会已经撑不住了", "b": "元末黄河治水、赋役加重、纸币滥发，加上瘟疫与饥荒，社会秩序全面松动。朱元璋出身贫寒，先入皇觉寺为僧，后投红巾军，在一堆割据势力里一路打了出来。", "x": "压垮一个王朝的，往往不是某一件事，而是几件事同时发生。"}, {"e": "明·开国", "t": "高筑墙、广积粮、缓称王", "b": "朱元璋的谋士朱升给他九个字：高筑墙、广积粮、缓称王。意思是先守稳根据地、攒够粮食、别太早把自己树成靶子，等别人互相消耗得差不多了再动手。", "x": "在多方竞争里，先不出头，有时比先出头更划算。"}, {"e": "明·开国", "t": "鄱阳湖之战：一次水战定下江南归属", "b": "1363 年朱元璋与陈友谅在鄱阳湖决战，陈军兵力更多，朱元璋以火攻和分割包围取胜，陈友谅中箭身亡。此后南方再没有能与他抗衡的势力。", "x": "决战一旦打输，之前的体量优势就没有意义了。"}, {"e": "明·开国", "t": "明朝废丞相：皇帝一个人要干三个人的活", "b": "洪武十三年胡惟庸案后，朱元璋废除中书省和丞相，六部直接对皇帝负责。他规定后代不许再立丞相。天下事都由一人决断，工作量随之上了一个台阶。", "x": "把权力收到一个人手里，也把工作量收到了一个人身上。"}, {"e": "明·开国", "t": "朱元璋为什么杀得这么狠", "b": "洪武年间大案接连发生，胡惟庸案、蓝玉案牵连数万人。朱元璋的出发点是把潜在的军事与行政威胁清干净，为子孙留一个没有强人的朝廷。", "x": "用极端手段消除威胁，往往同时也消除了组织的能力。"}, {"e": "明·制度", "t": "里甲制与黄册：把每个人登记在册", "b": "明代以一百一十户为一里，编制黄册登记户口与土地，作为赋役依据。这套制度是明代基层治理和财政的基础，也让国家第一次能相对精确地看见人口。", "x": "能统计到的人，才纳得进税。"}, {"e": "明·制度", "t": "鱼鳞图册：把土地一块块画下来", "b": "明代丈量土地后绘制图册，因图形像鱼鳞而得名，详细记录每块田的形状、面积与业主。它与黄册配合，构成了明代的税基。", "x": "掌握细节，才能掌握征收。"}, {"e": "明·制度", "t": "卫所制：当兵是一种世袭身份", "b": "明代军户世代当兵，屯田自养，全国设卫所。初期节省开支、兵源稳定，后期土地被侵占、军户逃亡，战斗力下降，最终转向募兵。", "x": "用身份解决长期供给问题，代价是失去流动和淘汰。"}, {"e": "明·开国", "t": "锦衣卫：明朝的特务起点", "b": "朱元璋设锦衣卫，负责侦察、缉捕、审讯，直属于皇帝，可以绕过常规司法程序。它不是一般的执法机构，而是皇帝伸向官员的手。", "x": "绕开常规流程的权力，往往也绕开了纠错机制。"}, {"e": "明·开国", "t": "空印案与郭桓案：一道手续引发的血案", "b": "地方官进京报账时常带着盖好印的空白文书备用，朱元璋认为其中有弊，严惩了大批官员。制度上的合理性，在皇帝眼里可能只是借口。", "x": "当最高权力不信任流程，流程本身就成了罪证。"}, {"e": "明·永乐", "t": "靖难之役：一个藩王把皇帝赶下了台", "b": "建文帝削藩，燕王朱棣以清君侧为名起兵，四年后攻入南京，建文帝下落不明，朱棣即位。前朝留下的藩王问题，最终以最激烈的方式解决。", "x": "削藩这条路上，留不留缓冲，结果可能完全不同。"}, {"e": "明·永乐", "t": "方孝孺被诛十族：一次极端表态", "b": "朱棣要求方孝孺起草即位诏书，方孝孺拒绝，据传被诛十族。这件事成了永乐朝合法性问题的一个血色注脚。", "x": "用极端手段压住异议，异议会转入看不见的地方。"}, {"e": "明·永乐", "t": "迁都北京：天子守国门", "b": "朱棣把首都从南京迁到北京，一方面靠近自己的根据地，一方面直接面对北方的蒙古威胁。此后明代的政治重心一直在北京。", "x": "把首府放在最危险的地方，是一种动员方式，也是一种风险。"}, {"e": "明·永乐", "t": "紫禁城：用建筑表达秩序", "b": "永乐年间营建北京城与紫禁城，中轴对称、等级分明，朝会与居住空间严格区分。建筑本身就是一套政治语言的说明书。", "x": "最宏大的建筑，往往同时在做治理的工作。"}, {"e": "明·永乐", "t": "郑和七下西洋：规模远超同时期的欧洲", "b": "永乐至宣德年间，郑和率两百多艘船、两万余人七次远航，最远到东非。船队以宣示国威、建立朝贡关系为主，贸易并不是核心目的。", "x": "不以赚钱为目的的远航，财政上很难持续。"}, {"e": "明·永乐", "t": "郑和为什么终止：一笔算不过来的账", "b": "远航耗费巨大，带回的多是珍奇与朝贡关系，不能形成稳定收益。加上北方压力上升、朝中反对，宣德之后航线彻底停止。", "x": "一件事能不能继续，取决于它能不能养活自己。"}, {"e": "明·永乐", "t": "《永乐大典》：一部没有副本的大书", "b": "永乐年间编纂的大型类书，收书七八千种，共两万余卷。正本下落不明，副本在近代战乱中大量散失，现存仅数百册。", "x": "没有冗余保存的东西，一旦出事就几乎没有备份。"}, {"e": "明·永乐", "t": "奴儿干都司：东北的管理与象征", "b": "永乐年间在黑龙江下游设奴儿干都司，管理当地部族，立永宁寺碑。它说明明代对东北的管理主要是羁縻性质，而不是直接行政。", "x": "边疆治理的深浅，往往看它收不收税、派不派官。"}, {"e": "明·永乐", "t": "五征漠北：永乐亲自带兵打蒙古", "b": "朱棣五次亲征漠北，打击鞑靼、瓦剌诸部，取得战果，但蒙古问题始终没有根本解决。最后一次回师途中病逝。", "x": "反复用兵能压住一时，改不了长期的地理与人口格局。"}, {"e": "明·永乐", "t": "内阁的出现：皇帝忙不过来之后", "b": "废除丞相后，皇帝工作量过大，永乐起用翰林官入值文渊阁，参与机务。后来形成内阁制度，逐渐承担起类似宰相的部分职能。", "x": "制度上删掉的东西，往往会以另一种形式长回来。"}, {"e": "明·制度", "t": "翰林院与词臣：靠文字上升的路径", "b": "明代大量高级官员出自翰林院，靠科举与文字能力进入决策圈。这种路径培养了高度文人化的官僚群体。", "x": "上升路径一旦固定，一个群体的思维方式也就固定了。"}, {"e": "明·仁宣", "t": "仁宣之治：休养的几年", "b": "仁宗、宣宗在位时间不长，但减少用兵、减轻赋役、整顿吏治，社会得以喘息。与永乐的大规模行动相比，这是一段刻意收缩的时期。", "x": "收缩不等于衰落，很多时候是为了把力量攒回来。"}, {"e": "明·仁宣", "t": "宣宗的业余爱好：斗蟋蟀", "b": "宣宗喜好斗蟋蟀，民间有促织之戏的记载，地方因此出现过摊派。个人偏好在一个高度集权的体系里，会被放大成社会成本。", "x": "当一个人的喜好能变成指令，成本就会被整条系统承担。"}, {"e": "明·仁宣", "t": "交趾的弃守：主动放弃一块占领地", "b": "明军在安南设立交趾布政使司，但当地反抗不断、驻军成本高昂，宣德年间决定撤出。主动收缩往往需要承担舆论压力，但账面清楚。", "x": "敢于放弃打得下的地方，是一种另一种能力。"}, {"e": "明·制度", "t": "票拟与批红：一套字面上的流程", "b": "内阁对奏章提出处理意见叫票拟，皇帝用朱笔批准叫批红。皇帝不理政时，批红可能落到宦官手里，权力也随手续而转移。", "x": "流程里最关键的一步，决定了权力真正在谁手上。"}, {"e": "明·英宗", "t": "土木之变：皇帝被俘的那一战", "b": "1449 年英宗在宦官王振怂恿下亲征瓦剌，指挥混乱，在土木堡大败，英宗被俘。这是明朝最严重的一次军事失败。", "x": "关键决策交给不懂行的人，风险会被一次性放大。"}, {"e": "明·英宗", "t": "北京保卫战：于谦把局面撑住了", "b": "英宗被俘后，于谦拥立景帝、组织京师防御，击退瓦剌。一个王朝在危机中活下来，往往靠几个能立刻做决定的人。", "x": "危机中最稀缺的，是能马上拍板并承担后果的人。"}, {"e": "明·英宗", "t": "于谦之死：救过国家的人救不了自己", "b": "英宗复辟后，于谦以谋逆罪被杀。他在北京保卫战中保住了明朝，却死在政治复辟的清算里。", "x": "政治清算的逻辑，跟功劳簿没有关系。"}, {"e": "明·英宗", "t": "夺门之变：一次宫廷政变", "b": "景帝病重时，石亨、徐有贞等人拥英宗复辟，史称夺门之变。英宗复位后，景帝一系的官员被大批清洗。", "x": "在继承规则不清的地方，政变几乎是可以预期的。"}, {"e": "明·制度", "t": "宦官干政的结构性原因", "b": "明代宦官掌司礼监、提督东厂，能替皇帝批红、监视百官。他们之所以能做大，是因为皇帝需要一支完全依附于自己的力量去制衡文官。", "x": "没有独立根基的人，才会对授予他权力的人绝对忠诚。"}, {"e": "明·制度", "t": "王振与刘瑾：两个被放大的宦官", "b": "王振促成土木之变，刘瑾在正德朝掌权，被称立皇帝。他们的权力来自皇帝的信任，一旦失去信任，结局往往极其惨烈。", "x": "依附型的权力，涨得快，落得更快。"}, {"e": "明·制度", "t": "西厂与内行厂：特务机构的叠加", "b": "成化设西厂，正德设内行厂，与东厂、锦衣卫并存，彼此监视。机构越叠越多，最终谁监视谁都不清楚。", "x": "为解决问题不断增加机构，问题常常变成机构本身。"}, {"e": "明·成化", "t": "成化犁庭：对建州女真的早期打击", "b": "成化年间明军多次出兵辽东，打击建州女真诸部。这一段往往被后来的清代史书淡化，但它说明明与女真的冲突由来已久。", "x": "被淡化的事件，往往在后来的叙事里重新变得重要。"}, {"e": "明·制度", "t": "一条鞭法：把复杂的赋役简化成一条", "b": "嘉靖万历时推行一条鞭法，把各种赋、役合并折算成银两征收。税制简化，货币化加深，白银成为财政的主轴。", "x": "简化流程，往往能带动整个经济的货币化。"}, {"e": "明·经济", "t": "白银货币化：明代中国已经卷进全球市场", "b": "明代中后期白银成为主要货币，大量白银来自日本与美洲，通过贸易流入。海外银产量的波动，能直接影响国内的物价与财政。", "x": "全球化的影响，比我们通常以为的要早得多。"}, {"e": "明·经济", "t": "商帮与市镇：江南的另一种繁荣", "b": "明代中后期江南市镇密集，丝绸、棉布、瓷器生产与贸易繁盛，徽商、晋商等商帮兴起。经济重心进一步南移。", "x": "一个朝代的力量，常常先从它的市镇里长出来。"}, {"e": "明·社会", "t": "《金瓶梅》：一部写日常生活的书", "b": "明代长篇小说《金瓶梅》以市井家庭为背景，写财富、欲望与人际关系。它留下的社会细节，比正史多得多。", "x": "想了解一个时代怎么过日子，小说常常比史书直接。"}, {"e": "明·社会", "t": "明代的城市生活与消费", "b": "明代中后期城市消费增长，茶馆、酒楼、戏班、书坊兴盛，市民文化发展。消费的扩张也带来对身份秩序的冲击。", "x": "消费一变，等级的边界就开始松动。"}, {"e": "明·社会", "t": "女性的处境与节烈观念", "b": "明代贞节观念强化，旌表节妇的制度化程度提高，同时女性在实际经济生活中仍有参与空间。规范与现实之间始终存在落差。", "x": "规范越被强调的地方，往往越说明现实里不那么整齐。"}, {"e": "明·制度", "t": "明代的教育与科举", "b": "明代以八股取士，府州县学与书院并存，读书人围绕科举形成庞大的备考群体。考试内容固定，也让思想空间变得狭窄。", "x": "考试考什么，一代人的脑子就长成什么样。"}, {"e": "明·制度", "t": "明代的海禁与走私", "b": "明初海禁，民间贸易转入走私，走私集团与沿海武装结合，形成倭寇问题。后来开放月港，才部分缓解。", "x": "压住合理的需求，需求会自己找一条更难管的路。"}, {"e": "明·经济", "t": "月港开禁：一次有限的开放", "b": "隆庆年间开放福建月港，允许民间出海贸易，但限定地点与船只。有限开放既缓解了走私压力，也让政府能收税。", "x": "与其堵死，不如开一条能看见、能收税的口子。"}, {"e": "明·社会", "t": "明代的灾荒与赈济", "b": "明代在地方设预备仓，遇灾减免赋税、发放粮食。但仓储常常被挪用，赈济能力随财政状况起伏。", "x": "救灾能力，是政权合法性的日常版本。"}, {"e": "明·万历", "t": "张居正：十年首辅，一条鞭法", "b": "张居正任内阁首辅，推行考成法整顿吏治、清丈土地、推广一条鞭法，财政明显好转。他依靠与宦官冯保的合作掌握实权。", "x": "能推动改革的人，往往也要借助不体面的手段。"}, {"e": "明·制度", "t": "考成法：给官员上进度表", "b": "张居正推行考成法，把政务登记造册、限期完成、逐级核查。行政效率提高，也让官僚系统长期处于压力之下。", "x": "没有期限的政令，往往等于没有政令。"}, {"e": "明·万历", "t": "张居正死后被清算", "b": "张居正死后不久即被抄家，家属惨遭牵连。改革触动的利益，在他失去权力后集中反扑。", "x": "改革者离开之后，反弹往往比他活着时更凶。"}, {"e": "明·万历", "t": "万历怠政：皇帝不上朝也是一种态度", "b": "万历后期长期不上朝、不批奏章，官员缺员不补。这种消极抵抗使行政几乎停摆，也让文官集团与皇权长期僵持。", "x": "最高权力选择不作为，整个系统会跟着失灵。"}, {"e": "明·万历", "t": "国本之争：立谁当太子吵了十五年", "b": "万历想立宠妃之子为太子，文官坚持立长子，双方争论十余年。继承问题一旦变成派系斗争，就会消耗整个朝廷的注意力。", "x": "决定继承人这件事，最能暴露一个体制的裂缝。"}, {"e": "明·万历", "t": "万历三大征：打得起但很贵", "b": "万历年间平定宁夏、援朝抗倭、平定播州，三场战争都打赢了，军费消耗巨大，国库被掏空。胜利不等于没有代价。", "x": "把账算到胜利之后，才知道赢了什么。"}, {"e": "明·万历", "t": "援朝抗倭：一场跨国的七年战争", "b": "1592 年日本入侵朝鲜，明军入朝作战，历时七年，最终击退日军。这场战争消耗了明朝大量兵力与财政。", "x": "远处的战场，往往比想象的更费钱。"}, {"e": "明·万历", "t": "东林党：从书院议政到派系斗争", "b": "东林书院出身的官员以清议批评朝政，逐渐形成派系，与非东林派激烈对立。党争消耗了朝廷应对危机的能力。", "x": "内部分裂，常常比外部压力更致命。"}, {"e": "明·万历", "t": "萨尔浒之战：后金崛起的第一声", "b": "1619 年明军四路进攻后金，被努尔哈赤各个击破，明军大败。此战之后，辽东局势彻底逆转。", "x": "分兵冒进，是把优势还给对手的最快方式。"}, {"e": "明·万历", "t": "辽东军费：一个吞掉财政的无底洞", "b": "为应对后金，明朝不断加征辽饷，军费越滚越大，财政与民生同时承压。战争的账单最终落到了普通农民身上。", "x": "打不下去的战争，最后总是从最底层收钱。"}, {"e": "明·天启", "t": "魏忠贤：宦官权力的顶峰", "b": "天启年间魏忠贤掌权，各地建生祠，东林党人遭大规模迫害。依附于皇帝个人的权力，在他死后迅速崩解。", "x": "权力建在一个人身上，那个人一走就全塌。"}, {"e": "明·崇祯", "t": "崇祯：勤政的亡国之君", "b": "崇祯节俭勤政，但性格多疑、频繁换相、杀将自毁长城，十七年换了五十多个内阁大学士。个人勤勉顶不住系统的全面失灵。", "x": "越是事事亲为，越容易把关键判断交给焦虑。"}, {"e": "明·崇祯", "t": "袁崇焕之死：一次自毁长城", "b": "袁崇焕在辽东多次击败后金，后因反间计与朝中猜忌被下狱处死。一个正在发挥作用的将领，被自己的朝廷除掉。", "x": "不信任到极点，最先损失的是最能用的人。"}, {"e": "明·崇祯", "t": "小冰期与明末饥荒", "b": "十七世纪气候转冷，北方连年歉收，旱灾、蝗灾与瘟疫叠加，加上加派赋税，农民几乎无以为生。", "x": "自然条件常常是历史里被低估的底层变量。"}, {"e": "明·崇祯", "t": "李自成与张献忠：从驿卒到闯王", "b": "明末财政困难，裁撤驿站，李自成失业后加入起义军，后来提出均田免赋，迅速聚集大量追随者。", "x": "压到最紧的时候，最先反弹的是活不下去的人。"}, {"e": "明·崇祯", "t": "崇祯最后的那个早上", "b": "1644 年李自成攻入北京，崇祯在煤山自缢，遗诏称诸臣误我。他把责任留给臣下，也把整套系统的失败留在了身后。", "x": "把失败归因于别人，往往意味着从没看清自己的位置。"}, {"e": "明·崇祯", "t": "明亡：财政、军事、灾荒一起算总账", "b": "明末财政崩溃、军费无着、党争内耗、灾荒连年、外患不断，没有哪一项单独致命，但一起压下来，谁也撑不住。", "x": "系统性崩溃，从来不是单一原因造成的。"}, {"e": "明·南明", "t": "南明：一个想复制但复制不了的局面", "b": "北京陷落后，南方先后出现弘光、隆武、永历等政权，但因为内部倾轧与军事失控，很快被逐个击破。", "x": "有同样的地理条件，不一定有同样的组织能力。"}, {"e": "明·南明", "t": "史可法与扬州", "b": "弘光朝史可法督师扬州，城破后殉国。南明内部的派系斗争，使他在最需要支援时得不到支援。", "x": "一个体系先坏在内部，外敌才有机会收尾。"}, {"e": "明·南明", "t": "郑成功：海上的最后一个南明力量", "b": "郑成功以金门厦门为基地抗清，1661 年收复台湾作为根据地。明朝的残余力量最终在海上延续了一段。", "x": "陆地上站不住时，还有别的方向可以守。"}, {"e": "明·军事", "t": "明代的长城与九边", "b": "明代大规模修筑长城，设辽东、宣府、大同、延绥等九边重镇。防御体系的维护成本极高，长期消耗国力。", "x": "静态防线最大的问题，是它需要永远有人付钱。"}, {"e": "明·军事", "t": "明代卫所与募兵的交替", "b": "卫所制崩坏后，明廷转向募兵，戚继光的戚家军、辽东的关宁铁骑都属此类。募兵战斗力强，但对财政的要求更高。", "x": "效率和成本，往往是一起涨的。"}, {"e": "明·文化", "t": "永乐大典到四库全书：两个时代的整理工作", "b": "类书与丛书的编纂，都是国家动用资源整理知识的方式。整理的过程，同时也是筛选和取舍的过程。", "x": "决定收录什么，等于决定后人能记得什么。"}, {"e": "明·经济", "t": "明代的钞法为什么失败", "b": "明初发行大明宝钞，不能兑换、大量超发，很快贬值，民间转而用白银和铜钱。没有约束的印钞权，信用撑不住。", "x": "一旦能靠印钞解决问题，就很难再克制。"}, {"e": "明·经济", "t": "明代的海外贸易与朝贡", "b": "明代把海外贸易纳入朝贡框架，限制民间出海，贸易的政治意义大于经济意义。结果是国家失去了海上贸易的收益与信息。", "x": "把生意当礼仪做，最后两头都做不好。"}, {"e": "明·经济", "t": "明代土地兼并的后果", "b": "明代中后期土地向官僚、宗族、王府集中，自耕农减少，赋役负担转嫁，逃户增多，税基不断萎缩。", "x": "赋税一旦可以转嫁，压力就会落到最没有议价能力的人身上。"}, {"e": "明·经济", "t": "田赋、徭役与加派", "b": "明代农民的负担包括田赋、徭役与各类加派。每次战事或工程都可能带来新的加征，而加征一旦开始就很难撤回。", "x": "临时的加派，往往比正式税制更难取消。"}, {"e": "明·制度", "t": "明代的户籍与流动", "b": "明代户籍管理严格，但商业与手工业发展带来了人口流动，制度与现实之间的缝隙越来越大。", "x": "制度一旦追不上生活，执行就会变成选择性执法。"}, {"e": "明·制度", "t": "明代的地方财政", "b": "明代地方留存比例低，多数收入要上解中央，地方遇到灾荒与工程往往缺乏机动资金，只能加派或挪用。", "x": "没有余钱的地方政府，一遇事就只能向下要钱。"}, {"e": "明·军事", "t": "明代的军户与逃亡", "b": "军户世代服兵役，负担沉重，逃亡现象普遍。制度性的人口外流，往往是一个系统失效最早的信号。", "x": "当人们开始用脚投票，说明规则已经不合身了。"}, {"e": "明·制度", "t": "明代的驿递系统", "b": "明代驿站负责传递公文与接待官员，后期被大量私用，成为财政负担。李自成正是出身驿卒。", "x": "公共系统一旦被私用，就会先失去功能，再失去合法性。"}, {"e": "明·社会", "t": "明代的士绅与乡村", "b": "明代基层依靠里甲与士绅维持秩序，士绅承担教化、调解与救济的职能，与国家形成半合作的关系。", "x": "治理成本过高时，国家会把一部分责任留给社会自己。"}, {"e": "明·经济", "t": "明代的商业信用", "b": "明代出现了会票、典当、合伙等商业信用形式，晋商、徽商依靠同乡与宗族关系扩展网络。", "x": "信任可以靠关系替代制度运转一阵子，但很难扩张。"}, {"e": "明·制度", "t": "明代的漕运", "b": "明代漕粮依靠大运河从南方运往北京，漕军、河工、仓储构成庞大的体系。运河一旦淤塞或战乱，北京立刻吃紧。", "x": "首都的粮食，取决于一条河的水位。"}, {"e": "明·社会", "t": "明代的灾害与瘟疫", "b": "明代灾荒频繁，瘟疫流行，尤其明末华北地区。国家救济能力跟不上，社会自救与流民问题加剧。", "x": "灾荒考验的从来不是天，而是组织能力。"}, {"e": "明·文化", "t": "明代的书坊与出版", "b": "明代出版业发达，书坊刻印小说、戏曲、日用类书，知识向普通人扩散。", "x": "出版成本一下降，思想的下沉就挡不住了。"}, {"e": "明·文化", "t": "明代戏曲与社会", "b": "明代戏曲繁荣，传奇与杂剧在社会各层流行，内容常涉及家庭伦理与政治讽刺。", "x": "一个时代的故事会，往往是最真实的社会记录。"}, {"e": "明·文化", "t": "明代思想：心学与理学", "b": "王阳明提出心即理、知行合一、致良知，与朱熹的理学分庭抗礼。心学强调内在体验，对后来的思想解放影响很大。", "x": "把权威从外面搬回内心，往往会带来更大的思想空间。"}, {"e": "明·制度", "t": "明代的科举：八股文与榜下捉婿", "b": "八股文格式严格，考核内容固定。科举人数众多，落第者形成了庞大的读书人群体，成为社会变动中活跃的一部分。", "x": "制度把大量精英吸进来，也把大量人挡在门外。"}, {"e": "明·制度", "t": "明代的藩王：一个吃财政的群体", "b": "明代藩王有封地和俸禄，子孙繁衍，成为国家财政的沉重负担。宗室开支在明代后期急剧膨胀。", "x": "任何在册的特权群体，都会随时间自我膨胀。"}]}, {"id": "qing", "name": "清朝", "desc": "入关到逊位 · 156 张", "cards": [{"e": "清", "t": "八旗不是军队，是社会组织", "b": "八旗把满洲人编成军事与民政合一的单位，旗人世代当兵领饷，不事生产。这套组织让几十万人的族群能高效动员，代价是形成很难拆解的身份集团，一直延续到清末。", "x": "把军事和社会捆在一起很高效，但也会造出难以改变的身份壁垒。"}, {"e": "《苦命天子》", "t": "咸丰不是昏君，他每天的批折量极大", "b": "茅海建写咸丰，最刺眼的不是他有多坏，而是他有多努力。他每天批阅奏折到深夜，事必躬亲，但他的信息来自一套层层修饰的奏报，判断的基础从源头就是歪的。", "x": "越勤奋的错判，代价越大，因为没人敢拦。"}, {"e": "清", "t": "清军入关，靠的是吴三桂开的门", "b": "1644 年李自成攻入北京、崇祯自尽，吴三桂在山海关引清军入关，共同击败李自成。清军以替明复仇的名义进入北京，随后迅速接管政权，而不是纯靠武力硬打下来。", "x": "政权更替时常有内部人开门，门一旦打开就关不回去了。"}, {"e": "《苦命天子》", "t": "皇帝面前没有一句真话，是怎么形成的", "b": "军机大臣报喜不报忧，前线将领虚报战功，层层相加后皇帝看到的是被修饰过的战局。等真相浮上来时，局面已经无法挽回。", "x": "信息的失真不是某个人撒谎，是一整套激励在起作用。"}, {"e": "清", "t": "剃发令：一道命令引发的全面抵抗", "b": "清廷要求汉人剃发编辫，口号是留头不留发、留发不留头。这道命令把原本可以妥协的征服，变成必须选择立场的对抗，江南各地因此爆发激烈抵抗。", "x": "让人在无法回头的象征上表态，会把中间派全推到对面。"}, {"e": "《苦命天子》", "t": "逃往热河：逃离的代价是失去反应能力", "b": "英法联军逼近北京，咸丰以巡幸为名去了承德，从此不再回京。距离远了，奏报更慢，判断更迟，朝中派系反而更活跃。", "x": "离开现场的那一刻，就已经放弃了对局面的控制。"}, {"e": "《苦命天子》", "t": "奕訢被留在北京：一个能干的人被推到前台又被打压", "b": "咸丰出逃时把奕訢留在北京办交涉，事后又忌惮他的声望。等到咸丰去世，奕訢在辛酉政变中重新掌权，又长年被慈禧压制。", "x": "有能力的人反复被用又被防，往往说明组织的信任机制坏了。"}, {"e": "清", "t": "迁界禁海：为了断郑成功，代价是沿海民生", "b": "清初为切断郑氏政权的补给，下令沿海居民内迁数十里，禁止出海。海防压力暂时缓解，但沿海渔农商贸几乎崩溃，恢复花了几十年。", "x": "为了安全切掉的，常常是更难重建的生计。"}, {"e": "清", "t": "《尼布楚条约》是中国第一次按国际法谈边界", "b": "1689 年中俄签订尼布楚条约，划定了东段边界，用拉丁文和满、俄文本，按对等谈判的方式完成。这是清廷少有的以平等姿态处理对外关系的案例。", "x": "有实力时按规则谈判，谈判结果才守得住。"}, {"e": "《苦命天子》", "t": "洋人是不是要抢大清的江山", "b": "咸丰朝的判断里，最要命的误读是把英法当成又来劫掠的北方蛮族，以为签完条约、给点银子和口岸就能打发。对方要的是常驻外交与条约体系。", "x": "把对手的目标判断错，所有应对都会打在空处。"}, {"e": "清", "t": "三藩之乱：一次差点掀翻新王朝的内战", "b": "吴三桂、尚可喜、耿精忠三个藩王掌控南方，康熙决定撤藩，引发八年战乱，波及十余省。清廷最终获胜，但暴露出用降将守边留下的隐患。", "x": "靠临时力量换来的稳定，迟早要还账。"}, {"e": "《苦命天子》", "t": "圆明园被烧，不只是因为谈判破裂", "b": "1860 年英法联军劫掠焚烧圆明园，导火索是谈判期间清廷扣押并虐待英法使团成员。惩罚性的破坏，也在向清廷示范一套新的力量语言。", "x": "一次谈判上的错误操作，代价可能是一座园子。"}, {"e": "《叫魂》", "t": "叫魂案里最可怕的不是妖术，是官僚的自我保护", "b": "1768 年江南流传有人剪人发辫、施术叫魂。案子从上往下推，地方官为了自保，宁可屈打成招也不肯上报说没这回事，最后演变成全国性的恐慌。", "x": "当一个系统里说没事比说有事风险更大，所有人都只会说有事。"}, {"e": "清", "t": "统一台湾：施琅与澎湖海战", "b": "1683 年施琅率水师在澎湖击败郑军，郑克塽投降，清朝设台湾府隶属福建。军事上是一次海战，政治上是把东南沿海纳入统一管辖。", "x": "关键节点上的胜负，往往决定几百年的格局。"}, {"e": "《叫魂》", "t": "乾隆为什么亲自抓一场地方上的妖术传闻", "b": "孔飞力指出，乾隆在意的不是妖术，而是这场传闻暴露出地方官在瞒他、汉人官员和族群之间的隔阂。借案子敲打官僚，是他维护控制的方式。", "x": "当权者追问的往往不是事件本身，而是谁在对他隐瞒。"}, {"e": "清", "t": "雅克萨之战：清军为什么打得这么吃力", "b": "两次雅克萨之战中，清军面对人数不多的哥萨克据守的堡垒，围攻数月才拿下。火器与工事的差距，在此时已经露出苗头。", "x": "在赢得漂亮的时候，往往最容易忽略正在拉开的差距。"}, {"e": "《叫魂》", "t": "冤案是怎么被生产出来的", "b": "审讯中被捕的人被反复逼问，供词越来越具体，细节越来越离奇，官员反而觉得更可信。冤案不是一两个人造的，是流程本身在造。", "x": "流程一旦奖励逼供，真相就成了最不重要的东西。"}, {"e": "清", "t": "多伦会盟：把蒙古纳入制度而不是只靠联姻", "b": "康熙在多伦与喀尔喀蒙古诸部会盟，编设旗制，确立清朝对漠北蒙古的管理。相比单纯联姻，制度化的编制更持久。", "x": "把关系写进制度里，比靠人情维系更久。"}, {"e": "清", "t": "摊丁入亩的前身：一条鞭法的思路延续", "b": "清朝在明代一条鞭法的基础上，把丁银摊入田赋，纳税跟着土地走。税基从人头转向土地，国家跟每个人的关系随之改变。", "x": "税制一变，国家和百姓的关系就跟着变。"}, {"e": "《叫魂》", "t": "谣言为什么在盛世最容易传", "b": "叫魂案发生在乾隆盛世中期，人口流动加剧、陌生人多、生计压力大。越是不安的社会，越容易相信身边的陌生人有超自然威胁。", "x": "谣言的土壤不是无知，是焦虑。"}, {"e": "清", "t": "九子夺嫡：康熙晚年的继承困局", "b": "康熙晚年诸皇子结党争夺储位，朝臣分裂，政务受影响。没有明确的继承规则，权力交接就必然演变成派系斗争。", "x": "继承制度不清晰，代价是整个朝廷的注意力。"}, {"e": "《大义觉迷录》", "t": "雍正把一份反清檄文公开了", "b": "雍正把曾静的谋反檄文连同自己的逐条批驳印成书，全国发行。他试图用说理回应指控，结果反而让普通人第一次读到那些指控的原文。", "x": "有时最有力的传播，是被反驳的那一方的反驳。"}, {"e": "《大义觉迷录》", "t": "乾隆为什么把父亲的书禁了", "b": "雍正死后，乾隆即位不久就下令收缴销毁《大义觉迷录》，禁止流传。父亲的公开辩论，被他视为把宫廷内幕暴露给了普通人。", "x": "上一代用来争理的方式，下一代可能只想抹掉。"}, {"e": "清", "t": "雍正为什么被骂得那么狠", "b": "雍正严苛、勤政、追缴亏空、整顿吏治，得罪了大批既得利益者，死后流言极多。改革者往往在任时就被写坏，评价要看他做成了什么。", "x": "被骂得最凶的人，可能恰恰在动最硬的骨头。"}, {"e": "清", "t": "密折制度：皇帝绕过整个官僚系统", "b": "雍正扩大密折制度，官员可以直接给皇帝上密报，内容不经上级。皇帝拿到更多真实信息，但官员之间互相监视，猜忌成为常态。", "x": "改变信息流的方向，就改变了权力的形状。"}, {"e": "《清代地方政府》", "t": "知县一个人管几十万人", "b": "瞿同祖的研究指出，清代一个县的正式编制里，官员只有知县、县丞等寥寥几人，大量事务靠书吏、衙役和师爷，这些人不在编制内，收入靠灰色地带。", "x": "人手不够又不给编制，实际上只能默许灰色收入。"}, {"e": "清", "t": "军机处：效率最高的机构，也最没有制约", "b": "雍正设立军机处，处理紧急军务，后来成为实际的中枢。它办事快、保密强，但完全依附皇帝，没有独立权力。", "x": "跑得最快的机构，往往也是最没有刹车的。"}, {"e": "《清代地方政府》", "t": "师爷为什么比官员更懂业务", "b": "刑名、钱谷师爷由官员私人聘请，熟悉律例和账目，实际承担了大量行政工作。他们不属国家编制，随时可以被解职。", "x": "真正撑着行政运转的人，常常不在这套体系的正式名单上。"}, {"e": "清", "t": "养廉银：用钱来解决贪腐", "b": "雍正推行养廉银，给官员远高于俸禄的补贴，希望以此减少贪腐。短期有效，但总督巡抚的开支和摊派依然存在，问题没有根除。", "x": "提高待遇能缓解症状，不改结构就治不了病根。"}, {"e": "《叫魂》《清代地方政府》", "t": "地方官为什么怕上报坏消息", "b": "地方官对上级负责，任何被认定失职的事都可能影响前途。在这种激励下，压下来、拖过去、找个替罪的人，往往比如实上报更安全。", "x": "考核只看结果时，隐瞒就成了理性的选择。"}, {"e": "清", "t": "摊丁入亩全覆盖：清代的财政底盘", "b": "雍正时摊丁入亩在全国推开，丁税并入地税，无地农民的负担减轻，人口登记随之宽松，清代人口在十八世纪大幅增长。", "x": "一项税制改动能悄悄改变一整个世纪的人口曲线。"}, {"e": "《停滞的帝国》", "t": "马戛尔尼的跪与不跪", "b": "1793 年英国使团来华，礼仪之争持续多日，最终双方各退一步。真正的问题不在跪姿，而在于两边对这场见面是什么性质，理解完全不同。", "x": "看起来是礼节之争，实质是两套世界秩序的碰撞。"}, {"e": "《停滞的帝国》", "t": "使团看到的清军：装备落后但人数惊人", "b": "使团沿途记录清军的火绳枪、弓箭与号衣，认为装备落后但仍是一支庞大的军队。几十年前，这种判断还会被认为荒谬。", "x": "看得见的落后，通常只是在别处已经跑出很远之后才被发现。"}, {"e": "清", "t": "改土归流：把土司换成流动的官", "b": "雍正年间在西南推行改土归流，废除世袭土司，改派流动的流官。中央对边疆的控制加强，但过程中的冲突与反抗也不少。", "x": "把世袭换成可替换的，才能真正收进中央。"}, {"e": "清", "t": "乾隆的十全武功，账怎么算", "b": "乾隆自述十全武功，包括平准噶尔、定回部、征缅甸、安南等。疆域达到极盛，代价是财政消耗巨大，部分战役打得相当勉强。", "x": "把战果集中宣传，容易掩盖付出的成本。"}, {"e": "《停滞的帝国》", "t": "被退回的礼物：清廷看不上的是什么", "b": "英方带来的天文仪器、火器、钟表，被当作贡品收下，却没被当作技术去研究。对新技术没有需求感，是最难改变的状态。", "x": "不觉得需要，才是最深的封闭。"}, {"e": "清", "t": "《四库全书》：最大的典籍工程，也是最大的一次筛选", "b": "乾隆修《四库全书》，收录三千多种书，同时大量禁毁被认为有问题的著作。整合知识的同时，也在决定哪些知识不该被记住。", "x": "整理和删除，往往在同一项工程里完成。"}, {"e": "《天朝的崩溃》", "t": "清军在鸦片战争里到底输在哪里", "b": "茅海建的计算显示，清军火炮射程短、炮弹质量差、指挥分散，各口岸省份之间几乎无法协同。英军则可以沿海快速机动、集中优势兵力。", "x": "在体系级的差距面前，个体的勇敢解决不了问题。"}, {"e": "清", "t": "文字狱：清代思想最紧的几十年", "b": "康雍乾三朝文字狱频发，一句诗、一个别号都可能招祸。读书人转向考据与经学，避开时政议论。", "x": "当表达的风险太高，创新会转向安全的地方。"}, {"e": "《天朝的崩溃》", "t": "皇帝拿到的战报，和战场是两回事", "b": "前线给皇帝的奏报常常夸大胜果、缩小损失，导致决策层对战局判断严重偏差。林则徐被撤职，很大程度是因为这些失真的信息。", "x": "判断的基础一错，再正确的方法也救不回来。"}, {"e": "《天朝的崩溃》", "t": "三元里抗英：民间的力量与官府的顾虑", "b": "广州三元里民众自发抗击英军，规模不小。但清廷对民间武装始终警惕，事后遣散。对内部稳定的顾虑，常常压过对外部的抵抗。", "x": "既要用民间的力量，又怕这股力量，这种矛盾反复出现。"}, {"e": "清", "t": "广州十三行：唯一对外的窗口", "b": "乾隆时规定西洋贸易只能通过广州，由十三行商人代理。贸易被集中管理，方便控制，也让信息和技术输入变得极其有限。", "x": "把门留成一条缝，进来的东西也就只有那么一点。"}, {"e": "《天朝的崩溃》", "t": "签订《南京条约》的人并不认为那是卖国", "b": "当时谈判的官员认为自己只是按皇帝的指示结束一场打不赢的战争，并没有意识到条约体系的长远含义。认知上的落后，往往比态度更致命。", "x": "很多错误的决定，当时的人并不觉得错。"}, {"e": "清", "t": "马戛尔尼访华：两个世界第一次正面碰撞", "b": "1793 年英国使团来华，请求扩大通商，清廷按朝贡礼仪接待，拒绝了请求。双方都没听懂对方在说什么，代价在几十年后支付。", "x": "沟通失败往往不是谈崩了，而是从头就没在同一个频道上。"}, {"e": "清", "t": "大小金川：一场花掉巨款的边地战争", "b": "乾隆两次用兵大小金川，地形险恶、碉楼坚固，清军伤亡与军费消耗巨大。这是盛世里最费钱的一场战争。", "x": "账面繁荣底下，总有一笔被忽略的开支。"}, {"e": "《皇帝的影子》", "t": "皇权越集中，信息就越难上传", "b": "清代皇权高度集中，所有重要决策都需要皇帝批红。但信息传递的环节越多，修饰就越多，皇帝反而更难看到真实情况。", "x": "越往上的权力，越依赖下面的人愿不愿意说实话。"}, {"e": "《清代国家与社会》", "t": "仓储与赈灾：清代的救命系统", "b": "清代在各地设常平仓、社仓、义仓，用于平抑粮价与灾荒救济。这套系统在太平天国之后大量废弛，一旦出事，底层几乎没有缓冲。", "x": "一个系统的韧性，往往体现在它最不起眼的仓库里。"}, {"e": "清", "t": "土尔扈特东归：一场横跨草原的大迁徙", "b": "伏尔加河流域的土尔扈特部因沙俄压迫决定东归，历时数月、损失惨重，最终抵达伊犁，被清廷接纳安置。", "x": "一个群体选择去哪里，往往能说明它在那里过不下去。"}, {"e": "清", "t": "白莲教起义：盛世末尾的第一道裂缝", "b": "嘉庆初年白莲教起义波及数省，清廷调集大量兵力镇压，耗时九年，军费消耗严重。这场战争标志清朝由盛转衰。", "x": "转折点常常出现在看起来最安稳的时候。"}, {"e": "《清代国家与社会》", "t": "蠲免：皇帝免税背后的政治账", "b": "清代多次大规模蠲免钱粮，减免灾区或全国赋税。这既是救济，也是塑造仁君形象的手段，而实际执行往往被地方层层截留。", "x": "给出去的东西，先经过多少双手，决定了最后能到哪。"}, {"e": "《叫魂》", "t": "口供里的普通人：他们只是被记录的那一面", "b": "清代审案档案里留下了大量普通人供词，多是些家长里短、邻里纠纷。这是少数能看到底层人声音的材料，但它来自审讯，本身就带着压力。", "x": "史料里能读到的人，大多是被人追问时说的话。"}, {"e": "清", "t": "和珅跌倒，嘉庆吃饱", "b": "乾隆晚年宠信和珅，贪腐积累巨大；嘉庆即位后查抄和珅家产，数额震惊朝野。抄家能补一时国库，补不了制度上的漏洞。", "x": "靠抄一个人救急，说明问题不在那个人身上。"}, {"e": "清·嘉道", "t": "嘉道中衰：一个王朝的缓慢漏气", "b": "嘉庆、道光两朝没有大的战乱，却问题频出：吏治腐败、财政紧张、河道失修、白银外流。表面平稳，底下的缓冲垫一点点被磨薄。", "x": "衰落很少是突然发生的，更多是缓冲余地一点一点被耗掉。"}, {"e": "《清代学术概论》", "t": "考据学为什么在清代这么发达", "b": "乾嘉学派做训诂、校勘、辨伪，方法严谨，成果巨大。梁启超认为这与文字狱的高压有关：学者把精力放在安全且可验证的领域。", "x": "环境的限制，会把才华挤到它允许的方向去。"}, {"e": "《清代学术概论》", "t": "汉学与宋学的对立", "b": "清代学者以汉学（训诂考据）对抗宋学（义理解释），强调回到文本本身。这场争论不只是学术分歧，也是对解释权的争夺。", "x": "学术方法之争，背后常常是关于谁有权力解释世界。"}, {"e": "清·道光", "t": "白银外流：鸦片背后的货币危机", "b": "十九世纪初英国向中国大量输入鸦片，中国白银持续外流，银贵钱贱，农民实际税负加重。鸦片问题首先是经济问题，不只是道德问题。", "x": "看起来是风气的问题，算下来往往是账的问题。"}, {"e": "《洪业》", "t": "明清易代不是一次征服，是两个精英集团的合流", "b": "魏斐德强调，清朝能建立统治，依靠了大量汉族士绅的合作，包括地方秩序重建与赋税体系。征服者需要被征服者的治理能力。", "x": "能坐稳的政权，通常是把原来的精英吸纳进来，而不是全换掉。"}, {"e": "清·道光", "t": "林则徐禁烟：一次坚决但不彻底的行动", "b": "1839 年林则徐在虎门销毁两万余箱鸦片，态度坚决。但他和清廷对英国的反应估计不足，也没有相应军备作为后盾。", "x": "决心可以快，配套的能力不会跟着决心一起长出来。"}, {"e": "清·道光", "t": "定海、镇江：清军为什么打不过", "b": "鸦片战争中英军舰队沿海机动，清军火炮射程短、指挥分散，各口岸之间难以互相支援。战争暴露的是体系差距，不是勇气差距。", "x": "在体系级别的差距面前，个体的勇敢解决不了问题。"}, {"e": "《洪业》", "t": "江南为什么抵抗得那么惨烈", "b": "剃发令之后，江南各地发生大规模抵抗，许多城市被屠。抵抗的激烈程度，与当地士绅的文化认同和宗族组织密切相关。", "x": "越是自成一套秩序的地方，越难接受外来的强制改变。"}, {"e": "清·道光", "t": "《南京条约》：中国近代第一个不平等条约", "b": "1842 年条约规定割让香港岛、赔款两千一百万银元、开放五口通商、协定关税。协定关税这一条影响最深远，中国失去了自主定税的权力。", "x": "最伤人的条款往往不在明面上的赔款里。"}, {"e": "《洪业》", "t": "地方秩序靠谁来维持", "b": "明清之际，地方绅士在战乱中组织团练、赈济、修城，实际承担了政府无力覆盖的职能。政权更替时，这批人往往决定了地方的归属。", "x": "中央更替的时候，地方秩序靠的是那些不出名的人。"}, {"e": "《太平天国》", "t": "洪秀全的宗教想象是怎么形成的", "b": "洪秀全多次乡试不中，一场大病后读到基督教小册子，把自己的幻觉解释成上天授命。个人挫折与外来文本结合，成了运动的起点。", "x": "能点燃很多人的，往往是一个人无处安放的挫败。"}, {"e": "清·咸丰", "t": "《瑷珲条约》与东北的失地", "b": "1858 年沙俄趁第二次鸦片战争之机，迫使黑龙江将军奕山签订瑷珲条约，割去黑龙江以北六十多万平方公里土地。", "x": "别人打仗的时候，最容易在旁边丢东西。"}, {"e": "《太平天国》", "t": "南京改名为天京之后发生的事", "b": "太平天国定都南京后迅速建立起一套等级森严的王府制度，与最初宣导的平等形成强烈反差。组织的现实会很快压过口号。", "x": "理想主义组织一旦掌权，往往比旧体制更快长出等级。"}, {"e": "清·咸丰", "t": "《天津条约》《北京条约》：更多的开口与权限", "b": "第二次鸦片战争后，清政府签订天津条约与北京条约，增开商埠、允许公使驻京、允许传教、割让九龙司。外国势力从沿海进入首都。", "x": "让步一旦形成惯例，就会变成下一轮谈判的起点。"}, {"e": "《太平天国》", "t": "为什么太平天国没能赢得士绅", "b": "太平天国反孔、毁庙、改变文字与礼制，直接触动了士绅的文化与利益根基。失去这一层支持，基层治理几乎无从建立。", "x": "想改造一个社会，绕不开那个社会里最会办事的人。"}, {"e": "清·咸丰", "t": "咸丰为什么觉得自己委屈", "b": "咸丰继位就撞上太平天国与英法联军，勤于批折却一再误判。他继承的是一套已经无法应对新局面的制度，个人的勤勉顶不住整体的失灵。", "x": "一个人的努力，填不平一整个体系的窟窿。"}, {"e": "《怀柔远人》·何伟亚", "t": "朝贡礼仪不是表演，是一套秩序声明", "b": "何伟亚指出，马戛尔尼访华中的礼仪安排，在清廷看来是确认天下秩序的程序，而非单纯的礼节。英方只看到侮辱，没看到这层意思。", "x": "误解对方的仪式，往往等于误解对方的世界观。"}, {"e": "清·咸丰", "t": "逃往热河：皇帝一走，中枢就空了", "b": "1860 年英法联军逼近北京，咸丰逃往承德，留下奕訢在京议和。皇帝离开政治中心，决策与信息都变得迟滞。", "x": "关键人物离场，组织就会陷入没有主心骨的等待。"}, {"e": "《中华帝国晚期的叛乱及其敌人》", "t": "团练：清廷把军事权力借给了地方", "b": "太平天国时期，清廷允许地方士绅组织团练自保。这解决了燃眉之急，也让地方掌握了军队、财政与人事，中央权威随之削弱。", "x": "危机时借出去的力量，往往很难收回来。"}, {"e": "清·咸丰", "t": "辛酉政变：慈禧上台的那一年", "b": "咸丰死后，肃顺等八大臣辅政，慈禧与恭亲王奕訢联手发动政变，肃顺被处死，两宫垂帘听政。晚清半个世纪的政治格局在此定型。", "x": "权力交接的瞬间，决定后面几十年的走向。"}, {"e": "《叫魂》·孔飞力", "t": "专制权力与常规权力：两套机制在博弈", "b": "孔飞力区分皇帝的专制权力和官僚的常规权力。叫魂案中，皇帝借非常规手段绕过官僚系统直接施压，最终又在官僚的拖延中不了了之。", "x": "同一个体制里，往往有两套规则在互相消耗。"}, {"e": "清·咸丰", "t": "太平天国：一场持续十四年的内战", "b": "1851 年洪秀全在金田起义，建号太平天国，攻下南京后改名天京，控制大半个江南。清廷的正规军屡战屡败，只能依靠地方团练。", "x": "正规军打不动的仗，最后交给了体制外的力量。"}, {"e": "清·咸丰", "t": "圣库制度：能打仗，不能治国", "b": "太平天国推行圣库制，财产充公、统一分配，在战争时期能集中资源，但长期无法激励生产，占领区的经济很快难以为继。", "x": "能动员的制度，不等于能持续运转的制度。"}, {"e": "清·咸丰", "t": "天京事变：内部一刀比外部更致命", "b": "1856 年天京内部权力斗争激化，杨秀清被杀，韦昌辉又被处死，石达开率部出走。太平天国元气大伤，从此由盛转衰。", "x": "撑得住外部压力，未必撑得住内部的账。"}, {"e": "清·咸丰", "t": "湘军：体制外的军队救了体制", "b": "曾国藩以书生带兵，招募同乡、自筹军饷，湘军成为平定太平天国的主力。军队由地方组织起来，中央对军权的垄断就此松动。", "x": "到了危急时刻借来的力量，事后不容易收回。"}, {"e": "清·咸丰", "t": "厘金：一个临时税种活了几十年", "b": "为筹措军饷，清廷允许地方设卡征收过境税，即厘金。它效率高、见效快，但层层设卡，成为商业流通的长期负担。", "x": "应急的办法一旦好用，就没多少人愿意再改回去。"}, {"e": "清·咸丰", "t": "总理衙门：清廷第一个外交机构", "b": "1861 年设立总理各国事务衙门，由奕訢主持，处理对外交涉、通商、海防等事务。传统朝贡体系之外，终于有了一个现代意义上的对外机构。", "x": "承认需要专门机构处理某件事，本身就是一次观念转变。"}, {"e": "清·同治", "t": "洋务运动：只换工具，不动结构", "b": "曾国藩、李鸿章、左宗棠等人办工厂、设船政局、练新军，主张师夷长技以制夷。技术层面的追赶推进得很快，制度层面的改革几乎没动。", "x": "只换工具、不改结构，关键时刻就会被打回原形。"}, {"e": "清·同治", "t": "江南制造总局：中国第一座机器工厂", "b": "1865 年李鸿章在上海创办江南制造总局，生产枪炮弹药并附设翻译馆，翻译西方科技书籍，培养了一批早期技术人才。", "x": "一个工厂能带出的，往往不只是产品。"}, {"e": "清·同治", "t": "福州船政局：自己造船的尝试", "b": "左宗棠在福州马尾创办船政局，附设船政学堂，培养了严复、邓世昌等一批人。它让中国第一次系统接触近代造船与海军教育。", "x": "技术引进最值钱的副产品，是人。"}, {"e": "清·同治", "t": "留美幼童：被提前叫回来的那一批孩子", "b": "1872 年起清政府派幼童赴美留学，原定十五年，因担心西化过深在 1881 年提前召回。其中出了詹天佑等人，但多数人的学业被中断。", "x": "担心被改变得太多，往往会失去本来能得到的东西。"}, {"e": "清·同治", "t": "京师同文馆：培养第一批翻译与外交人才", "b": "1862 年设立同文馆，教授外语与西学，是中国最早的近代官办学校之一。反对者认为读洋文有失体统，争议持续多年。", "x": "学习对方的语言，常常比学技术更让人抗拒。"}, {"e": "清·同治", "t": "天津教案：民愤与外交的双重夹击", "b": "1870 年天津因传闻教堂拐卖儿童引发骚乱，法国领事等数十人被杀。曾国藩处理时既遭外国压力，又被国内舆论指责软弱。", "x": "夹在两边的中间人，往往两边都不讨好。"}, {"e": "清·光绪", "t": "左宗棠收复新疆：一场赌国库的远征", "b": "1870 年代阿古柏占据新疆，沙俄占伊犁。左宗棠主张塞防，率军西征，靠借款和转运粮草完成收复，新疆随后建省。", "x": "最难的不是打，是把部队送到能打的地方。"}, {"e": "清·光绪", "t": "海防与塞防之争：有限的银子往哪放", "b": "李鸿章主张优先海防，左宗棠主张塞防，最终两边都办，两边都不够。资源约束下，选择题往往没有让人满意的答案。", "x": "预算不够时，真正的决策是决定哪件事不做。"}, {"e": "清·光绪", "t": "北洋水师：亚洲第一，然后呢", "b": "1888 年成军的北洋水师一度号称亚洲第一，但此后购舰停滞、弹药不足、训练流于形式。领先是暂时的，投入一停就开始落后。", "x": "排名是最会骗人的东西，尤其是靠一次投入换来的排名。"}, {"e": "清·光绪", "t": "甲午战争：输的不只是海战", "b": "1894 年战争在朝鲜爆发，陆战与海战接连失利，北洋水师在威海卫覆没。清廷战前对日本实力评估严重不足。", "x": "判断错了对手，后面的准备都白做。"}, {"e": "清·光绪", "t": "《马关条约》：两亿两白银的重量", "b": "1895 年条约割让台湾、澎湖与辽东，赔款两亿两白银。赔款逼出了后来的借款与列强瓜分，财政被彻底绑住。", "x": "一次赔款的数字，会成为之后十几年的枷锁。"}, {"e": "清·光绪", "t": "三国干涉还辽：弱国需要别人来保", "b": "马关条约后俄德法三国出面干涉，日本退还辽东，清廷以三千万两赎回。表面收复失地，实际上把自己放进了列强的博弈盘里。", "x": "靠别人拿回来的东西，往往要用别的方式还。"}, {"e": "清·光绪", "t": "公车上书：读书人第一次集体发声", "b": "马关条约签订后，康有为等举人上书反对议和，主张变法。虽然没送到皇帝手里，但形成了士人公开议论国事的氛围。", "x": "一个诉求有没有被听到不重要，重要的是有人开始说了。"}, {"e": "清·光绪", "t": "强学会与《时务报》：维新派的传播机器", "b": "康有为办强学会，梁启超主笔《时务报》，用报纸把变法主张传播到各地。思想动员先于政治行动。", "x": "改变舆论的成本一降低，行动的门槛就跟着降低。"}, {"e": "清·光绪", "t": "戊戌变法：一百零三天的改革", "b": "1898 年光绪推行新政，涉及教育、军事、工商、官制，百余日间发布大量诏令，触动了大量既得利益者。", "x": "改革失败往往不是因为目标错，而是节奏超出了承受力。"}, {"e": "清·光绪", "t": "戊戌政变的直接导火索", "b": "变法派试图拉拢袁世凯以武力对抗慈禧，事机泄露，慈禧发动政变，光绪被软禁，谭嗣同等六君子被杀。", "x": "没有可靠力量的政变计划，等于把牌摊给对方看。"}, {"e": "清·光绪", "t": "废除科举前的那场争论", "b": "变法期间主张废八股、改试策论，虽随变法失败而中止，但议题已经摆上台面。制度的改变常常在失败后被下一轮接手。", "x": "失败的主张也可能赢，只是晚几年。"}, {"e": "清·光绪", "t": "义和团：民间焦虑的爆发", "b": "1890 年代末山东直隶教案与民教冲突频发，义和团以扶清灭洋为号，攻击教堂教民。背后是旱灾、失业与对变化的恐惧。", "x": "看起来是情绪的行动，底下是具体的生计问题。"}, {"e": "清·光绪", "t": "庚子西狩：清廷的又一次出逃", "b": "1900 年八国联军攻入北京，慈禧带光绪逃往西安。这是四十年内清廷第二次弃都，中央权威进一步削弱。", "x": "同一个组织如果反复靠撤离保命，最后就没人再当真。"}, {"e": "清·光绪", "t": "《辛丑条约》：四亿五千万两", "b": "1901 年条约规定赔款四亿五千万两，分三十九年还清，本息合计近十亿两，并允许列强驻兵北京至山海关沿线。", "x": "把赔款按人头算，是让每个中国人都背上这笔账。"}, {"e": "清·光绪", "t": "新政：清廷最后一次认真的自救", "b": "1901 年后清廷推行新政，废科举、练新军、办学堂、筹备立宪、奖励实业。改革力度很大，但财政与时间都不站在它这边。", "x": "改革来得太晚时，它本身也会成为旧秩序崩解的一部分。"}, {"e": "清·光绪", "t": "废科举：一条路的终点", "b": "1905 年清廷下诏停止科举，读书人失去延续千年的上升通道，转向新式学堂、军队、商业与革命。这项改革促进了近代化，也移走了一块稳定的基础。", "x": "砸掉一条路时，要想清楚人会往哪里走。"}, {"e": "清·宣统", "t": "新军：清廷亲手培养的掘墓人", "b": "清末编练新军，装备近代、军官多为留学生，但思想上也更接近革命。湖北新军后来成为武昌起义的主力。", "x": "一支军队的组织形式，也会改变它的政治倾向。"}, {"e": "清·宣统", "t": "预备立宪与皇族内阁", "b": "1906 年清廷宣布预备立宪，1908 年颁布《钦定宪法大纲》，1911 年成立内阁，但十三名大臣中满族占九席。承诺一旦被看成敷衍，信任就回不来了。", "x": "给出承诺却不肯真的让权，比不承诺更伤信任。"}, {"e": "清·宣统", "t": "保路运动：一条铁路点燃全国", "b": "1911 年清廷宣布铁路国有，将民办的川汉、粤汉铁路收归，补偿条件引发强烈不满，四川爆发大规模抗议。地方与中央的对立被彻底撕开。", "x": "具体的利益问题，最容易变成全国性的情绪。"}, {"e": "清·宣统", "t": "武昌起义：一颗子弹引发的连锁", "b": "1911 年 10 月 10 日新军起义，占领武昌，各省随后纷纷宣布独立。清廷此时已无力调动可靠军队，只能请袁世凯出面。", "x": "压垮系统的往往不是最强的一击，而是最后一下。"}, {"e": "清·宣统", "t": "袁世凯的算术：谁能调动军队谁说了算", "b": "袁世凯掌控北洋新军，在清廷与革命党之间周旋，一面逼清帝退位，一面与南方谈判，最终成为民国临时大总统。", "x": "到了最后，决定权落在谁手里，比谁更有道理更重要。"}, {"e": "清·宣统", "t": "清帝退位：中国最后一份退位诏书", "b": "1912 年 2 月 12 日宣统退位，诏书由张謇起草，承认共和，延续两千一百多年的帝制结束。", "x": "制度的终结往往是一纸文书，但支撑它的结构早就松了。"}, {"e": "清·宣统", "t": "孙中山与辛亥革命的角色", "b": "孙中山长期在海外组织革命、宣传三民主义，武装起义多次失败。辛亥革命爆发时他不在国内，但此前的舆论与组织积累不可替代。", "x": "关键事件的爆发看似偶然，背后是长期的准备。"}, {"e": "清·制度", "t": "军机处与内阁：清朝的中枢怎么运转", "b": "清朝政务实际由军机处拟旨、皇帝朱批后执行，内阁处理日常。中枢机构重叠，相互牵制，效率取决于皇帝个人的精力。", "x": "权力越集中，运转效率就越依赖一个人的状态。"}, {"e": "清·制度", "t": "满汉双轨：一个政权两种官员", "b": "清朝重要职位多设满汉两员，相互牵制。满族在核心职位上占据优势，汉族官员实际治理地方。这种安排维持了平衡，也限制了用人。", "x": "为防止某一方坐大而设计的结构，往往牺牲了效率。"}, {"e": "清·制度", "t": "督抚与中央：地方权力为何越来越重", "b": "太平天国以后，地方督抚掌握军队、财权与人事，中央对南方的控制减弱。清后期很多决策实际上是地方在做。", "x": "中央把救火的任务交给地方，火权也一并交出去了。"}, {"e": "清·制度", "t": "捐纳制度：卖官的那笔账", "b": "清朝允许捐钱买官，以补财政缺口。短期填补了收入，长期让官场充斥不专业的人，也让行政效率持续下滑。", "x": "一旦把公职当成商品，治理的质量就很难保证。"}, {"e": "清·制度", "t": "漕运与盐政：清朝的两大财源", "b": "清朝靠运河漕粮供应北京，靠盐专卖获得巨额收入。运河淤塞与私盐泛滥让这两项优势逐渐削弱，财政随之紧张。", "x": "财政的根基一旦松动，所有问题都会跟着冒出来。"}, {"e": "清·制度", "t": "保甲制度：国家治理的最末端", "b": "清代地方以保甲编户，负责治安、催税、统计人口。国家治理只到县一级，基层实际依靠宗族与乡绅维持。", "x": "治理成本过高时，国家会把一部分责任留给社会自己。"}, {"e": "清·制度", "t": "幕府与师爷：衙门里真正办事的人", "b": "清代官员多不熟悉律例与钱粮，实权往往在幕僚手里，刑名、钱谷师爷是地方行政的实际执行者。", "x": "名义上的权力和实际办事的人，常常不是同一批。"}, {"e": "清·制度", "t": "《大清律例》：帝国的行为边界", "b": "清代律例详细规定刑罚与行政规则，是帝国治理的重要依据。它稳定了秩序，但也让地方司法高度依赖条文与惯例。", "x": "规则越细，越能减少随意，也越容易跟不上变化。"}, {"e": "清·社会", "t": "清代的人口爆炸", "b": "清代人口从一亿多增长到四亿左右，得益于长期和平、摊丁入亩、新作物推广。人口压力同时意味着人均资源紧张。", "x": "总量增长的背后，往往是每个人分到的越来越少。"}, {"e": "清·社会", "t": "番薯与玉米：养活中国的美洲作物", "b": "番薯、玉米、马铃薯自明末传入，清代在山地丘陵广泛种植，支撑了人口增长，也带来过度开垦与水土流失。", "x": "救急的办法，用久了也会变成新的负担。"}, {"e": "清·社会", "t": "一条辫子的政治含义", "b": "剃发留辫是清朝统治的象征，清初强制推行，清末又成为革命的对象。同一件事，在不同时期被读成完全相反的信号。", "x": "符号的意义，往往由当时的人赋予，而不是它本身。"}, {"e": "清·社会", "t": "缠足：一个社会的自我约束", "b": "缠足在清代社会各阶层广泛存在，既是审美偏好，也是婚姻竞争的结果。直到清末才被逐渐视为陋习而反对。", "x": "一种伤害被普遍接受时，往往不是没人看见，而是没人能先停下。"}, {"e": "清·社会", "t": "清代女性的实际位置", "b": "女性在法律与礼教上受压制，但实际经济与家庭角色复杂，寡妇主家、女性经营商业并不罕见。规范与生活之间总有距离。", "x": "制度写得再严，生活也会自己找到缝隙。"}, {"e": "清·社会", "t": "宗族：乡村的自我治理", "b": "清代宗族通过族田、祠堂、族规管理成员，处理纠纷与救济。国家无力覆盖的基层事务，很大一部分落在宗族身上。", "x": "公共治理不足时，社会会自己长出一些结构。"}, {"e": "清·社会", "t": "会馆与商帮：流动人口的组织", "b": "清代商业发达，同乡商人设会馆，提供住宿、借贷、调解与互助，晋商、徽商由此形成全国网络。", "x": "人一旦流动起来，就会需要新的组织来接住他们。"}, {"e": "清·社会", "t": "晋商与票号：中国早期的金融网络", "b": "山西商人经营票号，做汇兑与存放款业务，分号遍及全国。信用靠同乡与宗族关系保障，在没有现代银行的时代运转了几百年。", "x": "信任这个东西，可以靠关系替代制度运转一阵子。"}, {"e": "清·社会", "t": "徽商：靠科举与商业的结合", "b": "徽商经营盐、茶、木材与典当，重视子弟读书，商而优则仕。商业资本与科举身份相互支撑。", "x": "资本与身份结合，是最稳的一种积累方式。"}, {"e": "清·社会", "t": "清代的城市与市镇", "b": "清代江南市镇密集，工商业与手工业发达，苏州、杭州、汉口等城市人口众多。城市化带来新的社会问题与管理需求。", "x": "城市一变大，旧的治理方式就不够用了。"}, {"e": "清·社会", "t": "《红楼梦》背后的清代社会", "b": "曹雪芹写贾府的兴衰，展示清代贵族家庭的经济结构、人际网络与礼法压力。一个家族的败落，也在写制度如何运转。", "x": "最好的社会史，常常藏在小说里。"}, {"e": "清·社会", "t": "京剧的形成", "b": "清代徽班进京，融合昆曲、秦腔等，形成京剧。宫廷与市民的双重需求，共同推动了这门艺术。", "x": "一种艺术成熟，往往需要两边同时喜欢它。"}, {"e": "清·对外", "t": "朝贡体系：清廷理解世界的框架", "b": "清朝以朝贡关系理解对外交往，视外国为藩属或蛮夷。这套框架在遇到平等交往的要求时，既无法理解，也无法应对。", "x": "理解世界用的框架，决定了你能看见什么、又看不见什么。"}, {"e": "清·对外", "t": "广州体制：只有一条缝的通商", "b": "乾隆以后西洋贸易限于广州，由十三行代理，外商活动受限。贸易集中在一点，信息与技术输入也同样被压缩。", "x": "把门留成一条缝，进来的东西也就只有那么一点。"}, {"e": "清·对外", "t": "传教士与西学东渐", "b": "明末清初耶稣会士带来天文、历法、地图与数学知识，在宫廷任职。后来礼仪之争导致传教受限，交流中断。", "x": "知识的流动常常走一条非正式的窄路，断了就很难恢复。"}, {"e": "清·对外", "t": "礼仪之争：跪与不跪的问题", "b": "罗马教廷禁止中国教徒祭祖祭孔，康熙认为这是干涉内政，下令禁教。文化交流中最难谈的，往往不是知识，而是规则。", "x": "看起来是礼节的分歧，实际上是权威归属的分歧。"}, {"e": "清·对外", "t": "徐继畬与《瀛寰志略》", "b": "徐继畬在福建任职时搜集资料，编成《瀛寰志略》，介绍各国地理与政体，其中对美国制度的描述相当正面。此书在当时影响有限。", "x": "有人已经看清了，不等于整个系统会跟着改变。"}, {"e": "清·对外", "t": "魏源与《海国图志》", "b": "魏源编《海国图志》，提出师夷长技以制夷，介绍各国地理与军事技术。书在中国反响平平，在日本却被广泛阅读。", "x": "同一条信息，落在不同的环境里，价值完全不同。"}, {"e": "清·对外", "t": "郭嵩焘：第一个驻外使节的孤立", "b": "郭嵩焘出使英国，认真观察西方制度与生活，写日记如实记录，却被朝野斥为崇洋。他回国后几乎被排挤。", "x": "最先看见真相的人，往往最先被自己人攻击。"}, {"e": "清·对外", "t": "关税自主权的丧失", "b": "鸦片战争后协定关税，中国不能自主设定进口税率，税率长期很低。海关收入成为财政支柱，但税率由别人决定。", "x": "把一项关键权力交出去，恢复起来要花很久。"}, {"e": "清·对外", "t": "海关总税务司与赫德", "b": "英国人赫德长期主持中国海关，建立了高效、廉洁的税务体系，同时深度参与外交事务。能力很强，但权力掌握在外国人手里。", "x": "效率高的机构，如果归属不清，也是一种风险。"}, {"e": "清·对外", "t": "甲午之后的瓜分狂潮", "b": "1895 年后列强争相租借港口、划分势力范围，中国面临被瓜分的危机。危机会同时催生改革与激进化。", "x": "外部压力最大的时候，内部往往也最分裂。"}, {"e": "清·人物", "t": "康熙：一个长期执政者做了什么", "b": "康熙在位六十一年，平三藩、收台湾、抗沙俄、编《康熙字典》，同时晚期吏治松弛、继承问题未决。长任期既积累成就，也积累问题。", "x": "在位越久，留下的未解决问题也越多。"}, {"e": "清·人物", "t": "雍正：十三年把制度拧了一遍", "b": "雍正勤政、严苛，推行摊丁入亩、密折、军机处、养廉银，整顿财政与吏治。他做的多是费力不讨好的基础工作。", "x": "最不显眼的制度建设，往往决定后面几十年的稳定。"}, {"e": "清·人物", "t": "乾隆：把盛世用完了", "b": "乾隆前期疆域扩张、文化工程浩大，后期宠信和珅、吏治败坏、财政透支。一个盛世在他手里走向尽头。", "x": "盛世的消耗，往往在同一代人身上完成。"}, {"e": "清·人物", "t": "和珅：一个人能贪到什么程度", "b": "和珅受乾隆宠信，身兼多职，聚敛巨额财富，嘉庆即位后被赐死抄家。个人得势的极限，也取决于制度对他的约束有多松。", "x": "一个人的胃口，取决于容器有多松。"}, {"e": "清·人物", "t": "纪晓岚与《四库全书》", "b": "纪昀主持《四库全书》编纂，整理了大量典籍，也在查禁书籍的过程中承担了大量工作。", "x": "整理和删除，常常出自同一双手。"}, {"e": "清·人物", "t": "曹雪芹：把家族兴衰写成书", "b": "曹雪芹出身江宁织造世家，家道中落后写《红楼梦》，以贾府兴衰写出清代社会的结构与人心。", "x": "最深的观察，常常来自自己失去的东西。"}, {"e": "清·人物", "t": "林则徐：认真但不完全清醒", "b": "林则徐禁烟坚决，收集西洋资料编《四洲志》，但同样受限于时代认知，对英国的军事反应估计不足。", "x": "再认真的人，也受限于他所在时代的边界。"}, {"e": "清·人物", "t": "曾国藩：笨办法与硬功夫", "b": "曾国藩以结硬寨、打呆仗著称，重视后勤与组织，办湘军、开洋务。他不投机，靠可靠的组织一点一点推进。", "x": "面对复杂局面，笨办法常常是有效办法。"}, {"e": "清·人物", "t": "李鸿章：替清廷签了最多的字", "b": "李鸿章掌握北洋与外交资源，代表清廷签订马关、辛丑等条约。他既是能力最强的实务者，也是被骂得最多的人。", "x": "站在最前面的人，往往要替整个系统担责。"}, {"e": "清·人物", "t": "左宗棠：抬着棺材去西北", "b": "左宗棠主张塞防，率军收复新疆，坚持寸土不让。他办事风格强硬，与李鸿章多有冲突。", "x": "有些事不坚持，就真的没有了。"}, {"e": "清·人物", "t": "张之洞：中学为体，西学为用", "b": "张之洞办汉阳铁厂、自强学堂，提出中学为体西学为用，试图在保留制度的前提下引进技术。这条路线后来被证明走不通。", "x": "只借用工具而不改结构，最终还是会被逼到结构上。"}, {"e": "清·人物", "t": "康有为：托古改制", "b": "康有为借孔子的名义推动变法，著《新学伪经考》《孔子改制考》，用旧权威包装新主张以减小阻力。", "x": "改动的阻力越大，越需要借旧的外壳。"}, {"e": "清·人物", "t": "梁启超：一支笔的力量", "b": "梁启超流亡日本后办《清议报》《新民丛报》，以通俗有力的文章传播新思想，影响了一代青年。", "x": "在没有权力的地方，文字仍然可以塑造一代人。"}, {"e": "清·人物", "t": "谭嗣同：可以选择走却留下的人", "b": "戊戌政变后谭嗣同拒绝出逃，说各国变法无不从流血而成，最终与其他五人一同被杀。", "x": "有些选择的意义，不在结果，而在它表明了什么。"}, {"e": "清·人物", "t": "慈禧：掌权四十七年的代价", "b": "慈禧以垂帘听政掌握晚清实权，支持过洋务与新政，也支持过义和团。她的判断在关键节点上多次错过时机。", "x": "长期掌权者的判断失误，代价会由整个组织承担。"}, {"e": "清·人物", "t": "奕訢：被猜忌的有能力者", "b": "恭亲王奕訢主持总理衙门，是晚清少有的了解对外事务的高层，但长期受到慈禧猜忌，难以施展。", "x": "对有能力者的猜忌，本身就是一种治理成本。"}, {"e": "清·人物", "t": "光绪：有心无力的皇帝", "b": "光绪支持戊戌变法，但无实权、无军队、无地方支持，政变后被软禁。志愿与能力之间隔着一整套结构。", "x": "只有意愿没有实权，改革就无法落地。"}, {"e": "清·人物", "t": "袁世凯：在最关键处站着的人", "b": "袁世凯掌握北洋新军，在清廷与革命党之间周旋，逼清帝退位后成为民国大总统，后来又试图称帝失败。", "x": "谁掌握兵力，谁就有资格谈条件。"}]}, {"id": "modern", "name": "近代史", "desc": "1840 到 1949 · 44 张", "cards": [{"e": "近代·晚清", "t": "近代的起点：1840 年为什么是个分水岭", "b": "鸦片战争之前，中国与外部世界的接触限于朝贡与广州贸易；之后条约体系、通商口岸、外籍税务司、传教士进入内地，原有的秩序被一层层改写。", "x": "一个时代结束的标志，往往是旧规则再也管不住新问题。"}, {"e": "近代·晚清", "t": "通商口岸：新城市是怎么长出来的", "b": "上海、天津、汉口、广州等开埠城市出现租界、洋行、银行、报馆、教堂，形成中外混杂的城市空间。近代的城市形态在很大程度上由口岸塑造。", "x": "开放最先改变的不是政策，而是城市的形状。"}, {"e": "近代·晚清", "t": "租界：一块主权模糊的地", "b": "租界由外国侨民自治管理，有自己的巡捕、法庭与税收，中国政府在其中的权力受限。它同时是近代市政的样本和主权的缺口。", "x": "治理能力强的外来区块，最容易让人产生复杂的心态。"}, {"e": "近代·晚清", "t": "海关总税务司：效率与主权之间的张力", "b": "赫德主持下的海关建立了近代化的征税与统计体系，廉洁高效，但决定权掌握在外国人手里。制度先进与主权受损同时存在。", "x": "效率高的机构，如果归属不清，也是一种长期风险。"}, {"e": "近代·晚清", "t": "洋务企业与官督商办", "b": "轮船招商局、汉阳铁厂、开平矿务局等多采用官督商办，官方给资源和保护，商人出资经营。这种模式起步快，也容易滋生权责不清。", "x": "官方背书能加速起步，也容易让经营者不承担真实后果。"}, {"e": "近代·晚清", "t": "电报与铁路：让帝国的反应变快", "b": "电报线在 1870 年代后铺设，铁路在争议中逐步修建。它们让信息和兵力快速流动，也冲击了旧有的运输与风水观念。", "x": "基础设施一变，组织的反应速度就变了。"}, {"e": "近代·晚清", "t": "新式学堂与废科举后的读书人", "b": "京师大学堂、南洋公学等新式学堂建立，废除科举后读书人转向新学。一批人成了工程师、记者、教师和革命者。", "x": "上升通道一改，一代人的去向就全变了。"}, {"e": "近代·晚清", "t": "报馆与舆论的崛起", "b": "《申报》《时务报》《民报》等报刊出现，识字率的提升与印刷技术的普及让舆论成为政治力量。近代政治第一次需要考虑读者。", "x": "当读的人变多，说服就成为一门新的政治技术。"}, {"e": "近代·晚清", "t": "留日学生：革命思想的中转站", "b": "清末大量学生赴日本留学，日本的译著、社团与革命组织成为新思想的集散地，同盟会即在东京成立。", "x": "思想常常是在别处先成形，再带回来的。"}, {"e": "近代·晚清", "t": "商会与地方自治", "b": "清末商会在通商城市兴起，参与市政、治安、教育与调解。地方精英第一次以组织化的方式介入公共事务。", "x": "国家的空隙里，会自己长出管理公共事务的组织。"}, {"e": "近代·晚清", "t": "孙中山的三民主义", "b": "民族、民权、民生三条纲领，试图把反满、共和与社会改良整合在一起。它为分散的革命力量提供了共同语言。", "x": "把诉求整合成语言，是动员的第一步。"}, {"e": "近代·晚清", "t": "同盟会与多次起义", "b": "1905 年同盟会在东京成立，之后发动多次起义，均告失败，但积累了组织与舆论基础。辛亥革命爆发时，这些积累成了现成的骨架。", "x": "关键事件的爆发看似偶然，背后是长期的准备。"}, {"e": "近代·晚清", "t": "辛亥革命：清朝倒下的那一天", "b": "1911 年 10 月 10 日武昌起义，各省相继宣布独立，1912 年清帝退位。共和制度的建立速度远超多数人的预期。", "x": "旧秩序一旦失去军心，结束会快得不可思议。"}, {"e": "近代·民国", "t": "袁世凯与北洋：军队成了政治资本", "b": "袁世凯掌握北洋新军，在清廷与革命党之间周旋，成为民国临时大总统。此后北洋军队成了政治的最终裁决者。", "x": "谁掌握暴力，谁就有资格谈条件。"}, {"e": "近代·民国", "t": "民国初年的政党与议会", "b": "民国初年政党林立，国会选举、内阁更替频繁。制度形式已经搭起来，但没有相应的社会基础与军队支持。", "x": "制度移植得快，社会基础跟不上就会反复。"}, {"e": "近代·民国", "t": "宋教仁遇刺：一次关键人物的消失", "b": "1913 年宋教仁在上海遇刺，国民党与袁世凯的合作彻底破裂，议会政治的道路基本被堵死。", "x": "关键人物的消失，会让一条路线直接断掉。"}, {"e": "近代·民国", "t": "二次革命与护法运动", "b": "袁世凯控制中央后，国民党发动二次革命失败，孙中山南下广州组织护法。中央与地方的对抗成为民国初年的主线。", "x": "没有军队支撑的政治主张，很难落地。"}, {"e": "近代·民国", "t": "袁世凯称帝：一次失败的赌注", "b": "1915 年袁世凯宣布称帝，遭到各方反对，不到三个月取消，次年病死。旧式权威在共和时代已经失去合法性。", "x": "用旧脚本演新戏，观众不会买账。"}, {"e": "近代·民国", "t": "军阀混战：地方割据的二十年", "b": "北洋分裂后，直系、皖系、奉系等军阀争夺中央，地方军事化加剧。国家统一在很长时间里只是一种名义。", "x": "中央权威一旦碎裂，地方军事力量会迅速填补空白。"}, {"e": "近代·民国", "t": "五四运动：学生走上街头", "b": "1919 年巴黎和会消息传来，北京学生上街抗议，随后全国响应。新文化运动的思想积累与民族情绪在这里汇合。", "x": "社会情绪需要现成的组织才能变成行动。"}, {"e": "近代·民国", "t": "新文化运动：从语言开始改造", "b": "胡适提倡白话文，陈独秀办《新青年》，鲁迅写《狂人日记》。语言工具的改造，让新思想能进入更多人的阅读范围。", "x": "语言一变，思想的传播半径就变了。"}, {"e": "近代·民国", "t": "科学与民主：一个时代的两个关键词", "b": "五四提出的科学与民主，把批判的矛头指向传统礼教与家族制度。它既是思想解放，也是对旧社会结构的公开质疑。", "x": "口号之所以有力，是因为它同时说中了理想和不满。"}, {"e": "近代·民国", "t": "马克思主义在中国的传播", "b": "十月革命后，李大钊、陈独秀等人开始介绍马克思主义，1921 年中国共产党成立。一种新的组织方式进入中国的政治场。", "x": "新的组织方式进来，往往比新的理论更改变局面。"}, {"e": "近代·民国", "t": "第一次国共合作与北伐", "b": "1924 年国民党改组，与共产党合作，1926 年北伐迅速推进，击败吴佩孚、孙传芳，国民政府定都南京。", "x": "合作能迅速改变力量对比，也埋下分歧的伏笔。"}, {"e": "近代·民国", "t": "1927 年：合作破裂与新的分裂", "b": "北伐途中，国共合作破裂，随后进入十年内战。此后的政治主线，变成党内、党外的多条冲突同时进行。", "x": "旧问题没解决，新矛盾已经叠加上来。"}, {"e": "近代·民国", "t": "南京国民政府的十年", "b": "国民政府推行币制改革、修铁路、办教育，同时面临内部军阀与外部威胁。国家能力有限，很多政策难以真正落地。", "x": "现代化需要的不只是意愿，还有执行能力。"}, {"e": "近代·民国", "t": "法币改革：一次成功的货币统一", "b": "1935 年废银元、行法币，纸币统一，财政与市场得到稳定。抗日战争爆发后，为筹款大量发行，埋下通胀隐患。", "x": "短期有效的财政工具，用久了会反噬。"}, {"e": "近代·民国", "t": "农村问题：土地与佃租", "b": "近代中国农村土地集中、佃租高、借贷利息重，加上天灾与苛捐，大量农民生活艰难。农村问题贯穿整个近代。", "x": "所有宏大的政治，最终都要在村子里兑现。"}, {"e": "近代·抗战", "t": "日本侵华：从九一八到七七", "b": "1931 年九一八事变日本占领东北，1937 年七七事变全面侵华。民族危机压过了此前的内部纷争。", "x": "外部的压力，有时会短暂压下内部的矛盾，但不会解决它。"}, {"e": "近代·抗战", "t": "抗战中的后方工业内迁", "b": "大批工厂、学校与机构迁往重庆、昆明、成都等地，形成临时的工业与教育中心。战争迫使国家组织能力大幅提升。", "x": "极端的压力，也会逼出原本不存在的能力。"}, {"e": "近代·抗战", "t": "陕甘宁边区与根据地", "b": "中共在根据地推行土地政策、群众动员与基层政权建设，形成了与国统区不同的治理模式。", "x": "治理模式的竞争，往往比战争本身更决定长期走向。"}, {"e": "近代·抗战", "t": "重庆与延安：两种政治语言的对照", "b": "抗战时期，国民政府与中共在动员方式、社会政策与话语体系上差异明显。同一场战争里，有两条不同的组织路径。", "x": "同一个目标下，往往同时存在几种做法，看哪种能持续。"}, {"e": "近代·战后", "t": "抗战胜利后的局面", "b": "1945 年胜利后，国共对未来的政治安排分歧明显，谈判与冲突并行。国家重建的机会与内战的危险同时存在。", "x": "胜利之后的选择，往往比战争期间的判断更难。"}, {"e": "近代·战后", "t": "通货膨胀：民国后期的财政崩塌", "b": "内战期间军费浩大，货币超发，物价飞涨，城市居民的储蓄迅速蒸发。经济崩溃对政权的合法性的打击，往往比战场失利更直接。", "x": "一个政权失去货币信用时，公众对它的信任也会跟着耗光。"}, {"e": "近代·战后", "t": "土地改革：一次彻底的社会改造", "b": "在解放区推行的土地改革改变了农村的产权结构，把大量农民与新的政权绑定在一起。", "x": "把利益结构改掉，往往比赢几场仗更能改变格局。"}, {"e": "近代·战后", "t": "三大战役", "b": "辽沈、淮海、平津三大战役在不到半年内改变了军事力量对比，东北、华东、华北的控制权转移。", "x": "决定性战役的价值，在于让它后面的事变得不必再打。"}, {"e": "近代·战后", "t": "1949：近代的落幕", "b": "1949 年新中国成立，此后进入新的历史阶段。近代的很多议题，比如工业化、外交、农村问题，换了一种方式继续存在。", "x": "时代的名字会变，问题的清单往往还在。"}, {"e": "近代·专题", "t": "条约体系：一层层叠加的约束", "b": "从南京条约到辛丑条约，每次战败都带来新的条款，割地、赔款、通商、驻兵、传教，积累成一套结构性约束。", "x": "让步一旦成为惯例，下一轮谈判的起点就会更低。"}, {"e": "近代·专题", "t": "赔款与财政：借来的钱要用什么还", "b": "近代的赔款多靠向外国银行借款，以关税、盐税作抵押，财政的自主权被逐步抵押出去。", "x": "借来的钱，往往要用未来的选择权来还。"}, {"e": "近代·专题", "t": "教案与地方社会", "b": "传教士进入内地后，民教冲突频发，涉及土地、司法与地方权威。教案背后是旧秩序与新秩序在乡村层面的碰撞。", "x": "宏大的变化，最后都在具体的地方关系里显现。"}, {"e": "近代·专题", "t": "从士绅到新知识分子", "b": "科举废除后，读书人不再靠功名上升，转而成为教师、记者、律师、工程师。精英的构成和思维方式都变了。", "x": "精英的定义一变，社会的话语权也跟着变。"}, {"e": "近代·专题", "t": "女性与近代", "b": "废缠足、办女学、女性进入公共职业，这些变化首先出现在口岸城市。妇女解放与民族救亡结合，成为一种新的社会议题。", "x": "社会变革最先在最日常的地方留下痕迹。"}, {"e": "近代·专题", "t": "铁路与近代国家", "b": "铁路缩短了地理距离，也让中央能更快抵达边疆。同时，铁路修建与收回牵动了地方利益与民族情绪。", "x": "交通能力提升后，国家的边界也变得清晰。"}, {"e": "近代·专题", "t": "近代的公共舆论与知识分子", "b": "报刊、学会、学校构成了新的公共空间，知识分子以议论时政的方式参与政治，这种参与方式一直延续。", "x": "有读者的人，就有了某种政治力量。"}]}, {"id": "all", "name": "全部", "desc": "所有朝代一起看 · 283 张", "parts": ["ming", "qing", "modern"]}];
window.__GLOSSARY__ = {"孔子": "春秋鲁国人，儒家创始人。做过鲁国司寇，政治主张没被采纳，后半生办学讲学，主张以礼和道德秩序治理社会。", "老子": "春秋时期思想家，道家代表。主张少干预、顺自然，认为反复折腾往往带来更坏的后果。", "墨子": "战国时期思想家，墨家创始人。主张兼爱、非攻，同时擅长守城器械和组织纪律，是先秦少有的技术型团体。", "韩非": "战国末期法家代表，韩国公子。主张以法、术、势治国，让治理不依赖个人贤能，不依赖贤人。", "商鞅": "战国时期秦国改革家。推行军功授爵、废井田、奖励耕战，把秦国改造成高度动员的国家机器。", "管仲": "春秋时期齐国政治家，辅佐齐桓公称霸。善用经济手段，被后世视为早期重商与宏观调控的代表。", "屈原": "战国时期楚国大夫、诗人。主张联齐抗秦，不被采纳而流放，作《离骚》，最终投汨罗江。", "陈胜": "秦末农民起义领袖，与吴广在大泽乡起事，是第一次大规模反秦起义。", "吴广": "秦末起义领袖，与陈胜一同在大泽乡起兵，后被部下所杀。", "秦始皇": "名嬴政，结束战国分裂建立秦朝，统一文字、度量衡、货币，推行郡县制，也因高压统治迅速亡国。", "李斯": "秦朝丞相，法家代表。辅佐秦始皇统一制度，也参与沙丘之变，后被赵高陷害处死。", "刘邦": "汉高祖，起于沛县，推翻秦朝、击败项羽建立汉朝，实行郡国并行与休养生息。", "项羽": "秦末西楚霸王，巨鹿之战击败秦军主力，后与刘邦争天下，垓下兵败自刎。", "汉武帝": "名刘彻，西汉第七位皇帝。北击匈奴、通西域、独尊儒术，同时盐铁官营，连年征战耗尽民生。", "司马迁": "西汉史学家。因替李陵辩护受宫刑，忍辱完成《史记》，开创纪传体通史。", "张骞": "西汉使者。两次出使西域，本为联合大月氏夹击匈奴，军事目的落空，却打通了丝绸之路。", "王莽": "西汉外戚，代汉建立新朝。照《周礼》强行复古改制，失败后新朝速亡。", "刘秀": "汉光武帝，东汉开国皇帝。战乱后休养生息、裁撤冗员，重建中央集权的文书行政。", "蔡伦": "东汉宦官，改进造纸术，使纸张逐渐取代竹简，书籍成本大幅下降。", "曹操": "东汉末政治家、军事家。统一北方，推行屯田，为曹魏奠基，一生未称帝。", "刘备": "三国时期蜀汉开国皇帝，以宗室身份起兵，据益州与蜀汉对抗曹魏、东吴。", "孙权": "三国时期东吴建立者，据长江天险，与魏、蜀鼎立，开发江南。", "诸葛亮": "三国时期蜀汉丞相，辅佐刘备、刘禅，主政蜀汉，以《出师表》与北伐著称。", "祖逖": "东晋将领，自行招募军队北伐，一度收复黄河以南，因朝廷支持不足无功。", "苻坚": "前秦皇帝，统一北方后南征东晋，在淝水之战大败，前秦随后崩解。", "孝文帝": "北魏皇帝拓跋宏，迁都洛阳，推行改汉姓、穿汉服、说汉话的汉化改革。", "高欢": "东魏权臣，六镇之乱后崛起，掌控东魏朝政，为北齐奠基。", "宇文泰": "西魏权臣，创立府兵制雏形，为北周和隋唐的军事制度打下基础。", "隋炀帝": "名杨广，隋朝第二位皇帝。修大运河、建东都、三征高句丽，工程与战争叠加压垮民力。", "唐太宗": "名李世民，唐朝第二位皇帝。以纳谏著称，与魏征等讨论隋亡教训，开创贞观之治。", "魏征": "唐太宗时期名臣，以敢言直谏著称，前后上谏二百余事。", "武则天": "唐朝女皇，先为高宗皇后，后称帝改国号周。提拔寒门、设北门学士，也任用酷吏清除异己。", "玄奘": "唐代高僧，西行天竺取经，归国后主持译经，著《大唐西域记》。", "鉴真": "唐代高僧，六次东渡日本，最终抵达，传播律宗与建筑、医药技术。", "安禄山": "唐朝节度使，兼领平卢、范阳、河东三镇，755 年发动安史之乱。", "史思明": "唐朝节度使，与安禄山共同发动安史之乱，后自立为帝，被其子所杀。", "杜甫": "唐代诗人，经历安史之乱，作品记录战乱中的民生，被称为诗史。", "李白": "唐代诗人，盛唐气象的代表，诗风豪放，一生仕途不顺。", "黄巢": "唐末起义领袖，从山东起兵，转战大半个中国，攻入长安，加速唐朝灭亡。", "宋太祖": "名赵匡胤，宋朝开国皇帝。陈桥兵变黄袍加身，杯酒释兵权，确立重文轻武的国策。", "王安石": "北宋政治家，主持熙宁变法，推行青苗、免役、市易等法，意在富国强兵，执行中多有扰民。", "司马光": "北宋政治家、史学家，反对王安石变法，主持编撰编年体通史《资治通鉴》。", "苏轼": "北宋文学家，因乌台诗案被贬，一生宦海起伏，诗文书画皆成大家。", "沈括": "北宋科学家，著《梦溪笔谈》，记录毕昇活字印刷等重要技术。", " <script>
/* ==========================================================================
   卡片 · 逻辑
   数据从 window.__THEMES__ 读（build.py 注入）。
   ========================================================================== */

/* ---------- 配置 ---------- */
const CONFIG = {
  decay: 0.3,        // 看过一次后的权重倍数
  floor: 0.03,       // 权重下限，避免老卡片彻底不出现
  recent: 8,         // 最近抽过的若干张不重复
  threshold: 55,     // 滑动多少像素算翻页
  axisLock: 8        // 手势方向判定阈值
};

const KEY_THEME = 'cards.theme.v1';

/* ---------- 状态 ---------- */
let theme = null;
let pool = [];
let seen = {};
let history = [];
let curIdx = -1;

const stage = document.getElementById('stage');
const sheet = document.getElementById('sheet');
const themeList = document.getElementById('themeList');

/* ---------- 主题拼装 ---------- */
// 「全部」这类主题只存来源列表，启动时在内存里拼一次，避免页面里存重复数据
function hydrateThemes() {
  const byId = {};
  // 先把真实主题的卡片收起来
  window.__THEMES__.forEach(t => { if (t.cards) byId[t.id] = t.cards; });
  // 再给「全部」这类主题拼出完整的卡片数组
  window.__THEMES__.forEach(t => {
    if ((!t.cards || !t.cards.length) && t.parts) {
      const merged = [];
      t.parts.forEach(id => {
        const src = byId[id];
        if (src) for (let i = 0; i < src.length; i++) merged.push(src[i]);
      });
      t.cards = merged;
    }
  });
  // 兜底：任何主题都没有卡片时，退回第一个有卡片的主题
  if (!window.__THEMES__.some(t => t.cards && t.cards.length && t.id !== 'all')) {
    console.error('没有可用的卡片数据');
  }
}
hydrateThemes();

/* ---------- 存储 ---------- */
function seenKey() {
  // 带上内容版本号：卡片内容一变，旧的阅读记录自动作废
  return 'cards.seen.' + theme.id + '.' + (window.__VERSION__ || 'v1');
}

function loadSeen() {
  try {
    const raw = JSON.parse(localStorage.getItem(seenKey()) || '{}');
    if (!raw || typeof raw !== 'object') return {};
    // 卡片数量变化后，越界的旧索引会污染统计，这里直接丢掉
    const clean = {};
    for (const k in raw) {
      const i = Number(k);
      if (Number.isInteger(i) && i >= 0 && i < pool.length) clean[i] = raw[k];
    }
    return clean;
  } catch (e) { return {}; }
}

function saveSeen() {
  try { localStorage.setItem(seenKey(), JSON.stringify(seen)); } catch (e) {}
}

/* ---------- 权重抽取 ---------- */
function weightOf(i) {
  const n = Number(seen[i]) || 0;
  if (!n) return 1;
  return Math.max(CONFIG.floor, Math.pow(CONFIG.decay, n));
}

function pick(exclude) {
  exclude = exclude || [];
  let total = 0;
  const weights = [];
  for (let i = 0; i < pool.length; i++) {
    const w = exclude.indexOf(i) >= 0 ? 0 : weightOf(i);
    weights.push(w);
    total += w;
  }
  if (total <= 0) {
    // 全部看过了：均匀随机，但尽量避开刚看过的
    const avail = [];
    for (let i = 0; i < pool.length; i++) if (exclude.indexOf(i) < 0) avail.push(i);
    const src = avail.length ? avail : Array.from({ length: pool.length }, (_, i) => i);
    return src[Math.floor(Math.random() * src.length)];
  }
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return pool.length - 1;
}

/* ---------- 顶部信息 ---------- */
function seenCount() {
  let n = 0;
  for (const k in seen) {
    // 只统计当前池子范围内的索引（卡片内容换过之后，旧记录会越界）
    const i = Number(k);
    if (seen[k] > 0 && i >= 0 && i < pool.length) n++;
  }
  return n;
}

function updateHeader() {
  document.getElementById('themeName').textContent = theme.name;
}

/* ---------- 渲染 ---------- */
function place(el, offsetY, scale, opacity) {
  el.style.transform = 'translate3d(0, calc(-50% + ' + offsetY + 'px), 0) scale(' + scale + ')';
  el.style.opacity = String(opacity);
}

function markSeen(i) {
  seen[i] = (seen[i] || 0) + 1;
  saveSeen();
  updateHeader();
}

/** 把卡片内容刷成第 i 张（复用同一个元素） */
function fillCard(el, i) {
  const c = pool[i];
  el.innerHTML = '<div class="era"></div><h2></h2><p></p><div class="think"></div>';

  const era = el.querySelector('.era');
  if (c.e) era.textContent = c.e; else era.remove();

  el.querySelector('h2').textContent = c.t;
  el.querySelector('p').innerHTML = markTerms(c.b, c.terms);
  bindTerms(el);

  const think = el.querySelector('.think');
  if (c.x) think.textContent = c.x; else think.remove();

  el.dataset.i = i;
  curIdx = i;
  markSeen(i);
}

/**
 * 换卡：总是「当面这一张原地换内容」，不做双卡叠层动画。
 * 上下滑动时卡片跟手移动，松手后归位；成功翻页就用新内容复位。
 * 这样无论多快连滑，都不会出现卡片飞出后没有新卡接管、或者透明度停在 0。
 */
function render(i, fromDir) {
  if (!pool.length) return;
  i = Math.max(0, Math.min(i, pool.length - 1));

  const dir = fromDir || 0;
  resetGestures();

  // 清掉多余卡片，只留一张
  const cards = stage.querySelectorAll('.card');
  for (let k = 1; k < cards.length; k++) cards[k].remove();

  let el = cards[0];
  if (!el) {
    el = document.createElement('div');
    el.className = 'card';
    stage.appendChild(el);
  }

  fillCard(el, i);
  bindSwipe(el);

  // 新内容从滑动来的方向轻轻归位
  el.style.transition = 'none';
  place(el, dir === 0 ? 0 : -(dir * 26), 1, 1);

  requestAnimationFrame(() => {
    el.style.transition = '';
    place(el, 0, 1, 1);
  });
}

function next() {
  // 只记最近几张用于去重，不再支持回看
  history.push(curIdx);
  if (history.length > CONFIG.recent + 2) history.shift();
  const recent = history.slice(-CONFIG.recent).filter(x => x >= 0);
  render(pick(recent), 1);
}

/* ---------- 手势（上下滑，像短视频那样一屏一张） ---------- */
let gestureLock = false;
let currentCleanup = null;

function bindSwipe(el) {
  el.addEventListener('touchstart', onTouchStart, { passive: true });

  // 鼠标 / 桌面预览
  let my = 0, down = false;
  el.addEventListener('mousedown', e => {
    down = true;
    my = e.clientY;
    el.style.transition = 'none';
  });
  window.addEventListener('mousemove', e => {
    if (!down) return;
    const d = e.clientY - my;
    el.style.transform = 'translate3d(0, calc(-50% + ' + d + 'px), 0)';
  });
  window.addEventListener('mouseup', e => {
    if (!down) return;
    down = false;
    el.style.transition = '';
    const d = e.clientY - my;
    if (d <= -CONFIG.threshold) fan(el, -1);
    else place(el, 0, 1, 1);
  });
}

function onTouchStart(e) {
  if (e.touches.length !== 1 || gestureLock) return;
  const el = e.currentTarget;
  const x0 = e.touches[0].clientX;
  const y0 = e.touches[0].clientY;
  let dy = 0, axis = null, done = false;

  el.style.transition = 'none';

  function move(ev) {
    if (!(ev.touches && ev.touches.length)) return;
    const tx = ev.touches[0].clientX;
    const ty = ev.touches[0].clientY;
    dy = ty - y0;
    const dx = tx - x0;

    if (axis === null && (Math.abs(dx) > CONFIG.axisLock || Math.abs(dy) > CONFIG.axisLock)) {
      axis = Math.abs(dy) > Math.abs(dx) ? 'y' : 'x';
    }
    if (axis === 'x') return;

    if (ev.cancelable) ev.preventDefault();
    const damped = dy * 0.92;
    el.style.transform = 'translate3d(0, calc(-50% + ' + damped + 'px), 0)';
    el.style.opacity = String(Math.max(0.35, 1 - Math.abs(damped) / 620));
  }

  function cleanup() {
    window.removeEventListener('touchmove', move);
    window.removeEventListener('touchend', end);
    window.removeEventListener('touchcancel', cancel);
    currentCleanup = null;
  }

  function end() {
    if (done) return;
    done = true;
    cleanup();
    if (axis === 'x') return;

    el.style.transition = '';
    if (dy <= -CONFIG.threshold) fan(el, -1);       // 上滑 → 下一张
    else place(el, 0, 1, 1);                        // 下滑 → 弹回
  }

  function cancel() {
    if (done) return;
    done = true;
    cleanup();
    el.style.transition = '';
    place(el, 0, 1, 1);
  }

  currentCleanup = cleanup;
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', end, { passive: true });
  window.addEventListener('touchcancel', cancel, { passive: true });
}

/** 收起旧的手势监听并解锁 */
function resetGestures() {
  if (typeof currentCleanup === 'function') {
    try { currentCleanup(); } catch (e) {}
    currentCleanup = null;
  }
  gestureLock = false;
}

/** 手势确认：dir=-1 下一张（上滑），1 上一张（下滑） */
function fan(el, dir) {
  hidePop();

  // 只支持往下滑（上滑）切下一张，反方向一律弹回原位
  if (dir > 0) {
    el.style.transition = '';
    place(el, 0, 1, 1);
    return;
  }

  next();
}

/* ---------- 键盘 ---------- */
window.addEventListener('keydown', e => {
  if (sheet.classList.contains('on')) {
    if (e.key === 'Escape') closeSheet();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
});

/* ---------- 词条 ---------- */
const GLOSSARY = window.__GLOSSARY__ || {};
let activePop = null;
let activeTerm = null;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/**
 * 正文里的词条包成 <span class="term">。
 * 同一张卡里同一个词只标第一次出现；优先匹配长词。
 */
function markTerms(text, allowed) {
  if (!text) return '';
  let keys = Object.keys(GLOSSARY);
  if (allowed && allowed.length) keys = keys.filter(k => allowed.indexOf(k) >= 0);
  keys.sort((a, b) => b.length - a.length);
  if (!keys.length) return escapeHtml(text);

  const used = [];
  let out = '', i = 0;
  while (i < text.length) {
    let hit = null;
    for (const k of keys) {
      if (text.startsWith(k, i) && used.indexOf(k) < 0) { hit = k; break; }
    }
    if (hit) {
      used.push(hit);
      out += '<span class="term" data-term="' + escapeHtml(hit) + '">' + escapeHtml(hit) + '</span>';
      i += hit.length;
    } else {
      out += escapeHtml(text[i]);
      i++;
    }
  }
  return out;
}

function ensurePop() {
  if (activePop) return activePop;
  activePop = document.createElement('div');
  activePop.id = 'pop';
  document.body.appendChild(activePop);
  return activePop;
}

function hidePop() {
  if (activePop) activePop.classList.remove('on');
  activeTerm = null;
}

function showPop(term, anchor) {
  const def = GLOSSARY[term];
  if (!def) return;
  const pop = ensurePop();
  pop.innerHTML = '<b>' + escapeHtml(term) + '</b>' + escapeHtml(def);

  const r = anchor.getBoundingClientRect();
  const pad = 12;
  pop.style.visibility = 'hidden';
  pop.classList.add('on');

  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(pad, Math.min(left, window.innerWidth - pw - pad));

  const above = r.top - ph - 12;
  let top;
  if (above >= pad + 8) {
    top = above;
    pop.classList.remove('below');
    pop.classList.add('above');
  } else {
    top = r.bottom + 12;
    pop.classList.remove('above');
    pop.classList.add('below');
  }

  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.setProperty('--arrow-x', Math.max(14, Math.min(pw - 14, r.left + r.width / 2 - left)) + 'px');
  pop.style.visibility = '';
  activeTerm = term;
}

function bindTerms(el) {
  el.querySelectorAll('.term').forEach(t => {
    t.addEventListener('click', e => {
      e.stopPropagation();
      const term = t.dataset.term;
      if (activeTerm === term && activePop && activePop.classList.contains('on')) hidePop();
      else showPop(term, t);
    });
  });
}

document.addEventListener('touchstart', e => {
  if (e.target.closest && e.target.closest('.term')) return;
  hidePop();
}, { passive: true });
document.addEventListener('mousedown', e => {
  if (e.target.closest && e.target.closest('.term')) return;
  hidePop();
});
window.addEventListener('resize', hidePop);

/* ---------- 主题选择 ---------- */
function renderThemeList() {
  themeList.innerHTML = '';
  window.__THEMES__.forEach(t => {
    const b = document.createElement('button');
    b.className = 'titem' + (t.id === theme.id ? ' now' : '');
    b.innerHTML =
      '<div><span>' + t.name + '</span><small>' + t.desc.replace(t.name, '').replace(/^\s*·?\s*/, '') + '</small></div>' +
      '<span class="dot">●</span>';
    b.onclick = () => switchTheme(t.id);
    themeList.appendChild(b);
  });
}

function openSheet() {
  renderThemeList();
  sheet.classList.add('on');
}

function closeSheet() {
  sheet.classList.remove('on');
}

function switchTheme(id) {
  theme = window.__THEMES__.find(t => t.id === id) || window.__THEMES__[0];
  try { localStorage.setItem(KEY_THEME, theme.id); } catch (e) {}
  pool = theme.cards;
  seen = loadSeen();
  history = [];
  closeSheet();
  updateHeader();
  render(pick([]), 0);
}

document.getElementById('themeBtn').onclick = openSheet;
document.getElementById('closeSheet').onclick = closeSheet;
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

/* ---------- 启动 ---------- */
(function init() {
  const saved = localStorage.getItem(KEY_THEME);
  theme = window.__THEMES__.find(t => t.id === saved) || window.__THEMES__[0];
  pool = theme.cards;
  seen = loadSeen();

  // 只有一个主题时，隐藏切换按钮
  if (window.__THEMES__.length < 2) {
    document.getElementById('themeBtn').style.display = 'none';
  }
  const seenEl = document.getElementById('seen');
  if (seenEl) seenEl.remove();

  updateHeader();
  render(pick([]), 0);
})();

</script>

</body>
</html>
