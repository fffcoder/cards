<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="史论">
<meta name="theme-color" content="#0e0d0b">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230e0d0b'/%3E%3Cpath d='M50 44h80M50 74h80M50 104h56' stroke='%23d9bf8a' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M126 118l14 20' stroke='%23d9bf8a' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='118' cy='110' r='16' fill='none' stroke='%23d9bf8a' stroke-width='6'/%3E%3C/svg%3E">
<title>史论</title>
<style>
/* ==========================================================================
   卡片 · 样式
   配色、字号、间距全部收在最上面的变量里，改这里就够了。
   ========================================================================== */

:root {
  /* 底色与层次 */
  --bg: #0f0e0c;
  --card-a: #211d19;
  --card-b: #16130f;
  --line: rgba(217, 191, 138, .13);

  /* 文字 */
  --fg: #f3ece1;
  --fg-body: #c6bcae;
  --fg-dim: #8e8376;
  --fg-faint: #5b544b;
  --accent: #d9bf8a;

  /* 形状 */
  --radius: 22px;
  --pad-x: 24px;              /* 卡片内边距 */
  --pad-y: 30px;
  --sheet-radius: 20px;

  /* 动效 */
  --ease: cubic-bezier(.22, .9, .3, 1);
  --dur: .3s;

  /* 字号 */
  --t-title: clamp(21px, 5.9vw, 27px);
  --t-body: clamp(15px, 4.15vw, 17px);
  --t-think: clamp(13px, 3.7vw, 14.5px);
  --t-meta: 11px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}

/* ---------- 骨架 ---------- */
#deck {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-top: calc(env(safe-area-inset-top) + 8px);
}

header {
  flex: 0 0 auto;
  padding: 6px 20px 2px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#themeBtn {
  background: none;
  border: none;
  padding: 6px 10px 6px 4px;
  margin-left: -4px;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: .04em;
  color: var(--fg);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  border-radius: 10px;
  transition: background .18s ease;
}
#themeBtn:active { background: rgba(255, 255, 255, .05); }
#themeBtn i {
  font-style: normal;
  font-size: 9px;
  color: var(--fg-dim);
  transform: translateY(1px);
}

#stage {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
}

footer {
  flex: 0 0 auto;
  padding: 8px 20px calc(env(safe-area-inset-bottom) + 16px);
  display: flex;
  justify-content: center;
}

#nextBtn {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 14px 34px;
  border: none;
  border-radius: 999px;
  background: rgba(217, 191, 138, .11);
  box-shadow: 0 0 0 1px rgba(217, 191, 138, .2) inset;
  color: var(--accent);
  font-family: inherit;
  font-size: 15px;
  letter-spacing: .08em;
  cursor: pointer;
  transition: transform .14s var(--ease), background .2s ease;
}
#nextBtn i {
  font-style: normal;
  font-size: 13px;
  opacity: .75;
}
#nextBtn:active {
  transform: scale(.95);
  background: rgba(217, 191, 138, .19);
}

/* ---------- 卡片 ---------- */
.card {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 50%;
  max-width: 460px;
  margin: 0 auto;
  /* 用 translateY 做垂直居中，水平靠 left/right 拉伸，避免 iOS 上 3D 位移的坑 */
  transform: translate3d(0, -50%, 0);

  border-radius: var(--radius);
  padding: var(--pad-y) var(--pad-x);
  background: linear-gradient(165deg, var(--card-a), var(--card-b) 72%);
  box-shadow: 0 18px 44px -20px #000, 0 0 0 1px rgba(255, 255, 255, .05) inset;

  transition: transform var(--dur) var(--ease), opacity var(--dur) ease;
  will-change: transform, opacity;

  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: min(44vh, 340px);
  max-height: 100%;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  pointer-events: none;
  background: radial-gradient(120% 70% at 50% -8%, rgba(217, 191, 138, .07), transparent 62%);
}

.era {
  font-size: var(--t-meta);
  letter-spacing: .17em;
  color: var(--fg-dim);
  margin-bottom: 13px;
  /* 长书名不撑破卡片 */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 4px;
}

.card h2 {
  font-size: var(--t-title);
  margin: 0 0 15px;
  line-height: 1.38;
  font-weight: 600;
  letter-spacing: -.005em;
  color: var(--fg);
}

.card p {
  margin: 0;
  font-size: var(--t-body);
  line-height: 1.82;
  color: var(--fg-body);
  letter-spacing: .005em;
}

.think {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: var(--t-think);
  line-height: 1.72;
  color: var(--accent);
  opacity: .92;
}
.think::before {
  content: "多想一层";
  display: block;
  margin-bottom: 6px;
  color: #8c7a55;
  letter-spacing: .14em;
  font-size: 10px;
}

/* ---------- 词条 ---------- */
.term {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px dashed rgba(217, 191, 138, .5);
  padding-bottom: .5px;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.term:active { border-bottom-color: var(--accent); }

#pop {
  position: fixed;
  z-index: 30;
  max-width: min(78vw, 330px);
  padding: 14px 16px;
  border-radius: 16px;
  background: #2a2520;
  color: #ded4c6;
  font-size: 13.5px;
  line-height: 1.75;
  box-shadow: 0 16px 44px -12px #000, 0 0 0 1px rgba(217, 191, 138, .2) inset;
  opacity: 0;
  transform: translateY(6px) scale(.96);
  transition: opacity .18s ease, transform .18s var(--ease);
  pointer-events: none;
}
#pop.on { opacity: 1; transform: translateY(0) scale(1); }
#pop b {
  display: block;
  margin-bottom: 6px;
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: .02em;
}
#pop::after {
  content: "";
  position: absolute;
  left: var(--arrow-x, 50%);
  width: 10px;
  height: 10px;
  margin-left: -5px;
  background: #2a2520;
  transform: rotate(45deg);
}
#pop.below::after { top: -5px; }
#pop.above::after { bottom: -5px; }

/* ---------- 主题面板 ---------- */
#sheet {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  background: rgba(8, 7, 6, .86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: calc(env(safe-area-inset-top) + 36px) 18px calc(env(safe-area-inset-bottom) + 18px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#sheet.on { display: block; animation: sheetIn .22s var(--ease); }
@keyframes sheetIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

#sheet h3 {
  margin: 0 0 14px;
  padding-left: 6px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .16em;
  color: var(--fg-faint);
}

.titem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 8px;
  border-radius: var(--sheet-radius);
  border: none;
  cursor: pointer;
  background: rgba(255, 255, 255, .035);
  color: var(--fg);
  font-family: inherit;
  font-size: 16px;
  text-align: left;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .04) inset;
  transition: background .16s ease, box-shadow .16s ease;
}
.titem:active { background: rgba(255, 255, 255, .075); }
.titem small {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  color: var(--fg-dim);
  letter-spacing: .03em;
  font-weight: 400;
}
.titem.now {
  background: rgba(217, 191, 138, .09);
  box-shadow: 0 0 0 1px rgba(217, 191, 138, .38) inset;
}
.titem .dot { opacity: 0; color: var(--accent); font-size: 9px; }
.titem.now .dot { opacity: 1; }

#closeSheet {
  margin-top: 6px;
  width: 100%;
  padding: 15px;
  border-radius: var(--sheet-radius);
  border: none;
  background: transparent;
  color: var(--fg-faint);
  font-family: inherit;
  font-size: 14px;
}

/* ---------- 小屏兜底 ---------- */
@media (max-height: 680px) {
  :root {
    --pad-y: 24px;
    --t-title: clamp(19px, 5.4vw, 23px);
    --t-body: 14.5px;
  }
  .think { margin-top: 15px; padding-top: 13px; }
  #nextBtn { padding: 12px 28px; font-size: 14px; }
}

/* ---------- 减少动效 ---------- */
@media (prefers-reduced-motion: reduce) {
  .card, #pop, #sheet.on { transition: none; animation: none; }
}

/* ==========================================================================
   历史文章集 · 样式
   ========================================================================== */

:root {
  --bg: #0e0d0b;
  --fg: #f0e9de;
  --fg-body: #c3b9ab;
  --fg-dim: #8b8073;
  --fg-faint: #5b544b;
  --accent: #d9bf8a;
  --line: rgba(217, 191, 138, .13);
  --card: #191613;
  --radius: 16px;
  --ease: cubic-bezier(.22, .9, .3, 1);
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(14, 13, 11, .86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, .05);
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .04em;
  white-space: nowrap;
}
.brand small {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--fg-faint);
  letter-spacing: .1em;
  margin-top: 2px;
}

#backBtn {
  display: none;
  background: none;
  border: none;
  color: var(--accent);
  font-family: inherit;
  font-size: 15px;
  padding: 6px 8px 6px 0;
  cursor: pointer;
}
body.reading #backBtn { display: block; }
body.reading .brand { display: none; }

/* 搜索 */
.search {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, .055);
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .05) inset;
}
.search svg { flex: 0 0 auto; opacity: .45; }
#q {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  outline: none;
  color: var(--fg);
  font-family: inherit;
  font-size: 15px;
}
#q::placeholder { color: var(--fg-faint); }
#clearBtn {
  display: none;
  background: rgba(255, 255, 255, .1);
  border: none;
  color: var(--fg-dim);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
}
#clearBtn.on { display: block; }
body.reading .search { display: none; }

/* ---------- 列表 ---------- */
#list {
  padding: 12px 16px calc(env(safe-area-inset-bottom) + 32px);
}

.art {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: none;
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  margin-bottom: 10px;
  color: var(--fg);
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .045) inset;
  transition: background .16s ease, transform .12s var(--ease);
}
.art:active { background: #201c18; transform: scale(.995); }

.art .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--fg-dim);
  margin-bottom: 8px;
}
.art .meta .sep { color: #3f3a33; }

.art h2 {
  margin: 0 0 6px;
  font-size: 17px;
  line-height: 1.45;
  font-weight: 600;
  letter-spacing: -.002em;
}

.art .sub {
  margin: 0 0 10px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--fg-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.art .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.art .tag {
  font-size: 11px;
  color: #9a8f80;
  background: rgba(255, 255, 255, .05);
  border-radius: 6px;
  padding: 3px 7px;
  letter-spacing: .04em;
}

.empty {
  text-align: center;
  color: var(--fg-faint);
  font-size: 14px;
  padding: 48px 20px;
}

/* ---------- 搜索结果高亮 ---------- */
mark {
  background: rgba(217, 191, 138, .28);
  color: var(--fg);
  border-radius: 3px;
  padding: 0 1px;
}

.snippet {
  margin: 8px 0 0;
  font-size: 12.5px;
  line-height: 1.7;
  color: #9d9284;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ---------- 阅读页 ---------- */
#reader {
  display: none;
  padding: 20px 20px calc(env(safe-area-inset-bottom) + 56px);
  max-width: 680px;
  margin: 0 auto;
}
body.reading #list { display: none; }
body.reading #reader { display: block; }

#reader .era {
  font-size: 11px;
  letter-spacing: .17em;
  color: var(--fg-dim);
  margin-bottom: 12px;
}

#reader h1 {
  font-size: 26px;
  line-height: 1.4;
  font-weight: 650;
  letter-spacing: -.01em;
  margin: 0 0 12px;
}

#reader .lede {
  font-size: 15px;
  line-height: 1.8;
  color: var(--fg-dim);
  margin: 0 0 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

#reader .body {
  font-size: 16.5px;
  line-height: 1.9;
  color: var(--fg-body);
  letter-spacing: .006em;
}

#reader .body h2 {
  font-size: 19px;
  line-height: 1.5;
  color: var(--fg);
  font-weight: 600;
  margin: 34px 0 14px;
  padding-left: 12px;
  border-left: 3px solid rgba(217, 191, 138, .45);
}
#reader .body h3 {
  font-size: 16.5px;
  color: var(--fg);
  font-weight: 600;
  margin: 24px 0 10px;
}
#reader .body p { margin: 0 0 18px; }
#reader .body strong { color: #ede4d6; font-weight: 600; }

#reader .body ul,
#reader .body ol {
  margin: 0 0 18px;
  padding-left: 22px;
}
#reader .body li { margin-bottom: 8px; }

#reader .body blockquote {
  margin: 0 0 18px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, .03);
  border-left: 2px solid rgba(217, 191, 138, .35);
  border-radius: 0 8px 8px 0;
  color: var(--fg-dim);
  font-size: 15px;
}

#reader .body hr {
  border: none;
  border-top: 1px solid var(--line);
  margin: 30px 0;
}

#reader .body a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid rgba(217, 191, 138, .3);
}

#reader .body code {
  background: rgba(255, 255, 255, .06);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: .9em;
}

.reading-meta {
  margin-top: 36px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--fg-faint);
  letter-spacing: .06em;
}

/* 阅读进度条 */
#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  width: 0;
  background: var(--accent);
  z-index: 20;
  opacity: 0;
  transition: opacity .2s ease;
}
body.reading #progress { opacity: .75; }

@media (max-width: 360px) {
  #reader .body { font-size: 16px; }
  #reader h1 { font-size: 23px; }
}

/* 脉络入口 */
.nav-card {
  background: linear-gradient(150deg, #221d16, #191612 70%);
  box-shadow: 0 0 0 1px rgba(217,191,138,.22) inset;
  margin-bottom: 16px;
}
.nav-card h2 { color: var(--accent); }


/* ===== Tab 切换 ===== */
.tab-panel {
  display: none;
  position: fixed;
  inset: 0;
  bottom: calc(56px + env(safe-area-inset-bottom));
  overflow: hidden;
}
.tab-panel.on { display: block; }
#panel-articles { overflow-y: auto; -webkit-overflow-scrolling: touch; }
body.reading #panel-articles { overflow-y: auto; }

#tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  height: calc(56px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: flex;
  background: rgba(14, 13, 11, .92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid rgba(255, 255, 255, .06);
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: #5f584f;
  font-family: inherit;
  font-size: 11px;
  letter-spacing: .06em;
  cursor: pointer;
  transition: color .18s ease;
}
.tab svg { width: 21px; height: 21px; }
.tab.on { color: var(--accent); }

/* 卡片页在 Tab 下的高度修正 */
#panel-cards #deck {
  position: absolute;
  inset: 0;
  height: 100%;
  max-height: 100%;
  padding-bottom: 0;
}
#panel-cards #deck header { padding-top: calc(env(safe-area-inset-top) + 6px); }
#panel-cards footer { padding: 10px 20px 6px; }
#panel-cards footer #nextBtn { padding: 12px 30px; }

/* 史论页在 Tab 下的滚动修正 */
#panel-articles .topbar { position: sticky; top: 0; padding-top: 12px; }
#panel-articles #list { padding-bottom: 28px; }
#panel-articles #reader { padding-bottom: 40px; }

</style>
</head>
<body>

<!-- 阅读进度 -->
<div id="progress"></div>

<!-- ============ 卡片 Tab ============ -->
<section class="tab-panel" id="panel-cards">
  <div id="deck">
    <header>
      <button id="themeBtn"><span id="themeName"></span><i>⌄</i></button>
    </header>
    <div id="stage"></div>
    <footer><button id="nextBtn"><span>下一张</span><i>↓</i></button></footer>
  </div>
  <div id="sheet">
    <h3>选择主题</h3>
    <div id="themeList"></div>
    <button id="closeSheet">关闭</button>
  </div>
  <div id="pop"></div>
</section>

<!-- ============ 史论 Tab ============ -->
<section class="tab-panel" id="panel-articles">
  <div class="topbar">
    <div class="bar-row">
      <button id="backBtn">‹ 返回</button>
      <div class="brand">史论<small>历史文章集</small></div>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-4-4"></path>
      </svg>
      <input id="q" type="search" placeholder="搜索标题、正文、年代、标签" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="clearBtn" aria-label="清空">✕</button>

window.__THEMES__ = [{"id": "xianqin", "name": "先秦", "desc": "夏商周到战国 · 80 张", "cards": [{"e": "传说时代", "t": "三皇五帝不是神话，是记忆的压缩", "b": "仰韶、龙山时期的聚落规模与水利工程，说明那时已有跨部落的协作。三皇五帝这些名字，很可能是把几代人共同完成的事迹压缩到少数祖先身上。", "x": "没有文字的社会，只能用人物故事保存制度经验。"}, {"e": "夏", "t": "二里头：夏朝到底存不存在", "b": "河南偃师的二里头遗址有宫殿、青铜作坊和规划道路，年代约在公元前 1800 年，很多学者认为就是夏的都城。但至今没找到能自证的文字，所以夏到底叫不叫夏，仍有争议。", "x": "考古能给出实物，文字才能给出名字，两者不总对得上。"}, {"e": "传说时代", "t": "陶寺遗址：比二里头更早的城", "b": "山西襄汾的陶寺遗址有城墙、宫殿区、观象台和大型墓葬，年代约在公元前 2300 年至 1900 年。它显示出早期社会已经有明显的阶层分化。", "x": "城市一出现，就说明有人开始管理别人了。"}, {"e": "传说时代", "t": "良渚：五千年前的复杂社会", "b": "浙江良渚遗址有大型水利系统、宫殿区和玉器礼制，2019 年列入世界遗产。它证明在黄河之外，长江下游也出现过高度组织化的早期文明。", "x": "文明的起源从来不是一条线，而是好几条线同时出现。"}, {"e": "夏", "t": "大禹治水：一个关于组织能力的故事", "b": "传说大禹用疏导代替堵截，十三年三过家门而不入。这个故事真正的内核不是治水技术，而是一个能调动跨区域人力、持续多年的组织。", "x": "能把很多人组织起来做一件事，本身就是权力的起点。"}, {"e": "商", "t": "甲骨文是写给神看的", "b": "商王占卜后把结果刻在龟甲和牛骨上，记录的是问雨、问战、问病。这些文字不是档案，而是与神沟通的凭据。我们今天读到的商朝，其实是商王对神说的话。", "x": "留存下来的史料，常常是一次沟通的副产品。"}, {"e": "商", "t": "商朝的灭亡不是因为酒池肉林", "b": "牧野之战时商军大批倒戈，核心原因是商朝长期征东夷、主力在外、都城空虚，加上盟国离心。纣王的个人品行，更多是周人战后写史的叙事需要。", "x": "胜利者写历史，常把制度失败写成道德失败。"}, {"e": "商", "t": "妇好：中国最早有名字的女将", "b": "甲骨文记载妇好是商王武丁的妻子，多次率军出征，最多一次带兵一万三千人，还主持祭祀。她的墓在 1976 年被完整发掘。", "x": "名字被刻下来的那一刻，她才从传说变成了人。"}, {"e": "商", "t": "三星堆：另一个青铜文明", "b": "四川广汉的三星堆遗址出土大量青铜面具、神树、象牙，风格与中原迥异。它说明商代的中国是多个区域文明并存，不是单一中心。", "x": "在大一统之前，中华文明本来就有很多种样子。"}, {"e": "商", "t": "人殉与人牲：商代祭祀的另一面", "b": "商代墓葬与祭祀坑中发现大量人殉、人牲遗骸，规模相当大。周代之后这种做法逐渐减少，并被后人刻意淡化。", "x": "越是熟悉的文明，越需要正视它不那么舒服的部分。"}, {"e": "西周", "t": "分封制是一种成本极低的管理方式", "b": "西周把王族功臣分到各地建国，规定守边、纳贡、随王出征。中央不用养官员，只要维持宗法与礼乐，代价是诸侯一旦做强就收不回来。", "x": "用血缘分权能省钱，但省不掉日后的战争。"}, {"e": "西周", "t": "礼乐不是繁文缛节，是一套行为操作系统", "b": "周礼规定不同等级的人怎么吃饭、乘车、下葬，让人从行为上习惯尊卑。春秋时礼崩乐坏，不是人没礼貌，而是这套约束失效，社会开始按实力排序。", "x": "制度崩解，常常从仪式失去约束力开始。"}, {"e": "西周", "t": "井田制：土地制度也是军事制度", "b": "周代把土地划成九块，中间为公田，八家共耕。土地、劳动力与军事义务被绑在一起，是最早的动员结构。", "x": "任何动员能力，最终都落在谁拥有地上。"}, {"e": "西周", "t": "青铜器的用途主要是祭祀，不是打仗", "b": "青铜是商周最贵重的材料，却大量做成鼎、簋、爵用于祭祀，武器并不占多数。谁掌握青铜与祭祀，谁就掌握与祖先沟通的权力。", "x": "最稀缺的资源，往往投放在合法性的再生产上。"}, {"e": "西周", "t": "共和行政：中国第一次没有君主的时期", "b": "西周厉王时国人暴动，厉王出逃，此后由周定公、召穆公共同执掌政权，史称共和行政，持续十四年。这是中国史书中第一个确切纪年的起点。", "x": "权力一旦出现空档，往往是几个人临时接住。"}, {"e": "西周", "t": "《诗经》里的普通人", "b": "《诗经》除庙堂雅颂外，还有大量来自民间的风诗，写农事、婚恋、徭役与征夫。它们留下的社会细节，比铭文生动得多。", "x": "想听普通人的声音，得去听他们唱的歌。"}, {"e": "春秋", "t": "春秋五霸：一个半合法化的秩序", "b": "周王室衰弱后，实力强的诸侯以尊王攘夷的名义维持秩序，形成霸主机制。霸主需要周王背书来获得合法性。", "x": "权力真空里，最先出现的往往是半合法化的秩序。"}, {"e": "春秋", "t": "管仲的经济战：用丝绸买下一个国家", "b": "齐桓公想制衡鲁国，管仲让齐国高价收购鲁国丝绸，鲁人纷纷弃农种桑。等农田荒废，齐国突然停止收购并禁止卖粮。", "x": "把对手的生存方式改成单一依赖，比打败他更便宜。"}, {"e": "春秋", "t": "战车时代的战争逻辑", "b": "春秋以前的战争以战车为核，数量有限，讲究礼仪和阵型。战争规模真正扩张，要等到步兵与铁器普及之后。", "x": "战争形态的升级，往往先来自工具。"}, {"e": "春秋", "t": "城濮之战：退避三舍的算计", "b": "晋文公在城濮之战前主动后退九十里，既兑现当年流亡时的承诺，又让楚军轻敌冒进。结果晋军大胜，晋文公成为霸主。", "x": "退一步有时候不是软弱，是把主动权换个方向拿。"}, {"e": "春秋", "t": "弭兵之会：诸侯之间也有停战协议", "b": "春秋后期，晋楚两大集团长期争霸，宋国发起弭兵之会，各国约定停止战争。此后中原的战争明显减少，但小国要同时向两边纳贡。", "x": "和平的代价，常常由最没力量的一方支付。"}, {"e": "春秋", "t": "孔子一生没成功，学说靠弟子传下去", "b": "孔子做过鲁国司寇，政治失败后周游列国十四年，没人真正用他的方案。他的影响是死后由弟子整理《论语》并办学扩散。", "x": "思想的力量常常滞后于思想者本人。"}, {"e": "春秋", "t": "孔子对名的执着", "b": "孔子强调名不正则言不顺，认为名分混乱会导致事事不顺。这不是迂腐，而是认为秩序需要共同的符号基础。", "x": "共同认可的名分，能减少很多无谓的冲突。"}, {"e": "春秋", "t": "老子反向思考的治理思路", "b": "老子主张治大国若烹小鲜，反对频繁干预。他观察到反复折腾往往带来更坏的后果，强调顺应而非强行改造。", "x": "有时候最重要的工作，是忍住不动。"}, {"e": "春秋", "t": "《左传》为什么这么重视礼", "b": "《左传》记载春秋史事，评价人物常以是否符合礼为标准。它反映的是一种秩序观：社会稳定依赖共同认可的行为边界。", "x": "史书用什么标准评价人，反映的是当时的秩序焦虑。"}, {"e": "春秋", "t": "晋国六卿：三家分晋的前传", "b": "晋国后期权力分散到六家卿大夫手中，互相兼并后剩三家，最终韩赵魏分晋，成为战国开端。分权太深，君主就会被架空。", "x": "把权力一层层借出去，最后会发现自己手里没剩多少。"}, {"e": "春秋", "t": "楚国的扩张：南方的大国", "b": "楚国长期经营汉水与长江中游，文化与中原有别，自称蛮夷而不服周。它的兴起说明春秋的格局不只是中原内部的争夺。", "x": "边缘的强国，往往因为不被规则束缚而长得更快。"}, {"e": "春秋", "t": "越王勾践与卧薪尝胆", "b": "越国被吴国击败后，勾践忍辱数年，回国后整顿内政、训练军队，最终灭吴。这个故事流传千年，重点在长期忍耐与准备。", "x": "能忍多久，往往决定了能走多远。"}, {"e": "战国", "t": "春秋与战国的分界：三家分晋", "b": "公元前 453 年韩赵魏三家灭智氏瓜分晋国，前 403 年被周王正式列为诸侯。旧的礼制框架彻底破裂，战争进入更残酷的阶段。", "x": "当一个时代的分界线出现，往往是一次公开的越界。"}, {"e": "战国", "t": "李悝变法：最早的成文法典之一", "b": "魏文侯任用李悝变法，推行尽地力之教、平籴法，并著《法经》。魏国因此在战国初期最先强盛。", "x": "制度创新带来的优势，能维持几十年甚至更久。"}, {"e": "战国", "t": "吴起：会打仗也会改革的人", "b": "吴起先在魏国创建魏武卒，后在楚国推行变法，削弱贵族。楚悼王死后，旧贵族在丧礼上射杀他。", "x": "动别人饭碗的改革者，一旦失去靠山就很危险。"}, {"e": "战国", "t": "商鞅变法真正改变的是人心里的账本", "b": "商鞅确立军功授爵、废井田、励耕战，最狠的是让一切价值都能用军功换算。秦国人在几十年里被改造成一部愿意为国家打仗的社会机器。", "x": "制度改造的最终目标，是改掉人的偏好。"}, {"e": "战国", "t": "商鞅之死：自己定的法杀死自己", "b": "秦孝公死后，商鞅被指控谋反，逃亡时客栈因无凭证拒收，最终被车裂。制度一旦建立，制定者也受它约束。", "x": "能约束所有人的规则，才真的成立。"}, {"e": "战国", "t": "百家争鸣的土壤是诸侯怕输", "b": "春秋战国近百个政治实体互相竞争，每个都急需能打的方案，儒、墨、道、法、兵、阴阳家都有人供养。思想繁荣的直接原因是竞争压力。", "x": "一旦停止竞争，思想的供给会迅速收窄。"}, {"e": "战国", "t": "墨家是最早的技术型组织", "b": "墨家讲兼爱非攻，同时擅长守城器械和严密组织，成员称墨者，有首领巨子，纪律严格。他们的技术意识和纪律性在先秦独一份。", "x": "理想主义的组织，也需要最硬的纪律做支撑。"}, {"e": "战国", "t": "《韩非子》的核心是让规则不依赖人", "b": "法家主张法、术、势，用明确的赏罚与官僚考核，让治理不依赖贤人。优点是可预期，代价是缺乏弹性。", "x": "追求可预期很好，但可预期也要能容纳变化。"}, {"e": "战国", "t": "孙膑与围魏救赵", "b": "桂陵之战中，齐军不直接救赵，而是直捣魏都大梁，逼魏军回援并在途中伏击。这是战略上的经典转折。", "x": "在对手必救的地方下手，比正面对撞更省力。"}, {"e": "战国", "t": "长平之战：四十万降卒为什么被坑杀", "b": "秦赵长平之战，赵军粮尽投降，秦军无法供养几十万俘虏又怕其哗变，最终将其坑杀。这不只是屠杀，也是补给线决定的结局。", "x": "在最紧的资源约束下，选择往往最残酷。"}, {"e": "战国", "t": "《孙子兵法》首先是讲不要打", "b": "《孙子》开篇即言兵者国之大事，反复强调速胜、庙算、不战而屈人之兵。它讨论的重点是如何减少成本。", "x": "最高级的胜利，是让战争不发生。"}, {"e": "战国", "t": "铁器与牛耕改变了整个社会", "b": "战国时铁农具和牛耕普及，开垦荒地变得容易，井田制难以维持，私田出现，农民从集体劳作转向个体家庭生产。", "x": "技术变化常常是制度变化的前置条件。"}, {"e": "战国", "t": "编户齐民：国家第一次直接管到每个人", "b": "战国各国普遍编制户籍、按户征赋征兵，把人口变成可计算的国家资源。这是秦汉大一统的制度准备。", "x": "能数清每个人，才谈得上动员每个人。"}, {"e": "战国", "t": "战国的货币与商业", "b": "各国铸币不同，刀币、布币、圜钱并流通，商人跨区域贸易活跃。货币的多样化，正好说明当时的政治割裂。", "x": "货币的统一，往往是政治统一的第一步。"}, {"e": "战国", "t": "孟子与荀子：两条不同的路", "b": "孟子主张性善、仁政、民贵君轻；荀子主张性恶、礼法并施，教出了韩非与李斯。儒家的内部差异，比后人以为的要大。", "x": "同一个学派内部的差异，常常比学派之间还大。"}, {"e": "战国", "t": "庄子：把标准本身当问题", "b": "庄子用寓言拆解是非、大小的界限，认为争论的双方都受自己视角限制。他不给答案，而是取消问题。", "x": "有些问题解不开，是因为问法本身有问题。"}, {"e": "战国", "t": "屈原之死：个人与体制的冲突", "b": "屈原因政治主张不被采纳而流放，最终投江。他的悲剧被反复讲述，正因为它是一种常见情形：个人价值与体制需要的错位。", "x": "体制与个人的错位，历史上很少被妥善处理。"}, {"e": "战国", "t": "纵横家：靠口才改变格局", "b": "苏秦、张仪一类人往来各国，以合纵连横的说辞左右国家决策。他们的影响力完全依赖君主一时的判断。", "x": "靠说服获得的权力，也随说服对象的心情消散。"}, {"e": "战国", "t": "战国四公子与养士", "b": "孟尝君、平原君、信陵君、春申君各养门客数千，靠私人网络补充国家能力。这也说明正式体制已不能完全应付战国的竞争。", "x": "正式制度不够用的时候，私人关系就会被拉进来补。"}, {"e": "战国", "t": "秦始皇之前的秦：一个被看不起的国家", "b": "秦国地处西陲，中原诸国视其为夷狄，甚至不邀其参与会盟。正是这种边缘位置，让它更容易彻底改革而不被旧贵族牵制。", "x": "被排除在核心圈之外，有时反而更容易重新开始。"}, {"e": "战国", "t": "战国的城市与市", "b": "临淄、邯郸、大梁等城市规模巨大，齐国临淄人口众多，市集、手工业、娱乐业发达。城市化与商业繁荣，是战国社会的重要侧面。", "x": "战争频繁的时代，城市反而长得特别快。"}, {"e": "战国", "t": "战国的水利工程", "b": "都江堰、郑国渠、芍陂等大型水利工程在战国修建，灌溉面积大增。它们既是农业基础，也是国家动员能力的证明。", "x": "能修成一条渠的国家，通常也能打一场长期战争。"}, {"e": "战国", "t": "战国的变法竞赛", "b": "魏有李悝、楚有吴起、韩有申不害、齐有邹忌、秦有商鞅，各国相继变法。变法的深度，直接决定了后来谁能统一。", "x": "同样的压力下，谁改得更彻底，谁就活到最后。"}, {"e": "《史记》·司马迁", "t": "《史记》", "b": "司马迁写战国，最动人的不是战争，而是人在极端处境里的选择。他把刺客、商人、游侠也写进列传，让历史不只有帝王。", "x": "写人，比记事更能留下理解。"}, {"e": "《战国策》", "t": "《战国策》", "b": "《战国策》记录纵横家的说辞，几乎每一篇都是一次博弈。它的价值不在史实精确，而在展示当时的人如何思考利害。", "x": "看一个时代怎么算账，比看它怎么打仗更有信息量。"}, {"e": "《左传》", "t": "《左传》", "b": "《左传》以编年方式记录春秋，记事细致，人物性格鲜明。它把礼作为评价尺度，也把失败归因于失礼与失德。", "x": "史书的评价尺度，往往就是那个时代的秩序想象。"}, {"e": "《孟子》", "t": "《孟子》", "b": "孟子见梁惠王，开口就说何必曰利。他把政治的第一问题定义为义利之辨，主张仁政与民本。", "x": "把问题定义在哪里，就决定了后面所有答案。"}, {"e": "《庄子》", "t": "《庄子》", "b": "《庄子》用寓言和夸张的故事讲道理，庖丁解牛、濠梁之辩都在其中。它不提供方案，提供的是另一种看问题的角度。", "x": "有时改变视角，比改变现实更有效。"}, {"e": "《孙子兵法》", "t": "《孙子兵法》", "b": "《孙子兵法》十三篇，讲的是如何用最小代价达成目标。它强调情报、地形、士气与后勤，而不是单纯的勇武。", "x": "真正的战略，是先算清楚代价。"}, {"e": "《韩非子》", "t": "《韩非子》", "b": "《韩非子》把法、术、势三件事讲透，认为君主应靠制度而不是靠人。它对人性持悲观态度，因此强调可执行的规则。", "x": "对人性越不抱期待，设计出来的制度往往越结实。"}, {"e": "《诗经》", "t": "《诗经》", "b": "《诗经》三百篇，包含祭祀、宴饮、农事、婚恋与征战。它既是文学作品，也是了解西周至春秋社会的重要材料。", "x": "想了解一个时代的日常，诗常常比史更直接。"}, {"e": "《尚书》", "t": "《尚书》", "b": "《尚书》收录上古至周的命令与训诰，是研究早期政治观念的核心材料。它的真伪问题，也是清代考据学的重要战场。", "x": "文本的真假之争，有时比文本内容更影响后世。"}, {"e": "《管子》", "t": "《管子》", "b": "《管子》托名管仲，实际成书较晚，内容涵盖经济、政治、军事。它提出轻重之术，讨论国家如何通过市场手段调节财富。", "x": "把经济手段当治理工具，这个思路出现得比想象的早。"}, {"e": "《国语》", "t": "《国语》", "b": "《国语》分国记事，记录西周至春秋的言论与谈话，与《左传》互为补充。它更重视对话中的判断，而不是事件本身。", "x": "一个时代怎么说话，往往比它做了什么更能说明问题。"}, {"e": "《山海经》", "t": "《山海经》", "b": "《山海经》记载地理、物产、神话与异族，内容庞杂。它反映了早期中国人对世界的想象与分类方式。", "x": "看一个文明怎么描述远方，就知道它怎么理解自己。"}, {"e": "《墨子》", "t": "《墨子》", "b": "《墨子》主张兼爱、非攻、尚贤、节用，还包含大量守城技术与逻辑讨论。它是先秦少有的既有理想又有技术细节的著作。", "x": "理想主张能落到操作层面的，才活得下来。"}, {"e": "《荀子》", "t": "《荀子》", "b": "荀子主张性恶，强调后天教化与礼法，教出了韩非和李斯。他把儒家往制度化方向推了一步。", "x": "同一套价值，落到不同的人手里会长成完全不同的制度。"}, {"e": "《周礼》", "t": "《周礼》", "b": "《周礼》描绘了一套理想化的官制与地方制度，成书年代有争议。后世改革者常把它当蓝本，比如王莽。", "x": "把一本书当成现实蓝图，往往会付出很大代价。"}, {"e": "《道德经》", "t": "《道德经》", "b": "《道德经》主张无为、柔弱胜刚强、反者道之动。它被反复用于治国、用兵和修身。", "x": "越是想控制的，越容易失控，这个观察古今通用。"}, {"e": "《越绝书》", "t": "《越绝书》与《吴越春秋》", "b": "这两部书记载吴越争霸的故事，包含大量传说与细节，是了解东南地区早期历史的重要材料。", "x": "地方的历史记忆，常常保存在不那么正统的文献里。"}, {"e": "《竹书纪年》", "t": "《竹书纪年》", "b": "西晋时从战国魏墓中出土的编年史，记事与《史记》有出入。它提醒后人，历史叙事不止一个版本。", "x": "多一个版本的史料，就多一个怀疑的理由。"}, {"e": "《清华简》", "t": "《清华简》", "b": "清华大学收藏的一批战国竹简，包含《系年》等佚籍，对研究先秦史有重要价值。它的出现改变了学界的一些旧判断。", "x": "新材料一出现，旧结论就要重新检查。"}, {"e": "《殷墟甲骨》", "t": "《殷墟甲骨》", "b": "殷墟出土的十几万片甲骨，是研究商代最直接的材料。从甲骨文里能看到商王每天在问什么、担心什么。", "x": "最直接的史料，往往是最琐碎的那种。"}, {"e": "《西周的政体》·李峰", "t": "《西周的政体》李峰", "b": "李峰用青铜器铭文与考古材料研究西周的国家结构，认为西周不是简单的分封，而是一套以宗法制与礼制维系的政治秩序。", "x": "把制度看清楚，才能理解它为什么能维持几百年。"}, {"e": "《西周史》·许倬云", "t": "《西周史》许倬云", "b": "许倬云以社会史视角写西周，关注族群、文化与制度的互动，而不只是王朝更替。他把西周视为一个文化共同体的形成过程。", "x": "一个朝代的真正遗产，往往是它留下的文化框架。"}, {"e": "《中国古代社会研究》·郭沫若", "t": "《中国古代社会研究》郭沫若", "b": "郭沫若用马克思主义的方法研究先秦社会，提出商周为奴隶社会的判断。这个结论后来争议很大，但方法影响深远。", "x": "结论会被修正，提问方式会留下来。"}, {"e": "《商文明》·张光直", "t": "《商文明》张光直", "b": "张光直通过考古材料研究商代，强调商代社会与宗教、王权紧密相连，而不是单纯的军事征服。", "x": "理解一个文明，要看它怎么和神打交道。"}, {"e": "《春秋史》·童书业", "t": "《春秋史》童书业", "b": "童书业系统梳理春秋时期的政治、军事与社会，把分散的史事整理成可读的整体。", "x": "把碎片整理成结构，知识才能用得上。"}, {"e": "《战国史》·杨宽", "t": "《战国史》杨宽", "b": "杨宽全面梳理战国时期的制度、经济、军事与思想，是研究战国的重要参考。他把变法看作各国竞争的核心。", "x": "同一个时代的所有变化，最终都指向一个问题：谁更能组织。"}, {"e": "《先秦史》·吕思勉", "t": "《先秦史》吕思勉", "b": "吕思勉的先秦史注重制度与社会，考据细致，观点常与主流不同。他更愿意从材料本身出发。", "x": "不轻信成说，是治史最难也最基本的一步。"}, {"e": "《中国青铜时代》·张光直", "t": "《中国青铜时代》张光直", "b": "张光直认为中国早期文明的核心是政治与宗教的结合，青铜器是这种结合的物化。他比较了商周与美洲文明的相似性。", "x": "比较视野下，才能看出自己的文明独特在哪。"}, {"e": "《先秦诸子系年》·钱穆", "t": "《先秦诸子系年》钱穆", "b": "钱穆考订先秦诸子的生卒与活动年代，纠正了不少旧说。他关注思想与时代的关系。", "x": "思想不是悬空的，它长在具体的时间里。"}]}, {"id": "qinhan", "name": "秦汉", "desc": "秦到三国 · 66 张", "cards": [{"e": "秦", "t": "秦能统一靠的不只是军队，还有道路", "b": "秦修驰道、直道、灵渠，形成快速调动兵力和粮草的网络，配合郡县制与文书行政，效率远超六国。统一的实质是交通与行政基础设施的统一。", "x": "谁能更快传递信息和物资，谁就能更大规模地组织。"}, {"e": "秦", "t": "郡县制：把地方官变成可替换的人", "b": "秦设郡县，地方官由中央任免、定期调动，不再世袭。这让国家能直接管理地方，也要求有足够的文书与交通支持。", "x": "把职位变成可替换的，才能真正控制它。"}, {"e": "秦", "t": "秦的文书行政有多细致", "b": "睡虎地秦简显示，秦朝规定公文格式、传递期限、责任追究，甚至规定路上遇到雨怎么处理。这套体系是秦效率的来源。", "x": "严密的记录体系，是官僚制的基础。"}, {"e": "秦", "t": "焚书坑儒烧的是哪些书", "b": "焚书主要针对民间私藏的《诗》《书》与诸子书，医药、卜筮、种树等实用书不在其列。坑儒所坑多为方士术士。统一的代价之一，是消除异议被制度化。", "x": "思想统一的动作，往往伴随信息的损失。"}, {"e": "秦", "t": "秦亡于效率太强、缓冲太少", "b": "秦制高压高效，但民众没有发声渠道，也没有缓冲层，一旦负担超过承受线，反抗便迅速席卷。二世而亡，不是因为皇帝昏庸一个原因。", "x": "没有上下通道的组织，崩溃来得更快也更彻底。"}, {"e": "秦", "t": "陈胜吴广起义的导火索", "b": "秦法规定服役误期要受重罚，陈胜吴广在大泽乡遇雨误期，面临严惩。起义的直接原因，是制度刚性超过了人的承受力。", "x": "规则越刚性，就越需要留出例外。"}, {"e": "秦", "t": "秦的统一措施：书同文、车同轨", "b": "统一文字、度量衡、货币、车轨，这些措施让不同地区的人能交流、交易、通行。统一之后的文化整合，比军事征服影响更长久。", "x": "真正把地方黏在一起的，往往是这些不起眼的统一。"}, {"e": "秦", "t": "秦始皇的巡行与刻石", "b": "秦始皇多次巡行天下，在峄山、泰山、琅琊等地刻石纪功。巡行既是宣示权力，也是亲身查看这个刚刚拼起来的帝国。", "x": "能亲自跑一遍，才知道自己的地盘是什么样子。"}, {"e": "秦", "t": "灵渠与岭南的开发", "b": "秦为征百越开凿灵渠，沟通湘江与漓江，把中原与岭南连起来。一条运河，改变了南方的历史节奏。", "x": "基础设施一建，边疆就变成了后方。"}, {"e": "秦", "t": "兵马俑：一支为死者准备的军队", "b": "秦始皇陵的兵马俑坑按军阵排列，陶俑面容各异。它既是陪葬品，也是秦军组织形态的实物记录。", "x": "最宏大的工程，常常是为了解决一个人对死亡的恐惧。"}, {"e": "秦", "t": "赵高与沙丘之变", "b": "秦始皇病逝沙丘，赵高、李斯篡改遗诏，立胡亥为帝，逼死扶苏与蒙恬。一次继位操作，决定了一个王朝的走向。", "x": "权力交接的缝隙，是最容易被利用的地方。"}, {"e": "秦", "t": "秦的制度遗产被汉继承", "b": "汉承秦制，郡县、官僚、律令、文书体系大体延续，只是在尺度上有所放宽。秦亡了，但秦的治理技术留了下来。", "x": "一个王朝可以迅速结束，它的制度却能活很久。"}, {"e": "西汉", "t": "汉初的选择：总结秦亡教训", "b": "汉初用黄老无为、轻徭薄赋，让社会从战争后恢复。陆贾劝刘邦逆取顺守：造反能用法家手段，坐天下要靠仁义。", "x": "能自我修正的政权，比一味强硬的政权活得久。"}, {"e": "西汉", "t": "文景之治的关键是不要乱动", "b": "文帝景帝不搞大工程、少征税、减轻刑罚，三十年间社会财富积累，为汉武帝的扩张提供底气。休养生息不是懦弱，是给系统充能。", "x": "不动手，有时是最好的治理。"}, {"e": "西汉", "t": "推恩令：让一个封国自己碎掉", "b": "汉武帝时主父偃建议：诸侯王必须把土地分给所有子孙，而不只是长子。几代之后大国自然碎成小侯，中央一兵不发就解决了郡国问题。", "x": "最好的方案，是让对手自己瓦解。"}, {"e": "西汉", "t": "张骞出使西域的真实目的不是贸易", "b": "张骞两次出使是为了找大月氏结盟夹击匈奴，军事目的完全失败，但带回大量地理和物产信息，开启了后来丝绸之路的通道。", "x": "长期价值往往出现在目标的边缘。"}, {"e": "西汉", "t": "汉武帝的另一面：国家的钱从哪里来", "b": "连年征战耗尽国库，武帝推行盐铁官营、均输平准、算缗告缗，向商人收重税。战争让财政手段变得激进，商业活力随之萎缩。", "x": "战争先吃掉财政，再吃掉商业。"}, {"e": "西汉", "t": "轮台诏：一次公开的自我修正", "b": "武帝晚年下轮台诏，承认长期用兵使民生疲敝，决定转向休养。这是少见的由皇帝亲口承认政策失误并调整的记录。", "x": "能承认自己错了的决策者，才有可能及时止损。"}, {"e": "西汉", "t": "司马迁的选择", "b": "司马迁因替李陵辩护受宫刑，忍辱著《史记》。他写史重视人物性格与处境，不只给帝王作传，也记录游侠、商人。", "x": "看待历史的角度，往往由个人处境塑造。"}, {"e": "西汉", "t": "汉代的吏治考核", "b": "汉代对地方官有上计制度，定期上报户口、赋税、治安。考核让中央能看到地方状况，但也容易被数据美化。", "x": "考核指标一旦固定，就会有人专门做指标。"}, {"e": "西汉", "t": "昭宣中兴：帝国的一次回调", "b": "昭帝、宣帝时期减轻赋役、整顿吏治、与匈奴和战并用，国力恢复。宣帝被评价为汉家制度本以霸王道杂之。", "x": "一个体系的健康，看它能不能在过度之后往回收。"}, {"e": "新", "t": "王莽是被自己照的书办砸的", "b": "王莽摄政时声望极高，上台后强行照《周礼》复古，频繁改名改币改土地制度，社会无从执行。他不是坏人，是被理想模型和现实间的距离压垮的人。", "x": "用一本书改造一个复杂社会，几乎注定失败。"}, {"e": "新", "t": "王莽改制：为什么越改越乱", "b": "王田制、五均六筦、频繁改币，政策频繁变动让社会无法形成预期。改革最怕的不是方向错，是让人猜不到明天会怎样。", "x": "频繁变化的规则，会让所有人都不敢做长期打算。"}, {"e": "新", "t": "绿林赤眉：社会底层的反弹", "b": "王莽末年灾荒与改制失败叠加，各地起义爆发。起义军多为流民与农民，组织松散，但足以摧毁旧秩序。", "x": "当所有人都活不下去时，组织性差也能赢。"}, {"e": "东汉", "t": "光武中兴：换一套柔和的治理办法", "b": "刘秀在战乱后裁撤冗员、释放奴婢、削弱三公、强化尚书台。他把事务交给效率更高的文书系统处理。", "x": "把决策流放到流程里，能减少个人好恶的影响。"}, {"e": "东汉", "t": "云台二十八将：开国功臣的软着陆", "b": "刘秀重赏功臣但不让他们掌实权，用文吏治天下。开国之后的功臣处理方式，往往决定王朝前期的稳定。", "x": "给荣誉不给权力，是一种难度很高的平衡。"}, {"e": "东汉", "t": "纸的普及没让国家变强，却让文化下沉", "b": "东汉蔡伦改良造纸之后，纸张逐渐替代竹简，书籍成本下降，读书开始不只是上层特权。", "x": "信息成本下降，往往伴随权力扩散。"}, {"e": "东汉", "t": "黄巾起义的根本原因是地方失控", "b": "东汉末年外戚宦官轮流乱政，地方豪族兼并土地，天灾与赋税叠加。苍天已死这句口号能拉拢这么多人，是因为太多人活不下去。", "x": "起义的口号，总是社会的账单。"}, {"e": "东汉", "t": "党锢之祸：士人与宦官的对抗", "b": "东汉后期士大夫集团与宦官集团激烈冲突，两次党锢大批士人被禁锢终身。知识精英与皇权近侍的对抗，越演越烈。", "x": "把不同意见直接封死，往往会让矛盾转向更隐蔽更激烈的形式。"}, {"e": "东汉", "t": "外戚与宦官：皇权旁边的两种人", "b": "东汉中后期皇帝年幼即位，太后临朝依赖外戚，皇帝长大后依靠宦官夺权。两股势力轮流坐大，皇帝本人反而最弱。", "x": "当继承制度不稳定时，离权力最近的人就会成为真正的掌权者。"}, {"e": "东汉", "t": "东汉的庄园与豪族", "b": "东汉豪族拥有大量土地、佃客与部曲，形成半独立的庄园经济。这一结构后来成了魏晋门阀的基础。", "x": "经济上的独立，往往是政治独立的前奏。"}, {"e": "东汉", "t": "班超经营西域", "b": "班超以三十余人起家，在西域活动三十余年，重新打通西域通道。他的办法不是大军压境，而是联络与分化。", "x": "在资源不够的地方，外交能力比兵力更值钱。"}, {"e": "东汉", "t": "《汉书》与班固", "b": "班固继司马迁之后撰写断代史《汉书》，开创后世纪传体断代史体例。它与《史记》的差别，也在记叙重心上。", "x": "史书的形式选择，决定了后人看到的历史形状。"}, {"e": "东汉", "t": "张衡与浑天说", "b": "张衡制浑天仪、地动仪，提出浑天说。东汉的天文与数学，是当时世界上最系统的知识之一。", "x": "科学知识的存在，不代表它能被社会普遍使用。"}, {"e": "东汉", "t": "东汉的经学争论", "b": "今文经与古文经之争贯穿东汉，涉及文本真伪与解释权。学术争论背后，是谁有资格定义权威。", "x": "学术方法之争，背后常常是关于谁有权力解释世界。"}, {"e": "三国", "t": "三国鼎立的基础是地形和粮食", "b": "曹操占中原，孙权有长江天险，刘备据四川盆地。三方的地理条件互相牵制，军事优势被地形抵消，才出现几十年均势。", "x": "在军事对抗里，地形是最稳定的因素。"}, {"e": "三国", "t": "曹操的屯田：用兵的地方先种地", "b": "曹操在许下屯田，把流民与土地重新绑在一起，解决了军粮问题。能在混乱中恢复生产的人，往往能撑到最后。", "x": "战争打到最后，比的是谁能种出粮食。"}, {"e": "三国", "t": "九品中正制本来是改革，最后变成门阀", "b": "曹丕用中正官评定人才出身和品第，本意是纠正汉末名士评议的混乱。后来评定标准被世家主导，变成上品无寒门。", "x": "设计的初衷，挡不住执行者的利益。"}, {"e": "三国", "t": "赤壁之战：火攻之下是补给问题", "b": "曹操南下，北方兵不习水战，军中疫病流行，补给线拉长。火攻是结果，不是全部原因。", "x": "把失败归因于一个战术，常常忽略更基础的条件。"}, {"e": "三国", "t": "诸葛亮治蜀：法度与民心的平衡", "b": "诸葛亮主政蜀汉，赏罚分明、开诚布公，同时推行屯田、修水利。国力最弱的一方，靠治理效率维持了长期对峙。", "x": "实力不够时，内部效率就是唯一的加成。"}, {"e": "三国", "t": "蜀汉的困局：地理优势也是限制", "b": "四川盆地易守难攻，也难出去。北伐多次因粮运困难无果，最终被拖垮。", "x": "让你安全的地形，同时也是让你出不去的地形。"}, {"e": "三国", "t": "东吴世家与长江防线", "b": "孙吴依赖江东世家大族提供兵源与财赋，长江是天然的防线，也是内部权力妥协的舞台。", "x": "依赖地方豪族支撑的政权，中央往往不够强。"}, {"e": "三国", "t": "司马氏篡魏靠的不是兵变，是时间", "b": "司马懿在高平陵之变后实质掌权，此后几十年通过联姻、提拔亲信、掌控都督区，一步步把魏国装进自己口袋。", "x": "真正稳固的权力，是一点一点积累出来的。"}, {"e": "三国", "t": "魏蜀吴的人口对比", "b": "三国中魏国人口与兵力远超吴蜀，蜀汉人口约百万。长期的国力差距，最终在司马氏统一时兑现。", "x": "实力差距拉得足够大，战术就变得不重要了。"}, {"e": "三国", "t": "三国时期的屯田与水利", "b": "三国各政权都重视屯田与水利，邓艾在淮河流域大兴屯田。战争压力反而推动了农业技术的恢复。", "x": "极端的竞争，有时候会逼出长期才有回报的建设。"}, {"e": "三国", "t": "建安文学：乱世里的另一种表达", "b": "曹操、曹丕、曹植与建安七子的诗文，写乱世、写人生短促。文学的气质往往与时代处境同步。", "x": "文学是时代最敏感的温度计。"}, {"e": "《史记》·司马迁", "t": "《史记》", "b": "司马迁以纪传体写三千年历史，本纪、世家、列传构成人物叙事。他把失败者也写进历史，比如项羽入本纪。", "x": "给失败者一个位置，历史才有厚度。"}, {"e": "《汉书》·班固", "t": "《汉书》", "b": "班固以断代史方式记录西汉一朝，体例严整。它与《史记》最大的差别，是写作目的从究天人之际转为记录一朝之制。", "x": "写作目的变了，史书的样子也会变。"}, {"e": "《资治通鉴》·司马光", "t": "《资治通鉴》", "b": "司马光编年记载战国至五代的历史，目的明确：给帝王提供治理参考。材料取舍都围绕有用展开。", "x": "史书的价值，取决于它服务于什么问题。"}, {"e": "《睡虎地秦简》", "t": "《睡虎地秦简》", "b": "湖北云梦出土的秦简，包含法律文书、行政规定、日书等，是研究秦制的第一手材料。它让秦朝从抽象的暴政变成了具体的流程。", "x": "能看见细节，才谈得上理解。"}, {"e": "《张家山汉简》", "t": "《张家山汉简》", "b": "湖北江陵张家山出土的汉简包含《二年律令》等法律文献，显示汉初法律比想象的更有条理，也更有人情味的细节。", "x": "出土文献常常推翻我们对制度的想当然。"}, {"e": "《秦汉史》·吕思勉", "t": "《秦汉史》吕思勉", "b": "吕思勉从制度与社会角度梳理秦汉，关注官制、赋税、兵制与民间生活，不满足于帝王将相的故事。", "x": "一个朝代真正的骨架，藏在制度里。"}, {"e": "《秦汉史》·劳榦", "t": "《秦汉史》劳榦", "b": "劳榦重视简牍与考古材料，把秦汉的行政、军事、边疆问题放在制度框架下考察。", "x": "新材料一出现，旧结论就要重新检查。"}, {"e": "《史记》·司马迁", "t": "《史记》里的刘邦与项羽", "b": "司马迁写项羽入本纪、写刘邦多市井气，不完全站在胜利者一边。这种写法本身就是一种态度。", "x": "记录谁、怎么记录，本身就是选择。"}, {"e": "《后汉书》·范晔", "t": "《后汉书》", "b": "范晔的《后汉书》以人物列传为主，对党锢、逸民、列女等群体有专门记载，留下了东汉社会的多个侧面。", "x": "记下边缘的人，才能看见完整的社会。"}, {"e": "《三国志》·陈寿", "t": "《三国志》与注", "b": "陈寿写《三国志》简练克制，裴松之作注补充大量材料。正文与注的对比，本身就是一场史学对话。", "x": "材料放在一起，读者才有判断的余地。"}, {"e": "《盐铁论》·桓宽", "t": "《盐铁论》", "b": "西汉昭帝时召开盐铁会议，讨论国家是否应垄断盐铁经营。桓宽记录辩论，留下官营与民营之争的原始声音。", "x": "国家的钱该从哪里来，这个争论两千年没停过。"}, {"e": "《论衡》·王充", "t": "《论衡》王充", "b": "王充以怀疑态度批评当时的迷信与虚妄之说，主张实证。他在东汉的思想环境里显得相当孤立。", "x": "敢于怀疑常识的人，通常都不太受欢迎。"}, {"e": "《汉代农业》·许倬云", "t": "《汉代农业》许倬云", "b": "许倬云研究汉代农业技术与经营方式，讨论小农经济如何成为帝国的基础。", "x": "一个国家的结构，往往由它怎么种地决定。"}, {"e": "《中国古代帝国的形成与结构》·西嶋定生", "t": "《中国古代帝国的形成与结构》西嶋定生", "b": "日本学者西嶋定生研究秦汉的二十等爵与编户制度，认为帝国的本质是对人的支配。", "x": "看得见人，才谈得上统治人。"}, {"e": "《汉代社会》", "t": "《汉代社会》", "b": "汉代社会研究关注家族、宗族、乡里、豪族与流民，展示帝国底层如何运转。", "x": "决定一个时代稳定与否的，往往是这些不在史书正中央的人。"}, {"e": "《秦制研究》", "t": "《秦制研究》", "b": "秦制研究讨论郡县、军功爵、户籍、律令之间的关系，说明秦的效率来自系统，而不只是严刑峻法。", "x": "把制度连起来看，才知道它为什么有效，也才知道它为什么脆弱。"}, {"e": "《王莽》", "t": "《王莽》", "b": "研究王莽的著作强调他不是简单的篡位者，而是一个试图用儒家理想改造现实的改革者，失败源于理想与执行脱节。", "x": "最危险的改革者，往往是最真诚的那个。"}, {"e": "《匈奴史》", "t": "《匈奴史》", "b": "匈奴史研究汉匈之间的和亲、战争与贸易，说明北方草原与中原的关系远不止打与不打。", "x": "边疆的问题，常常是经济和气候问题。"}, {"e": "《丝绸之路新史》·韩森", "t": "《丝绸之路新史》韩森", "b": "韩森用出土文书重建丝绸之路的实际运作，指出它更多是短程贸易与文化交流的网络，而不是一条直通的东西大道。", "x": "宏大叙事之下，往往是很多段很短的往来。"}, {"e": "《汉帝国的建立与刘邦集团》·李开元", "t": "《汉帝国的建立与刘邦集团》李开元", "b": "李开元研究刘邦集团的构成与权力结构，把开国看作一个政治集团的整合过程。", "x": "开国不只是一场战争，也是一次权力分配。"}]}, {"id": "weijin", "name": "魏晋南北朝", "desc": "西晋到隋前 · 59 张", "cards": [{"e": "西晋", "t": "司马炎统一：三国归晋", "b": "265 年司马炎代魏建晋，280 年灭吴，结束分裂。统一来得很快，但西晋的政治结构从建立之初就不稳。", "x": "统一的速度，不代表统一的稳固程度。"}, {"e": "西晋", "t": "大封宗室：给自己埋下的地雷", "b": "晋武帝大封宗室为王，并让他们掌握军队。初衷是防止权臣篡位，结果是诸王力量过大，最终爆发八王之乱。", "x": "为了防止一种风险而增加另一种风险，很常见。"}, {"e": "西晋", "t": "占田制与荫客：士族的特权被写进法律", "b": "西晋规定官员按品级占田、荫庇亲属与佃客。特权一旦法律化，阶层就变得极难流动。", "x": "把好处写进法律，等于把它变成长期结构。"}, {"e": "西晋", "t": "八王之乱：一场自毁长城的内战", "b": "晋惠帝暗弱，诸王为争夺中央控制权混战十六年，国家精锐尽损，才有后来的五胡乱华。", "x": "把兵权分给兄弟，往往换来兄弟相攻。"}, {"e": "西晋", "t": "永嘉之乱与衣冠南渡", "b": "西晋灭亡后，大批北方士族和百姓南迁，带来人口、技术和文化。东晋在南方重建政权，江南从此成为经济重心。", "x": "大规模人口流动，常把一个失败变成另一个开端。"}, {"e": "西晋", "t": "清谈与玄学：乱世里的精神出口", "b": "西晋士人好清谈，讨论有无、名教与自然。频繁的政变让政治参与变得危险，抽象的讨论成了安全的去处。", "x": "一个时代讨论什么，往往取决于它回避什么。"}, {"e": "东晋", "t": "王与马共天下", "b": "东晋建立依赖琅琊王氏的支持，王导主政、王敦掌兵，时人称王与马共天下。南渡政权从一开始就是与士族共治。", "x": "靠谁上位，就要和谁分权。"}, {"e": "东晋", "t": "祖逖北伐：一个人撑不起整个国家", "b": "祖逖自行招募军队、自行筹粮，收复黄河以南，但东晋朝廷担心他做大，支援始终不足。", "x": "关键的支持来自后方，而不是前线。"}, {"e": "东晋", "t": "淝水之战：八万打赢八十万不是奇迹", "b": "前秦苻坚集结大军南征，军队由多民族拼凑，士气不齐。东晋靠组织度与地形优势，抓住对方阵型移动时的混乱取胜。", "x": "人数优势需要组织支撑，不然就是负担。"}, {"e": "东晋", "t": "谢安：打赢了还在下棋", "b": "淝水之战捷报传来时谢安正在下棋，看完信只说小儿辈大破贼。这种镇定既是风度，也是政治表演。", "x": "在危机里，领导者的表情本身就是一种资源。"}, {"e": "东晋", "t": "土断：给流民重新上户口", "b": "南渡人口挂在原籍的侨郡，不纳税不服役。东晋后期推行土断，把侨人编入当地户籍，扩大税基，也触动士族利益。", "x": "户籍一旦改革，钱和人的归属就都变了。"}, {"e": "东晋", "t": "门阀政治：皇帝也要看几家脸色", "b": "东晋的琅琊王氏、颍川庾氏、谯国桓氏、陈郡谢氏轮流执政，皇权有限。政治的稳定性依赖这几家之间的平衡。", "x": "当权力由几个家族分配，任何一家做大都会引发动荡。"}, {"e": "东晋", "t": "桓温与北伐", "b": "桓温多次北伐，一度收复洛阳，但朝廷担心他功高，支援有限。北伐在政治上常常是双刃剑。", "x": "功劳太大的人，往往会被自己人先防住。"}, {"e": "南朝", "t": "刘裕：寒门出身的开国者", "b": "刘裕出身寒微，靠军功崛起，北伐灭南燕、后秦，后取代东晋建立宋朝。他大量起用寒人，压制士族。", "x": "打破既得利益的人，往往不是从里面长出来的。"}, {"e": "南朝", "t": "南朝四百八十寺：寺院经济学", "b": "南朝佛教极盛，寺院占田、免税、接受布施，形成庞大的独立经济实体，甚至影响国家财政。北朝与唐代多次灭佛，本质上是财政动作。", "x": "宗教和财政的冲突，常常表现为信仰之争。"}, {"e": "南朝", "t": "梁武帝与侯景之乱", "b": "梁武帝萧衍在位四十八年，晚年接纳东魏降将侯景，侯景叛乱攻入建康，梁武帝饿死台城。接纳一个人的风险，有时是亡国级别的。", "x": "一次人事决定，可能改变整个政权。"}, {"e": "南朝", "t": "南朝士族的衰落", "b": "侯景之乱中大批士族被杀，庄园经济受创。加上寒人掌机要，门阀的政治优势逐步瓦解。", "x": "阶层的崩塌，有时只需要一场动乱。"}, {"e": "南朝", "t": "寒人掌机要：权力流向新的位置", "b": "南朝皇帝多用寒门出身的中书舍人处理机要，绕过士族把持的高位。名义上的高位与实际权力开始分离。", "x": "权力会自己流向真正处理事情的位置。"}, {"e": "南朝", "t": "建康：南方的都城", "b": "建康人口众多，商业繁荣，佛寺林立。南方的城市文化在分裂时期反而发展出独特的面貌。", "x": "政治分裂，文化不一定跟着分裂。"}, {"e": "南朝", "t": "南朝的文学与《文选》", "b": "昭明太子编《文选》，收录先秦至南朝的诗文。文学在南朝被系统整理，成为后世科举与文章的重要范本。", "x": "整理本身，就是在选择什么该被传下去。"}, {"e": "北魏", "t": "北魏的建立与统一北方", "b": "鲜卑拓跋部建立北魏，439 年统一北方。此后北方在相对稳定的环境中发展，为后来隋唐的统一积累基础。", "x": "长期的分裂里，往往有一半在悄悄整合。"}, {"e": "北魏", "t": "北魏孝文帝的迁都", "b": "孝文帝迁都洛阳，试图摆脱旧贵族势力范围，直接用汉化制度整合国家。迁都既是战略，也是政治重塑。", "x": "改变地理中心，往往也是改变权力中心。"}, {"e": "北魏", "t": "孝文帝改革：改汉姓穿汉服说汉话", "b": "孝文帝强制鲜卑贵族改汉姓、穿汉服、说汉话、与汉人通婚。改革极大提升治理效率，也让北方边镇将士被边缘化。", "x": "改革总有受益者，也有被落下的人。"}, {"e": "北魏", "t": "六镇之乱：被改革抛下的人的反叛", "b": "迁都后，原先守边的鲜卑军户地位骤降，待遇远不如洛阳新贵，不满积累终成叛乱。乱局中高欢、宇文泰崛起。", "x": "在改革中受损的群体，往往是下一轮风波的起点。"}, {"e": "西魏", "t": "府兵制：兵农合一的动员体制", "b": "西魏宇文泰创立府兵制雏形，兵农合一，军人有军籍与土地。这套制度后来被隋唐继承，成为统一战争的基础。", "x": "能把兵和土地绑在一起，就能长期维持一支军队。"}, {"e": "北魏", "t": "云冈与龙门石窟", "b": "北魏皇室开凿石窟造像，展示皇权与佛法的合一。巨大的造像工程同时消耗资源并凝聚人心。", "x": "最宏大的建筑，常常也承担着政治功能。"}, {"e": "北魏", "t": "《齐民要术》里写的都是活下去的办法", "b": "贾思勰记录农、林、牧、副、渔的技术，包括如何酿酒、储藏、救荒。它不写理想，写的是普通人家怎么在灾年保住口粮。", "x": "最朴素的知识，往往最接近生活的边界。"}, {"e": "北魏", "t": "北魏的均田制", "b": "北魏推行均田制，按人口分配土地，配套租调制度。它在土地相对充足时有效，后来被隋唐继承并逐步难以维持。", "x": "制度有它适用的条件，条件一变就要调整。"}, {"e": "北朝", "t": "北周与北齐：两种不同的路径", "b": "北周在关陇集团支持下改革军制、整合族群，北齐则依赖山东士族，内部矛盾更重。最终北周灭北齐。", "x": "同样的起点，不同的整合方式，结局差得很远。"}, {"e": "北朝", "t": "关陇集团：隋唐的胚胎", "b": "西魏北周时期形成的关中军事贵族集团，胡汉混合、文武合一，隋唐两代的皇室与重臣多出于此。", "x": "一个王朝的根基，往往在上一轮分裂里就已经埋好。"}, {"e": "魏晋", "t": "佛教东传靠的是战乱中的安慰", "b": "佛教在南北朝迅速传播，因为社会长期动荡，人们需要解释苦难的体系。寺院提供救济、医疗、教育，也吸收了大量逃役人口。", "x": "能提供慰藉的东西，往往也能组织人。"}, {"e": "魏晋", "t": "南北对峙带来了什么", "b": "南北对立促成各自社会发展，南朝保持商业与文化的活力，北朝积累军事与土地制度经验。分裂期不是空洞的时间。", "x": "分裂的时期，是不同路径的试验期。"}, {"e": "魏晋", "t": "世家大族的形成", "b": "从东汉豪族到魏晋门阀，家族通过土地、文化、婚姻与官位垄断，形成可以延续数百年的政治集团。", "x": "能自我复制的优势，才是真正的优势。"}, {"e": "魏晋", "t": "《世说新语》与名士风度", "b": "《世说新语》记录名士的言谈与做派，展示动荡时代里一种自我保存的方式：以清谈和放达维持个人尊严。", "x": "社会秩序松动时，个人风格常成为价值寄托。"}, {"e": "魏晋", "t": "魏晋玄学为什么流行", "b": "频繁的政权更迭让士人难以在政治上有所作为，他们转向讨论有与无、名教与自然。", "x": "一个时代讨论什么，往往取决于它回避什么。"}, {"e": "北朝", "t": "木兰辞背后的兵制", "b": "《木兰辞》反映的是府兵制环境：家庭出征服役。花木兰代父从军，可以理解成兵役制度下的家庭策略。", "x": "制度压力，往往最终落在家庭内部消化。"}, {"e": "魏晋", "t": "南北朝的书法与绘画", "b": "王羲之的行书、顾恺之的人物画，在这一时期达到高峰。乱世中的艺术反而形成了极高的审美标准。", "x": "秩序崩塌时，个人技艺反而更被看重。"}, {"e": "魏晋", "t": "南北朝的科学技术", "b": "祖冲之算圆周率到小数点后七位，贾思勰写农书，郦道元注《水经》。分裂时期的科学成就常被低估。", "x": "政治上分裂，知识上未必停步。"}, {"e": "魏晋", "t": "坞堡与宗族自保", "b": "战乱中地方大族筑坞堡自保，拥有武装与部曲。国家无力保护时，社会会自己长出防御结构。", "x": "治理能力不足时，安全会变成私人商品。"}, {"e": "魏晋", "t": "南北朝的移民与语言", "b": "大量北方人口南迁，带来北方方言与南方语言的交融。今天的汉语方言格局，有一部分可以从这里追溯。", "x": "人口的流动，最终会沉淀成语言。"}, {"e": "《世说新语》·刘义庆", "t": "《世说新语》", "b": "刘义庆编，记录汉末至东晋名士的言行，篇幅短小。它是了解魏晋精神气质最直接的窗口。", "x": "一个时代的风度，藏在它的段子里。"}, {"e": "《洛阳伽蓝记》·杨衒之", "t": "《洛阳伽蓝记》", "b": "杨衒之记录北魏洛阳的佛寺与城市生活，兼写政治与社会变迁。它既是地理志，也是亡国之后的追忆。", "x": "城市被写下来的那一刻，它才开始有历史。"}, {"e": "《水经注》·郦道元", "t": "《水经注》", "b": "郦道元为《水经》作注，记录一千多条河流及沿岸地理、历史、风俗，文字优美，保存了大量失传文献。", "x": "注释写得好，有时比原著更有价值。"}, {"e": "《齐民要术》·贾思勰", "t": "《齐民要术》", "b": "贾思勰总结北方农业生产技术，从耕作、育种到酿造、储藏，是中国现存最早的完整农书。", "x": "技术书比政治书更能反映普通人怎么活。"}, {"e": "《文心雕龙》·刘勰", "t": "《文心雕龙》", "b": "刘勰系统讨论文学创作与文体，是中国第一部体系完整的文学理论著作。", "x": "把经验写成方法，是需要很强抽象能力的。"}, {"e": "《诗品》·钟嵘", "t": "《诗品》", "b": "钟嵘品评汉至齐梁的诗人，分为上中下三品。评价标准背后，是当时的审美取向。", "x": "谁被排在上面，反映的是那个时代喜欢什么。"}, {"e": "《三国志》·裴松之注", "t": "《三国志》裴注", "b": "裴松之为《三国志》作注，补充了大量逸事与异说，篇幅远超正文。它让后人能看到同一件事的不同版本。", "x": "保存不同说法，本身就是对历史负责。"}, {"e": "《晋书》", "t": "《晋书》", "b": "唐修《晋书》收录两晋史事，包含大量志怪传闻。它的史料价值与文学色彩并存。", "x": "越是写得好看的史书，越要小心它的想象。"}, {"e": "《宋书》·沈约", "t": "《宋书》与《南史》", "b": "沈约《宋书》与李延寿《南史》，分别以断代与通史方式记录南朝，互为参照。同一段历史的不同剪裁，可以看出作者立场。", "x": "读出作者的选择，比记住内容更重要。"}, {"e": "《魏书》·魏收", "t": "《魏书》", "b": "魏收撰《魏书》，记录北魏历史。因褒贬鲜明，当时被称为秽史，但也保存了大量制度材料。", "x": "有立场的记载，仍然是记载。"}, {"e": "《颜氏家训》·颜之推", "t": "《颜氏家训》", "b": "颜之推以家训形式讨论教育、处世、婚丧与治学，反映南北朝士族的实际生活与价值。", "x": "家训是最不掩饰真实想法的文体。"}, {"e": "《抱朴子》·葛洪", "t": "《抱朴子》", "b": "葛洪讨论神仙、炼丹与养生，也论时政。它同时保存了道教与早期化学的知识。", "x": "看起来荒诞的东西，有时藏着真正有用的知识。"}, {"e": "《魏晋南北朝史》·王仲荦", "t": "《魏晋南北朝史》王仲荦", "b": "王仲荦系统梳理这一时期的政治、经济、民族与文化，重视社会结构的变动。", "x": "把混乱的时代讲清楚，本身就是一种能力。"}, {"e": "《门阀与庄园》", "t": "《门阀与庄园》", "b": "研究魏晋门阀的著作关注家族如何通过土地、文化、婚姻与仕宦自我延续。", "x": "理解了家族，才理解这段历史的运行逻辑。"}, {"e": "《从平城到洛阳》·康乐", "t": "《从平城到洛阳》康乐", "b": "康乐研究北魏孝文帝迁都与汉化改革，讨论改革如何重塑政权与社会关系。", "x": "一次迁都，改变的不只是地图。"}, {"e": "《中古中国门阀大族的消亡》·谭凯", "t": "《中古中国门阀大族的消亡》谭凯", "b": "谭凯用墓志数据研究唐代门阀的消亡，指出这个过程比想象中更慢，也更复杂。", "x": "用数据看历史，才能发现直觉错在哪里。"}, {"e": "《六朝文明》·丁爱博", "t": "《六朝文明》丁爱博", "b": "丁爱博以考古材料研究六朝的物质文化，包括城市、墓葬、器物与宗教，展示南方社会的实际面貌。", "x": "知道他们怎么生活，才谈得上理解他们怎么想。"}, {"e": "《魏晋之际的政治权力与家族网络》·仇鹿鸣", "t": "《魏晋之际的政治权力与家族网络》仇鹿鸣", "b": "仇鹿鸣研究魏晋易代过程中的家族网络与政治操作，说明政权更替不是一两个人的行动。", "x": "权力交接从来不是一瞬间的事。"}, {"e": "《能夏则大与渐慕华风》·胡鸿", "t": "《能夏则大与渐慕华风》胡鸿", "b": "胡鸿研究十六国北朝的政治体如何自我定位与整合，讨论华夏认同在分裂时期的演变。", "x": "认同不是天生的，它是在互动中被不断重新定义的。"}]}, {"id": "suitang", "name": "隋唐", "desc": "隋到五代 · 58 张", "cards": [{"e": "隋", "t": "隋朝的统一：几十年就完成了", "b": "581 年杨坚代周建隋，589 年灭陈，结束近三百年的分裂。统一很快，但隋朝只维持了三十七年。", "x": "能在短时间里做成大事的政权，往往也容易在短时间里耗尽自己。"}, {"e": "隋", "t": "大运河是一条财政血管", "b": "隋炀帝修运河的直接动机是把江南粮食和物资送到北方政治中心。它让南北经济连成一体，但工程极重，压垮了当时的民力。", "x": "基础设施的价值，要过一两代人才能看清。"}, {"e": "隋", "t": "隋炀帝的问题不是昏，而是急", "b": "他修运河、建东都、三征高句丽都在十几年内完成，每件事单独看是战略，叠加起来超出当时社会的承受能力。", "x": "节奏决定成败：同一个动作，慢一步就是另一回事。"}, {"e": "隋", "t": "三省六部：一种互相检查的制度设计", "b": "中书省出主意，门下省可以驳回，尚书省执行。决策需经审核才能落地，减少一人拍板的失误。", "x": "让不同环节互相制衡，能减少决策的随意性。"}, {"e": "隋", "t": "科举制的确立：给社会一个上升通道", "b": "隋朝开始以考试选官，唐代完善。它不能消灭特权，但给了社会一个可见的上升通道，使精英的精力流向读书而非造反。", "x": "一个社会是否稳定，部分取决于它有没有上升通道。"}, {"e": "隋", "t": "开皇之治：短暂的富足", "b": "隋文帝时期政治清明、府库充盈，但严苛的律法与对地方的控制也埋下矛盾。表面的富足未必等于社会的承受力。", "x": "国库满，不等于民间有余。"}, {"e": "隋", "t": "三征高句丽：一场拖垮隋朝的战争", "b": "隋炀帝三次征讨高句丽，动员规模巨大，前线失利，民夫与士兵损失惨重。战争把已经紧绷的社会直接推过了极限。", "x": "最后压垮系统的，往往是最费钱的那件事。"}, {"e": "隋", "t": "李密与瓦岗军：隋末的另一种力量", "b": "瓦岗军在隋末崛起，占据兴洛仓，开仓放粮吸引流民，一度成为最强势力。粮仓本身就是最有号召力的政治资源。", "x": "能分粮食的人，才有资格谈号召力。"}, {"e": "唐", "t": "李渊起兵：关中的地理优势再次生效", "b": "李渊从太原起兵入关中，占领长安，依托关中的地形与仓储逐步扩张。地理条件在易代之际依然是硬约束。", "x": "开局的位置，往往决定了后面能选的路。"}, {"e": "唐", "t": "玄武门之变：一次成功的宫廷政变", "b": "626 年李世民在玄武门伏击并杀死太子李建成，随后掌权。政变虽然血腥，但此后带来了贞观之治。", "x": "结果的正当性，不能反推手段的正当性。"}, {"e": "唐", "t": "贞观之治的核心是问得出问题", "b": "太宗与魏征反复讨论为什么隋亡。他通过纳谏降低决策失误，用制度让批评有出口，把秦隋的教训直接变成了治理原则。", "x": "能听到不同意见，等于给判断加了保险。"}, {"e": "唐", "t": "魏征：一个被允许说难听话的人", "b": "魏征前后进谏二百余事，太宗多次被顶撞仍予采纳。他死后太宗说以铜为镜可以正衣冠，以人为镜可以明得失。", "x": "让批评有出口，是最高级的自我纠错。"}, {"e": "唐", "t": "唐律疏议：为什么被邻国照搬", "b": "唐律体系完整、条款清晰，附有官方解释，日本、朝鲜、越南的律法都受其影响。法律输出的前提是制度成熟与长期稳定。", "x": "能被别人借鉴的，一定是可执行的。"}, {"e": "唐", "t": "唐长安是一个国际城市", "b": "长安有大量西域商人、僧侣、留学生、乐工，胡食胡乐胡服在贵族中流行。唐朝的开放建立在军事优势和丝绸之路贸易之上。", "x": "开放需要实力做基础。"}, {"e": "唐", "t": "坊市制度：长安的管理方式", "b": "长安将居民区（坊）与商业区（市）分开，夜间关闭坊门。城市管理严格，也限制了商业的时间与空间。", "x": "城市形态的变化，常反映管理方式的变化。"}, {"e": "唐", "t": "玄奘西行", "b": "玄奘私自出境西行天竺，历时十七年，带回大量佛经，归国后主持译经。他为了知识愿意承担极大的个人风险。", "x": "真正想要知识的人，会自己去找。"}, {"e": "唐", "t": "府兵制与均田制的绑定", "b": "唐代前期府兵制依托均田制，兵农合一，士兵自己备装备。均田制维持不下去时，府兵制也随之瓦解。", "x": "两种制度绑在一起，会一起成功，也会一起失败。"}, {"e": "唐", "t": "武则天是怎么打破规则的", "b": "她通过科举提拔寒门、设置北门学士绕过三省、用酷吏清除反对者。她的统治方式短期有效，但代价很高。", "x": "改规则的人，往往同时承担风险和代价。"}, {"e": "唐", "t": "开天盛世：人口、商业与城市", "b": "玄宗前期政治稳定、经济繁荣，人口增长，长安洛阳商业繁盛。盛世的基础是长期的和平与行政效率。", "x": "盛世最容易被当成常态，其实它是例外。"}, {"e": "唐", "t": "节度使制度养出了割据", "b": "唐朝在边境设节度使，给了兵权、财权和行政权。安禄山一人兼三镇兵力，中央却无足够力量制衡。", "x": "把多个权力交给同一个角色，风险会放大。"}, {"e": "唐", "t": "安史之乱：一个王朝的转折", "b": "755 年安禄山起兵，战乱持续八年，北方经济凋敝，人口锐减。此后唐朝再未恢复到战前的国力。", "x": "转折点往往不是缓慢的衰退，而是一次断崖。"}, {"e": "唐", "t": "马嵬驿：一场兵变改变了政治", "b": "安史之乱中玄宗逃往四川，行至马嵬驿禁军哗变，杀杨国忠，逼死杨贵妃。皇帝的权威在士兵面前显得很脆弱。", "x": "当军队不再服从，皇帝就只剩名分。"}, {"e": "唐", "t": "安史之乱后唐朝为什么还能撑一百多年", "b": "乱后唐朝依靠藩镇互相牵制、运河财赋继续供应，以及皇帝的灵活妥协维持运转。", "x": "衰落不是一次性崩塌，而是长期的缓慢滑落。"}, {"e": "唐", "t": "藩镇为什么不推翻唐朝", "b": "藩镇需要朝廷给予合法性和名分，也需要彼此制衡；唐廷垄断着盐铁和运河带来的财源。结构上的相互依赖让各方都没有动机掀桌。", "x": "互相依赖的关系，比单纯的实力更能维持稳定。"}, {"e": "唐", "t": "两税法：国家不再管你怎么赚钱", "b": "唐中后期税制从按人丁征收改为按财产与田亩征收，一年分夏秋两次。政府从管人口转向管资产，货币经济进一步扩大。", "x": "税制形态反映国家对社会的掌控方式。"}, {"e": "唐", "t": "南方的崛起", "b": "安史之乱后北方残破，江南成为财政重心，扬州、益州繁荣。经济重心的南移在唐代基本完成。", "x": "一个地区的衰落，往往是另一个地区的起点。"}, {"e": "唐", "t": "黄巢起义跨越了半个中国", "b": "唐末饥荒与赋税加重，黄巢从山东起兵，一路攻入广州、洛阳、长安。起义能走这么远，说明交通已经连成一片。", "x": "同一套网络，也能把人组织起来反抗。"}, {"e": "唐", "t": "朱温篡唐：唐朝的最后十年", "b": "黄巢降将朱温控制朝廷，907 年废唐建梁。中央权威在藩镇手里被彻底耗尽。", "x": "政权名义上结束的那一刻，实际早就结束了。"}, {"e": "五代", "t": "五代十国：藩镇割据的延续", "b": "五代五十三年间换了五个朝代，皇帝多由军将拥立。谁能控制禁军，谁就能当皇帝。", "x": "当军队成为拥立者，政权就更像一次交易。"}, {"e": "五代", "t": "冯道：在五个朝代当官的人", "b": "冯道历仕四朝十君，自号长乐老。后人骂他无节，也有人认为他在乱世中保全了许多百姓与典籍。", "x": "评价一个乱世中的人，需要先理解他面对的选择。"}, {"e": "五代", "t": "石敬瑭与燕云十六州", "b": "后晋石敬瑭为求契丹支持，割让燕云十六州并称儿皇帝。这片地区此后长期成为北方政权的战略屏障问题。", "x": "一次求援的代价，可能延续几百年。"}, {"e": "五代", "t": "周世宗改革：五代里最像样的努力", "b": "后周世宗柴荣整顿军制、改革税制、限制佛教，并开始北伐。他去世太早，但为宋朝打下了基础。", "x": "有些人的意义，在于他们为后来者铺了路。"}, {"e": "唐", "t": "唐代的女性与武则天时代", "b": "唐代女性在婚姻、财产与社会活动上的空间比宋以后更宽，武则天称帝也在观念上打开过一道口子。", "x": "制度允许的空间，往往随政治风向变动。"}, {"e": "唐", "t": "唐代的科举与士族", "b": "科举扩大，但唐代前期世家仍占优势。真正的社会流动，要到宋代才更普遍。", "x": "制度建立与制度生效，中间隔着几十上百年。"}, {"e": "唐", "t": "唐代的佛教与灭佛", "b": "唐武宗灭佛，拆寺四千余所，勒令僧尼还俗。宗教政策背后是资源争夺：寺院占田免税，影响财政与兵源。", "x": "当公共资源吃紧，最先被动的往往是特权群体。"}, {"e": "唐", "t": "唐代的丝绸之路与贸易", "b": "陆上与海上贸易同时繁荣，长安、广州、扬州是重要节点。贸易带来物产、宗教与技术，也带来了外来人口。", "x": "开放的实质，是人和货自由流动。"}, {"e": "唐", "t": "李白杜甫各自活在一个时代的两端", "b": "李白看到了盛唐的余晖与开放的浪漫，杜甫经历了安史之乱后的凋敝。文学气质的变化，往往是社会状态的早期信号。", "x": "文学是时代最敏感的温度计。"}, {"e": "唐", "t": "唐代的边塞诗与帝国心理", "b": "盛唐边塞诗雄浑开阔，反映军事自信；中晚唐的边塞诗更多是悲凉与现实。", "x": "诗歌，是一个国家的内心状态。"}, {"e": "唐", "t": "鉴真东渡是双向的文化交易", "b": "鉴真六次东渡，失败五次、失明一次，最终抵达日本，传播律宗与建筑、医药。日本同时输入唐朝制度与技术。", "x": "真正的影响，是互相的，不是单向的。"}, {"e": "唐", "t": "唐代的医学与算学", "b": "唐代设太医署、算学馆，国家介入专业教育。专业知识的制度化，是唐代行政能力强的一部分。", "x": "国家能力的底层，往往是这些不显眼的专业机构。"}, {"e": "《贞观政要》·吴兢", "t": "《贞观政要》", "b": "吴兢辑录太宗与群臣的对话，讨论为政之道。它把贞观之治整理成一套可读的治理经验，后世帝王常读。", "x": "把经验整理成书，才能被别人反复使用。"}, {"e": "《通典》·杜佑", "t": "《通典》", "b": "杜佑编撰的制度史，涵盖食货、选举、职官、礼、乐、兵、刑法、州郡、边防，是中国第一部政书。", "x": "制度史比政治史更接近社会的骨架。"}, {"e": "《史通》·刘知几", "t": "《史通》", "b": "刘知几系统讨论史书的体例、取材与评价，是中国第一部史学理论著作。他批评了很多前代史书的写法。", "x": "能批评方法本身，学科才开始成熟。"}, {"e": "《大唐西域记》·玄奘", "t": "《大唐西域记》", "b": "玄奘口述、辩机记录，写下一百多个国家与地区的地理、物产、宗教与风俗。它既是佛教文献，也是中亚南亚史的重要材料。", "x": "一个人认真记载的见闻，能成为后世的重要史料。"}, {"e": "《唐六典》", "t": "《唐六典》", "b": "唐代官修的行政法典，规定各机构的编制与职权。它让唐代的官僚体系第一次被系统写下来。", "x": "把机构写清楚，才谈得上约束它。"}, {"e": "《全唐诗》", "t": "《全唐诗》", "b": "清人编纂的唐诗总集，收录四万八千余首。它是研究唐代社会与心态最丰富的材料之一。", "x": "一个时代的情绪，往往保存在它的诗里。"}, {"e": "《唐代科举制度研究》·吴宗国", "t": "《唐代科举制度研究》吴宗国", "b": "吴宗国研究唐代科举的实际运作，指出唐代科举规模有限，真正改变社会结构要到宋代。", "x": "制度的建立与效果，往往不是同一时间发生的。"}, {"e": "《隋唐帝国形成史论》·谷川道雄", "t": "《隋唐帝国形成史论》谷川道雄", "b": "谷川道雄从府兵制与贵族制入手，讨论隋唐帝国的形成过程，强调共同体与权力结构的关系。", "x": "一个帝国的形状，取决于它怎么组织人。"}, {"e": "《唐代藩镇研究》·张国刚", "t": "《唐代藩镇研究》张国刚", "b": "张国刚系统研究藩镇的类型与运作，指出藩镇并不都是割据，也有忠于中央的类型。", "x": "把一件事看成一个整体，往往会忽略它的多样性。"}, {"e": "《长安十二时辰》", "t": "《长安十二时辰》与其他长安研究", "b": "对唐代长安的城市研究关注坊市、人口、治安与日常生活，还原一座百万人口城市如何运转。", "x": "城市越大，管理细节越决定成败。"}, {"e": "《撒马尔罕的金桃》·薛爱华", "t": "《撒马尔罕的金桃》薛爱华", "b": "薛爱华研究唐代的外来物品与文化，从香料、宝石到乐器、动物，展示唐朝如何吸纳异域元素。", "x": "一个文明的开放程度，可以从它进口什么看出来。"}, {"e": "《唐诗别裁》·沈德潜", "t": "《唐诗别裁》", "b": "沈德潜编选的唐诗选本，主张温柔敦厚的诗教。选本本身就是一种评价标准。", "x": "选什么、不选什么，比评论更能说明立场。"}, {"e": "《新唐书》", "t": "《旧唐书》与《新唐书》", "b": "两部唐史分别成于五代与北宋，取材与立场不同。对照阅读能看出后人对同一段历史的不同理解。", "x": "同一个朝代，可以写出两种历史。"}, {"e": "《安禄山事迹》", "t": "《安禄山事迹》", "b": "记载安禄山生平与安史之乱的早期文献，细节丰富，也夹杂传说。", "x": "越接近事件的记载，越需要辨别它的立场。"}, {"e": "《唐代衣食住行》·黄正建", "t": "《唐代衣食住行》黄正建", "b": "黄正建从日常生活角度研究唐代，讨论饮食、服饰、住宅与交通，展示普通人的实际生活。", "x": "宏大叙事之外，还有每天怎么吃饭这件事。"}, {"e": "《唐代宗教信仰与社会》·荣新江", "t": "《唐代宗教信仰与社会》荣新江", "b": "荣新江研究唐代宗教与社会的关系，包括佛教、道教与外来宗教的传播与互动。", "x": "信仰的传播，常常沿着商路和人口流动走。"}, {"e": "《隋书》", "t": "《隋书》", "b": "唐修《隋书》，记录隋朝三十七年历史，也保存了南北朝的制度材料。短命的王朝，留下了长久的制度。", "x": "政权的寿命，和它留下的东西不一定成正比。"}, {"e": "《资治通鉴》·司马光", "t": "《资治通鉴·唐纪》", "b": "司马光在《资治通鉴》中对唐代的记载，重视君臣对话与决策过程，为后世提供了大量可借鉴的案例。", "x": "决策的过程，比结果更有学习价值。"}]}, {"id": "songyuan", "name": "宋元", "desc": "北宋到元末 · 65 张", "cards": [{"e": "北宋", "t": "宋朝重文轻武是从五代吸取的教训", "b": "五代武将频繁篡位，宋太祖因此以杯酒释兵权，把军事指挥权分散给文官体系，以免武将坐大。这带来了内部稳定，也带来了边境的被动。", "x": "解决上一轮问题的方法，往往会在下一轮造成新的问题。"}, {"e": "北宋", "t": "杯酒释兵权：一次低成本的收权", "b": "赵匡胤宴请将领，劝他们交出军权换富贵。比起屠戮功臣，这种做法既省成本，也减少了内部怨恨。", "x": "让出权力的人有好处，收权才会顺利。"}, {"e": "北宋", "t": "强干弱枝：宋朝的军事设计", "b": "宋代把精兵集中在中央，地方兵力薄弱，同时以枢密院、三衙、率臣分割军权。防内乱有效，但战场反应慢。", "x": "为了安全设计的结构，往往会牺牲效率。"}, {"e": "北宋", "t": "交子：四川商人先发明的纸币", "b": "北宋四川铁钱笨重，商人自发发行存款凭证交子，后来由官方接办。纸币能成立依赖信用和防伪，两个条件缺一不可。", "x": "货币的本质是信任，而不是金属。"}, {"e": "北宋", "t": "宋朝的财政收入主要来自商业税", "b": "北宋商税、专卖（盐、茶、酒）、海外贸易收入比重很高，城市经济繁荣，汴京人口超百万。", "x": "财政结构改变，会带动整个社会形态的变化。"}, {"e": "北宋", "t": "王安石变法的根本矛盾", "b": "青苗、免役、市易等法目标是增加财政收入、减轻农民负担，但执行时常强制摊派，反成扰民。", "x": "好的设计与执行能力，是两件事。"}, {"e": "北宋", "t": "新旧党争：政策变成了身份", "b": "王安石变法引起长期争论，新旧两党轮流执政，政策反复。政治立场一旦固化成身份，就很难再讨论具体问题。", "x": "当立场代替分析，政策就只能来回摆。"}, {"e": "北宋", "t": "澶渊之盟：花钱买和平是否值得", "b": "宋辽订立和约，宋每年给辽银绢，换得百余年边境安定。从财政账看支出有限，但军事压力转为外交依赖。", "x": "花钱买来的和平，也会带来依赖。"}, {"e": "北宋", "t": "活字印刷在宋代已经出现", "b": "毕昇的泥活字记录在《梦溪笔谈》，但因汉字字数多、排版成本高，长期未能普及。宋代真正流行的是雕版印刷。", "x": "技术的普及，取决于它是否适配当时的现实条件。"}, {"e": "北宋", "t": "科举的糊名与誊录", "b": "宋代科举采用糊名、誊录等制度，减少主考官凭姓名偏私。这些技术手段让公平更有制度保障。", "x": "公平感，很大程度上来自可见的流程。"}, {"e": "北宋", "t": "理学回应的问题是：世界为什么有秩序", "b": "程朱理学用天理、气、性来解释宇宙与道德秩序，为士人提供一套内在修养与外在规范。", "x": "一套理论能长期占据主流，往往是因为它回答了当时最迫切的秩序问题。"}, {"e": "北宋", "t": "宋代的女性与经济", "b": "宋代城市商业、纺织、饮食业中女性参与度较高，也有女性经商。叙事中的闺阁，并不覆盖可见的全部。", "x": "历史记录越强调规范，越可能掩盖现实。"}, {"e": "北宋", "t": "汴京的市井生活", "b": "汴京有夜市、瓦舍勾栏、酒楼茶坊，市民文化兴盛。宋代的城市不只是行政中心，也是消费与娱乐的场所。", "x": "当城市不再只服务权力，它才开始有自己的生命力。"}, {"e": "北宋", "t": "靖康之变：一个王朝的整体崩塌", "b": "金军攻破汴京，掳走徽钦二帝、宗室、工匠、书籍。灭国不只是军事失败，也是一次文化和人才的大规模抽空。", "x": "战争的代价，常常要以文明的损失来计量。"}, {"e": "南宋", "t": "岳飞之死的政治算术", "b": "宋高宗担心迎回钦帝威胁自己的皇位，秦桧主和以维持南北对峙，岳飞的军事优势反而成为和议的障碍。", "x": "在国家利益之外，常还有个人利益的算计。"}, {"e": "南宋", "t": "绍兴和议：用称臣换来的和平", "b": "南宋与金订立绍兴和议，向金称臣纳贡，划定边界。和平维持了二十年，但代价是政治上的从属地位。", "x": "和平的形式，往往也会影响后面的谈判位置。"}, {"e": "南宋", "t": "南宋的经济扩张：海上丝绸之路", "b": "南宋失去北方后更依赖海上贸易，泉州、广州成为国际港口，瓷、丝、铜钱外流，市舶司成为重要财源。", "x": "外部压力常常逼迫一个社会重新定义自己的资源。"}, {"e": "南宋", "t": "会子与通胀", "b": "南宋会子长期超发，导致物价上涨、信用下降。货币发行者一旦能通过印钞解决问题，通胀就成为结构性风险。", "x": "一旦能印钱解决困难，就很难克制不印。"}, {"e": "南宋", "t": "朱熹与书院", "b": "朱熹讲学、注经，重建书院体系。理学的传播依赖教育网络，思想要落地，必须有一套组织。", "x": "思想要传播，得有地方讲。"}, {"e": "南宋", "t": "崖山之后", "b": "崖山海战后南宋灭亡，大量士人南逃，文化随人流散落。政权消亡不代表社会结构的立即消失。", "x": "政治实体的结束，未必意味着社会组织的终止。"}, {"e": "辽", "t": "辽的双轨制：一套国家两种制度", "b": "辽以南北面官分治汉人与游牧部族，用不同制度管理不同人群。这是多民族政权的现实做法。", "x": "承认差异，有时比强行统一更有效。"}, {"e": "辽", "t": "澶渊之盟与辽宋的百年和平", "b": "宋辽对峙一百余年，边境贸易繁盛，榷场成为双方经济连接点。战争未必是唯一的关系形式。", "x": "和平也能产生长期的经济利益。"}, {"e": "金", "t": "金朝的崛起：几年之间灭辽灭北宋", "b": "女真完颜部迅速崛起，1115 年建金，十年内灭辽，随后攻破汴京。军事组织的高效，能短暂压过体量优势。", "x": "组织效率，可以在一段时间里战胜规模。"}, {"e": "金", "t": "金朝的汉化与猛安谋克", "b": "金朝保留猛安谋克军事组织，同时逐步汉化官制。两种制度并行久了，内部的矛盾也会积累。", "x": "同时用两套规则，短期灵活，长期难平衡。"}, {"e": "西夏", "t": "西夏：夹缝中的政权", "b": "西夏在宋辽金之间周旋，靠地理位置和灵活外交生存，同时发展自己的文字与佛教文化。", "x": "小国的生存能力，往往体现在外交上。"}, {"e": "元", "t": "蒙古崛起靠的不只是骑兵", "b": "成吉思汗用千户制重组部落，建立严明的军纪与情报系统，并吸纳各地工匠与技术，把游牧骑兵变成能攻城的复合军。", "x": "一个组织的强盛，往往来自系统整合，而不是单点优势。"}, {"e": "元", "t": "行省制是元代留下的最大遗产", "b": "元朝设中书省派出机构行省管理地方，后来演化为地方最高行政单位。今天的省级行政区划，可以追溯到元。", "x": "治理疆域的技术，常常先解决边界问题。"}, {"e": "元", "t": "四等人制与其实际程度", "b": "蒙古人、色目人、汉人、南人分等，法律与仕途差异明显。不过实际治理中大量汉人参与行政，等级制度存在，但并非简单一刀切。", "x": "制度文本与实施效果之间，常有差距。"}, {"e": "元", "t": "驿站网络是帝国的信息骨架", "b": "元代驿站遍布欧亚，可快速传递政令、情报与使节。信息的传递速度，决定了帝国可以扩张到多大。", "x": "组织的边界，很大程度由信息传输速度决定。"}, {"e": "元", "t": "《马可·波罗游记》", "b": "游记描述元大都的繁华、纸币、驿站，许多细节与中文史料相合，也有夸张和遗漏。它影响了欧洲对东方的想象。", "x": "描述不准确的材料，依然会塑造历史。"}, {"e": "元", "t": "元曲为什么繁荣", "b": "元代科举长期停顿，大量读书人无法进入仕途，转向市井文艺创作。", "x": "渠道堵塞的能量，往往会寻找新的出口。"}, {"e": "元", "t": "元代的纸币与财政", "b": "元代发行交钞，曾长期使用，后期因超发和管理不善导致通货膨胀。财政工具的滥用会影响货币信用。", "x": "货币信用一旦受损，恢复往往要付出很高成本。"}, {"e": "元", "t": "红巾军起义与元末的社会崩溃", "b": "黄河治水、赋税加重、瘟疫流行，加上纸币通胀，社会秩序全面失控。朱元璋从底层崛起，最终建立明朝。", "x": "当多个问题叠加，任何一个都可能成为最后一根稻草。"}, {"e": "元", "t": "元朝的海上贸易与泉州", "b": "元代泉州是当时世界最大的港口之一，色目商人活跃。元朝对海外贸易的依赖，超过多数人的印象。", "x": "一个陆上帝国，也可能在海上赚很多钱。"}, {"e": "元", "t": "元代的科技与天文", "b": "郭守敬编《授时历》，测算一年长度为 365.2425 日，精度接近现代值。元代的实用科学相当发达。", "x": "技术上的领先，不等于制度上的领先。"}, {"e": "元", "t": "元代的宗教政策", "b": "元朝对佛教、道教、伊斯兰教、基督教等多种宗教相对宽容，重用色目人管理财政。多元背后是治理的实际需要。", "x": "包容有时不是因为理念，而是因为人手不够。"}, {"e": "宋", "t": "宋代的商业革命", "b": "宋代突破坊市制，出现街市夜市，纸币、信用、行会、海外贸易发达。经济形态提前出现了许多近代特征。", "x": "经济形态一变，社会结构就会跟着动。"}, {"e": "宋", "t": "宋代的印刷业与知识流动", "b": "宋代雕版印刷普及、书坊遍布，书籍价格大幅下降，民间藏书和私学增多。", "x": "文化传播成本一降，社会变化就难以阻挡。"}, {"e": "宋", "t": "宋代的海外贸易与市舶司", "b": "宋在广州、泉州设市舶司，管理对外贸易并抽税。海洋贸易是国家财政的一部分。", "x": "开放往往是经济需要，而非单纯胸襟。"}, {"e": "宋", "t": "宋代的灾荒与救济", "b": "宋代设常平仓、义仓，遇灾赈济、减税。救济能力与财政状况直接相关。", "x": "救灾能力，是政权稳定性的日常指标。"}, {"e": "宋", "t": "宋代的家族与宗族", "b": "宋代宗族制度重建，族田、族谱、祠堂发展。基层秩序在很大程度上由宗族维持。", "x": "治理成本高时，社会会自己长出一些结构。"}, {"e": "宋", "t": "宋代的城市与消费", "b": "宋代城市人口增加，茶楼、酒楼、瓦市、书铺林立，消费文化兴盛。", "x": "消费扩张，会让社会变得更多样。"}, {"e": "宋", "t": "宋代的军事技术", "b": "宋代火药武器开始用于战场，出现突火枪、火箭等。但技术创新没有转化为整体的军事优势。", "x": "单点技术领先，需要体系配合才能变成实力。"}, {"e": "宋", "t": "宋代的医学与《洗冤集录》", "b": "宋慈著《洗冤集录》，系统记录验尸方法，是世界上最早的法医学专著之一。", "x": "把经验写成可检验的流程，才能被继承。"}, {"e": "宋", "t": "宋代的数学与《数书九章》", "b": "秦九韶著《数书九章》，讨论高次方程与实用算法。宋代数学在世界上处于领先水平。", "x": "有用的知识，往往先解决实际问题。"}, {"e": "《东京梦华录》·孟元老", "t": "《东京梦华录》", "b": "孟元老追忆北宋汴京的城市生活，从节令、饮食到娱乐，细节极其丰富。它是了解宋代城市最生动的材料。", "x": "一个城市的日常，就是它最真实的历史。"}, {"e": "《梦溪笔谈》·沈括", "t": "《梦溪笔谈》", "b": "沈括记录见闻与科学观察，包含活字印刷、指南针、地质与天文。它像一本北宋的知识笔记。", "x": "好奇心写下来的东西，往往比正式著作更长久。"}, {"e": "《资治通鉴》·司马光", "t": "《资治通鉴》", "b": "司马光编年记载战国至五代的历史，目的明确：给帝王提供治理参考。", "x": "史书的价值，取决于它服务于什么问题。"}, {"e": "《宋史》", "t": "《宋史》", "b": "元修《宋史》卷帙浩繁，保存了大量原始材料，但也有繁冗与矛盾之处。", "x": "材料多，不等于叙述清楚。"}, {"e": "《清明上河图》·张择端", "t": "《清明上河图》", "b": "张择端绘汴京街市，画中店铺、船只、行人、桥梁细节密集，是研究宋代城市与商业的图像史料。", "x": "一张画能提供文字写不出来的信息。"}, {"e": "《朱子语类》·朱熹", "t": "《朱子语类》", "b": "朱熹讲学的语录汇编，语言通俗，展示理学的具体论证方式。", "x": "看一个人怎么讲课，比看他的结论更能理解他。"}, {"e": "《文献通考》·马端临", "t": "《文献通考》", "b": "马端临编撰的制度通史，涵盖田赋、钱币、户口、职官等，接续《通典》。", "x": "把制度沿革连起来看，才能看出变化的逻辑。"}, {"e": "《宋代中国的改革》·刘子健", "t": "《宋代中国的改革》刘子健", "b": "刘子健研究王安石变法，认为它是一场试图用官僚手段重塑社会的改革，失败在于既有结构太坚固。", "x": "改革失败，常常不是因为方案不好，而是结构太稳。"}, {"e": "《中国转向内在》·刘子健", "t": "《中国转向内在》刘子健", "b": "刘子健认为南宋以后中国文化转向内向，精英的关注点从改造世界转向修养自身。", "x": "一个群体的注意力转向哪里，往往说明它在哪里碰了壁。"}, {"e": "《天潢贵胄》·贾志扬", "t": "《天潢贵胄》贾志扬", "b": "贾志扬研究宋代宗室的制度与生活，说明皇族如何被供养也被限制。", "x": "任何特权群体，都需要一整套管理制度。"}, {"e": "《蒙元入侵前夜的中国日常生活》·谢和耐", "t": "《蒙元入侵前夜的中国日常生活》谢和耐", "b": "谢和耐描绘南宋临安的城市生活，从衣食住行到节庆娱乐，展示一个高度商业化社会的样子。", "x": "理解一个时代，得先知道它的人怎么过日子。"}, {"e": "《成吉思汗与今日世界之形成》·杰克·威泽弗德", "t": "《成吉思汗与今日世界之形成》杰克·威泽弗德", "b": "威泽弗德认为蒙古帝国的扩张促进了欧亚交流，丝绸之路上的商品、技术与疾病都因此加速流动。", "x": "一次破坏性的扩张，也可能加速世界的连接。"}, {"e": "《蒙元制度与政治文化》·姚大力", "t": "《蒙元制度与政治文化》姚大力", "b": "姚大力研究元代制度与政治文化，关注蒙古传统与汉制的结合方式。", "x": "征服者的制度，最终会被治理的需要改造。"}, {"e": "《邓广铭宋史研究》", "t": "《邓广铭宋史研究》", "b": "邓广铭对宋代政治、人物与制度的考证严谨，纠正了不少旧说。", "x": "把事实弄清楚，是所有解释的前提。"}, {"e": "《南宋行暮》·虞云国", "t": "《南宋行暮》虞云国", "b": "虞云国研究南宋后期的政治与社会，展示一个看似安定实则漏洞渐多的政权。", "x": "衰败不一定伴随明显的动荡，有时只是缓慢的空心化。"}, {"e": "《宋代地方的治理》", "t": "《宋代地方的治理》", "b": "研究宋代州县的实际运作，包括赋税征收、司法审理与地方势力，说明国家如何抵达基层。", "x": "国家的边界，落在它能管到哪一层。"}, {"e": "《辽史》", "t": "《辽史》与《金史》", "b": "两部正史分别记录辽与金，材料多来自汉人文书，叙述视角有明显偏向。", "x": "读别人的历史，要看是谁写的。"}, {"e": "《梦粱录》·吴自牧", "t": "《东京梦华录》与《梦粱录》", "b": "《梦粱录》模仿《东京梦华录》记录南宋临安的城市生活，两书对照能看出南北两都的差异。", "x": "同一体裁的记录，放在一起才有比较的价值。"}, {"e": "《水浒传》", "t": "《水浒传》的历史背景", "b": "《水浒传》虽是小说，但其对宋代基层社会、官府运作、江湖规则的描写，保留了大量社会细节。", "x": "虚构的文学，常常保存最真实的社会质感。"}, {"e": "《大宋之变》·赵冬梅", "t": "《大宋之变》赵冬梅", "b": "赵冬梅以王安石变法为中心，写北宋中期的政治转折，关注变法如何改变士人的政治生活。", "x": "一场改革动摇的，往往不只是制度，还有人之间的关系。"}]}, {"id": "mingqing", "name": "明清", "desc": "洪武到逊位 · 239 张", "cards": [{"e": "明·开国", "t": "红巾军起义：元末的社会已经撑不住了", "b": "元末黄河治水、赋役加重、纸币滥发，加上瘟疫与饥荒，社会秩序全面松动。朱元璋出身贫寒，先入皇觉寺为僧，后投红巾军，在一堆割据势力里一路打了出来。", "x": "压垮一个王朝的，往往不是某一件事，而是几件事同时发生。"}, {"e": "明·开国", "t": "高筑墙、广积粮、缓称王", "b": "朱元璋的谋士朱升给他九个字：高筑墙、广积粮、缓称王。意思是先守稳根据地、攒够粮食、别太早把自己树成靶子，等别人互相消耗得差不多了再动手。", "x": "在多方竞争里，先不出头，有时比先出头更划算。"}, {"e": "明·开国", "t": "鄱阳湖之战：一次水战定下江南归属", "b": "1363 年朱元璋与陈友谅在鄱阳湖决战，陈军兵力更多，朱元璋以火攻和分割包围取胜，陈友谅中箭身亡。此后南方再没有能与他抗衡的势力。", "x": "决战一旦打输，之前的体量优势就没有意义了。"}, {"e": "明·开国", "t": "明朝废丞相：皇帝一个人要干三个人的活", "b": "洪武十三年胡惟庸案后，朱元璋废除中书省和丞相，六部直接对皇帝负责。他规定后代不许再立丞相。天下事都由一人决断，工作量随之上了一个台阶。", "x": "把权力收到一个人手里，也把工作量收到了一个人身上。"}, {"e": "明·开国", "t": "朱元璋为什么杀得这么狠", "b": "洪武年间大案接连发生，胡惟庸案、蓝玉案牵连数万人。朱元璋的出发点是把潜在的军事与行政威胁清干净，为子孙留一个没有强人的朝廷。", "x": "用极端手段消除威胁，往往同时也消除了组织的能力。"}, {"e": "明·制度", "t": "里甲制与黄册：把每个人登记在册", "b": "明代以一百一十户为一里，编制黄册登记户口与土地，作为赋役依据。这套制度是明代基层治理和财政的基础，也让国家第一次能相对精确地看见人口。", "x": "能统计到的人，才纳得进税。"}, {"e": "明·制度", "t": "鱼鳞图册：把土地一块块画下来", "b": "明代丈量土地后绘制图册，因图形像鱼鳞而得名，详细记录每块田的形状、面积与业主。它与黄册配合，构成了明代的税基。", "x": "掌握细节，才能掌握征收。"}, {"e": "明·制度", "t": "卫所制：当兵是一种世袭身份", "b": "明代军户世代当兵，屯田自养，全国设卫所。初期节省开支、兵源稳定，后期土地被侵占、军户逃亡，战斗力下降，最终转向募兵。", "x": "用身份解决长期供给问题，代价是失去流动和淘汰。"}, {"e": "明·开国", "t": "锦衣卫：明朝的特务起点", "b": "朱元璋设锦衣卫，负责侦察、缉捕、审讯，直属于皇帝，可以绕过常规司法程序。它不是一般的执法机构，而是皇帝伸向官员的手。", "x": "绕开常规流程的权力，往往也绕开了纠错机制。"}, {"e": "明·开国", "t": "空印案与郭桓案：一道手续引发的血案", "b": "地方官进京报账时常带着盖好印的空白文书备用，朱元璋认为其中有弊，严惩了大批官员。制度上的合理性，在皇帝眼里可能只是借口。", "x": "当最高权力不信任流程，流程本身就成了罪证。"}, {"e": "明·永乐", "t": "靖难之役：一个藩王把皇帝赶下了台", "b": "建文帝削藩，燕王朱棣以清君侧为名起兵，四年后攻入南京，建文帝下落不明，朱棣即位。前朝留下的藩王问题，最终以最激烈的方式解决。", "x": "削藩这条路上，留不留缓冲，结果可能完全不同。"}, {"e": "明·永乐", "t": "方孝孺被诛十族：一次极端表态", "b": "朱棣要求方孝孺起草即位诏书，方孝孺拒绝，据传被诛十族。这件事成了永乐朝合法性问题的一个血色注脚。", "x": "用极端手段压住异议，异议会转入看不见的地方。"}, {"e": "明·永乐", "t": "迁都北京：天子守国门", "b": "朱棣把首都从南京迁到北京，一方面靠近自己的根据地，一方面直接面对北方的蒙古威胁。此后明代的政治重心一直在北京。", "x": "把首府放在最危险的地方，是一种动员方式，也是一种风险。"}, {"e": "明·永乐", "t": "紫禁城：用建筑表达秩序", "b": "永乐年间营建北京城与紫禁城，中轴对称、等级分明，朝会与居住空间严格区分。建筑本身就是一套政治语言的说明书。", "x": "最宏大的建筑，往往同时在做治理的工作。"}, {"e": "明·永乐", "t": "郑和七下西洋：规模远超同时期的欧洲", "b": "永乐至宣德年间，郑和率两百多艘船、两万余人七次远航，最远到东非。船队以宣示国威、建立朝贡关系为主，贸易并不是核心目的。", "x": "不以赚钱为目的的远航，财政上很难持续。"}, {"e": "明·永乐", "t": "郑和为什么终止：一笔算不过来的账", "b": "远航耗费巨大，带回的多是珍奇与朝贡关系，不能形成稳定收益。加上北方压力上升、朝中反对，宣德之后航线彻底停止。", "x": "一件事能不能继续，取决于它能不能养活自己。"}, {"e": "明·永乐", "t": "《永乐大典》：一部没有副本的大书", "b": "永乐年间编纂的大型类书，收书七八千种，共两万余卷。正本下落不明，副本在近代战乱中大量散失，现存仅数百册。", "x": "没有冗余保存的东西，一旦出事就几乎没有备份。"}, {"e": "明·永乐", "t": "奴儿干都司：东北的管理与象征", "b": "永乐年间在黑龙江下游设奴儿干都司，管理当地部族，立永宁寺碑。它说明明代对东北的管理主要是羁縻性质，而不是直接行政。", "x": "边疆治理的深浅，往往看它收不收税、派不派官。"}, {"e": "明·永乐", "t": "五征漠北：永乐亲自带兵打蒙古", "b": "朱棣五次亲征漠北，打击鞑靼、瓦剌诸部，取得战果，但蒙古问题始终没有根本解决。最后一次回师途中病逝。", "x": "反复用兵能压住一时，改不了长期的地理与人口格局。"}, {"e": "明·永乐", "t": "内阁的出现：皇帝忙不过来之后", "b": "废除丞相后，皇帝工作量过大，永乐起用翰林官入值文渊阁，参与机务。后来形成内阁制度，逐渐承担起类似宰相的部分职能。", "x": "制度上删掉的东西，往往会以另一种形式长回来。"}, {"e": "明·制度", "t": "翰林院与词臣：靠文字上升的路径", "b": "明代大量高级官员出自翰林院，靠科举与文字能力进入决策圈。这种路径培养了高度文人化的官僚群体。", "x": "上升路径一旦固定，一个群体的思维方式也就固定了。"}, {"e": "明·仁宣", "t": "仁宣之治：休养的几年", "b": "仁宗、宣宗在位时间不长，但减少用兵、减轻赋役、整顿吏治，社会得以喘息。与永乐的大规模行动相比，这是一段刻意收缩的时期。", "x": "收缩不等于衰落，很多时候是为了把力量攒回来。"}, {"e": "明·仁宣", "t": "宣宗的业余爱好：斗蟋蟀", "b": "宣宗喜好斗蟋蟀，民间有促织之戏的记载，地方因此出现过摊派。个人偏好在一个高度集权的体系里，会被放大成社会成本。", "x": "当一个人的喜好能变成指令，成本就会被整条系统承担。"}, {"e": "明·仁宣", "t": "交趾的弃守：主动放弃一块占领地", "b": "明军在安南设立交趾布政使司，但当地反抗不断、驻军成本高昂，宣德年间决定撤出。主动收缩往往需要承担舆论压力，但账面清楚。", "x": "敢于放弃打得下的地方，是一种另一种能力。"}, {"e": "明·制度", "t": "票拟与批红：一套字面上的流程", "b": "内阁对奏章提出处理意见叫票拟，皇帝用朱笔批准叫批红。皇帝不理政时，批红可能落到宦官手里，权力也随手续而转移。", "x": "流程里最关键的一步，决定了权力真正在谁手上。"}, {"e": "明·英宗", "t": "土木之变：皇帝被俘的那一战", "b": "1449 年英宗在宦官王振怂恿下亲征瓦剌，指挥混乱，在土木堡大败，英宗被俘。这是明朝最严重的一次军事失败。", "x": "关键决策交给不懂行的人，风险会被一次性放大。"}, {"e": "明·英宗", "t": "北京保卫战：于谦把局面撑住了", "b": "英宗被俘后，于谦拥立景帝、组织京师防御，击退瓦剌。一个王朝在危机中活下来，往往靠几个能立刻做决定的人。", "x": "危机中最稀缺的，是能马上拍板并承担后果的人。"}, {"e": "明·英宗", "t": "于谦之死：救过国家的人救不了自己", "b": "英宗复辟后，于谦以谋逆罪被杀。他在北京保卫战中保住了明朝，却死在政治复辟的清算里。", "x": "政治清算的逻辑，跟功劳簿没有关系。"}, {"e": "明·英宗", "t": "夺门之变：一次宫廷政变", "b": "景帝病重时，石亨、徐有贞等人拥英宗复辟，史称夺门之变。英宗复位后，景帝一系的官员被大批清洗。", "x": "在继承规则不清的地方，政变几乎是可以预期的。"}, {"e": "明·制度", "t": "宦官干政的结构性原因", "b": "明代宦官掌司礼监、提督东厂，能替皇帝批红、监视百官。他们之所以能做大，是因为皇帝需要一支完全依附于自己的力量去制衡文官。", "x": "没有独立根基的人，才会对授予他权力的人绝对忠诚。"}, {"e": "明·制度", "t": "王振与刘瑾：两个被放大的宦官", "b": "王振促成土木之变，刘瑾在正德朝掌权，被称立皇帝。他们的权力来自皇帝的信任，一旦失去信任，结局往往极其惨烈。", "x": "依附型的权力，涨得快，落得更快。"}, {"e": "明·制度", "t": "西厂与内行厂：特务机构的叠加", "b": "成化设西厂，正德设内行厂，与东厂、锦衣卫并存，彼此监视。机构越叠越多，最终谁监视谁都不清楚。", "x": "为解决问题不断增加机构，问题常常变成机构本身。"}, {"e": "明·成化", "t": "成化犁庭：对建州女真的早期打击", "b": "成化年间明军多次出兵辽东，打击建州女真诸部。这一段往往被后来的清代史书淡化，但它说明明与女真的冲突由来已久。", "x": "被淡化的事件，往往在后来的叙事里重新变得重要。"}, {"e": "明·制度", "t": "一条鞭法：把复杂的赋役简化成一条", "b": "嘉靖万历时推行一条鞭法，把各种赋、役合并折算成银两征收。税制简化，货币化加深，白银成为财政的主轴。", "x": "简化流程，往往能带动整个经济的货币化。"}, {"e": "明·经济", "t": "白银货币化：明代中国已经卷进全球市场", "b": "明代中后期白银成为主要货币，大量白银来自日本与美洲，通过贸易流入。海外银产量的波动，能直接影响国内的物价与财政。", "x": "全球化的影响，比我们通常以为的要早得多。"}, {"e": "明·经济", "t": "商帮与市镇：江南的另一种繁荣", "b": "明代中后期江南市镇密集，丝绸、棉布、瓷器生产与贸易繁盛，徽商、晋商等商帮兴起。经济重心进一步南移。", "x": "一个朝代的力量，常常先从它的市镇里长出来。"}, {"e": "明·社会", "t": "《金瓶梅》：一部写日常生活的书", "b": "明代长篇小说《金瓶梅》以市井家庭为背景，写财富、欲望与人际关系。它留下的社会细节，比正史多得多。", "x": "想了解一个时代怎么过日子，小说常常比史书直接。"}, {"e": "明·社会", "t": "明代的城市生活与消费", "b": "明代中后期城市消费增长，茶馆、酒楼、戏班、书坊兴盛，市民文化发展。消费的扩张也带来对身份秩序的冲击。", "x": "消费一变，等级的边界就开始松动。"}, {"e": "明·社会", "t": "女性的处境与节烈观念", "b": "明代贞节观念强化，旌表节妇的制度化程度提高，同时女性在实际经济生活中仍有参与空间。规范与现实之间始终存在落差。", "x": "规范越被强调的地方，往往越说明现实里不那么整齐。"}, {"e": "明·制度", "t": "明代的教育与科举", "b": "明代以八股取士，府州县学与书院并存，读书人围绕科举形成庞大的备考群体。考试内容固定，也让思想空间变得狭窄。", "x": "考试考什么，一代人的脑子就长成什么样。"}, {"e": "明·制度", "t": "明代的海禁与走私", "b": "明初海禁，民间贸易转入走私，走私集团与沿海武装结合，形成倭寇问题。后来开放月港，才部分缓解。", "x": "压住合理的需求，需求会自己找一条更难管的路。"}, {"e": "明·经济", "t": "月港开禁：一次有限的开放", "b": "隆庆年间开放福建月港，允许民间出海贸易，但限定地点与船只。有限开放既缓解了走私压力，也让政府能收税。", "x": "与其堵死，不如开一条能看见、能收税的口子。"}, {"e": "明·社会", "t": "明代的灾荒与赈济", "b": "明代在地方设预备仓，遇灾减免赋税、发放粮食。但仓储常常被挪用，赈济能力随财政状况起伏。", "x": "救灾能力，是政权合法性的日常版本。"}, {"e": "明·万历", "t": "张居正：十年首辅，一条鞭法", "b": "张居正任内阁首辅，推行考成法整顿吏治、清丈土地、推广一条鞭法，财政明显好转。他依靠与宦官冯保的合作掌握实权。", "x": "能推动改革的人，往往也要借助不体面的手段。"}, {"e": "明·制度", "t": "考成法：给官员上进度表", "b": "张居正推行考成法，把政务登记造册、限期完成、逐级核查。行政效率提高，也让官僚系统长期处于压力之下。", "x": "没有期限的政令，往往等于没有政令。"}, {"e": "明·万历", "t": "张居正死后被清算", "b": "张居正死后不久即被抄家，家属惨遭牵连。改革触动的利益，在他失去权力后集中反扑。", "x": "改革者离开之后，反弹往往比他活着时更凶。"}, {"e": "明·万历", "t": "万历怠政：皇帝不上朝也是一种态度", "b": "万历后期长期不上朝、不批奏章，官员缺员不补。这种消极抵抗使行政几乎停摆，也让文官集团与皇权长期僵持。", "x": "最高权力选择不作为，整个系统会跟着失灵。"}, {"e": "明·万历", "t": "国本之争：立谁当太子吵了十五年", "b": "万历想立宠妃之子为太子，文官坚持立长子，双方争论十余年。继承问题一旦变成派系斗争，就会消耗整个朝廷的注意力。", "x": "决定继承人这件事，最能暴露一个体制的裂缝。"}, {"e": "明·万历", "t": "万历三大征：打得起但很贵", "b": "万历年间平定宁夏、援朝抗倭、平定播州，三场战争都打赢了，军费消耗巨大，国库被掏空。胜利不等于没有代价。", "x": "把账算到胜利之后，才知道赢了什么。"}, {"e": "明·万历", "t": "援朝抗倭：一场跨国的七年战争", "b": "1592 年日本入侵朝鲜，明军入朝作战，历时七年，最终击退日军。这场战争消耗了明朝大量兵力与财政。", "x": "远处的战场，往往比想象的更费钱。"}, {"e": "明·万历", "t": "东林党：从书院议政到派系斗争", "b": "东林书院出身的官员以清议批评朝政，逐渐形成派系，与非东林派激烈对立。党争消耗了朝廷应对危机的能力。", "x": "内部分裂，常常比外部压力更致命。"}, {"e": "明·万历", "t": "萨尔浒之战：后金崛起的第一声", "b": "1619 年明军四路进攻后金，被努尔哈赤各个击破，明军大败。此战之后，辽东局势彻底逆转。", "x": "分兵冒进，是把优势还给对手的最快方式。"}, {"e": "明·万历", "t": "辽东军费：一个吞掉财政的无底洞", "b": "为应对后金，明朝不断加征辽饷，军费越滚越大，财政与民生同时承压。战争的账单最终落到了普通农民身上。", "x": "打不下去的战争，最后总是从最底层收钱。"}, {"e": "明·天启", "t": "魏忠贤：宦官权力的顶峰", "b": "天启年间魏忠贤掌权，各地建生祠，东林党人遭大规模迫害。依附于皇帝个人的权力，在他死后迅速崩解。", "x": "权力建在一个人身上，那个人一走就全塌。"}, {"e": "明·崇祯", "t": "崇祯：勤政的亡国之君", "b": "崇祯节俭勤政，但性格多疑、频繁换相、杀将自毁长城，十七年换了五十多个内阁大学士。个人勤勉顶不住系统的全面失灵。", "x": "越是事事亲为，越容易把关键判断交给焦虑。"}, {"e": "明·崇祯", "t": "袁崇焕之死：一次自毁长城", "b": "袁崇焕在辽东多次击败后金，后因反间计与朝中猜忌被下狱处死。一个正在发挥作用的将领，被自己的朝廷除掉。", "x": "不信任到极点，最先损失的是最能用的人。"}, {"e": "明·崇祯", "t": "小冰期与明末饥荒", "b": "十七世纪气候转冷，北方连年歉收，旱灾、蝗灾与瘟疫叠加，加上加派赋税，农民几乎无以为生。", "x": "自然条件常常是历史里被低估的底层变量。"}, {"e": "明·崇祯", "t": "李自成与张献忠：从驿卒到闯王", "b": "明末财政困难，裁撤驿站，李自成失业后加入起义军，后来提出均田免赋，迅速聚集大量追随者。", "x": "压到最紧的时候，最先反弹的是活不下去的人。"}, {"e": "明·崇祯", "t": "崇祯最后的那个早上", "b": "1644 年李自成攻入北京，崇祯在煤山自缢，遗诏称诸臣误我。他把责任留给臣下，也把整套系统的失败留在了身后。", "x": "把失败归因于别人，往往意味着从没看清自己的位置。"}, {"e": "明·崇祯", "t": "明亡：财政、军事、灾荒一起算总账", "b": "明末财政崩溃、军费无着、党争内耗、灾荒连年、外患不断，没有哪一项单独致命，但一起压下来，谁也撑不住。", "x": "系统性崩溃，从来不是单一原因造成的。"}, {"e": "明·南明", "t": "南明：一个想复制但复制不了的局面", "b": "北京陷落后，南方先后出现弘光、隆武、永历等政权，但因为内部倾轧与军事失控，很快被逐个击破。", "x": "有同样的地理条件，不一定有同样的组织能力。"}, {"e": "明·南明", "t": "史可法与扬州", "b": "弘光朝史可法督师扬州，城破后殉国。南明内部的派系斗争，使他在最需要支援时得不到支援。", "x": "一个体系先坏在内部，外敌才有机会收尾。"}, {"e": "明·南明", "t": "郑成功：海上的最后一个南明力量", "b": "郑成功以金门厦门为基地抗清，1661 年收复台湾作为根据地。明朝的残余力量最终在海上延续了一段。", "x": "陆地上站不住时，还有别的方向可以守。"}, {"e": "明·军事", "t": "明代的长城与九边", "b": "明代大规模修筑长城，设辽东、宣府、大同、延绥等九边重镇。防御体系的维护成本极高，长期消耗国力。", "x": "静态防线最大的问题，是它需要永远有人付钱。"}, {"e": "明·军事", "t": "明代卫所与募兵的交替", "b": "卫所制崩坏后，明廷转向募兵，戚继光的戚家军、辽东的关宁铁骑都属此类。募兵战斗力强，但对财政的要求更高。", "x": "效率和成本，往往是一起涨的。"}, {"e": "明·文化", "t": "永乐大典到四库全书：两个时代的整理工作", "b": "类书与丛书的编纂，都是国家动用资源整理知识的方式。整理的过程，同时也是筛选和取舍的过程。", "x": "决定收录什么，等于决定后人能记得什么。"}, {"e": "明·经济", "t": "明代的钞法为什么失败", "b": "明初发行大明宝钞，不能兑换、大量超发，很快贬值，民间转而用白银和铜钱。没有约束的印钞权，信用撑不住。", "x": "一旦能靠印钞解决问题，就很难再克制。"}, {"e": "明·经济", "t": "明代的海外贸易与朝贡", "b": "明代把海外贸易纳入朝贡框架，限制民间出海，贸易的政治意义大于经济意义。结果是国家失去了海上贸易的收益与信息。", "x": "把生意当礼仪做，最后两头都做不好。"}, {"e": "明·经济", "t": "明代土地兼并的后果", "b": "明代中后期土地向官僚、宗族、王府集中，自耕农减少，赋役负担转嫁，逃户增多，税基不断萎缩。", "x": "赋税一旦可以转嫁，压力就会落到最没有议价能力的人身上。"}, {"e": "明·经济", "t": "田赋、徭役与加派", "b": "明代农民的负担包括田赋、徭役与各类加派。每次战事或工程都可能带来新的加征，而加征一旦开始就很难撤回。", "x": "临时的加派，往往比正式税制更难取消。"}, {"e": "明·制度", "t": "明代的户籍与流动", "b": "明代户籍管理严格，但商业与手工业发展带来了人口流动，制度与现实之间的缝隙越来越大。", "x": "制度一旦追不上生活，执行就会变成选择性执法。"}, {"e": "明·制度", "t": "明代的地方财政", "b": "明代地方留存比例低，多数收入要上解中央，地方遇到灾荒与工程往往缺乏机动资金，只能加派或挪用。", "x": "没有余钱的地方政府，一遇事就只能向下要钱。"}, {"e": "明·军事", "t": "明代的军户与逃亡", "b": "军户世代服兵役，负担沉重，逃亡现象普遍。制度性的人口外流，往往是一个系统失效最早的信号。", "x": "当人们开始用脚投票，说明规则已经不合身了。"}, {"e": "明·制度", "t": "明代的驿递系统", "b": "明代驿站负责传递公文与接待官员，后期被大量私用，成为财政负担。李自成正是出身驿卒。", "x": "公共系统一旦被私用，就会先失去功能，再失去合法性。"}, {"e": "明·社会", "t": "明代的士绅与乡村", "b": "明代基层依靠里甲与士绅维持秩序，士绅承担教化、调解与救济的职能，与国家形成半合作的关系。", "x": "治理成本过高时，国家会把一部分责任留给社会自己。"}, {"e": "明·经济", "t": "明代的商业信用", "b": "明代出现了会票、典当、合伙等商业信用形式，晋商、徽商依靠同乡与宗族关系扩展网络。", "x": "信任可以靠关系替代制度运转一阵子，但很难扩张。"}, {"e": "明·制度", "t": "明代的漕运", "b": "明代漕粮依靠大运河从南方运往北京，漕军、河工、仓储构成庞大的体系。运河一旦淤塞或战乱，北京立刻吃紧。", "x": "首都的粮食，取决于一条河的水位。"}, {"e": "明·社会", "t": "明代的灾害与瘟疫", "b": "明代灾荒频繁，瘟疫流行，尤其明末华北地区。国家救济能力跟不上，社会自救与流民问题加剧。", "x": "灾荒考验的从来不是天，而是组织能力。"}, {"e": "明·文化", "t": "明代的书坊与出版", "b": "明代出版业发达，书坊刻印小说、戏曲、日用类书，知识向普通人扩散。", "x": "出版成本一下降，思想的下沉就挡不住了。"}, {"e": "明·文化", "t": "明代戏曲与社会", "b": "明代戏曲繁荣，传奇与杂剧在社会各层流行，内容常涉及家庭伦理与政治讽刺。", "x": "一个时代的故事会，往往是最真实的社会记录。"}, {"e": "明·文化", "t": "明代思想：心学与理学", "b": "王阳明提出心即理、知行合一、致良知，与朱熹的理学分庭抗礼。心学强调内在体验，对后来的思想解放影响很大。", "x": "把权威从外面搬回内心，往往会带来更大的思想空间。"}, {"e": "明·制度", "t": "明代的科举：八股文与榜下捉婿", "b": "八股文格式严格，考核内容固定。科举人数众多，落第者形成了庞大的读书人群体，成为社会变动中活跃的一部分。", "x": "制度把大量精英吸进来，也把大量人挡在门外。"}, {"e": "明·制度", "t": "明代的藩王：一个吃财政的群体", "b": "明代藩王有封地和俸禄，子孙繁衍，成为国家财政的沉重负担。宗室开支在明代后期急剧膨胀。", "x": "任何在册的特权群体，都会随时间自我膨胀。"}, {"e": "清", "t": "八旗不是军队，是社会组织", "b": "八旗把满洲人编成军事与民政合一的单位，旗人世代当兵领饷，不事生产。这套组织让几十万人的族群能高效动员，代价是形成很难拆解的身份集团，一直延续到清末。", "x": "把军事和社会捆在一起很高效，但也会造出难以改变的身份壁垒。"}, {"e": "《苦命天子》", "t": "咸丰不是昏君，他每天的批折量极大", "b": "茅海建写咸丰，最刺眼的不是他有多坏，而是他有多努力。他每天批阅奏折到深夜，事必躬亲，但他的信息来自一套层层修饰的奏报，判断的基础从源头就是歪的。", "x": "越勤奋的错判，代价越大，因为没人敢拦。"}, {"e": "清", "t": "清军入关，靠的是吴三桂开的门", "b": "1644 年李自成攻入北京、崇祯自尽，吴三桂在山海关引清军入关，共同击败李自成。清军以替明复仇的名义进入北京，随后迅速接管政权，而不是纯靠武力硬打下来。", "x": "政权更替时常有内部人开门，门一旦打开就关不回去了。"}, {"e": "《苦命天子》", "t": "皇帝面前没有一句真话，是怎么形成的", "b": "军机大臣报喜不报忧，前线将领虚报战功，层层相加后皇帝看到的是被修饰过的战局。等真相浮上来时，局面已经无法挽回。", "x": "信息的失真不是某个人撒谎，是一整套激励在起作用。"}, {"e": "清", "t": "剃发令：一道命令引发的全面抵抗", "b": "清廷要求汉人剃发编辫，口号是留头不留发、留发不留头。这道命令把原本可以妥协的征服，变成必须选择立场的对抗，江南各地因此爆发激烈抵抗。", "x": "让人在无法回头的象征上表态，会把中间派全推到对面。"}, {"e": "《苦命天子》", "t": "逃往热河：逃离的代价是失去反应能力", "b": "英法联军逼近北京，咸丰以巡幸为名去了承德，从此不再回京。距离远了，奏报更慢，判断更迟，朝中派系反而更活跃。", "x": "离开现场的那一刻，就已经放弃了对局面的控制。"}, {"e": "《苦命天子》", "t": "奕訢被留在北京：一个能干的人被推到前台又被打压", "b": "咸丰出逃时把奕訢留在北京办交涉，事后又忌惮他的声望。等到咸丰去世，奕訢在辛酉政变中重新掌权，又长年被慈禧压制。", "x": "有能力的人反复被用又被防，往往说明组织的信任机制坏了。"}, {"e": "清", "t": "迁界禁海：为了断郑成功，代价是沿海民生", "b": "清初为切断郑氏政权的补给，下令沿海居民内迁数十里，禁止出海。海防压力暂时缓解，但沿海渔农商贸几乎崩溃，恢复花了几十年。", "x": "为了安全切掉的，常常是更难重建的生计。"}, {"e": "清", "t": "《尼布楚条约》是中国第一次按国际法谈边界", "b": "1689 年中俄签订尼布楚条约，划定了东段边界，用拉丁文和满、俄文本，按对等谈判的方式完成。这是清廷少有的以平等姿态处理对外关系的案例。", "x": "有实力时按规则谈判，谈判结果才守得住。"}, {"e": "《苦命天子》", "t": "洋人是不是要抢大清的江山", "b": "咸丰朝的判断里，最要命的误读是把英法当成又来劫掠的北方蛮族，以为签完条约、给点银子和口岸就能打发。对方要的是常驻外交与条约体系。", "x": "把对手的目标判断错，所有应对都会打在空处。"}, {"e": "清", "t": "三藩之乱：一次差点掀翻新王朝的内战", "b": "吴三桂、尚可喜、耿精忠三个藩王掌控南方，康熙决定撤藩，引发八年战乱，波及十余省。清廷最终获胜，但暴露出用降将守边留下的隐患。", "x": "靠临时力量换来的稳定，迟早要还账。"}, {"e": "《苦命天子》", "t": "圆明园被烧，不只是因为谈判破裂", "b": "1860 年英法联军劫掠焚烧圆明园，导火索是谈判期间清廷扣押并虐待英法使团成员。惩罚性的破坏，也在向清廷示范一套新的力量语言。", "x": "一次谈判上的错误操作，代价可能是一座园子。"}, {"e": "《叫魂》", "t": "叫魂案里最可怕的不是妖术，是官僚的自我保护", "b": "1768 年江南流传有人剪人发辫、施术叫魂。案子从上往下推，地方官为了自保，宁可屈打成招也不肯上报说没这回事，最后演变成全国性的恐慌。", "x": "当一个系统里说没事比说有事风险更大，所有人都只会说有事。"}, {"e": "清", "t": "统一台湾：施琅与澎湖海战", "b": "1683 年施琅率水师在澎湖击败郑军，郑克塽投降，清朝设台湾府隶属福建。军事上是一次海战，政治上是把东南沿海纳入统一管辖。", "x": "关键节点上的胜负，往往决定几百年的格局。"}, {"e": "《叫魂》", "t": "乾隆为什么亲自抓一场地方上的妖术传闻", "b": "孔飞力指出，乾隆在意的不是妖术，而是这场传闻暴露出地方官在瞒他、汉人官员和族群之间的隔阂。借案子敲打官僚，是他维护控制的方式。", "x": "当权者追问的往往不是事件本身，而是谁在对他隐瞒。"}, {"e": "清", "t": "雅克萨之战：清军为什么打得这么吃力", "b": "两次雅克萨之战中，清军面对人数不多的哥萨克据守的堡垒，围攻数月才拿下。火器与工事的差距，在此时已经露出苗头。", "x": "在赢得漂亮的时候，往往最容易忽略正在拉开的差距。"}, {"e": "《叫魂》", "t": "冤案是怎么被生产出来的", "b": "审讯中被捕的人被反复逼问，供词越来越具体，细节越来越离奇，官员反而觉得更可信。冤案不是一两个人造的，是流程本身在造。", "x": "流程一旦奖励逼供，真相就成了最不重要的东西。"}, {"e": "清", "t": "多伦会盟：把蒙古纳入制度而不是只靠联姻", "b": "康熙在多伦与喀尔喀蒙古诸部会盟，编设旗制，确立清朝对漠北蒙古的管理。相比单纯联姻，制度化的编制更持久。", "x": "把关系写进制度里，比靠人情维系更久。"}, {"e": "清", "t": "摊丁入亩的前身：一条鞭法的思路延续", "b": "清朝在明代一条鞭法的基础上，把丁银摊入田赋，纳税跟着土地走。税基从人头转向土地，国家跟每个人的关系随之改变。", "x": "税制一变，国家和百姓的关系就跟着变。"}, {"e": "《叫魂》", "t": "谣言为什么在盛世最容易传", "b": "叫魂案发生在乾隆盛世中期，人口流动加剧、陌生人多、生计压力大。越是不安的社会，越容易相信身边的陌生人有超自然威胁。", "x": "谣言的土壤不是无知，是焦虑。"}, {"e": "清", "t": "九子夺嫡：康熙晚年的继承困局", "b": "康熙晚年诸皇子结党争夺储位，朝臣分裂，政务受影响。没有明确的继承规则，权力交接就必然演变成派系斗争。", "x": "继承制度不清晰，代价是整个朝廷的注意力。"}, {"e": "《大义觉迷录》", "t": "雍正把一份反清檄文公开了", "b": "雍正把曾静的谋反檄文连同自己的逐条批驳印成书，全国发行。他试图用说理回应指控，结果反而让普通人第一次读到那些指控的原文。", "x": "有时最有力的传播，是被反驳的那一方的反驳。"}, {"e": "《大义觉迷录》", "t": "乾隆为什么把父亲的书禁了", "b": "雍正死后，乾隆即位不久就下令收缴销毁《大义觉迷录》，禁止流传。父亲的公开辩论，被他视为把宫廷内幕暴露给了普通人。", "x": "上一代用来争理的方式，下一代可能只想抹掉。"}, {"e": "清", "t": "雍正为什么被骂得那么狠", "b": "雍正严苛、勤政、追缴亏空、整顿吏治，得罪了大批既得利益者，死后流言极多。改革者往往在任时就被写坏，评价要看他做成了什么。", "x": "被骂得最凶的人，可能恰恰在动最硬的骨头。"}, {"e": "清", "t": "密折制度：皇帝绕过整个官僚系统", "b": "雍正扩大密折制度，官员可以直接给皇帝上密报，内容不经上级。皇帝拿到更多真实信息，但官员之间互相监视，猜忌成为常态。", "x": "改变信息流的方向，就改变了权力的形状。"}, {"e": "《清代地方政府》", "t": "知县一个人管几十万人", "b": "瞿同祖的研究指出，清代一个县的正式编制里，官员只有知县、县丞等寥寥几人，大量事务靠书吏、衙役和师爷，这些人不在编制内，收入靠灰色地带。", "x": "人手不够又不给编制，实际上只能默许灰色收入。"}, {"e": "清", "t": "军机处：效率最高的机构，也最没有制约", "b": "雍正设立军机处，处理紧急军务，后来成为实际的中枢。它办事快、保密强，但完全依附皇帝，没有独立权力。", "x": "跑得最快的机构，往往也是最没有刹车的。"}, {"e": "《清代地方政府》", "t": "师爷为什么比官员更懂业务", "b": "刑名、钱谷师爷由官员私人聘请，熟悉律例和账目，实际承担了大量行政工作。他们不属国家编制，随时可以被解职。", "x": "真正撑着行政运转的人，常常不在这套体系的正式名单上。"}, {"e": "清", "t": "养廉银：用钱来解决贪腐", "b": "雍正推行养廉银，给官员远高于俸禄的补贴，希望以此减少贪腐。短期有效，但总督巡抚的开支和摊派依然存在，问题没有根除。", "x": "提高待遇能缓解症状，不改结构就治不了病根。"}, {"e": "《叫魂》《清代地方政府》", "t": "地方官为什么怕上报坏消息", "b": "地方官对上级负责，任何被认定失职的事都可能影响前途。在这种激励下，压下来、拖过去、找个替罪的人，往往比如实上报更安全。", "x": "考核只看结果时，隐瞒就成了理性的选择。"}, {"e": "清", "t": "摊丁入亩全覆盖：清代的财政底盘", "b": "雍正时摊丁入亩在全国推开，丁税并入地税，无地农民的负担减轻，人口登记随之宽松，清代人口在十八世纪大幅增长。", "x": "一项税制改动能悄悄改变一整个世纪的人口曲线。"}, {"e": "《停滞的帝国》", "t": "马戛尔尼的跪与不跪", "b": "1793 年英国使团来华，礼仪之争持续多日，最终双方各退一步。真正的问题不在跪姿，而在于两边对这场见面是什么性质，理解完全不同。", "x": "看起来是礼节之争，实质是两套世界秩序的碰撞。"}, {"e": "《停滞的帝国》", "t": "使团看到的清军：装备落后但人数惊人", "b": "使团沿途记录清军的火绳枪、弓箭与号衣，认为装备落后但仍是一支庞大的军队。几十年前，这种判断还会被认为荒谬。", "x": "看得见的落后，通常只是在别处已经跑出很远之后才被发现。"}, {"e": "清", "t": "改土归流：把土司换成流动的官", "b": "雍正年间在西南推行改土归流，废除世袭土司，改派流动的流官。中央对边疆的控制加强，但过程中的冲突与反抗也不少。", "x": "把世袭换成可替换的，才能真正收进中央。"}, {"e": "清", "t": "乾隆的十全武功，账怎么算", "b": "乾隆自述十全武功，包括平准噶尔、定回部、征缅甸、安南等。疆域达到极盛，代价是财政消耗巨大，部分战役打得相当勉强。", "x": "把战果集中宣传，容易掩盖付出的成本。"}, {"e": "《停滞的帝国》", "t": "被退回的礼物：清廷看不上的是什么", "b": "英方带来的天文仪器、火器、钟表，被当作贡品收下，却没被当作技术去研究。对新技术没有需求感，是最难改变的状态。", "x": "不觉得需要，才是最深的封闭。"}, {"e": "清", "t": "《四库全书》：最大的典籍工程，也是最大的一次筛选", "b": "乾隆修《四库全书》，收录三千多种书，同时大量禁毁被认为有问题的著作。整合知识的同时，也在决定哪些知识不该被记住。", "x": "整理和删除，往往在同一项工程里完成。"}, {"e": "《天朝的崩溃》", "t": "清军在鸦片战争里到底输在哪里", "b": "茅海建的计算显示，清军火炮射程短、炮弹质量差、指挥分散，各口岸省份之间几乎无法协同。英军则可以沿海快速机动、集中优势兵力。", "x": "在体系级的差距面前，个体的勇敢解决不了问题。"}, {"e": "清", "t": "文字狱：清代思想最紧的几十年", "b": "康雍乾三朝文字狱频发，一句诗、一个别号都可能招祸。读书人转向考据与经学，避开时政议论。", "x": "当表达的风险太高，创新会转向安全的地方。"}, {"e": "《天朝的崩溃》", "t": "皇帝拿到的战报，和战场是两回事", "b": "前线给皇帝的奏报常常夸大胜果、缩小损失，导致决策层对战局判断严重偏差。林则徐被撤职，很大程度是因为这些失真的信息。", "x": "判断的基础一错，再正确的方法也救不回来。"}, {"e": "《天朝的崩溃》", "t": "三元里抗英：民间的力量与官府的顾虑", "b": "广州三元里民众自发抗击英军，规模不小。但清廷对民间武装始终警惕，事后遣散。对内部稳定的顾虑，常常压过对外部的抵抗。", "x": "既要用民间的力量，又怕这股力量，这种矛盾反复出现。"}, {"e": "清", "t": "广州十三行：唯一对外的窗口", "b": "乾隆时规定西洋贸易只能通过广州，由十三行商人代理。贸易被集中管理，方便控制，也让信息和技术输入变得极其有限。", "x": "把门留成一条缝，进来的东西也就只有那么一点。"}, {"e": "《天朝的崩溃》", "t": "签订《南京条约》的人并不认为那是卖国", "b": "当时谈判的官员认为自己只是按皇帝的指示结束一场打不赢的战争，并没有意识到条约体系的长远含义。认知上的落后，往往比态度更致命。", "x": "很多错误的决定，当时的人并不觉得错。"}, {"e": "清", "t": "马戛尔尼访华：两个世界第一次正面碰撞", "b": "1793 年英国使团来华，请求扩大通商，清廷按朝贡礼仪接待，拒绝了请求。双方都没听懂对方在说什么，代价在几十年后支付。", "x": "沟通失败往往不是谈崩了，而是从头就没在同一个频道上。"}, {"e": "清", "t": "大小金川：一场花掉巨款的边地战争", "b": "乾隆两次用兵大小金川，地形险恶、碉楼坚固，清军伤亡与军费消耗巨大。这是盛世里最费钱的一场战争。", "x": "账面繁荣底下，总有一笔被忽略的开支。"}, {"e": "《皇帝的影子》", "t": "皇权越集中，信息就越难上传", "b": "清代皇权高度集中，所有重要决策都需要皇帝批红。但信息传递的环节越多，修饰就越多，皇帝反而更难看到真实情况。", "x": "越往上的权力，越依赖下面的人愿不愿意说实话。"}, {"e": "《清代国家与社会》", "t": "仓储与赈灾：清代的救命系统", "b": "清代在各地设常平仓、社仓、义仓，用于平抑粮价与灾荒救济。这套系统在太平天国之后大量废弛，一旦出事，底层几乎没有缓冲。", "x": "一个系统的韧性，往往体现在它最不起眼的仓库里。"}, {"e": "清", "t": "土尔扈特东归：一场横跨草原的大迁徙", "b": "伏尔加河流域的土尔扈特部因沙俄压迫决定东归，历时数月、损失惨重，最终抵达伊犁，被清廷接纳安置。", "x": "一个群体选择去哪里，往往能说明它在那里过不下去。"}, {"e": "清", "t": "白莲教起义：盛世末尾的第一道裂缝", "b": "嘉庆初年白莲教起义波及数省，清廷调集大量兵力镇压，耗时九年，军费消耗严重。这场战争标志清朝由盛转衰。", "x": "转折点常常出现在看起来最安稳的时候。"}, {"e": "《清代国家与社会》", "t": "蠲免：皇帝免税背后的政治账", "b": "清代多次大规模蠲免钱粮，减免灾区或全国赋税。这既是救济，也是塑造仁君形象的手段，而实际执行往往被地方层层截留。", "x": "给出去的东西，先经过多少双手，决定了最后能到哪。"}, {"e": "《叫魂》", "t": "口供里的普通人：他们只是被记录的那一面", "b": "清代审案档案里留下了大量普通人供词，多是些家长里短、邻里纠纷。这是少数能看到底层人声音的材料，但它来自审讯，本身就带着压力。", "x": "史料里能读到的人，大多是被人追问时说的话。"}, {"e": "清", "t": "和珅跌倒，嘉庆吃饱", "b": "乾隆晚年宠信和珅，贪腐积累巨大；嘉庆即位后查抄和珅家产，数额震惊朝野。抄家能补一时国库，补不了制度上的漏洞。", "x": "靠抄一个人救急，说明问题不在那个人身上。"}, {"e": "清·嘉道", "t": "嘉道中衰：一个王朝的缓慢漏气", "b": "嘉庆、道光两朝没有大的战乱，却问题频出：吏治腐败、财政紧张、河道失修、白银外流。表面平稳，底下的缓冲垫一点点被磨薄。", "x": "衰落很少是突然发生的，更多是缓冲余地一点一点被耗掉。"}, {"e": "《清代学术概论》", "t": "考据学为什么在清代这么发达", "b": "乾嘉学派做训诂、校勘、辨伪，方法严谨，成果巨大。梁启超认为这与文字狱的高压有关：学者把精力放在安全且可验证的领域。", "x": "环境的限制，会把才华挤到它允许的方向去。"}, {"e": "《清代学术概论》", "t": "汉学与宋学的对立", "b": "清代学者以汉学（训诂考据）对抗宋学（义理解释），强调回到文本本身。这场争论不只是学术分歧，也是对解释权的争夺。", "x": "学术方法之争，背后常常是关于谁有权力解释世界。"}, {"e": "清·道光", "t": "白银外流：鸦片背后的货币危机", "b": "十九世纪初英国向中国大量输入鸦片，中国白银持续外流，银贵钱贱，农民实际税负加重。鸦片问题首先是经济问题，不只是道德问题。", "x": "看起来是风气的问题，算下来往往是账的问题。"}, {"e": "《洪业》", "t": "明清易代不是一次征服，是两个精英集团的合流", "b": "魏斐德强调，清朝能建立统治，依靠了大量汉族士绅的合作，包括地方秩序重建与赋税体系。征服者需要被征服者的治理能力。", "x": "能坐稳的政权，通常是把原来的精英吸纳进来，而不是全换掉。"}, {"e": "清·道光", "t": "林则徐禁烟：一次坚决但不彻底的行动", "b": "1839 年林则徐在虎门销毁两万余箱鸦片，态度坚决。但他和清廷对英国的反应估计不足，也没有相应军备作为后盾。", "x": "决心可以快，配套的能力不会跟着决心一起长出来。"}, {"e": "清·道光", "t": "定海、镇江：清军为什么打不过", "b": "鸦片战争中英军舰队沿海机动，清军火炮射程短、指挥分散，各口岸之间难以互相支援。战争暴露的是体系差距，不是勇气差距。", "x": "在体系级别的差距面前，个体的勇敢解决不了问题。"}, {"e": "《洪业》", "t": "江南为什么抵抗得那么惨烈", "b": "剃发令之后，江南各地发生大规模抵抗，许多城市被屠。抵抗的激烈程度，与当地士绅的文化认同和宗族组织密切相关。", "x": "越是自成一套秩序的地方，越难接受外来的强制改变。"}, {"e": "清·道光", "t": "《南京条约》：中国近代第一个不平等条约", "b": "1842 年条约规定割让香港岛、赔款两千一百万银元、开放五口通商、协定关税。协定关税这一条影响最深远，中国失去了自主定税的权力。", "x": "最伤人的条款往往不在明面上的赔款里。"}, {"e": "《洪业》", "t": "地方秩序靠谁来维持", "b": "明清之际，地方绅士在战乱中组织团练、赈济、修城，实际承担了政府无力覆盖的职能。政权更替时，这批人往往决定了地方的归属。", "x": "中央更替的时候，地方秩序靠的是那些不出名的人。"}, {"e": "《太平天国》", "t": "洪秀全的宗教想象是怎么形成的", "b": "洪秀全多次乡试不中，一场大病后读到基督教小册子，把自己的幻觉解释成上天授命。个人挫折与外来文本结合，成了运动的起点。", "x": "能点燃很多人的，往往是一个人无处安放的挫败。"}, {"e": "清·咸丰", "t": "《瑷珲条约》与东北的失地", "b": "1858 年沙俄趁第二次鸦片战争之机，迫使黑龙江将军奕山签订瑷珲条约，割去黑龙江以北六十多万平方公里土地。", "x": "别人打仗的时候，最容易在旁边丢东西。"}, {"e": "《太平天国》", "t": "南京改名为天京之后发生的事", "b": "太平天国定都南京后迅速建立起一套等级森严的王府制度，与最初宣导的平等形成强烈反差。组织的现实会很快压过口号。", "x": "理想主义组织一旦掌权，往往比旧体制更快长出等级。"}, {"e": "清·咸丰", "t": "《天津条约》《北京条约》：更多的开口与权限", "b": "第二次鸦片战争后，清政府签订天津条约与北京条约，增开商埠、允许公使驻京、允许传教、割让九龙司。外国势力从沿海进入首都。", "x": "让步一旦形成惯例，就会变成下一轮谈判的起点。"}, {"e": "《太平天国》", "t": "为什么太平天国没能赢得士绅", "b": "太平天国反孔、毁庙、改变文字与礼制，直接触动了士绅的文化与利益根基。失去这一层支持，基层治理几乎无从建立。", "x": "想改造一个社会，绕不开那个社会里最会办事的人。"}, {"e": "清·咸丰", "t": "咸丰为什么觉得自己委屈", "b": "咸丰继位就撞上太平天国与英法联军，勤于批折却一再误判。他继承的是一套已经无法应对新局面的制度，个人的勤勉顶不住整体的失灵。", "x": "一个人的努力，填不平一整个体系的窟窿。"}, {"e": "《怀柔远人》·何伟亚", "t": "朝贡礼仪不是表演，是一套秩序声明", "b": "何伟亚指出，马戛尔尼访华中的礼仪安排，在清廷看来是确认天下秩序的程序，而非单纯的礼节。英方只看到侮辱，没看到这层意思。", "x": "误解对方的仪式，往往等于误解对方的世界观。"}, {"e": "清·咸丰", "t": "逃往热河：皇帝一走，中枢就空了", "b": "1860 年英法联军逼近北京，咸丰逃往承德，留下奕訢在京议和。皇帝离开政治中心，决策与信息都变得迟滞。", "x": "关键人物离场，组织就会陷入没有主心骨的等待。"}, {"e": "《中华帝国晚期的叛乱及其敌人》", "t": "团练：清廷把军事权力借给了地方", "b": "太平天国时期，清廷允许地方士绅组织团练自保。这解决了燃眉之急，也让地方掌握了军队、财政与人事，中央权威随之削弱。", "x": "危机时借出去的力量，往往很难收回来。"}, {"e": "清·咸丰", "t": "辛酉政变：慈禧上台的那一年", "b": "咸丰死后，肃顺等八大臣辅政，慈禧与恭亲王奕訢联手发动政变，肃顺被处死，两宫垂帘听政。晚清半个世纪的政治格局在此定型。", "x": "权力交接的瞬间，决定后面几十年的走向。"}, {"e": "《叫魂》·孔飞力", "t": "专制权力与常规权力：两套机制在博弈", "b": "孔飞力区分皇帝的专制权力和官僚的常规权力。叫魂案中，皇帝借非常规手段绕过官僚系统直接施压，最终又在官僚的拖延中不了了之。", "x": "同一个体制里，往往有两套规则在互相消耗。"}, {"e": "清·咸丰", "t": "太平天国：一场持续十四年的内战", "b": "1851 年洪秀全在金田起义，建号太平天国，攻下南京后改名天京，控制大半个江南。清廷的正规军屡战屡败，只能依靠地方团练。", "x": "正规军打不动的仗，最后交给了体制外的力量。"}, {"e": "清·咸丰", "t": "圣库制度：能打仗，不能治国", "b": "太平天国推行圣库制，财产充公、统一分配，在战争时期能集中资源，但长期无法激励生产，占领区的经济很快难以为继。", "x": "能动员的制度，不等于能持续运转的制度。"}, {"e": "清·咸丰", "t": "天京事变：内部一刀比外部更致命", "b": "1856 年天京内部权力斗争激化，杨秀清被杀，韦昌辉又被处死，石达开率部出走。太平天国元气大伤，从此由盛转衰。", "x": "撑得住外部压力，未必撑得住内部的账。"}, {"e": "清·咸丰", "t": "湘军：体制外的军队救了体制", "b": "曾国藩以书生带兵，招募同乡、自筹军饷，湘军成为平定太平天国的主力。军队由地方组织起来，中央对军权的垄断就此松动。", "x": "到了危急时刻借来的力量，事后不容易收回。"}, {"e": "清·咸丰", "t": "厘金：一个临时税种活了几十年", "b"
