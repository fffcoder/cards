<style>
/* ==========================================================================
   历史文章集 · 样式
   ========================================================================== */

:root {
  --bg: #0e0d0b;
  --fg: #f0e9de;
  --fg-body: #c3b9ab;
  --fg-dim: #8b8073;
  --fg-faint: #5b544b;
  --accent: #d9bf8a;
  --line: rgba(217, 191, 138, .13);
  --card: #191613;
  --radius: 16px;
  --ease: cubic-bezier(.22, .9, .3, 1);
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(14, 13, 11, .86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, .05);
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .04em;
  white-space: nowrap;
}
.brand small {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--fg-faint);
  letter-spacing: .1em;
  margin-top: 2px;
}

#backBtn {
  display: none;
  background: none;
  border: none;
  color: var(--accent);
  font-family: inherit;
  font-size: 15px;
  padding: 6px 8px 6px 0;
  cursor: pointer;
}
body.reading #backBtn { display: block; }
body.reading .brand { display: none; }

/* 搜索 */
.search {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, .055);
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .05) inset;
}
.search svg { flex: 0 0 auto; opacity: .45; }
#q {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  outline: none;
  color: var(--fg);
  font-family: inherit;
  font-size: 15px;
}
#q::placeholder { color: var(--fg-faint); }
#clearBtn {
  display: none;
  background: rgba(255, 255, 255, .1);
  border: none;
  color: var(--fg-dim);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
}
#clearBtn.on { display: block; }
body.reading .search { display: none; }

/* ---------- 列表 ---------- */
#list {
  padding: 12px 16px calc(env(safe-area-inset-bottom) + 32px);
}

.art {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: none;
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  margin-bottom: 10px;
  color: var(--fg);
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .045) inset;
  transition: background .16s ease, transform .12s var(--ease);
}
.art:active { background: #201c18; transform: scale(.995); }

.art .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--fg-dim);
  margin-bottom: 8px;
}
.art .meta .sep { color: #3f3a33; }

.art h2 {
  margin: 0 0 6px;
  font-size: 17px;
  line-height: 1.45;
  font-weight: 600;
  letter-spacing: -.002em;
}

.art .sub {
  margin: 0 0 10px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--fg-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.art .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.art .tag {
  font-size: 11px;
  color: #9a8f80;
  background: rgba(255, 255, 255, .05);
  border-radius: 6px;
  padding: 3px 7px;
  letter-spacing: .04em;
}

.empty {
  text-align: center;
  color: var(--fg-faint);
  font-size: 14px;
  padding: 48px 20px;
}

/* ---------- 搜索结果高亮 ---------- */
mark {
  background: rgba(217, 191, 138, .28);
  color: var(--fg);
  border-radius: 3px;
  padding: 0 1px;
}

.snippet {
  margin: 8px 0 0;
  font-size: 12.5px;
  line-height: 1.7;
  color: #9d9284;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ---------- 阅读页 ---------- */
#reader {
  display: none;
  padding: 20px 20px calc(env(safe-area-inset-bottom) + 56px);
  max-width: 680px;
  margin: 0 auto;
}
body.reading #list { display: none; }
body.reading #reader { display: block; }

#reader .era {
  font-size: 11px;
  letter-spacing: .17em;
  color: var(--fg-dim);
  margin-bottom: 12px;
}

#reader h1 {
  font-size: 26px;
  line-height: 1.4;
  font-weight: 650;
  letter-spacing: -.01em;
  margin: 0 0 12px;
}

#reader .lede {
  font-size: 15px;
  line-height: 1.8;
  color: var(--fg-dim);
  margin: 0 0 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

#reader .body {
  font-size: 16.5px;
  line-height: 1.9;
  color: var(--fg-body);
  letter-spacing: .006em;
}

#reader .body h2 {
  font-size: 19px;
  line-height: 1.5;
  color: var(--fg);
  font-weight: 600;
  margin: 34px 0 14px;
  padding-left: 12px;
  border-left: 3px solid rgba(217, 191, 138, .45);
}
#reader .body h3 {
  font-size: 16.5px;
  color: var(--fg);
  font-weight: 600;
  margin: 24px 0 10px;
}
#reader .body p { margin: 0 0 18px; }
#reader .body strong { color: #ede4d6; font-weight: 600; }

#reader .body ul,
#reader .body ol {
  margin: 0 0 18px;
  padding-left: 22px;
}
#reader .body li { margin-bottom: 8px; }

#reader .body blockquote {
  margin: 0 0 18px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, .03);
  border-left: 2px solid rgba(217, 191, 138, .35);
  border-radius: 0 8px 8px 0;
  color: var(--fg-dim);
  font-size: 15px;
}

#reader .body hr {
  border: none;
  border-top: 1px solid var(--line);
  margin: 30px 0;
}

#reader .body a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid rgba(217, 191, 138, .3);
}

#reader .body code {
  background: rgba(255, 255, 255, .06);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: .9em;
}

.reading-meta {
  margin-top: 36px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--fg-faint);
  letter-spacing: .06em;
}

/* 阅读进度条 */
#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  width: 0;
  background: var(--accent);
  z-index: 20;
  opacity: 0;
  transition: opacity .2s ease;
}
body.reading #progress { opacity: .75; }

@media (max-width: 360px) {
  #reader .body { font-size: 16px; }
  #reader h1 { font-size: 23px; }
}

</style>

<script>
window.__ARTICLES__ = [{"id": "001-jiaohun", "title": "1768：一场由官僚自保催生的全国冤案", "subtitle": "从《叫魂》看专制权力、官僚理性与底层恐惧如何共同制造恐慌", "era": "清·乾隆", "tags": ["清代", "社会史", "官僚制", "孔飞力"], "date": "2026-11-28", "html": "<h2>一、德清县，一个修水闸的木匠</h2>\n<p>乾隆三十三年春天，浙江德清县城外，几个木匠在修一座水闸。</p>\n<p>这一带有个说法：木匠会把人的名字写在纸片上，打进桥桩，借修桥的法术摄人魂魄。被摄的人会生病，会死。这种法术叫\"叫魂\"。</p>\n<p>一个叫沈士良的农民找到了木匠吴东明。沈士良和自己的两个侄子有仇，他想请吴东明把侄子的名字打进桥桩。</p>\n<p>吴东明拒绝了。然后他去报了官。</p>\n<p>按说事情到这里就完了。沈士良挨了打，吴东明接着修水闸，德清县的春天照常过去。</p>\n<p>但它没有。</p>\n<p>到那年夏天，山东、江苏、直隶的衙门里挤满了人，罪名大同小异：剪人发辫，施行妖术。到秋天，军机处奉旨审结，说全案查无实据。这时已经有几十个人死在狱里。</p>\n<p>这件事距离德清县那座水闸，是一千多里。</p>\n<h2>二、谣言走在运河上</h2>\n<p>把各地报上来的案子按时间排一排，会发现一条很清楚的路线：德清、杭州、苏州、扬州、山东、直隶。</p>\n<p>这条线跟大运河几乎重合。</p>\n<p>十八世纪中叶的江南，是当时世界上人口最稠密的地区之一。康熙末年，全国大约一亿五千万人；到乾隆末年，这个数字接近三亿。人多，地不够，很多人离开土地，成了流动的人。</p>\n<p>大运河两头连着粮仓和京城。运粮的船、做买卖的商人、赶考的士子、找活计的工匠，都在同一条水路上走。一条传闻上了船，跟着往北，几天就能换一个省。</p>\n<p>被指认的人里，有很大一部分是这样一些人：游方的和尚、走街的乞丐、剃头的匠人、四处卖艺的。他们没有本地户籍，住在庙里或客栈，身边没有亲族，也没有能替他们担保的人。</p>\n<p>有个案子在山东。一个叫觉性的和尚被抓，罪名是剪人发辫。审讯时他说自己只是个走方和尚，不认识举报他的人。这话在当时没什么用——没有保人，就等于没有身份；没有身份，就等于可以被怀疑。</p>\n<h2>三、富尼汉的那本账</h2>\n<p>最先上折子的是山东巡抚富尼汉。</p>\n<p>他抓了人，审了，然后把案子报上去。奏折写得很有分寸，先叙述听说的情况，再说自己如何追查，最后说\"事关重大，不敢隐匿\"。</p>\n<p>这句\"不敢隐匿\"，把一种处境说得很清楚。</p>\n<p>如果富尼汉在折子里写\"查无此事\"，会是什么结果？乾隆面前摆着的是一份密报，说山东出了妖术；接着一份来自山东的奏折，说山东没有妖术。皇帝多半不会觉得山东太平，只会觉得这个巡抚要么无能，要么在瞒他。</p>\n<p>所以富尼汉的选择其实只有一种。写\"有\"，他是尽职的；写\"没有\"，他要冒失职的风险。<strong>风险不对称，判断就会歪。</strong></p>\n<p>案子一旦报成\"有\"，下级就跟着办。审讯要用刑，因为妖术按重案办，重案可以用刑。被捕的人在刑下供出更多的人名，于是又抓人，再审，再供。供词越来越详细：什么时辰、什么地点、用的什么东西、摄走谁的魂魄。越详细，上面越相信。</p>\n<p>江苏、直隶的地方官也陆续上折子，说同样的事。没有谁在撒谎，也没有谁特别贪婪。<strong>每个人都做了对自己最安全的选择，加在一起，产出的却是一件根本不存在的事。</strong></p>\n<h2>四、承德的一封信</h2>\n<p>案子的规模，是皇帝给的。</p>\n<p>乾隆在承德避暑山庄读到山东的密报，很快下了谕旨。此后的几个月里，谕旨一道接一道，语气一次比一次重。他要求各省严查，要求把拿获的人解京审问，甚至对已经查明的案子也要求\"再行严讯\"。</p>\n<p>孔飞力注意到一个细节：这些谕旨里反复出现的，不是\"妖术可恨\"，而是\"各省督抚何以并不奏闻\"。</p>\n<p>皇帝真正不安的，是江南的官员和士绅关系太近，近到可能一起瞒着他。妖术案给了他一个机会，让整个官僚系统为他一件事转起来，转得越快，越能看出谁是主人。</p>\n<p>还有一层。剪的是发辫。清朝初年为了剃发令杀过很多人，辫子从那时起就不只是头发。妖术专剪发辫这件事，在皇帝看来不可能只是一个乡下人的迷信。</p>\n<h2>五、收场的人是官僚</h2>\n<p>有意思的是，最后把这件案子结束掉的，还是那批皇帝不太信任的人。</p>\n<p>负责审理的是军机处。几位大臣把解京的人犯逐一过堂，反复复核，发现供词互相冲突，很多根本是刑讯之下编出来的。他们没有正面顶撞，只是把案子一件一件往回收。到了秋天，军机处奏报，称各案均无实据。</p>\n<p>乾隆接受了这个结果。此后谕旨不再提。地方上也渐渐安静下来。</p>\n<p>一个高度集权的体制，可以用一纸谕旨发动一场席卷十二省的运动；但要停下来，仍然要靠它平时最不放心的那套常规机器。孔飞力在书里把这一对关系叫做\"专制权力\"和\"常规权力\"：前者可以无限扩张，但要落地，总要经过后者。</p>\n<h2>六、后来的争论</h2>\n<p>《叫魂》出版于 1990 年，三十多年来讨论不断。</p>\n<p>有人说孔飞力把乾隆想得太聪明、太有逻辑了。真实的皇帝可能只是焦躁、信息不全、脾气上来了，未必是在下一盘大棋。</p>\n<p>也有人重新统计过案件分布，认为孔飞力手上的样本集中在几个省，全国的实际规模可能被高估；而且清代刑科题本里涉及\"邪术\"的案子本来就多，与民间信仰日常纠缠，不好都算进同一场恐慌。</p>\n<p>还有一种看法更看重底下那层：十八世纪的人口压力、粮价波动、地方社会失序，这才是恐慌的土壤。皇权动员只是火柴，柴堆是早就堆好的。</p>\n<p>这些争论没有推翻这本书。反倒是因为它把\"制度如何生产事实\"这个问题放在了一个材料极好的案子上，才经得起一遍遍地重新翻检。</p>\n<h2>七、几个可以自己想的问题</h2>\n<p>我看完这本书，最放不下的不是乾隆，是富尼汉。他写那句\"不敢隐匿\"的时候，大概知道自己抓的人未必真有问题。</p>\n<p>如果你坐在 1768 年山东巡抚的位置上，手里就是那份密报，你会怎么落笔？</p>\n<p>\"报有比报无安全\"这件事，在今天的机构里还剩下多少？它换成了什么样子？</p>\n<p>还有一层：整件事的材料，都是审讯时留下来的。人在刑具前说的话，怎么拿来当历史用？</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>孔飞力：《叫魂：1768年中国妖术大恐慌》，陈兼、刘昶译，上海三联书店，1999 年。</li>\n<li>《清高宗实录》卷八一二至八一六，乾隆三十三年相关谕旨。</li>\n<li>《宫中档乾隆朝奏折》，台北故宫博物院藏。</li>\n<li>中国人民大学清史研究所编：《清史编年》第五卷，中国人民大学出版社。</li>\n<li>关于人口背景，参看何炳棣《明初以降人口及其相关问题》。</li>\n</ol>", "text": "一、德清县，一个修水闸的木匠\n乾隆三十三年春天，浙江德清县城外，几个木匠在修一座水闸。\n这一带有个说法：木匠会把人的名字写在纸片上，打进桥桩，借修桥的法术摄人魂魄。被摄的人会生病，会死。这种法术叫\"叫魂\"。\n一个叫沈士良的农民找到了木匠吴东明。沈士良和自己的两个侄子有仇，他想请吴东明把侄子的名字打进桥桩。\n吴东明拒绝了。然后他去报了官。\n按说事情到这里就完了。沈士良挨了打，吴东明接着修水闸，德清县的春天照常过去。\n但它没有。\n到那年夏天，山东、江苏、直隶的衙门里挤满了人，罪名大同小异：剪人发辫，施行妖术。到秋天，军机处奉旨审结，说全案查无实据。这时已经有几十个人死在狱里。\n这件事距离德清县那座水闸，是一千多里。\n二、谣言走在运河上\n把各地报上来的案子按时间排一排，会发现一条很清楚的路线：德清、杭州、苏州、扬州、山东、直隶。\n这条线跟大运河几乎重合。\n十八世纪中叶的江南，是当时世界上人口最稠密的地区之一。康熙末年，全国大约一亿五千万人；到乾隆末年，这个数字接近三亿。人多，地不够，很多人离开土地，成了流动的人。\n大运河两头连着粮仓和京城。运粮的船、做买卖的商人、赶考的士子、找活计的工匠，都在同一条水路上走。一条传闻上了船，跟着往北，几天就能换一个省。\n被指认的人里，有很大一部分是这样一些人：游方的和尚、走街的乞丐、剃头的匠人、四处卖艺的。他们没有本地户籍，住在庙里或客栈，身边没有亲族，也没有能替他们担保的人。\n有个案子在山东。一个叫觉性的和尚被抓，罪名是剪人发辫。审讯时他说自己只是个走方和尚，不认识举报他的人。这话在当时没什么用——没有保人，就等于没有身份；没有身份，就等于可以被怀疑。\n三、富尼汉的那本账\n最先上折子的是山东巡抚富尼汉。\n他抓了人，审了，然后把案子报上去。奏折写得很有分寸，先叙述听说的情况，再说自己如何追查，最后说\"事关重大，不敢隐匿\"。\n这句\"不敢隐匿\"，把一种处境说得很清楚。\n如果富尼汉在折子里写\"查无此事\"，会是什么结果？乾隆面前摆着的是一份密报，说山东出 <script>
/* ==========================================================================
   历史文章集 · 逻辑
   列表 + 阅读页 + 全局搜索
   ========================================================================== */

const ARTS = window.__ARTICLES__ || [];
const LS_READ = 'articles.read.v1';

const listEl = document.getElementById('list');
const readerEl = document.getElementById('reader');
const qEl = document.getElementById('q');
const clearBtn = document.getElementById('clearBtn');
const backBtn = document.getElementById('backBtn');
const progressEl = document.getElementById('progress');

let currentId = null;

/* ---------- 已读记录 ---------- */
function readSet() {
  try {
    const a = JSON.parse(localStorage.getItem(LS_READ) || '[]');
    return new Set(Array.isArray(a) ? a : []);
  } catch (e) { return new Set(); }
}
function markRead(id) {
  const s = readSet();
  s.add(id);
  try { localStorage.setItem(LS_READ, JSON.stringify([...s])); } catch (e) {}
}

/* ---------- 高亮 ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function highlight(text, terms) {
  let out = esc(text);
  if (!terms.length) return out;
  terms.forEach(t => {
    if (!t) return;
    const safe = esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(safe, 'gi'), m => '<mark>' + m + '</mark>');
  });
  return out;
}

/* ---------- 搜索 ---------- */
function tokenize(q) {
  return q.trim().toLowerCase().split(/\s+/).filter(Boolean);
}

/** 在正文里取包含关键词的一小段 */
function snippet(a, terms) {
  if (!terms.length) return '';
  const lower = a.text.toLowerCase();
  let idx = -1;
  for (const t of terms) {
    idx = lower.indexOf(t);
    if (idx >= 0) break;
  }
  if (idx < 0) return '';
  const start = Math.max(0, idx - 34);
  const end = Math.min(a.text.length, idx + 80);
  return (start > 0 ? '…' : '') + a.text.slice(start, end) + (end < a.text.length ? '…' : '');
}

function score(a, terms) {
  if (!terms.length) return 1;
  const title = a.title.toLowerCase();
  const sub = a.subtitle.toLowerCase();
  const tags = a.tags.join(' ').toLowerCase();
  const era = a.era.toLowerCase();
  const text = a.text.toLowerCase();
  let s = 0;
  for (const t of terms) {
    let hit = 0;
    if (title.includes(t)) hit += 10;
    if (sub.includes(t)) hit += 5;
    if (tags.includes(t)) hit += 6;
    if (era.includes(t)) hit += 5;
    if (text.includes(t)) hit += 1;
    if (!hit) return 0; // 所有词都要出现
    s += hit;
  }
  return s;
}

/* ---------- 列表渲染 ---------- */
function renderList() {
  const terms = tokenize(qEl.value);
  const read = readSet();

  const items = ARTS
    .map(a => ({ a, s: score(a, terms) }))
    .filter(x => x.s > 0)
    .sort((x, y) => (terms.length ? y.s - x.s : 0) || (y.a.date > x.a.date ? 1 : -1));

  if (!items.length) {
    listEl.innerHTML = '<div class="empty">没有找到相关文章<br>试试换个词，比如「叫魂」「官僚」「鸦片」</div>';
    return;
  }

  listEl.innerHTML = items.map(({ a }) => {
    const snip = snippet(a, terms);
    return `<button class="art" data-id="${a.id}">
      <div class="meta">
        <span>${highlight(a.era, terms)}</span>
        <span class="sep">·</span>
        <span>${a.words} 字</span>
        ${read.has(a.id) ? '<span class="sep">·</span><span>已读</span>' : ''}
      </div>
      <h2>${highlight(a.title, terms)}</h2>
      ${a.subtitle ? `<p class="sub">${highlight(a.subtitle, terms)}</p>` : ''}
      ${snip ? `<p class="snippet">${highlight(snip, terms)}</p>` : ''}
      <div class="tags">${a.tags.map(t => `<span class="tag">${highlight(t, terms)}</span>`).join('')}</div>
    </button>`;
  }).join('');

  listEl.querySelectorAll('.art').forEach(btn => {
    btn.onclick = () => openArticle(btn.dataset.id);
  });
}

/* ---------- 阅读页 ---------- */
function openArticle(id) {
  const a = ARTS.find(x => x.id === id);
  if (!a) return;
  currentId = id;

  readerEl.innerHTML = `
    <div class="era">${esc(a.era)}</div>
    <h1>${esc(a.title)}</h1>
    ${a.subtitle ? `<p class="lede">${esc(a.subtitle)}</p>` : ''}
    <div class="body">${a.html}</div>
    <div class="reading-meta">${a.words} 字 · ${a.tags.map(t => '#' + t).join(' ')}</div>
  `;

  document.body.classList.add('reading');
  window.scrollTo(0, 0);
  markRead(id);
  history.pushState({ id }, '', '#' + id);
  updateProgress();
}

function closeArticle(fromPop) {
  document.body.classList.remove('reading');
  readerEl.innerHTML = '';
  currentId = null;
  progressEl.style.width = '0';
  renderList();
  if (!fromPop) {
    history.pushState({}, '', location.pathname + location.search);
  }
  window.scrollTo(0, 0);
}

backBtn.onclick = () => {
  if (history.state && history.state.id) history.back();
  else closeArticle();
};

window.addEventListener('popstate', e => {
  if (e.state && e.state.id) openArticle(e.state.id);
  else if (document.body.classList.contains('reading')) closeArticle(true);
});

/* ---------- 阅读进度 ---------- */
function updateProgress() {
  if (!document.body.classList.contains('reading')) return;
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? Math.min(1, window.scrollY / h) : 0;
  progressEl.style.width = (p * 100) + '%';
}
window.addEventListener('scroll', updateProgress, { passive: true });

/* ---------- 搜索交互 ---------- */
let t = null;
qEl.addEventListener('input', () => {
  clearBtn.classList.toggle('on', !!qEl.value);
  clearTimeout(t);
  t = setTimeout(renderList, 90);
});
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const first = listEl.querySelector('.art');
    if (first) openArticle(first.dataset.id);
    qEl.blur();
  }
});
clearBtn.onclick = () => {
  qEl.value = '';
  clearBtn.classList.remove('on');
  renderList();
  qEl.focus();
};

// 在阅读页里输入则先返回列表
qEl.addEventListener('focus', () => {
  if (document.body.classList.contains('reading')) closeArticle();
});

/* ---------- 启动 ---------- */
(function init() {
  renderList();
  const hash = decodeURIComponent(location.hash.replace('#', ''));
  if (hash && ARTS.some(a => a.id === hash)) {
    openArticle(hash);
  } else {
    history.replaceState({}, '', location.pathname + location.search);
  }
})();

</script>

</body>
</html>
