<style>
/* ==========================================================================
   历史文章集 · 样式
   ========================================================================== */

:root {
  --bg: #0e0d0b;
  --fg: #f0e9de;
  --fg-body: #c3b9ab;
  --fg-dim: #8b8073;
  --fg-faint: #5b544b;
  --accent: #d9bf8a;
  --line: rgba(217, 191, 138, .13);
  --card: #191613;
  --radius: 16px;
  --ease: cubic-bezier(.22, .9, .3, 1);
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(14, 13, 11, .86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, .05);
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .04em;
  white-space: nowrap;
}
.brand small {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--fg-faint);
  letter-spacing: .1em;
  margin-top: 2px;
}

#backBtn {
  display: none;
  background: none;
  border: none;
  color: var(--accent);
  font-family: inherit;
  font-size: 15px;
  padding: 6px 8px 6px 0;
  cursor: pointer;
}
body.reading #backBtn { display: block; }
body.reading .brand { display: none; }

/* 搜索 */
.search {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, .055);
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .05) inset;
}
.search svg { flex: 0 0 auto; opacity: .45; }
#q {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  outline: none;
  color: var(--fg);
  font-family: inherit;
  font-size: 15px;
}
#q::placeholder { color: var(--fg-faint); }
#clearBtn {
  display: none;
  background: rgba(255, 255, 255, .1);
  border: none;
  color: var(--fg-dim);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
}
#clearBtn.on { display: block; }
body.reading .search { display: none; }

/* ---------- 列表 ---------- */
#list {
  padding: 12px 16px calc(env(safe-area-inset-bottom) + 32px);
}

.art {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: none;
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  margin-bottom: 10px;
  color: var(--fg);
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .045) inset;
  transition: background .16s ease, transform .12s var(--ease);
}
.art:active { background: #201c18; transform: scale(.995); }

.art .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--fg-dim);
  margin-bottom: 8px;
}
.art .meta .sep { color: #3f3a33; }

.art h2 {
  margin: 0 0 6px;
  font-size: 17px;
  line-height: 1.45;
  font-weight: 600;
  letter-spacing: -.002em;
}

.art .sub {
  margin: 0 0 10px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--fg-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.art .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.art .tag {
  font-size: 11px;
  color: #9a8f80;
  background: rgba(255, 255, 255, .05);
  border-radius: 6px;
  padding: 3px 7px;
  letter-spacing: .04em;
}

.empty {
  text-align: center;
  color: var(--fg-faint);
  font-size: 14px;
  padding: 48px 20px;
}

/* ---------- 搜索结果高亮 ---------- */
mark {
  background: rgba(217, 191, 138, .28);
  color: var(--fg);
  border-radius: 3px;
  padding: 0 1px;
}

.snippet {
  margin: 8px 0 0;
  font-size: 12.5px;
  line-height: 1.7;
  color: #9d9284;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ---------- 阅读页 ---------- */
#reader {
  display: none;
  padding: 20px 20px calc(env(safe-area-inset-bottom) + 56px);
  max-width: 680px;
  margin: 0 auto;
}
body.reading #list { display: none; }
body.reading #reader { display: block; }

#reader .era {
  font-size: 11px;
  letter-spacing: .17em;
  color: var(--fg-dim);
  margin-bottom: 12px;
}

#reader h1 {
  font-size: 26px;
  line-height: 1.4;
  font-weight: 650;
  letter-spacing: -.01em;
  margin: 0 0 12px;
}

#reader .lede {
  font-size: 15px;
  line-height: 1.8;
  color: var(--fg-dim);
  margin: 0 0 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

#reader .body {
  font-size: 16.5px;
  line-height: 1.9;
  color: var(--fg-body);
  letter-spacing: .006em;
}

#reader .body h2 {
  font-size: 19px;
  line-height: 1.5;
  color: var(--fg);
  font-weight: 600;
  margin: 34px 0 14px;
  padding-left: 12px;
  border-left: 3px solid rgba(217, 191, 138, .45);
}
#reader .body h3 {
  font-size: 16.5px;
  color: var(--fg);
  font-weight: 600;
  margin: 24px 0 10px;
}
#reader .body p { margin: 0 0 18px; }
#reader .body strong { color: #ede4d6; font-weight: 600; }

#reader .body ul,
#reader .body ol {
  margin: 0 0 18px;
  padding-left: 22px;
}
#reader .body li { margin-bottom: 8px; }

#reader .body blockquote {
  margin: 0 0 18px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, .03);
  border-left: 2px solid rgba(217, 191, 138, .35);
  border-radius: 0 8px 8px 0;
  color: var(--fg-dim);
  font-size: 15px;
}

#reader .body hr {
  border: none;
  border-top: 1px solid var(--line);
  margin: 30px 0;
}

#reader .body a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid rgba(217, 191, 138, .3);
}

#reader .body code {
  background: rgba(255, 255, 255, .06);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: .9em;
}

.reading-meta {
  margin-top: 36px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--fg-faint);
  letter-spacing: .06em;
}

/* 阅读进度条 */
#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  width: 0;
  background: var(--accent);
  z-index: 20;
  opacity: 0;
  transition: opacity .2s ease;
}
body.reading #progress { opacity: .75; }

@media (max-width: 360px) {
  #reader .body { font-size: 16px; }
  #reader h1 { font-size: 23px; }
}

</style>

<script>
window.__ARTICLES__ = [{"id": "001-jiaohun", "title": "1768：一场由官僚自保催生的全国冤案", "subtitle": "从《叫魂》看专制权力、官僚理性与底层恐惧如何共同制造恐慌", "era": "清·乾隆", "tags": ["清代", "社会史", "官僚制", "孔飞力"], "date": "2026-11-28", "html": "<h2>一、德清县，一个修水闸的木匠</h2>\n<p>乾隆三十三年春天，浙江德清县城外，几个木匠在修一座水闸。</p>\n<p>这一带有个说法：木匠会把人的名字写在纸片上，打进桥桩，借修桥的法术摄人魂魄。被摄的人会生病，会死。这种法术叫\"叫魂\"。</p>\n<p>一个叫沈士良的农民找到了木匠吴东明。沈士良和自己的两个侄子有仇，他想请吴东明把侄子的名字打进桥桩。</p>\n<p>吴东明拒绝了。然后他去报了官。</p>\n<p>按说事情到这里就完了。沈士良挨了打，吴东明接着修水闸，德清县的春天照常过去。</p>\n<p>但它没有。</p>\n<p>到那年夏天，山东、江苏、直隶的衙门里挤满了人，罪名大同小异：剪人发辫，施行妖术。到秋天，军机处奉旨审结，说全案查无实据。这时已经有几十个人死在狱里。</p>\n<p>这件事距离德清县那座水闸，是一千多里。</p>\n<h2>二、谣言走在运河上</h2>\n<p>把各地报上来的案子按时间排一排，会发现一条很清楚的路线：德清、杭州、苏州、扬州、山东、直隶。</p>\n<p>这条线跟大运河几乎重合。</p>\n<p>十八世纪中叶的江南，是当时世界上人口最稠密的地区之一。康熙末年，全国大约一亿五千万人；到乾隆末年，这个数字接近三亿。人多，地不够，很多人离开土地，成了流动的人。</p>\n<p>大运河两头连着粮仓和京城。运粮的船、做买卖的商人、赶考的士子、找活计的工匠，都在同一条水路上走。一条传闻上了船，跟着往北，几天就能换一个省。</p>\n<p>被指认的人里，有很大一部分是这样一些人：游方的和尚、走街的乞丐、剃头的匠人、四处卖艺的。他们没有本地户籍，住在庙里或客栈，身边没有亲族，也没有能替他们担保的人。</p>\n<p>有个案子在山东。一个叫觉性的和尚被抓，罪名是剪人发辫。审讯时他说自己只是个走方和尚，不认识举报他的人。这话在当时没什么用——没有保人，就等于没有身份；没有身份，就等于可以被怀疑。</p>\n<h2>三、富尼汉的那本账</h2>\n<p>最先上折子的是山东巡抚富尼汉。</p>\n<p>他抓了人，审了，然后把案子报上去。奏折写得很有分寸，先叙述听说的情况，再说自己如何追查，最后说\"事关重大，不敢隐匿\"。</p>\n<p>这句\"不敢隐匿\"，把一种处境说得很清楚。</p>\n<p>如果富尼汉在折子里写\"查无此事\"，会是什么结果？乾隆面前摆着的是一份密报，说山东出了妖术；接着一份来自山东的奏折，说山东没有妖术。皇帝多半不会觉得山东太平，只会觉得这个巡抚要么无能，要么在瞒他。</p>\n<p>所以富尼汉的选择其实只有一种。写\"有\"，他是尽职的；写\"没有\"，他要冒失职的风险。<strong>风险不对称，判断就会歪。</strong></p>\n<p>案子一旦报成\"有\"，下级就跟着办。审讯要用刑，因为妖术按重案办，重案可以用刑。被捕的人在刑下供出更多的人名，于是又抓人，再审，再供。供词越来越详细：什么时辰、什么地点、用的什么东西、摄走谁的魂魄。越详细，上面越相信。</p>\n<p>江苏、直隶的地方官也陆续上折子，说同样的事。没有谁在撒谎，也没有谁特别贪婪。<strong>每个人都做了对自己最安全的选择，加在一起，产出的却是一件根本不存在的事。</strong></p>\n<h2>四、承德的一封信</h2>\n<p>案子的规模，是皇帝给的。</p>\n<p>乾隆在承德避暑山庄读到山东的密报，很快下了谕旨。此后的几个月里，谕旨一道接一道，语气一次比一次重。他要求各省严查，要求把拿获的人解京审问，甚至对已经查明的案子也要求\"再行严讯\"。</p>\n<p>孔飞力注意到一个细节：这些谕旨里反复出现的，不是\"妖术可恨\"，而是\"各省督抚何以并不奏闻\"。</p>\n<p>皇帝真正不安的，是江南的官员和士绅关系太近，近到可能一起瞒着他。妖术案给了他一个机会，让整个官僚系统为他一件事转起来，转得越快，越能看出谁是主人。</p>\n<p>还有一层。剪的是发辫。清朝初年为了剃发令杀过很多人，辫子从那时起就不只是头发。妖术专剪发辫这件事，在皇帝看来不可能只是一个乡下人的迷信。</p>\n<h2>五、收场的人是官僚</h2>\n<p>有意思的是，最后把这件案子结束掉的，还是那批皇帝不太信任的人。</p>\n<p>负责审理的是军机处。几位大臣把解京的人犯逐一过堂，反复复核，发现供词互相冲突，很多根本是刑讯之下编出来的。他们没有正面顶撞，只是把案子一件一件往回收。到了秋天，军机处奏报，称各案均无实据。</p>\n<p>乾隆接受了这个结果。此后谕旨不再提。地方上也渐渐安静下来。</p>\n<p>一个高度集权的体制，可以用一纸谕旨发动一场席卷十二省的运动；但要停下来，仍然要靠它平时最不放心的那套常规机器。孔飞力在书里把这一对关系叫做\"专制权力\"和\"常规权力\"：前者可以无限扩张，但要落地，总要经过后者。</p>\n<h2>六、后来的争论</h2>\n<p>《叫魂》出版于 1990 年，三十多年来讨论不断。</p>\n<p>有人说孔飞力把乾隆想得太聪明、太有逻辑了。真实的皇帝可能只是焦躁、信息不全、脾气上来了，未必是在下一盘大棋。</p>\n<p>也有人重新统计过案件分布，认为孔飞力手上的样本集中在几个省，全国的实际规模可能被高估；而且清代刑科题本里涉及\"邪术\"的案子本来就多，与民间信仰日常纠缠，不好都算进同一场恐慌。</p>\n<p>还有一种看法更看重底下那层：十八世纪的人口压力、粮价波动、地方社会失序，这才是恐慌的土壤。皇权动员只是火柴，柴堆是早就堆好的。</p>\n<p>这些争论没有推翻这本书。反倒是因为它把\"制度如何生产事实\"这个问题放在了一个材料极好的案子上，才经得起一遍遍地重新翻检。</p>\n<h2>七、几个可以自己想的问题</h2>\n<p>我看完这本书，最放不下的不是乾隆，是富尼汉。他写那句\"不敢隐匿\"的时候，大概知道自己抓的人未必真有问题。</p>\n<p>如果你坐在 1768 年山东巡抚的位置上，手里就是那份密报，你会怎么落笔？</p>\n<p>\"报有比报无安全\"这件事，在今天的机构里还剩下多少？它换成了什么样子？</p>\n<p>还有一层：整件事的材料，都是审讯时留下来的。人在刑具前说的话，怎么拿来当历史用？</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>孔飞力：《叫魂：1768年中国妖术大恐慌》，陈兼、刘昶译，上海三联书店，1999 年。</li>\n<li>《清高宗实录》卷八一二至八一六，乾隆三十三年相关谕旨。</li>\n<li>《宫中档乾隆朝奏折》，台北故宫博物院藏。</li>\n<li>中国人民大学清史研究所编：《清史编年》第五卷，中国人民大学出版社。</li>\n<li>关于人口背景，参看何炳棣《明初以降人口及其相关问题》。</li>\n</ol>", "text": "一、德清县，一个修水闸的木匠\n乾隆三十三年春天，浙江德清县城外，几个木匠在修一座水闸。\n这一带有个说法：木匠会把人的名字写在纸片上，打进桥桩，借修桥的法术摄人魂魄。被摄的人会生病，会死。这种法术叫\"叫魂\"。\n一个叫沈士良的农民找到了木匠吴东明。沈士良和自己的两个侄子有仇，他想请吴东明把侄子的名字打进桥桩。\n吴东明拒绝了。然后他去报了官。\n按说事情到这里就完了。沈士良挨了打，吴东明接着修水闸，德清县的春天照常过去。\n但它没有。\n到那年夏天，山东、江苏、直隶的衙门里挤满了人，罪名大同小异：剪人发辫，施行妖术。到秋天，军机处奉旨审结，说全案查无实据。这时已经有几十个人死在狱里。\n这件事距离德清县那座水闸，是一千多里。\n二、谣言走在运河上\n把各地报上来的案子按时间排一排，会发现一条很清楚的路线：德清、杭州、苏州、扬州、山东、直隶。\n这条线跟大运河几乎重合。\n十八世纪中叶的江南，是当时世界上人口最稠密的地区之一。康熙末年，全国大约一亿五千万人；到乾隆末年，这个数字接近三亿。人多，地不够，很多人离开土地，成了流动的人。\n大运河两头连着粮仓和京城。运粮的船、做买卖的商人、赶考的士子、找活计的工匠，都在同一条水路上走。一条传闻上了船，跟着往北，几天就能换一个省。\n被指认的人里，有很大一部分是这样一些人：游方的和尚、走街的乞丐、剃头的匠人、四处卖艺的。他们没有本地户籍，住在庙里或客栈，身边没有亲族，也没有能替他们担保的人。\n有个案子在山东。一个叫觉性的和尚被抓，罪名是剪人发辫。审讯时他说自己只是个走方和尚，不认识举报他的人。这话在当时没什么用——没有保人，就等于没有身份；没有身份，就等于可以被怀疑。\n三、富尼汉的那本账\n最先上折子的是山东巡抚富尼汉。\n他抓了人，审了，然后把案子报上去。奏折写得很有分寸，先叙述听说的情况，再说自己如何追查，最后说\"事关重大，不敢隐匿\"。\n这句\"不敢隐匿\"，把一种处境说得很清楚。\n如果富尼汉在折子里写\"查无此事\"，会是什么结果？乾隆面前摆着的是一份密报，说山东出了妖术；接着一份来自山东的奏折，说山东没有妖术。皇帝多半不会觉得山东太平，只会觉得这个巡抚要么无能，要么在瞒他。\n所以富尼汉的选择其实只有一种。写\"有\"，他是尽职的；写\"没有\"，他要冒失职的风险。风险不对称，判断就会歪。\n案子一旦报成\"有\"，下级就跟着办。审讯要用刑，因为妖术按重案办，重案可以用刑。被捕的人在刑下供出更多的人名，于是又抓人，再审，再供。供词越来越详细：什么时辰、什么地点、用的什么东西、摄走谁的魂魄。越详细，上面越相信。\n江苏、直隶的地方官也陆续上折子，说同样的事。没有谁在撒谎，也没有谁特别贪婪。每个人都做了对自己最安全的选择，加在一起，产出的却是一件根本不存在的事。\n四、承德的一封信\n案子的规模，是皇帝给的。\n乾隆在承德避暑山庄读到山东的密报，很快下了谕旨。此后的几个月里，谕旨一道接一道，语气一次比一次重。他要求各省严查，要求把拿获的人解京审问，甚至对已经查明的案子也要求\"再行严讯\"。\n孔飞力注意到一个细节：这些谕旨里反复出现的，不是\"妖术可恨\"，而是\"各省督抚何以并不奏闻\"。\n皇帝真正不安的，是江南的官员和士绅关系太近，近到可能一起瞒着他。妖术案给了他一个机会，让整个官僚系统为他一件事转起来，转得越快，越能看出谁是主人。\n还有一层。剪的是发辫。清朝初年为了剃发令杀过很多人，辫子从那时起就不只是头发。妖术专剪发辫这件事，在皇帝看来不可能只是一个乡下人的迷信。\n五、收场的人是官僚\n有意思的是，最后把这件案子结束掉的，还是那批皇帝不太信任的人。\n负责审理的是军机处。几位大臣把解京的人犯逐一过堂，反复复核，发现供词互相冲突，很多根本是刑讯之下编出来的。他们没有正面顶撞，只是把案子一件一件往回收。到了秋天，军机处奏报，称各案均无实据。\n乾隆接受了这个结果。此后谕旨不再提。地方上也渐渐安静下来。\n一个高度集权的体制，可以用一纸谕旨发动一场席卷十二省的运动；但要停下来，仍然要靠它平时最不放心的那套常规机器。孔飞力在书里把这一对关系叫做\"专制权力\"和\"常规权力\"：前者可以无限扩张，但要落地，总要经过后者。\n六、后来的争论\n《叫魂》出版于 1990 年，三十多年来讨论不断。\n有人说孔飞力把乾隆想得太聪明、太有逻辑了。真实的皇帝可能只是焦躁、信息不全、脾气上来了，未必是在下一盘大棋。\n也有人重新统计过案件分布，认为孔飞力手上的样本集中在几个省，全国的实际规模可能被高估；而且清代刑科题本里涉及\"邪术\"的案子本来就多，与民间信仰日常纠缠，不好都算进同一场恐慌。\n还有一种看法更看重底下那层：十八世纪的人口压力、粮价波动、地方社会失序，这才是恐慌的土壤。皇权动员只是火柴，柴堆是早就堆好的。\n这些争论没有推翻这本书。反倒是因为它把\"制度如何生产事实\"这个问题放在了一个材料极好的案子上，才经得起一遍遍地重新翻检。\n七、几个可以自己想的问题\n我看完这本书，最放不下的不是乾隆，是富尼汉。他写那句\"不敢隐匿\"的时候，大概知道自己抓的人未必真有问题。\n如果你坐在 1768 年山东巡抚的位置上，手里就是那份密报，你会怎么落笔？\n\"报有比报无安全\"这件事，在今天的机构里还剩下多少？它换成了什么样子？\n还有一层：整件事的材料，都是审讯时留下来的。人在刑具前说的话，怎么拿来当历史用？\n\n主要参考文献\n\n孔飞力：《叫魂：1768年中国妖术大恐慌》，陈兼、刘昶译，上海三联书店，1999 年。\n《清高宗实录》卷八一二至八一六，乾隆三十三年相关谕旨。\n《宫中档乾隆朝奏折》，台北故宫博物院藏。\n中国人民大学清史研究所编：《清史编年》第五卷，中国人民大学出版社。\n关于人口背景，参看何炳棣《明初以降人口及其相关问题》。\n", "words": 2000}, {"id": "002-erlitou", "title": "二里头的一件铜爵，和一段找不到名字的历史", "subtitle": "夏朝存在吗？考古能给的东西，和文字能给的东西", "era": "先秦·夏", "tags": ["先秦", "考古", "二里头", "夏商周断代"], "date": "2026-11-27", "html": "<h2>一、洛阳盆地，一片灰土</h2>\n<p>1959 年夏天，考古学家徐旭生在河南偃师一带调查。</p>\n<p>他是来找\"夏墟\"的。司马迁在《史记》里写过夏，写了十四代、四百多年，写了最后一个叫桀的王，写了他被商汤流放。可商朝有甲骨文，有安阳的宫殿基址，有青铜器上的铭文，夏什么都没有。<strong>一个写在两千年前书里的王朝，在地底下找不到对应的东西。</strong></p>\n<p>徐旭生走到二里头村的时候，看到地里有一片灰土。灰土下面，是陶片。</p>\n<h2>二、这里挖出了什么</h2>\n<p>往后六十年的发掘，二里头给了一件东西的各个部分。</p>\n<p>宫城。夯土的墙基，围出一块十万平方米的城，中间是一号宫殿，三十多米见方，前面有庭院。这种布局，后来的商周宫殿也在用。</p>\n<p>道路。城里有几条主干道，宽十几米，路面有车辙。</p>\n<p>作坊。城南是铸铜的遗址，出土了陶范、坩埚、铜渣。那里铸出来的青铜器，是中国目前发现最早的青铜礼器群。</p>\n<p>一件铜爵。三足，长流，器壁很薄。铸造这样的东西，需要合范、需要配比、需要控制温度。这不是一个村子的手艺。</p>\n<p>还有一样东西没挖出来：字。</p>\n<p>二里头有刻画符号，陶器上零零星星几十个。但那不是文字。没有甲骨，没有铭文，没有能读出\"夏\"这个字的东西。</p>\n<h2>三、两拨人吵了四十年</h2>\n<p>于是问题变成了这样：二里头是夏都，还是早商都？</p>\n<p>一派以邹衡为代表。他认为二里头一至四期全是夏文化，商的早期都邑是郑州商城。理由是二里头与之后的二里岗文化差别明显，中间有断裂。</p>\n<p>另一派认为，二里头晚期（三、四期）已经进入商代，很可能是汤都西亳。理由是这个阶段出现了新的器物组合和礼制变化。</p>\n<p>两边都拿地层和陶器说话，谁也说服不了谁。因为<strong>争论的其实不是器物，是名字</strong>。</p>\n<p>年代是清楚的。二里头的绝对年代大约在公元前 1750 到 1530 年，用碳十四测过很多次。这个时间跟《竹书纪年》里夏的纪年大致对得上。</p>\n<p>但对得上，不等于就是。</p>\n<p>许宏后来在《最早的中国》里说得很坦白：他能证明二里头是一个广域王权国家的都邑，是这个区域最早的国家级聚落；他不能证明它叫\"夏\"。</p>\n<h2>四、名字是后来的人给的</h2>\n<p>\"夏\"这个称呼，最早出现在西周人的话里。</p>\n<p>周公反复讲\"殷革夏命\"，讲夏的失德、商的天命、周的承接。这套话在当时有非常实际的作用：周要证明自己取代商是合法的，就需要一个先例；商取代夏，正好就是这个先例。</p>\n<p>顾颉刚当年提出过\"层累地造成的古史\"，说的就是这个意思：越往后，上古的历史越详细，越整齐。</p>\n<p>所以有一种可能是：夏确实存在，就是二里头那样一个国家；但\"夏\"这个名字，是周人为了讲自己的故事才安上去的。</p>\n<h2>五、另一条路</h2>\n<p>也不是没有办法。</p>\n<p>商朝人自己也记过。甲骨文里有\"西邑\"，有学者认为那指的是一个更早的西边的都城。如果这个推测成立，那么商人心里的\"前朝\"，可能叫西邑，不叫夏。</p>\n<p>陶寺遗址在山西襄汾，年代比二里头还早，有观象台、有城墙、有大墓。良渚在浙江，有水利系统、有玉礼器。石峁在陕西神木，石头砌的城几百万立方米。</p>\n<p>这些地方都不叫夏。但它们加在一起，说明公元前两千年上下的中国大地上，早就有若干个复杂社会同时存在。<strong>夏的问题，可能从一开始就问错了：我们总想找一个王朝，实际上找到的是好几个并立的文明。</strong></p>\n<h2>六、那件铜爵</h2>\n<p>二里头出土的铜爵，现在在中国社会科学院考古研究所的库房里。</p>\n<p>它不高，二十厘米左右，壁厚两毫米。铸造的时候，陶范要做得非常精确，否则铜水浇进去就漏了。做这件东西的人，肯定有师傅教，有分工，有人给他准备料。</p>\n<p>这件爵说明，四千年前洛阳盆地有人能组织起足够多的人、足够长的工序，去做一件只用来倒酒的东西。</p>\n<p>至于这个组织叫什么，我们不知道。</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>许宏：《最早的中国》，科学出版社，2009 年。</li>\n<li>邹衡：《夏商周考古学论文集》，文物出版社，1980 年。</li>\n<li>张光直：《中国青铜时代》，三联书店，1999 年。</li>\n<li>李学勤：《走出疑古时代》，辽宁大学出版社，1997 年。</li>\n<li>中国社会科学院考古研究所：《二里头（1999—2006）》，文物出版社，2014 年。</li>\n</ol>", "text": "一、洛阳盆地，一片灰土\n1959 年夏天，考古学家徐旭生在河南偃师一带调查。\n他是来找\"夏墟\"的。司马迁在《史记》里写过夏，写了十四代、四百多年，写了最后一个叫桀的王，写了他被商汤流放。可商朝有甲骨文，有安阳的宫殿基址，有青铜器上的铭文，夏什么都没有。一个写在两千年前书里的王朝，在地底下找不到对应的东西。\n徐旭生走到二里头村的时候，看到地里有一片灰土。灰土下面，是陶片。\n二、这里挖出了什么\n往后六十年的发掘，二里头给了一件东西的各个部分。\n宫城。夯土的墙基，围出一块十万平方米的城，中间是一号宫殿，三十多米见方，前面有庭院。这种布局，后来的商周宫殿也在用。\n道路。城里有几条主干道，宽十几米，路面有车辙。\n作坊。城南是铸铜的遗址，出土了陶范、坩埚、铜渣。那里铸出来的青铜器，是中国目前发现最早的青铜礼器群。\n一件铜爵。三足，长流，器壁很薄。铸造这样的东西，需要合范、需要配比、需要控制温度。这不是一个村子的手艺。\n还有一样东西没挖出来：字。\n二里头有刻画符号，陶器上零零星星几十个。但那不是文字。没有甲骨，没有铭文，没有能读出\"夏\"这个字的东西。\n三、两拨人吵了四十年\n于是问题变成了这样：二里头是夏都，还是早商都？\n一派以邹衡为代表。他认为二里头一至四期全是夏文化，商的早期都邑是郑州商城。理由是二里头与之后的二里岗文化差别明显，中间有断裂。\n另一派认为，二里头晚期（三、四期）已经进入商代，很可能是汤都西亳。理由是这个阶段出现了新的器物组合和礼制变化。\n两边都拿地层和陶器说话，谁也说服不了谁。因为争论的其实不是器物，是名字。\n年代是清楚的。二里头的绝对年代大约在公元前 1750 到 1530 年，用碳十四测过很多次。这个时间跟《竹书纪年》里夏的纪年大致对得上。\n但对得上，不等于就是。\n许宏后来在《最早的中国》里说得很坦白：他能证明二里头是一个广域王权国家的都邑，是这个区域最早的国家级聚落；他不能证明它叫\"夏\"。\n四、名字是后来的人给的\n\"夏\"这个称呼，最早出现在西周人的话里。\n周公反复讲\"殷革夏命\"，讲夏的失德、商的天命、周的承接。这套话在当时有非常实际的作用：周要证明自己取代商是合法的，就需要一个先例；商取代夏，正好就是这个先例。\n顾颉刚当年提出过\"层累地造成的古史\"，说的就是这个意思：越往后，上古的历史越详细，越整齐。\n所以有一种可能是：夏确实存在，就是二里头那样一个国家；但\"夏\"这个名字，是周人为了讲自己的故事才安上去的。\n五、另一条路\n也不是没有办法。\n商朝人自己也记过。甲骨文里有\"西邑\"，有学者认为那指的是一个更早的西边的都城。如果这个推测成立，那么商人心里的\"前朝\"，可能叫西邑，不叫夏。\n陶寺遗址在山西襄汾，年代比二里头还早，有观象台、有城墙、有大墓。良渚在浙江，有水利系统、有玉礼器。石峁在陕西神木，石头砌的城几百万立方米。\n这些地方都不叫夏。但它们加在一起，说明公元前两千年上下的中国大地上，早就有若干个复杂社会同时存在。夏的问题，可能从一开始就问错了：我们总想找一个王朝，实际上找到的是好几个并立的文明。\n六、那件铜爵\n二里头出土的铜爵，现在在中国社会科学院考古研究所的库房里。\n它不高，二十厘米左右，壁厚两毫米。铸造的时候，陶范要做得非常精确，否则铜水浇进去就漏了。做这件东西的人，肯定有师傅教，有分工，有人给他准备料。\n这件爵说明，四千年前洛阳盆地有人能组织起足够多的人、足够长的工序，去做一件只用来倒酒的东西。\n至于这个组织叫什么，我们不知道。\n\n主要参考文献\n\n许宏：《最早的中国》，科学出版社，2009 年。\n邹衡：《夏商周考古学论文集》，文物出版社，1980 年。\n张光直：《中国青铜时代》，三联书店，1999 年。\n李学勤：《走出疑古时代》，辽宁大学出版社，1997 年。\n中国社会科学院考古研究所：《二里头（1999—2006）》，文物出版社，2014 年。\n", "words": 1304}, {"id": "003-juyan", "title": "元延二年，一份报到郡府的账", "subtitle": "从居延汉简看两千年前的基层行政，究竟怎么运转", "era": "秦汉", "tags": ["秦汉", "简牍", "基层治理", "居延"], "date": "2026-11-26", "html": "<h2>一、1930 年，额济纳河边上</h2>\n<p>1930 年，中瑞西北科学考察团在内蒙古额济纳河流域的汉代烽燧遗址里，挖出了一万多枚木简。</p>\n<p>那些简被埋在沙里，一千九百多年没有烂。有的写着公文，有的写着名册，有的只有几个字：某年某月某人取粟几斗。</p>\n<p>这就是居延汉简。后来 1970 年代又出土一批，编成《居延新简》。</p>\n<p>简上记的东西琐碎到让人吃惊：某队有多少人、每人每天吃几升米、马病了喂什么药、谁欠谁几文钱。<strong>正史里没有一个字写这些。可边关就是这么一天天过去的。</strong></p>\n<h2>二、账本上的名字</h2>\n<p>汉成帝元延二年，居延某地的县令（简文中多作\"令\"或\"丞\"）向郡府上报上计簿。簿上列着这一年的户口、垦田、钱谷出入、刑狱案件。</p>\n<p>简文残破，只留下片段：\"元延二年……户八百廿三，口四千卅七……田二千一百顷……\"</p>\n<p>八百多户，四千多人。这是当时一个县的规模。</p>\n<p>紧接着几支简，是郡府核对后的批语。有一处写着户数和上一年对不上，要求说明原因；另一处写着某乡上报的垦田数小于实际，责令复核。</p>\n<p><strong>这就是上计。</strong> 每年秋天，县把一年的账报到郡，郡汇总报中央。户口、垦田、钱粮、盗贼、狱讼，逐项核对。</p>\n<h2>三、为什么必须这么细</h2>\n<p>因为要收税，要派人服役，要调兵。</p>\n<p>汉代的赋役建立在人口登记上。一个人是不是在册，决定了他全年要交多少算赋、要服多少天徭役、家里有几个男丁会被征去戍边。</p>\n<p>所以户籍不是虚文。居延简里有大量\"戍卒名籍\"，记着每一个从内地来戍边的士兵的姓名、籍贯、年龄、身高、肤色。为什么要记肤色？因为逃跑时要发通缉。</p>\n<p>还有一个细节。简里有很多\"病书\"，写某卒患病、不能值勤，请予免除当日劳役。这些病书要经过上级审核，有的还附了医官的诊断。<strong>一个边塞小卒请一天病假，要走完一整套文书流程。</strong></p>\n<h2>四、行政的代价</h2>\n<p>看起来很严密。但代价也在这里。</p>\n<p>一份公文从县到郡，从郡到都尉府，再到朝廷，中间要经过多少双手、多少站。居延出土的简里，有一种\"邮书刺\"，专门记录某份文书几时发出、几时到达、由谁传递。如果超期，要追责。</p>\n<p>有个简上写着：“前书到，期会已过，至今未报。”</p>\n<p>这是上级在催。催了还要写进档案。</p>\n<p>阎步克、卜宪群这些学者研究汉代官僚制时，都提到同一个问题：<strong>秦汉的行政能力，来于文书；它的负担，也来于文书。</strong> 一个县要养多少书吏，抄多少份，才能维持这套流程。</p>\n<p>居延的边塞是最考验这套系统的地方——离中央几千里，补给靠内地转运，一个环节断了，整条线就废了。</p>\n<h2>五、一个卒的日常</h2>\n<p>简里有一个叫\"忠\"的戍卒，出现在好几支简上。</p>\n<p>他某月某日领粟三石三斗三升少；某日与同伍的人一起巡烽；某日他的弩损坏，上报换新；某日他病了，同伍的人替他值勤。</p>\n<p>这些记录毫无戏剧性。但如果把他一年里出现在简上的所有条目连起来，就能看出一个边疆士兵的生活节奏：领粮、巡烽、修器、生病、被人替、替别人。</p>\n<p><strong>历史书里没有\"忠\"这个人。他没打过有名的仗，没说过一句被记下来的话。他只是被记在账上。</strong></p>\n<h2>六、这批简改变了什么</h2>\n<p>居延汉简出土之前，秦汉史的主要材料是《史记》《汉书》，加上一点金石。那都是上层视角。</p>\n<p>简牍出来之后，学界对秦汉基层的认识整个变了。原来\"郡县制\"三个字底下，是上计、是名籍、是邮书、是病书、是每月的粮账。</p>\n<p>劳榦花了几十年考释这批简。邢义田后来研究\"治国安邦\"，专门讨论这套文书体系如何把一个大帝国连起来。</p>\n<p>有意思的是，这些研究越深入，秦汉的形象就越不像“严刑峻法”四个字能概括的。它更像一个<strong>极其依赖流程、极其依赖纸张（准确说是木片）的组织</strong>。它的强，在于流程；它的弱，也在于流程。</p>\n<h2>七、最后</h2>\n<p>额济纳河边那些烽燧，今天还在。</p>\n<p>风把沙吹过残墙，木简当年就堆在墙根下。写字的人不知道这些东西会留下来，他只是照规矩，把该记的记上。</p>\n<p>两千年后，我们靠这些记账的木片，才知道一个汉代的边塞是怎么运转的。</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>劳榦：《居延汉简考释》，中央研究院历史语言研究所，1957 年。</li>\n<li>邢义田：《治国安邦：法制、行政与军事》，中华书局，2011 年。</li>\n<li>卜宪群：《秦汉官僚制度》，社会科学文献出版社，2002 年。</li>\n<li>阎步克：《从爵本位到官本位》，三联书店，2009 年。</li>\n<li>甘肃省文物考古研究所等：《居延新简》，文物出版社，1990 年。</li>\n</ol>", "text": "一、1930 年，额济纳河边上\n1930 年，中瑞西北科学考察团在内蒙古额济纳河流域的汉代烽燧遗址里，挖出了一万多枚木简。\n那些简被埋在沙里，一千九百多年没有烂。有的写着公文，有的写着名册，有的只有几个字：某年某月某人取粟几斗。\n这就是居延汉简。后来 1970 年代又出土一批，编成《居延新简》。\n简上记的东西琐碎到让人吃惊：某队有多少人、每人每天吃几升米、马病了喂什么药、谁欠谁几文钱。正史里没有一个字写这些。可边关就是这么一天天过去的。\n二、账本上的名字\n汉成帝元延二年，居延某地的县令（简文中多作\"令\"或\"丞\"）向郡府上报上计簿。簿上列着这一年的户口、垦田、钱谷出入、刑狱案件。\n简文残破，只留下片段：\"元延二年……户八百廿三，口四千卅七……田二千一百顷……\"\n八百多户，四千多人。这是当时一个县的规模。\n紧接着几支简，是郡府核对后的批语。有一处写着户数和上一年对不上，要求说明原因；另一处写着某乡上报的垦田数小于实际，责令复核。\n这就是上计。 每年秋天，县把一年的账报到郡，郡汇总报中央。户口、垦田、钱粮、盗贼、狱讼，逐项核对。\n三、为什么必须这么细\n因为要收税，要派人服役，要调兵。\n汉代的赋役建立在人口登记上。一个人是不是在册，决定了他全年要交多少算赋、要服多少天徭役、家里有几个男丁会被征去戍边。\n所以户籍不是虚文。居延简里有大量\"戍卒名籍\"，记着每一个从内地来戍边的士兵的姓名、籍贯、年龄、身高、肤色。为什么要记肤色？因为逃跑时要发通缉。\n还有一个细节。简里有很多\"病书\"，写某卒患病、不能值勤，请予免除当日劳役。这些病书要经过上级审核，有的还附了医官的诊断。一个边塞小卒请一天病假，要走完一整套文书流程。\n四、行政的代价\n看起来很严密。但代价也在这里。\n一份公文从县到郡，从郡到都尉府，再到朝廷，中间要经过多少双手、多少站。居延出土的简里，有一种\"邮书刺\"，专门记录某份文书几时发出、几时到达、由谁传递。如果超期，要追责。\n有个简上写着：“前书到，期会已过，至今未报。”\n这是上级在催。催了还要写进档案。\n阎步克、卜宪群这些学者研究汉代官僚制时，都提到同一个问题：秦汉的行政能力，来于文书；它的负担，也来于文书。 一个县要养多少书吏，抄多少份，才能维持这套流程。\n居延的边塞是最考验这套系统的地方——离中央几千里，补给靠内地转运，一个环节断了，整条线就废了。\n五、一个卒的日常\n简里有一个叫\"忠\"的戍卒，出现在好几支简上。\n他某月某日领粟三石三斗三升少；某日与同伍的人一起巡烽；某日他的弩损坏，上报换新；某日他病了，同伍的人替他值勤。\n这些记录毫无戏剧性。但如果把他一年里出现在简上的所有条目连起来，就能看出一个边疆士兵的生活节奏：领粮、巡烽、修器、生病、被人替、替别人。\n历史书里没有\"忠\"这个人。他没打过有名的仗，没说过一句被记下来的话。他只是被记在账上。\n六、这批简改变了什么\n居延汉简出土之前，秦汉史的主要材料是《史记》《汉书》，加上一点金石。那都是上层视角。\n简牍出来之后，学界对秦汉基层的认识整个变了。原来\"郡县制\"三个字底下，是上计、是名籍、是邮书、是病书、是每月的粮账。\n劳榦花了几十年考释这批简。邢义田后来研究\"治国安邦\"，专门讨论这套文书体系如何把一个大帝国连起来。\n有意思的是，这些研究越深入，秦汉的形象就越不像“严刑峻法”四个字能概括的。它更像一个极其依赖流程、极其依赖纸张（准确说是木片）的组织。它的强，在于流程；它的弱，也在于流程。\n七、最后\n额济纳河边那些烽燧，今天还在。\n风把沙吹过残墙，木简当年就堆在墙根下。写字的人不知道这些东西会留下来，他只是照规矩，把该记的记上。\n两千年后，我们靠这些记账的木片，才知道一个汉代的边塞是怎么运转的。\n\n主要参考文献\n\n劳榦：《居延汉简考释》，中央研究院历史语言研究所，1957 年。\n邢义田：《治国安邦：法制、行政与军事》，中华书局，2011 年。\n卜宪群：《秦汉官僚制度》，社会科学文献出版社，2002 年。\n阎步克：《从爵本位到官本位》，三联书店，2009 年。\n甘肃省文物考古研究所等：《居延新简》，文物出版社，1990 年。\n", "words": 1380}, {"id": "004-anshi", "title": "天宝十四载，长安城里没人相信会打仗", "subtitle": "安史之乱前的十年，一场被所有人低估的危机", "era": "隋唐", "tags": ["隋唐", "安史之乱", "藩镇", "长安"], "date": "2026-11-25", "html": "<h2>一、那年冬天，长安下了场雪</h2>\n<p>天宝十四载十一月初九，范阳节度使安禄山起兵，十五万人，号称二十万，以\"奉密诏讨杨国忠\"为名南下。</p>\n<p>消息传到长安，是几天之后。</p>\n<p>《资治通鉴》记了当时朝廷的反应，写得很简短。玄宗起初不信，说这是厌恶安禄山的人在造谣。后来消息越来越确凿，他才召集宰相商议。</p>\n<p>而在这之前，几乎没有人认为安禄山会反。</p>\n<h2>二、他为什么会坐到那个位置上</h2>\n<p>安禄山是胡人，父系是康国粟特人，母系是突厥人。他早年在幽州做互市牙郎，也就是在边境市场上做中间人，会六种蕃语。</p>\n<p>这个出身很重要。唐代的东北边境，是胡汉杂处的地方。会说话、能办事、两边都吃得开的人，最容易往上走。</p>\n<p>他靠军功升迁，也靠另一样东西：<strong>在皇帝面前的表现</strong>。</p>\n<p>史书写他\"外若痴直，内实狡黠\"。他体重三百多斤，进京时在玄宗面前跳胡旋舞，转得飞快。他认杨贵妃做母亲——他比杨贵妃大十几岁。每次入朝，先拜贵妃，再拜皇帝；玄宗问他为什么，他说胡人先母而后父。</p>\n<p>这些事看起来很荒唐，但很有效。天宝年间，玄宗对他几乎不设防。</p>\n<h2>三、他手里的三镇</h2>\n<p>到天宝十载，安禄山已经身兼平卢、范阳、河东三镇节度使。</p>\n<p>节度使这个职位，本意是边防。唐代在边境设十节度，各管一段防线。问题是，一个节度使掌的不只是兵。他还掌财权——可以自己收税、自己征粮；掌行政权——可以自己任免属官；掌监察权——可以自己处置部下。</p>\n<p>三镇加起来，兵力接近二十万，占当时全国边兵的近一半。</p>\n<p>陈寅恪讨论过这个格局：中央的兵力在内地，精锐在边镇；边镇越强，中央越依赖边镇；而边镇又离中央越来越远。</p>\n<p>仇鹿鸣后来的研究补了一层：这种格局不只是军事问题，也是政治问题。边镇形成了一个相对独立的权力网络，其中的将领、幕僚、商人都跟节度使绑在一起。</p>\n<h2>四、长安知道的，和不知道的</h2>\n<p>玄宗不是没收到过警告。</p>\n<p>杨国忠多次说安禄山必反。太子也说过。有人上奏说安禄山私养战马、储备军械，玄宗派人去看，回来的人报\"无他\"。</p>\n<p>还有一个细节。天宝十三载，玄宗想召安禄山入朝，试探他。安禄山来了。来了之后，玄宗就更放心了——他都敢来，怎么会反？</p>\n<p>这个逻辑在当时并不算错。只是安禄山来的时候，把所有能见到的信息都处理得很好。</p>\n<p>事情的转折在杨国忠。他为了逼安禄山反，做了几件事：查抄安禄山在长安的宅第，杀了他的女婿，还上奏说安禄山必反，请朝廷先动手。</p>\n<p><strong>把一个人逼反，然后证明自己说对了。</strong> 这在政治上很常见，代价通常由整个国家付。</p>\n<h2>五、兵到洛阳的时候</h2>\n<p>起兵之后，一个月内，安禄山渡过黄河，攻下陈留、荥阳，进逼洛阳。</p>\n<p>唐军不是没有兵。封常清在洛阳募兵六万，但都是临时招募的市井之人，没受过训练。高仙芝退守陕郡，又退到潼关。</p>\n<p>玄宗听信宦官边令诚的话，把封常清、高仙芝一起杀了。</p>\n<p>潼关是长安的门户。守将换成哥舒翰，二十万兵，据险而守。哥舒翰主张坚守不出，拖住叛军。玄宗和杨国忠却一再催他出战。</p>\n<p>天宝十五载六月，哥舒翰被迫出关，在灵宝西原中伏，二十万人几乎全军覆没。潼关失守。</p>\n<h2>六、那天早上，长安的街上</h2>\n<p>六月十三日，天还没亮，玄宗带着杨贵妃、皇子皇孙、少数亲信，从延秋门出了长安，向西走。</p>\n<p>第二天早上，百官照常上朝，到了宫门外，发现宫门开着，里面没有人。</p>\n<p>《资治通鉴》写的是：\"百官犹未知，至是，犹有入朝者，见宫门洞开，内人乱出，乃惊散。\"</p>\n<p>当天，长安城里有人抢了国库。几天后，安禄山的军队进城。</p>\n<h2>七、为什么没人相信</h2>\n<p>回过头看，这场动乱有太多信号：三镇合一、边兵过重、杨国忠与安禄山的私怨、朝廷一再拒绝报警。</p>\n<p>为什么这些信号都没起作用？</p>\n<p>第一层，是信息的过滤。皇帝听到的都是经过筛选的，说安禄山反的人被当成构陷，说安禄山忠的人被当成可靠。</p>\n<p>第二层，是玄宗本人的状态。他在位四十多年，前期开明，后期倦怠。天宝年间，他把政事交给李林甫、杨国忠，自己在宫里研究音律。《霓裳羽衣曲》就作于这个时期。</p>\n<p>第三层，是结构。藩镇制度本身让边将获得了他不该有的资源，而中央又没有能力收回。制度一旦成形，个人的警觉也就有限了。</p>\n<p>蒲立本在一本小书里说过一句话，大意是：安禄山之乱不是某个人的野心造成的，而是唐代边防体制运作到某个阶段的自然结果。</p>\n<h2>八、后来的事</h2>\n<p>安史之乱打了八年。</p>\n<p>唐朝没有亡，但它再也没能回到战前的样子。藩镇割据、财政重心南移、府兵制彻底瓦解，这些变化都从这八年开始。</p>\n<p>长安还在，宫城还在，但那个\"天宝\"的盛世，是在那年冬天结束的。</p>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>司马光：《资治通鉴》卷二一七，天宝十四载。</li>\n<li>蒲立本（Edwin G. Pulleyblank）：《安禄山叛乱的背景》，1955 年。</li>\n<li>仇鹿鸣：《长安与河北之间：中晚唐的政治与文化》，北京师范大学出版社，2018 年。</li>\n<li>张国刚：《唐代藩镇研究》，中国人民大学出版社，2010 年。</li>\n<li>陈寅恪：《唐代政治史述论稿》，上海古籍出版社。</li>\n</ol>", "text": "一、那年冬天，长安下了场雪\n天宝十四载十一月初九，范阳节度使安禄山起兵，十五万人，号称二十万，以\"奉密诏讨杨国忠\"为名南下。\n消息传到长安，是几天之后。\n《资治通鉴》记了当时朝廷的反应，写得很简短。玄宗起初不信，说这是厌恶安禄山的人在造谣。后来消息越来越确凿，他才召集宰相商议。\n而在这之前，几乎没有人认为安禄山会反。\n二、他为什么会坐到那个位置上\n安禄山是胡人，父系是康国粟特人，母系是突厥人。他早年在幽州做互市牙郎，也就是在边境市场上做中间人，会六种蕃语。\n这个出身很重要。唐代的东北边境，是胡汉杂处的地方。会说话、能办事、两边都吃得开的人，最容易往上走。\n他靠军功升迁，也靠另一样东西：在皇帝面前的表现。\n史书写他\"外若痴直，内实狡黠\"。他体重三百多斤，进京时在玄宗面前跳胡旋舞，转得飞快。他认杨贵妃做母亲——他比杨贵妃大十几岁。每次入朝，先拜贵妃，再拜皇帝；玄宗问他为什么，他说胡人先母而后父。\n这些事看起来很荒唐，但很有效。天宝年间，玄宗对他几乎不设防。\n三、他手里的三镇\n到天宝十载，安禄山已经身兼平卢、范阳、河东三镇节度使。\n节度使这个职位，本意是边防。唐代在边境设十节度，各管一段防线。问题是，一个节度使掌的不只是兵。他还掌财权——可以自己收税、自己征粮；掌行政权——可以自己任免属官；掌监察权——可以自己处置部下。\n三镇加起来，兵力接近二十万，占当时全国边兵的近一半。\n陈寅恪讨论过这个格局：中央的兵力在内地，精锐在边镇；边镇越强，中央越依赖边镇；而边镇又离中央越来越远。\n仇鹿鸣后来的研究补了一层：这种格局不只是军事问题，也是政治问题。边镇形成了一个相对独立的权力网络，其中的将领、幕僚、商人都跟节度使绑在一起。\n四、长安知道的，和不知道的\n玄宗不是没收到过警告。\n杨国忠多次说安禄山必反。太子也说过。有人上奏说安禄山私养战马、储备军械，玄宗派人去看，回来的人报\"无他\"。\n还有一个细节。天宝十三载，玄宗想召安禄山入朝，试探他。安禄山来了。来了之后，玄宗就更放心了——他都敢来，怎么会反？\n这个逻辑在当时并不算错。只是安禄山来的时候，把所有能见到的信息都处理得很好。\n事情的转折在杨国忠。他为了逼安禄山反，做了几件事：查抄安禄山在长安的宅第，杀了他的女婿，还上奏说安禄山必反，请朝廷先动手。\n把一个人逼反，然后证明自己说对了。 这在政治上很常见，代价通常由整个国家付。\n五、兵到洛阳的时候\n起兵之后，一个月内，安禄山渡过黄河，攻下陈留、荥阳，进逼洛阳。\n唐军不是没有兵。封常清在洛阳募兵六万，但都是临时招募的市井之人，没受过训练。高仙芝退守陕郡，又退到潼关。\n玄宗听信宦官边令诚的话，把封常清、高仙芝一起杀了。\n潼关是长安的门户。守将换成哥舒翰，二十万兵，据险而守。哥舒翰主张坚守不出，拖住叛军。玄宗和杨国忠却一再催他出战。\n天宝十五载六月，哥舒翰被迫出关，在灵宝西原中伏，二十万人几乎全军覆没。潼关失守。\n六、那天早上，长安的街上\n六月十三日，天还没亮，玄宗带着杨贵妃、皇子皇孙、少数亲信，从延秋门出了长安，向西走。\n第二天早上，百官照常上朝，到了宫门外，发现宫门开着，里面没有人。\n《资治通鉴》写的是：\"百官犹未知，至是，犹有入朝者，见宫门洞开，内人乱出，乃惊散。\"\n当天，长安城里有人抢了国库。几天后，安禄山的军队进城。\n七、为什么没人相信\n回过头看，这场动乱有太多信号：三镇合一、边兵过重、杨国忠与安禄山的私怨、朝廷一再拒绝报警。\n为什么这些信号都没起作用？\n第一层，是信息的过滤。皇帝听到的都是经过筛选的，说安禄山反的人被当成构陷，说安禄山忠的人被当成可靠。\n第二层，是玄宗本人的状态。他在位四十多年，前期开明，后期倦怠。天宝年间，他把政事交给李林甫、杨国忠，自己在宫里研究音律。《霓裳羽衣曲》就作于这个时期。\n第三层，是结构。藩镇制度本身让边将获得了他不该有的资源，而中央又没有能力收回。制度一旦成形，个人的警觉也就有限了。\n蒲立本在一本小书里说过一句话，大意是：安禄山之乱不是某个人的野心造成的，而是唐代边防体制运作到某个阶段的自然结果。\n八、后来的事\n安史之乱打了八年。\n唐朝没有亡，但它再也没能回到战前的样子。藩镇割据、财政重心南移、府兵制彻底瓦解，这些变化都从这八年开始。\n长安还在，宫城还在，但那个\"天宝\"的盛世，是在那年冬天结束的。\n\n主要参考文献\n\n司马光：《资治通鉴》卷二一七，天宝十四载。\n蒲立本（Edwin G. Pulleyblank）：《安禄山叛乱的背景》，1955 年。\n仇鹿鸣：《长安与河北之间：中晚唐的政治与文化》，北京师范大学出版社，2018 年。\n张国刚：《唐代藩镇研究》，中国人民大学出版社，2010 年。\n陈寅恪：《唐代政治史述论稿》，上海古籍出版社。\n", "words": 1607}];

<script>
/* ==========================================================================
   历史文章集 · 逻辑
   列表 + 阅读页 + 全局搜索
   ========================================================================== */

const ARTS = window.__ARTICLES__ || [];
const LS_READ = 'articles.read.v1';

const listEl = document.getElementById('list');
const readerEl = document.getElementById('reader');
const qEl = document.getElementById('q');
const clearBtn = document.getElementById('clearBtn');
const backBtn = document.getElementById('backBtn');
const progressEl = document.getElementById('progress');

let currentId = null;

/* ---------- 已读记录 ---------- */
function readSet() {
  try {
    const a = JSON.parse(localStorage.getItem(LS_READ) || '[]');
    return new Set(Array.isArray(a) ? a : []);
  } catch (e) { return new Set(); }
}
function markRead(id) {
  const s = readSet();
  s.add(id);
  try { localStorage.setItem(LS_READ, JSON.stringify([...s])); } catch (e) {}
}

/* ---------- 高亮 ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function highlight(text, terms) {
  let out = esc(text);
  if (!terms.length) return out;
  terms.forEach(t => {
    if (!t) return;
    const safe = esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(safe, 'gi'), m => '<mark>' + m + '</mark>');
  });
  return out;
}

/* ---------- 搜索 ---------- */
function tokenize(q) {
  return q.trim().toLowerCase().split(/\s+/).filter(Boolean);
}

/** 在正文里取包含关键词的一小段 */
function snippet(a, terms) {
  if (!terms.length) return '';
  const lower = a.text.toLowerCase();
  let idx = -1;
  for (const t of terms) {
    idx = lower.indexOf(t);
    if (idx >= 0) break;
  }
  if (idx < 0) return '';
  const start = Math.max(0, idx - 34);
  const end = Math.min(a.text.length, idx + 80);
  return (start > 0 ? '…' : '') + a.text.slice(start, end) + (end < a.text.length ? '…' : '');
}

function score(a, terms) {
  if (!terms.length) return 1;
  const title = a.title.toLowerCase();
  const sub = a.subtitle.toLowerCase();
  const tags = a.tags.join(' ').toLowerCase();
  const era = a.era.toLowerCase();
  const text = a.text.toLowerCase();
  let s = 0;
  for (const t of terms) {
    let hit = 0;
    if (title.includes(t)) hit += 10;
    if (sub.includes(t)) hit += 5;
    if (tags.includes(t)) hit += 6;
    if (era.includes(t)) hit += 5;
    if (text.includes(t)) hit += 1;
    if (!hit) return 0; // 所有词都要出现
    s += hit;
  }
  return s;
}

/* ---------- 列表渲染 ---------- */
function renderList() {
  const terms = tokenize(qEl.value);
  const read = readSet();

  const items = ARTS
    .map(a => ({ a, s: score(a, terms) }))
    .filter(x => x.s > 0)
    .sort((x, y) => (terms.length ? y.s - x.s : 0) || (y.a.date > x.a.date ? 1 : -1));

  if (!items.length) {
    listEl.innerHTML = '<div class="empty">没有找到相关文章<br>试试换个词，比如「叫魂」「官僚」「鸦片」</div>';
    return;
  }

  listEl.innerHTML = items.map(({ a }) => {
    const snip = snippet(a, terms);
    return `<button class="art" data-id="${a.id}">
      <div class="meta">
        <span>${highlight(a.era, terms)}</span>
        <span class="sep">·</span>
        <span>${a.words} 字</span>
        ${read.has(a.id) ? '<span class="sep">·</span><span>已读</span>' : ''}
      </div>
      <h2>${highlight(a.title, terms)}</h2>
      ${a.subtitle ? `<p class="sub">${highlight(a.subtitle, terms)}</p>` : ''}
      ${snip ? `<p class="snippet">${highlight(snip, terms)}</p>` : ''}
      <div class="tags">${a.tags.map(t => `<span class="tag">${highlight(t, terms)}</span>`).join('')}</div>
    </button>`;
  }).join('');

  listEl.querySelectorAll('.art').forEach(btn => {
    btn.onclick = () => openArticle(btn.dataset.id);
  });
}

/* ---------- 阅读页 ---------- */
function openArticle(id) {
  const a = ARTS.find(x => x.id === id);
  if (!a) return;
  currentId = id;

  readerEl.innerHTML = `
    <div class="era">${esc(a.era)}</div>
    <h1>${esc(a.title)}</h1>
    ${a.subtitle ? `<p class="lede">${esc(a.subtitle)}</p>` : ''}
    <div class="body">${a.html}</div>
    <div class="reading-meta">${a.words} 字 · ${a.tags.map(t => '#' + t).join(' ')}</div>
  `;

  document.body.classList.add('reading');
  window.scrollTo(0, 0);
  markRead(id);
  history.pushState({ id }, '', '#' + id);
  updateProgress();
}

function closeArticle(fromPop) {
  document.body.classList.remove('reading');
  readerEl.innerHTML = '';
  currentId = null;
  progressEl.style.width = '0';
  renderList();
  if (!fromPop) {
    history.pushState({}, '', location.pathname + location.search);
  }
  window.scrollTo(0, 0);
}

backBtn.onclick = () => {
  if (history.state && history.state.id) history.back();
  else closeArticle();
};

window.addEventListener('popstate', e => {
  if (e.state && e.state.id) openArticle(e.state.id);
  else if (document.body.classList.contains('reading')) closeArticle(true);
});

/* ---------- 阅读进度 ---------- */
function updateProgress() {
  if (!document.body.classList.contains('reading')) return;
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? Math.min(1, window.scrollY / h) : 0;
  progressEl.style.width = (p * 100) + '%';
}
window.addEventListener('scroll', updateProgress, { passive: true });

/* ---------- 搜索交互 ---------- */
let t = null;
qEl.addEventListener('input', () => {
  clearBtn.classList.toggle('on', !!qEl.value);
  clearTimeout(t);
  t = setTimeout(renderList, 90);
});
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const first = listEl.querySelector('.art');
    if (first) openArticle(first.dataset.id);
    qEl.blur();
  }
});
clearBtn.onclick = () => {
  qEl.value = '';
  clearBtn.classList.remove('on');
  renderList();
  qEl.focus();
};

// 在阅读页里输入则先返回列表
qEl.addEventListener('focus', () => {
  if (document.body.classList.contains('reading')) closeArticle();
});

/* ---------- 启动 ---------- */
(function init() {
  renderList();
  const hash = decodeURIComponent(location.hash.replace('#', ''));
  if (hash && ARTS.some(a => a.id === hash)) {
    openArticle(hash);
  } else {
    history.replaceState({}, '', location.pathname + location.search);
  }
})();

</script>
