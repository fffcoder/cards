<style>
/* ==========================================================================
   历史文章集 · 样式
   ========================================================================== */

:root {
  --bg: #0e0d0b;
  --fg: #f0e9de;
  --fg-body: #c3b9ab;
  --fg-dim: #8b8073;
  --fg-faint: #5b544b;
  --accent: #d9bf8a;
  --line: rgba(217, 191, 138, .13);
  --card: #191613;
  --radius: 16px;
  --ease: cubic-bezier(.22, .9, .3, 1);
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(14, 13, 11, .86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, .05);
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .04em;
  white-space: nowrap;
}
.brand small {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--fg-faint);
  letter-spacing: .1em;
  margin-top: 2px;
}

#backBtn {
  display: none;
  background: none;
  border: none;
  color: var(--accent);
  font-family: inherit;
  font-size: 15px;
  padding: 6px 8px 6px 0;
  cursor: pointer;
}
body.reading #backBtn { display: block; }
body.reading .brand { display: none; }

/* 搜索 */
.search {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, .055);
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .05) inset;
}
.search svg { flex: 0 0 auto; opacity: .45; }
#q {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  outline: none;
  color: var(--fg);
  font-family: inherit;
  font-size: 15px;
}
#q::placeholder { color: var(--fg-faint); }
#clearBtn {
  display: none;
  background: rgba(255, 255, 255, .1);
  border: none;
  color: var(--fg-dim);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
}
#clearBtn.on { display: block; }
body.reading .search { display: none; }

/* ---------- 列表 ---------- */
#list {
  padding: 12px 16px calc(env(safe-area-inset-bottom) + 32px);
}

.art {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: none;
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  margin-bottom: 10px;
  color: var(--fg);
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .045) inset;
  transition: background .16s ease, transform .12s var(--ease);
}
.art:active { background: #201c18; transform: scale(.995); }

.art .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--fg-dim);
  margin-bottom: 8px;
}
.art .meta .sep { color: #3f3a33; }

.art h2 {
  margin: 0 0 6px;
  font-size: 17px;
  line-height: 1.45;
  font-weight: 600;
  letter-spacing: -.002em;
}

.art .sub {
  margin: 0 0 10px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--fg-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.art .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.art .tag {
  font-size: 11px;
  color: #9a8f80;
  background: rgba(255, 255, 255, .05);
  border-radius: 6px;
  padding: 3px 7px;
  letter-spacing: .04em;
}

.empty {
  text-align: center;
  color: var(--fg-faint);
  font-size: 14px;
  padding: 48px 20px;
}

/* ---------- 搜索结果高亮 ---------- */
mark {
  background: rgba(217, 191, 138, .28);
  color: var(--fg);
  border-radius: 3px;
  padding: 0 1px;
}

.snippet {
  margin: 8px 0 0;
  font-size: 12.5px;
  line-height: 1.7;
  color: #9d9284;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ---------- 阅读页 ---------- */
#reader {
  display: none;
  padding: 20px 20px calc(env(safe-area-inset-bottom) + 56px);
  max-width: 680px;
  margin: 0 auto;
}
body.reading #list { display: none; }
body.reading #reader { display: block; }

#reader .era {
  font-size: 11px;
  letter-spacing: .17em;
  color: var(--fg-dim);
  margin-bottom: 12px;
}

#reader h1 {
  font-size: 26px;
  line-height: 1.4;
  font-weight: 650;
  letter-spacing: -.01em;
  margin: 0 0 12px;
}

#reader .lede {
  font-size: 15px;
  line-height: 1.8;
  color: var(--fg-dim);
  margin: 0 0 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

#reader .body {
  font-size: 16.5px;
  line-height: 1.9;
  color: var(--fg-body);
  letter-spacing: .006em;
}

#reader .body h2 {
  font-size: 19px;
  line-height: 1.5;
  color: var(--fg);
  font-weight: 600;
  margin: 34px 0 14px;
  padding-left: 12px;
  border-left: 3px solid rgba(217, 191, 138, .45);
}
#reader .body h3 {
  font-size: 16.5px;
  color: var(--fg);
  font-weight: 600;
  margin: 24px 0 10px;
}
#reader .body p { margin: 0 0 18px; }
#reader .body strong { color: #ede4d6; font-weight: 600; }

#reader .body ul,
#reader .body ol {
  margin: 0 0 18px;
  padding-left: 22px;
}
#reader .body li { margin-bottom: 8px; }

#reader .body blockquote {
  margin: 0 0 18px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, .03);
  border-left: 2px solid rgba(217, 191, 138, .35);
  border-radius: 0 8px 8px 0;
  color: var(--fg-dim);
  font-size: 15px;
}

#reader .body hr {
  border: none;
  border-top: 1px solid var(--line);
  margin: 30px 0;
}

#reader .body a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid rgba(217, 191, 138, .3);
}

#reader .body code {
  background: rgba(255, 255, 255, .06);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: .9em;
}

.reading-meta {
  margin-top: 36px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--fg-faint);
  letter-spacing: .06em;
}

/* 阅读进度条 */
#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  width: 0;
  background: var(--accent);
  z-index: 20;
  opacity: 0;
  transition: opacity .2s ease;
}
body.reading #progress { opacity: .75; }

@media (max-width: 360px) {
  #reader .body { font-size: 16px; }
  #reader h1 { font-size: 23px; }
}

</style>

<script>
window.__ARTICLES__ = [{"id": "001-jiaohun", "title": "1768：一场由官僚自保催生的全国冤案", "subtitle": "从《叫魂》看专制权力、官僚理性与底层恐惧如何共同制造恐慌", "era": "清·乾隆", "tags": ["清代", "社会史", "官僚制", "孔飞力"], "date": "2026-11-28", "html": "<h2>一、一个修水闸的木匠</h2>\n<p>乾隆三十三年（1768）春，浙江德清县城外，几个木匠在修一座水闸。当地有种说法：木匠会把人的名字写在纸片上，打进桥桩，借建房修桥的法术摄人魂魄，被摄者会生病甚至死去，这叫\"叫魂\"。</p>\n<p>一个叫沈士良的农民找到木匠吴东明，想请他把一个仇人的名字打进桥桩。吴东明拒绝了，并把这件事报官。事情本来该到此为止。</p>\n<p>但它没有。谣言顺着运河往北传，到夏天已经波及浙江、江苏、山东、直隶等十二个省份。苏州的乞丐被指剪人发辫，山东的游方和尚被指在客栈施术，直隶的卖艺人在集市上被围殴。各地衙门里挤满了被指认的人，刑具上的血还没干，新的供词又被刻出来。</p>\n<p>到秋天，军机处奉旨审结，认定全案查无实据，绝大多数被告确系诬告。可是在这个过程中，已经有数十人死在狱中。</p>\n<p>这件事被美国历史学家孔飞力（Philip A. Kuhn）写成《叫魂：1768年中国妖术大恐慌》，1990 年出版后成为清代社会史最常被引用的著作之一。它之所以至今仍被讨论，并不是因为它讲了一个离奇的案子，而是因为它用这批档案回答了一个更普遍的问题：<strong>一个高度集权的体系，为什么会在没有事实依据的情况下，系统性地制造出大量冤案？</strong></p>\n<h2>二、谣言为什么能传播那么远</h2>\n<p>先看地理。1768 年的谣言扩散路径，与运河和官道的走向高度一致：德清—杭州—苏州—扬州—山东—直隶，几乎就是漕运主干线。</p>\n<p>这并不偶然。十八世纪中叶的江南是当时世界上城市化程度最高的地区之一，苏州、杭州、江宁人口稠密，商旅往来频繁。大运河不仅是粮食通道，也是信息通道。一个县城里的传闻，可以在一两个月内变成几百公里外的\"实事\"。</p>\n<p>再看社会结构。档案里被指认为\"妖人\"的，很大比例是无籍的游方僧道、乞丐、剃头匠和卖艺人。这些人有几个共同点：没有本地户籍，住在寺庙或客栈，与周围人没有血缘和地缘关系，也没有能替他们作保的人。</p>\n<p>孔飞力敏锐地指出：<strong>恐慌的对象不是\"妖术\"，而是\"流动的人\"。</strong> 在一个以户籍和宗族为基本秩序的农业社会里，陌生人的存在本身就是一种不确定。当旱灾、粮价、疫病同时出现时，这种不确定就会寻找一个具体的载体——而游方僧人恰好符合所有想象。</p>\n<p>同期的人口数据支持这个背景：清代人口从康熙末年的约一亿五千万增长到乾隆末年的三亿左右，人均耕地持续下降，大量人口离开土地成为流民。<strong>十八世纪的盛世，同时也是流动人口急剧膨胀的时代。</strong></p>\n<h2>三、官僚为什么宁可办错</h2>\n<p>这是全书最精彩的论证。</p>\n<p>按照正常的行政逻辑，一个地方官接到妖术传闻后的最优选择，应该是查明真相、如实上报。但在乾隆朝的考核体系下，情况恰好相反。</p>\n<p>如果官员上报\"查无此事\"，等于向皇帝承认：你的辖区里出现过引起恐慌的传闻，而你什么都没有查到。这在皇帝眼里等同于两种可能——要么你无能，要么你在隐瞒。</p>\n<p>于是官员的理性选择变成了：<strong>把案件办成\"有\"。</strong> 抓人、审讯、取得供词、上报\"拿获妖人\"。供词越具体（何时何地施术、用什么物件、摄走谁的魂魄），上级越相信案子是真的，办案者的功劳也越大。</p>\n<p>刑讯在这个链条里不是例外，而是常态。清代律例允许对强盗、人命等重案用刑，而\"妖术\"一经上报就被归入重案。被捕者在刑讯下会供出更多名字，于是案件像雪球一样越滚越大。</p>\n<p>这里有一个关键机制：<strong>信息在层层上传的过程中被系统性扭曲，而扭曲的方向是一致的——越来越像\"确有其事\"。</strong> 每一级官员都在做对自己最安全的选择，但把这些选择加总起来，整个系统产出的却是与事实相反的结果。</p>\n<p>这不是某个贪官的问题。孔飞力反复强调，这些官员多数是尽责的、按规矩办事的。<strong>问题出在结构：当\"报有\"的风险远低于\"报无\"的风险时，系统就必然生产出大量的\"有\"。</strong></p>\n<h2>四、乾隆在其中的位置</h2>\n<p>如果只是官僚自保，这个案子可能在中层就消解了。让它变成全国性事件的是皇帝本人。</p>\n<p>乾隆在承德避暑山庄读到密报后，连续下旨督办，前后发了数十道谕旨，措辞一次比一次严厉。他关心的具体是什么？孔飞力提出了三层解读：</p>\n<p><strong>第一层，是对江南官僚的不信任。</strong> 乾隆一生对江南士绅与地方官的结合保持警惕。在他看来，如果江南出现大规模妖术而地方官没有及时上报，那说明这套官僚系统已经不可靠。</p>\n<p><strong>第二层，是剃发与政治符号。</strong> 剪辫在清代的语境里极为敏感——剃发令是清朝统治合法性的象征物。妖术专剪发辫，在皇帝看来不只是迷信，而是对统治秩序的隐喻性挑战。</p>\n<p><strong>第三层，是专制权力对常规权力的敲打。</strong> 孔飞力使用了\"专制权力\"（despotism）与\"常规权力\"（bureaucracy）这对概念：皇帝通过非常规手段（密折、直接下旨、越过常规程序）来打破官僚系统的惰性。叫魂案给了他一个机会，让整个官僚体系为一件本不存在的事运转起来，从而证明谁才是真正的主人。</p>\n<p>有意思的是，最终结束这场恐慌的，恰恰也是官僚系统。军机处几位大臣用拖延、复核、逐案销案的方式，把这场运动一点点冷却下来。<strong>皇帝的权力可以发动一场运动，但要收场，还得依靠他并不信任的那套常规机器。</strong> 这是全书最耐人寻味的张力。</p>\n<h2>五、这件事在学界还有什么争论</h2>\n<p>《叫魂》出版三十多年来，讨论不断，主要有几种不同声音。</p>\n<p><strong>一种质疑针对\"专制权力\"概念的使用。</strong> 部分学者认为，孔飞力把乾隆的动机解释得过于统一和理性，实际上皇帝的反应可能包含大量情绪、误判和信息不对称，未必是一场精心设计的权力演示。</p>\n<p><strong>另一种质疑来自对档案的再统计。</strong> 有研究者指出，孔飞力使用的案件样本集中于几个省份，而全国范围的实际案件数量与分布可能被高估或低估；此外，清代刑科题本中大量涉及\"邪术\"的案件本来就与民间信仰日常纠缠，未必都能归入同一场\"恐慌\"。</p>\n<p><strong>还有一种视角来自社会史内部。</strong> 一些学者更强调十八世纪的人口压力、粮价波动与地方社会失序，认为恐慌的根源在基层，皇权动员只是把它放大了，而不是制造了它。</p>\n<p>这些分歧并不意味着《叫魂》被推翻。相反，它说明这本著作提出的问题足够好——<strong>它把\"制度如何生产事实\"这个问题，放在了一个材料极其丰富的案例上。</strong></p>\n<h2>六、可以继续追问的问题</h2>\n<ul>\n<li>如果你处在 1768 年一个知县的位置，在同样的考核体系下，你会怎么选？有第三条路吗？</li>\n<li>\"报有\"风险低于\"报无\"风险，这个结构在今天的组织里是否仍然存在？形式有什么变化？</li>\n<li>档案本身是被审讯生产出来的，那么历史学者如何从\"被逼出来的供词\"里读出真实？这种方法的边界在哪？</li>\n</ul>\n<hr>\n<p><strong>主要参考文献</strong></p>\n<ol>\n<li>孔飞力：《叫魂：1768年中国妖术大恐慌》，陈兼、刘昶译，上海三联书店，1999 年。</li>\n<li>《清高宗实录》卷八一二至八一六，乾隆三十三年相关谕旨。</li>\n<li>《宫中档乾隆朝奏折》，台北故宫博物院藏。</li>\n<li>中国人民大学清史研究所编：《清史编年》第五卷，中国人民大学出版社。</li>\n<li>关于人口与流民背景，参看何炳棣《明初以降人口及其相关问题》。</li>\n</ol>", "text": "一、一个修水闸的木匠\n乾隆三十三年（1768）春，浙江德清县城外，几个木匠在修一座水闸。当地有种说法：木匠会把人的名字写在纸片上，打进桥桩，借建房修桥的法术摄人魂魄，被摄者会生病甚至死去，这叫\"叫魂\"。\n一个叫沈士良的农民找到木匠吴东明，想请他把一个仇人的名字打进桥桩。吴东明拒绝了，并把这件事报官。事情本来该到此为止。\n但它没有。谣言顺着运河往北传，到夏天已经波及浙江、江苏、山东、直隶等十二个省份。苏州的乞丐被指剪人发辫，山东的游方和尚被指在客栈施术，直隶的卖艺人在集市上被围殴。各地衙门里挤满了被指认的人，刑具上的血还没干，新的供词又被刻出来。\n到秋天，军机处奉旨审结，认定全案查无实据，绝大多数被告确系诬告。可是在这个过程中，已经有数十人死在狱中。\n这件事被美国历史学家孔飞力（Philip /* ---------- 高亮 ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function highlight(text, terms) {
  let out = esc(text);
  if (!terms.length) return out;
  terms.forEach(t => {
    if (!t) return;
    const safe = esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(safe, 'gi'), m => '<mark>' + m + '</mark>');
  });
  return out;
}

/* ---------- 搜索 ---------- */
function tokenize(q) {
  return q.trim().toLowerCase().split(/\s+/).filter(Boolean);
}

/** 在正文里取包含关键词的一小段 */
function snippet(a, terms) {
  if (!terms.length) return '';
  const lower = a.text.toLowerCase();
  let idx = -1;
  for (const t of terms) {
    idx = lower.indexOf(t);
    if (idx >= 0) break;
  }
  if (idx < 0) return '';
  const start = Math.max(0, idx - 34);
  const end = Math.min(a.text.length, idx + 80);
  return (start > 0 ? '…' : '') + a.text.slice(start, end) + (end < a.text.length ? '…' : '');
}

function score(a, terms) {
  if (!terms.length) return 1;
  const title = a.title.toLowerCase();
  const sub = a.subtitle.toLowerCase();
  const tags = a.tags.join(' ').toLowerCase();
  const era = a.era.toLowerCase();
  const text = a.text.toLowerCase();
  let s = 0;
  for (const t of terms) {
    let hit = 0;
    if (title.includes(t)) hit += 10;
    if (sub.includes(t)) hit += 5;
    if (tags.includes(t)) hit += 6;
    if (era.includes(t)) hit += 5;
    if (text.includes(t)) hit += 1;
    if (!hit) return 0; // 所有词都要出现
    s += hit;
  }
  return s;
}

/* ---------- 列表渲染 ---------- */
function renderList() {
  const terms = tokenize(qEl.value);
  const read = readSet();

  const items = ARTS
    .map(a => ({ a, s: score(a, terms) }))
    .filter(x => x.s > 0)
    .sort((x, y) => (terms.length ? y.s - x.s : 0) || (y.a.date > x.a.date ? 1 : -1));

  if (!items.length) {
    listEl.innerHTML = '<div class="empty">没有找到相关文章<br>试试换个词，比如「叫魂」「官僚」「鸦片」</div>';
    return;
  }

  listEl.innerHTML = items.map(({ a }) => {
    const snip = snippet(a, terms);
    return `<button class="art" data-id="${a.id}">
      <div class="meta">
        <span>${highlight(a.era, terms)}</span>
        <span class="sep">·</span>
        <span>${a.words} 字</span>
        ${read.has(a.id) ? '<span class="sep">·</span><span>已读</span>' : ''}
      </div>
      <h2>${highlight(a.title, terms)}</h2>
      ${a.subtitle ? `<p class="sub">${highlight(a.subtitle, terms)}</p>` : ''}
      ${snip ? `<p class="snippet">${highlight(snip, terms)}</p>` : ''}
      <div class="tags">${a.tags.map(t => `<span class="tag">${highlight(t, terms)}</span>`).join('')}</div>
    </button>`;
  }).join('');

  listEl.querySelectorAll('.art').forEach(btn => {
    btn.onclick = () => openArticle(btn.dataset.id);
  });
}

/* ---------- 阅读页 ---------- */
function openArticle(id) {
  const a = ARTS.find(x => x.id === id);
  if (!a) return;
  currentId = id;

  readerEl.innerHTML = `
    <div class="era">${esc(a.era)}</div>
    <h1>${esc(a.title)}</h1>
    ${a.subtitle ? `<p class="lede">${esc(a.subtitle)}</p>` : ''}
    <div class="body">${a.html}</div>
    <div class="reading-meta">${a.words} 字 · ${a.tags.map(t => '#' + t).join(' ')}</div>
  `;

  document.body.classList.add('reading');
  window.scrollTo(0, 0);
  markRead(id);
  history.pushState({ id }, '', '#' + id);
  updateProgress();
}

function closeArticle(fromPop) {
  document.body.classList.remove('reading');
  readerEl.innerHTML = '';
  currentId = null;
  progressEl.style.width = '0';
  renderList();
  if (!fromPop) {
    history.pushState({}, '', location.pathname + location.search);
  }
  window.scrollTo(0, 0);
}

backBtn.onclick = () => {
  if (history.state && history.state.id) history.back();
  else closeArticle();
};

window.addEventListener('popstate', e => {
  if (e.state && e.state.id) openArticle(e.state.id);
  else if (document.body.classList.contains('reading')) closeArticle(true);
});

/* ---------- 阅读进度 ---------- */
function updateProgress() {
  if (!document.body.classList.contains('reading')) return;
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? Math.min(1, window.scrollY / h) : 0;
  progressEl.style.width = (p * 100) + '%';
}
window.addEventListener('scroll', updateProgress, { passive: true });

/* ---------- 搜索交互 ---------- */
let t = null;
qEl.addEventListener('input', () => {
  clearBtn.classList.toggle('on', !!qEl.value);
  clearTimeout(t);
  t = setTimeout(renderList, 90);
});
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const first = listEl.querySelector('.art');
    if (first) openArticle(first.dataset.id);
    qEl.blur();
  }
});
clearBtn.onclick = () => {
  qEl.value = '';
  clearBtn.classList.remove('on');
  renderList();
  qEl.focus();
};

// 在阅读页里输入则先返回列表
qEl.addEventListener('focus', () => {
  if (document.body.classList.contains('reading')) closeArticle();
});

/* ---------- 启动 ---------- */
(function init() {
  renderList();
  const hash = decodeURIComponent(location.hash.replace('#', ''));
  if (hash && ARTS.some(a => a.id === hash)) {
    openArticle(hash);
  } else {
    history.replaceState({}, '', location.pathname + location.search);
  }
})();

</script>
